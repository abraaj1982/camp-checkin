function pick(id) { st.clrOpen = false; st.clrNote = ''; st.caseOpen = false; st.cur = st.results.find(x => x.id === id) || null; hideNotes(true); st.complaint = ''; st.severity = 'normal'; st.msg = null; st.results = []; render(); if (st.cur) showNotes(); }

const sameDay = iso => { if (!iso) return false; const d = new Date(iso); return !isNaN(d) && d.toDateString() === new Date().toDateString(); };

  const k = (lab, v) => `<div class="card"><div class="kl">${lab}</div><div class="kv">${v}</div></div>`;

  return `<div class="kpis">${k(l.total, s.total)}${k(l.openN, s.open)}${k(l.closedN, s.closed)}${k(l.urgentN, s.urgent)}${k(l.avg, s.avgCloseMinutes)}</div>${bars(l.byDay, s.byDay)}${bars(l.byTeam, s.byTeam)}${bars(l.byBus, s.byBus)}`;
}
function render() {

  const ae = document.activeElement, keep = ae && ae.id ? { id: ae.id, pos: ae.selectionStart } : null;
  $('app').innerHTML = `${st.msg ? `<div class="banner ${st.msg.cls}" role="alert">${esc(st.msg.t)}</div>` : ''}
   <div class="tabs">${[['cases', l.tCases], ['leave', l.tLeave(st.clrPending)], ['stats', l.tStats]].map(t => `<button class="${st.tab === t[0] ? 'on' : ''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${st.tab === 'cases' ? casesView() : st.tab === 'leave' ? leaveView() : statsView()}`;
  renderStrip();
  if (keep && $(keep.id)) { const e = $(keep.id); e.focus(); try { e.setSelectionRange(keep.pos, keep.pos); } catch (x) {} }
}
document.addEventListener('input', e => {
  if (e.target.id === 'q') onQ(e.target.value); else if (e.target.id === 'cn') st.clrNote = e.target.value; else if (e.target.id === 'cm') { st.complaint = e.target.value; const sb = document.querySelector('[data-opencase]'); if (sb) { sb.disabled = st.complaint.trim().length < 3; sb.style.opacity = sb.disabled ? '.5' : ''; } } else if (e.target.dataset.tr) st.drafts[e.target.dataset.tr] = e.target.value;
});
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.tab) setTab(d.tab); else if (d.pick) pick(d.pick); else if (d.clear) { st.cur = null; hideNotes(true); render(); }
  else if (d.notes) showNotes(); else if (d.hide) hideNotes(); else if (d.sev) { st.severity = d.sev; render(); }
  else if (d.filter) { st.filter = d.filter; render(); } else if (d.movestrip) { st.strip = st.strip === 'top' ? 'bot' : 'top'; pref.set('strip', st.strip); render(); }
  else if (d.clropen) { st.clrOpen = true; render(); } else if (d.clrcancel) { st.clrOpen = false; st.clrNote = ''; render(); } else if (d.clrsend) sendClr();
  else if (d.caseopen) { st.caseOpen = true; render(); setTimeout(() => { const e = $('cm'); if (e) e.focus(); }, 50); } else if (d.casecancel) { st.caseOpen = false; st.complaint = ''; render(); }
  else if (d.opencase) openCase(); else if (d.save) saveTreatment(d.save, false); else if (d.closecase) saveTreatment(d.closecase, true);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && st.notes) hideNotes(); });
