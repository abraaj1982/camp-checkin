<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طالب جديد — MUKHAYYAM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="ui.js" defer></script>
<style>
.stu2{display:flex;gap:12px;align-items:center}.stu2 .av{width:54px;height:54px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.banner.go{background:var(--okbg);color:var(--ok)}
.fgrid{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:520px){.fgrid.two{grid-template-columns:1fr 1fr}}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.arow:last-child{border:0}
.arow .g{font-size:13px;color:var(--muted)}
.btn.go{background:#1F7A45;min-height:58px;font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="brand"><div class="logo">م</div><div style="min-width:0"><div class="t" id="campT"></div><div class="s" id="campS"></div></div></div>
    <div class="tools"><a class="tool" href="hub.html" id="homeBtn"></a><button class="tool" id="langBtn"></button><button class="tool" id="themeBtn"></button></div>
  </header>
  <section class="hero compact"><div class="ic" aria-hidden="true">➕</div><div><h1 id="hT"></h1><p id="hS"></p></div></section>
  <main id="app"></main>
</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4lEBGPNxghwq9UmK0iljI5QdS-8iCvC-K09dDtbZCXGvGZyA4repTE3rFVVRp5zS4yw/exec';
const token = sessionStorage.getItem('mukhayyam_token');
let perms = [];
try { perms = JSON.parse(sessionStorage.getItem('mukhayyam_permissions') || '[]'); } catch (e) {}
const can = k => perms.indexOf('*') !== -1 || perms.indexOf(k) !== -1;
if (!token) location.href = 'login.html'; else if (!can('addstudent')) location.href = 'hub.html';
const pref = { get(k, d) { try { return localStorage.getItem('mk_pref_' + k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('mk_pref_' + k, v); } catch (e) {} } };
const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AUTH_ERR = /EXPIRED|IDLE_TIMEOUT|REVOKED|BAD_SIGNATURE|MALFORMED|USER_NOT_FOUND|ACCOUNT_DISABLED|BAD_PAYLOAD/;
const T = {
 ar: { dir: 'rtl', title: 'طالب جديد', sub: 'للطلبة غير المسجّلين مسبقًا في الكشف', home: 'الرئيسية', lang: 'English', dark: '🌙 داكن', light: '☀ فاتح',
  notice: 'هذه الخانة مخصصة للطلبة غير المسجّلين مسبقًا. إذا كان الطالب مسجّلًا فابحث عنه في «الوصول المباشر» ولا تُضِفه هنا. لا يُقبل أي اسم مكرر.',
  name: 'اسم الطالب (كاملًا)', cls: 'الصف', team: 'الفريق', busLbl: 'الباص', noBus: 'بلا باص', shirt: 'مقاس القميص', note: 'ملاحظة', trip: 'مسجّل في الرحلة', yes: 'نعم', no: 'لا',
  food: 'الحساسية الغذائية', medical: 'الحالة الصحية', bags: 'عدد الحقائب', optional: 'اختياري', pick: 'اختر', bus: n => 'باص ' + n,
  add: 'إضافة الطالب', added: (id, n) => `تمت إضافة ${n}. رقمه: ${id}`, addedList: 'أُضيفوا يدويًا', noAdded: 'لم يُضف أحد بعد.',
  printBand: 'اطبع سواره', goArrive: 'سجّل وصوله', manual: 'مضاف يدويًا', dupTitle: 'هذا الطالب مسجّل مسبقًا. لا يمكن إضافته مرة ثانية.', dupOpen: 'افتح الطالب في «الوصول المباشر»', dupHint: 'إذا كان طالبًا آخر بنفس الاسم، أضف اسم الجد أو العائلة ليختلف الاسم.',
  error: 'تعذّر الاتصال. حاول مرة أخرى.', sessionEnd: 'انتهت الجلسة. سجّل الدخول من جديد.', codes: { DUPLICATE_NAME: 'هذا الطالب مسجّل مسبقًا. لا يمكن إضافته مرة ثانية.', BAD_REQUEST: 'تحقق من البيانات المكتوبة (الاسم والصف مطلوبان)' } },
 en: { dir: 'ltr', title: 'New student', sub: 'For students not registered in advance', home: 'Home', lang: 'العربية', dark: '🌙 Dark', light: '☀ Light',
  notice: 'This screen is for students NOT registered in advance. If the student is registered, find him in “Direct Arrival” and do not add him here. No duplicate name is accepted.',
  name: 'Student full name', cls: 'Class', team: 'Team', busLbl: 'Bus', noBus: 'No bus', shirt: 'Shirt size', note: 'Note', trip: 'Registered for the trip', yes: 'Yes', no: 'No',
  food: 'Food allergy', medical: 'Medical condition', bags: 'Number of bags', optional: 'optional', pick: 'Choose', bus: n => 'Bus ' + n,
  add: 'Add student', added: (id, n) => `${n} added. Number: ${id}`, addedList: 'Added by hand', noAdded: 'Nobody added yet.',
  printBand: 'Print wristband', goArrive: 'Record arrival', manual: 'Added by hand', dupTitle: 'This student is already registered. He cannot be added twice.', dupOpen: 'Open him in “Direct Arrival”', dupHint: 'If this is another student with the same name, add the grandfather or family name so the names differ.',
  error: 'Connection problem. Try again.', sessionEnd: 'Session expired. Please log in again.', codes: { DUPLICATE_NAME: 'This student is already registered. He cannot be added twice.', BAD_REQUEST: 'Check the data (name and class are required)' } }
};
const EMPTY = { name: '', cls: '', team: '', bus: '', shirt: '', note: '', trip: '', food: '', medical: '', bags: '' };
const st = { lang: pref.get('lang', 'ar'), theme: pref.get('theme', 'light'), added: [], teams: [], buses: [], classes: [], msg: null, f: Object.assign({}, EMPTY), last: null, dup: null };
const L = () => T[st.lang];
async function api(action, extra) {
  const r = await (await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: token }, extra || {})) })).json();
  if (r && r.code && AUTH_ERR.test(r.code)) { st.msg = { cls: 'bad', t: L().sessionEnd }; render(); setTimeout(() => { sessionStorage.clear(); location.href = 'login.html'; }, 1500); throw new Error('auth'); }
  return r;
}
const say = (cls, t) => { st.msg = { cls: cls, t: t }; };
const errText = r => (r && L().codes[r.code]) || (r && r.error) || L().error;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));
async function load() { try { const r = await api('studentAddList'); if (r.success) { st.added = r.added; st.teams = r.teams; st.buses = r.buses; st.classes = r.classes; } else if (r.code === 'FORBIDDEN' || r.error) { location.href = 'hub.html'; return; } } catch (e) {} render(); }
async function addStudent() {
  const f = st.f; let busy = st.busy; if (busy) return; st.busy = true;
  try { const r = await api('studentAdd', { name: f.name, cls: f.cls, team: f.team, bus: f.bus, shirt: f.shirt, note: f.note, trip: f.trip, foodAllergy: f.food, medical: f.medical, bags: f.bags, clientId: st.addId || (st.addId = uid()) });
    if (r.success) { st.last = { id: r.id, name: r.name }; st.dup = null; say('ok', L().added(r.id, r.name)); st.f = Object.assign({}, EMPTY); st.addId = null; st.busy = false; await load(); return; }
    if (r.code === 'DUPLICATE_NAME') { st.dup = r.existing; st.msg = null; } else say('bad', errText(r));
  } catch (e) { if (e.message !== 'auth') say('bad', L().error); }
  st.busy = false; render();
}
function opt(list, val, blank, lbl) { return `<option value="">${blank}</option>` + list.map(x => `<option value="${esc(x)}" ${val === x ? 'selected' : ''}>${esc(lbl ? lbl(x) : x)}</option>`).join(''); }
function dupCard() { const l = L(), x = st.dup; if (!x) return ''; return `<div class="banner bad" role="alert"><b>${l.dupTitle}</b><div style="margin-top:6px">${esc(x.name)} · ${esc(x.id)}${x.cls ? ' · ' + esc(x.cls) : ''}${x.bus ? ' · ' + l.bus(esc(x.bus)) : ''}</div><div class="muted" style="margin-top:6px;font-size:13px">${l.dupHint}</div><a class="btn go full" style="margin-top:10px;text-decoration:none;display:flex;align-items:center;justify-content:center" href="reception.html?q=${encodeURIComponent(x.id)}">${l.dupOpen}</a></div>`; }
function txt(id, label, val, max, extra) { return `<div><label class="lbl" for="${id}">${label}</label><input id="${id}" type="text" maxlength="${max}" value="${esc(val)}" autocomplete="off" ${extra || ''}></div>`; }
function view() {
  const l = L(), f = st.f, ok = f.name.trim().length >= 3 && f.cls;
  return `<div class="banner warn">${esc(l.notice)}</div>${st.msg ? `<div class="banner ${st.msg.cls}" role="alert">${esc(st.msg.t)}</div>` : ''}${dupCard()}
  <section class="card"><div class="fgrid">${txt('fn', l.name, f.name, 60)}
    <div class="fgrid two"><div><label class="lbl" for="fc">${l.cls}</label><select id="fc" data-f="cls">${opt(st.classes, f.cls, l.pick)}</select></div><div><label class="lbl" for="ft">${l.team} (${l.optional})</label><select id="ft" data-f="team">${opt(st.teams, f.team, l.pick)}</select></div></div>
    <div class="fgrid two"><div><label class="lbl" for="fb">${l.busLbl} (${l.optional})</label><select id="fb" data-f="bus">${opt(st.buses, f.bus, l.noBus, x => l.bus(x))}</select></div><div><label class="lbl" for="ftr">${l.trip}</label><select id="ftr" data-f="trip"><option value="">${l.no}</option><option value="1" ${f.trip === '1' ? 'selected' : ''}>${l.yes}</option></select></div></div>
    <div class="fgrid two">${txt('fs', l.shirt + ' (' + l.optional + ')', f.shirt, 8, 'placeholder="M / L / XL"')}<div><label class="lbl" for="fg">${l.bags} (${l.optional})</label><input id="fg" type="number" min="0" max="20" inputmode="numeric" value="${esc(f.bags)}"></div></div>
    ${txt('ffd', l.food + ' (' + l.optional + ')', f.food, 100)}${txt('fm', l.medical + ' (' + l.optional + ')', f.medical, 100)}${txt('fo', l.note + ' (' + l.optional + ')', f.note, 100)}</div>
    <button class="btn go full" style="margin-top:12px" data-add="1" ${ok ? '' : 'disabled'}>${l.add}</button>
    ${st.last ? `<div class="banner go" style="margin-top:10px">${esc(l.added(st.last.id, st.last.name))} <a href="wristbands.html" style="margin-inline-start:8px">${l.printBand}</a> · <a href="reception.html?q=${encodeURIComponent(st.last.id)}">${l.goArrive}</a></div>` : ''}</section>
  <section class="card"><h2 class="h2" style="margin-bottom:6px">${l.addedList} (${st.added.length})</h2>${st.added.length ? st.added.map(a => `<div class="arow"><div><b>${esc(a.name)}</b> <span class="muted">· ${esc(a.id)}</span><div class="g">${esc([a.cls, a.team, a.bus ? l.bus(a.bus) : l.noBus, a.shirt, a.trip ? l.trip : ''].filter(Boolean).join(' · '))}</div></div></div>`).join('') : `<div class="muted">${l.noAdded}</div>`}</section>`;
}
function render() {
  const l = L(); document.documentElement.lang = st.lang; document.documentElement.dir = l.dir; document.documentElement.dataset.theme = st.theme; document.title = l.title + ' — MUKHAYYAM';
  $('hT').textContent = l.title; $('hS').textContent = l.sub; $('homeBtn').textContent = l.home; $('langBtn').textContent = l.lang; $('themeBtn').textContent = st.theme === 'light' ? l.dark : l.light;
  const ae = document.activeElement, keep = ae && ae.id ? { id: ae.id, pos: ae.selectionStart } : null;
  $('app').innerHTML = view();
  if (keep && $(keep.id) && ['INPUT', 'TEXTAREA'].indexOf($(keep.id).tagName) !== -1) { const e = $(keep.id); e.focus(); try { e.setSelectionRange(keep.pos, keep.pos); } catch (x) {} }
}
document.addEventListener('input', e => { const i = e.target.id;
  if (i === 'fn') { st.f.name = e.target.value; st.dup = null; render(); } else if (i === 'fs') st.f.shirt = e.target.value; else if (i === 'fo') st.f.note = e.target.value; else if (i === 'ffd') st.f.food = e.target.value; else if (i === 'fm') st.f.medical = e.target.value; else if (i === 'fg') st.f.bags = e.target.value; });
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.f) { st.f[e.target.dataset.f] = e.target.value; render(); } });
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b && b.dataset.add) addStudent(); });
$('langBtn').onclick = () => { st.lang = st.lang === 'ar' ? 'en' : 'ar'; pref.set('lang', st.lang); render(); };
$('themeBtn').onclick = () => { st.theme = st.theme === 'light' ? 'dark' : 'light'; pref.set('theme', st.theme); render(); };
render(); load();
</script>
</body></html>
