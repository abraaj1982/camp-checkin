<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — MUKHAYYAM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<script src="ui.js" defer></script>
<style>
.login{padding:16px;flex:1;display:flex;flex-direction:column}
.login .card{padding:30px 22px 26px}
.login .ic{width:72px;height:72px;border-radius:18px;background:var(--gold);color:var(--logoink);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 14px}
.login h1{font-size:24px;text-align:center}
.login .sub{text-align:center;color:var(--muted);margin:6px 0 18px}
.field{margin-top:18px}
.pw{position:relative}.pw input{padding-inline-end:52px}
.pw button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;min-height:40px;min-width:40px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px}.pw button:hover,.pw button:focus-visible{color:var(--brand)}
.caps{margin-top:8px;color:var(--warn);background:var(--warnbg);border-radius:10px;padding:6px 10px;font-size:13px}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="brand"><div class="logo">م</div><div style="min-width:0"><div class="t" id="campT"></div><div class="s" id="campS"></div></div></div>
    <div class="tools"><button class="tool" id="langBtn" aria-label="Language"></button><button class="tool" id="themeBtn"></button></div>
  </header>
  <div class="login"><div class="card">
    <div class="ic" aria-hidden="true">م</div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <form id="form" autocomplete="on">
      <div class="field"><label class="lbl" for="username"><span id="lblU"></span><span class="req">*</span></label><input id="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>
      <div class="field"><label class="lbl" for="password"><span id="lblP"></span><span class="req">*</span></label><div class="pw"><input id="password" type="password" autocomplete="current-password" required><button type="button" id="showPw"></button></div><div class="caps" id="caps" role="status" hidden></div></div>
      <div id="msg" role="alert"></div>
      <button type="submit" class="btn full" id="btn" style="margin-top:22px"></button>
    </form>
    <p class="foot" id="foot"></p>
  </div></div>
</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4lEBGPNxghwq9UmK0iljI5QdS-8iCvC-K09dDtbZCXGvGZyA4repTE3rFVVRp5zS4yw/exec';
const T = {
  ar: { dir: 'rtl', why: { EXPIRED: 'انتهت مدة الجلسة (12 ساعة). ادخل من جديد.', IDLE_TIMEOUT: 'خرجت لعدم استخدام الشاشة مدة طويلة.', REVOKED: 'أُلغيت جلستك (تغيّرت كلمة المرور أو الصلاحيات).', NO_TOKEN: 'لم تعد جلسة الدخول محفوظة على هذا الجوال (غالباً أغلق الجوال الصفحة).', ACCOUNT_DISABLED: 'الحساب معطَّل.', other: c => 'انتهت الجلسة (' + c + ').' }, caps: 'مفتاح Caps Lock مفعّل', title: 'تسجيل الدخول', sub: 'منصة إدارة المخيم', note: '🔒 أدخل اسم المستخدم وكلمة المرور التي استلمتها من السكرتارية', show: 'إظهار', hide: 'إخفاء', foot: 'نسيت كلمة المرور؟ تواصل مع السكرتارية.', u: 'اسم المستخدم', p: 'كلمة المرور', go: 'دخول', going: 'جارٍ الدخول...', lang: 'English', dark: '🌙 داكن', light: '☀ فاتح',
        bad: 'اسم المستخدم أو كلمة المرور غير صحيحة.', locked: 'الحساب مقفل مؤقتاً. تواصل مع السكرتارية.', disabled: 'الحساب معطَّل. تواصل مع السكرتارية.', net: 'تعذّر الاتصال. تحقق من الإنترنت وأعد المحاولة.', ok: 'تم الدخول...' },
  en: { dir: 'ltr', why: { EXPIRED: 'Your session ended (12 hours). Please sign in again.', IDLE_TIMEOUT: 'You were signed out after a long time without use.', REVOKED: 'Your session was cancelled (password or permissions changed).', NO_TOKEN: 'The sign-in is no longer saved on this phone (usually the phone closed the page).', ACCOUNT_DISABLED: 'The account is disabled.', other: c => 'Session ended (' + c + ').' }, caps: 'Caps Lock is on', title: 'Sign in', sub: 'Camp management platform', note: '🔒 Enter the username and password you received from the secretariat', show: 'Show', hide: 'Hide', foot: 'Forgot your password? Contact the secretariat.', u: 'Username', p: 'Password', go: 'Sign in', going: 'Signing in...', lang: 'العربية', dark: '🌙 Dark', light: '☀ Light',
        bad: 'Wrong username or password.', locked: 'Account temporarily locked. Contact the secretariat.', disabled: 'Account disabled. Contact the secretariat.', net: 'Could not connect. Check the internet and try again.', ok: 'Signed in...' }
};
const pref = { get(k, d) { try { return localStorage.getItem('mk_pref_' + k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('mk_pref_' + k, v); } catch (e) {} } };
// Eye icons for the show / hide password button (a drawing instead of the word "إظهار").
const EYE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19C5.6 19 2 12 2 12a18 18 0 0 1 4.1-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>';
const S = { lang: pref.get('lang', 'ar'), theme: pref.get('theme', 'light') };
const $ = id => document.getElementById(id);
function paint() {
  const t = T[S.lang]; document.documentElement.lang = S.lang; document.documentElement.dir = t.dir; document.documentElement.dataset.theme = S.theme;
  $('title').textContent = t.title; $('sub').textContent = t.sub; $('foot').textContent = t.foot; const shown = $('password').type !== 'password'; $('showPw').innerHTML = shown ? EYE_OFF : EYE; $('showPw').setAttribute('aria-label', shown ? t.hide : t.show); $('showPw').title = shown ? t.hide : t.show; $('lblU').textContent = t.u; $('lblP').textContent = t.p; $('btn').textContent = t.go;
  $('langBtn').textContent = t.lang; $('themeBtn').textContent = S.theme === 'light' ? t.dark : t.light; document.title = t.title + ' — MUKHAYYAM';
}
function msg(cls, text) { $('msg').innerHTML = text ? '<div class="banner ' + cls + '"></div>' : ''; if (text) $('msg').firstChild.textContent = text; }
$('langBtn').onclick = () => { S.lang = S.lang === 'ar' ? 'en' : 'ar'; pref.set('lang', S.lang); paint(); };
$('themeBtn').onclick = () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; pref.set('theme', S.theme); paint(); };
$('showPw').onclick = () => { const p = $('password'); p.type = p.type === 'password' ? 'text' : 'password'; paint(); p.focus(); };
paint();
// Why was he sent back here? (only when the app signed him out; a normal logout leaves nothing)
try { const w = (localStorage.getItem('mk_logout_reason') || '').split('|'); if (w[0] && Date.now() - Number(w[1] || 0) < 6 * 3600e3) { const t = T[S.lang]; msg('warn', t.why[w[0]] || t.why.other(w[0])); } localStorage.removeItem('mk_logout_reason'); } catch (e) {}
// Warn when Caps Lock is on while typing the password (a common reason for a refused password).
function capsCheck(e) { const on = !!(e.getModifierState && e.getModifierState('CapsLock')); $('caps').hidden = !on; if (on) $('caps').textContent = '⚠ ' + T[S.lang].caps; }
$('password').addEventListener('keydown', capsCheck); $('password').addEventListener('keyup', capsCheck); $('password').addEventListener('blur', () => { $('caps').hidden = true; });

$('form').addEventListener('submit', async e => {
  e.preventDefault(); msg('', ''); const t = T[S.lang];
  $('btn').disabled = true; $('btn').textContent = t.going;
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username: $('username').value.trim(), password: $('password').value }) });
    const data = await res.json();
    if (data.success) {
      sessionStorage.setItem('mukhayyam_token', data.token);
      sessionStorage.setItem('mukhayyam_fullName', data.fullName || '');
      sessionStorage.setItem('mukhayyam_role', data.role || '');
      sessionStorage.setItem('mukhayyam_assignedBus', data.assignedBus || '');
      sessionStorage.setItem('mukhayyam_permissions', JSON.stringify(data.permissions || []));
      sessionStorage.setItem('mukhayyam_committees', JSON.stringify(data.committees || []));
      msg('ok', t.ok);
      const p = data.permissions || [];
      // One screen only (check-in) -> straight to it; otherwise the home menu of that person's screens.
      location.href = (p.length === 1 && p[0] === 'checkin') ? 'supervisor.html' : (p.length === 1 && p[0] === 'gate') ? 'gate.html' : 'hub.html';
      return;
    }
    const err = String(data.error || '');
    msg('bad', /locked/i.test(err) ? t.locked : /disabled/i.test(err) ? t.disabled : t.bad);
  } catch (err) { msg('warn', t.net); }
  $('btn').disabled = false; $('btn').textContent = t.go;
});
</script>
</body></html>
