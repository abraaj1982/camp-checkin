<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — MUKHAYYAM</title>
<style>
:root {
  --sap-blue: #0A6ED4;
  --sap-green: #107E3E;
  --sap-red: #C30C13;
  --sap-gray: #6C757D;
  --sap-text: #32363A;
  --sap-bg: #F8F9FA;
  --sap-border: #D3D3D3;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: linear-gradient(135deg, #E8F4FD 0%, #F8F9FA 100%);
  color: var(--sap-text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
.card {
  background: white;
  width: 100%;
  max-width: 360px;
  border-radius: 10px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  overflow: hidden;
}
.card-header {
  background: linear-gradient(135deg, var(--sap-blue) 0%, #0052A3 100%);
  color: white;
  padding: 24px 20px;
  text-align: center;
}
.card-header h1 { font-size: 18px; font-weight: 700; }
.card-header p { font-size: 12px; opacity: .9; margin-top: 4px; }
.card-body { padding: 24px 20px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input[type=text], input[type=password] {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid var(--sap-border);
  border-radius: 6px;
  font-size: 14px;
  margin-bottom: 16px;
  font-family: inherit;
}
input:focus { outline: none; border-color: var(--sap-blue); }
.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  background: var(--sap-blue);
  color: white;
}
.btn:disabled { opacity: .6; cursor: not-allowed; }
#msg {
  margin-top: 14px;
  padding: 10px;
  border-radius: 6px;
  font-size: 13px;
  text-align: center;
  display: none;
}
#msg.error { display: block; background: #FADAD4; color: var(--sap-red); }
#msg.ok { display: block; background: #E1F5EB; color: var(--sap-green); }
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <h1>🏕️ تسجيل الدخول</h1>
    <p>منصة المخيم — دخول موحّد</p>
  </div>
  <div class="card-body">
    <form id="loginForm">
      <label for="username">اسم المستخدم</label>
      <input type="text" id="username" autocomplete="username" required>

      <label for="password">كلمة المرور</label>
      <input type="password" id="password" autocomplete="current-password" required>

      <button type="submit" class="btn" id="submitBtn">دخول</button>
    </form>
    <div id="msg"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4lEBGPNxghwq9UmK0iljI5QdS-8iCvC-K09dDtbZCXGvGZyA4repTE3rFVVRp5zS4yw/exec';

const form = document.getElementById('loginForm');
const msg = document.getElementById('msg');
const submitBtn = document.getElementById('submitBtn');

function setMsg(text, cls) {
  msg.textContent = text;
  msg.className = cls || '';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  setMsg('', '');
  submitBtn.disabled = true;
  submitBtn.textContent = 'جاري الدخول...';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', username, password })
    });
    const data = await res.json();

    if (data.success) {
      sessionStorage.setItem('mukhayyam_token', data.token);
      sessionStorage.setItem('mukhayyam_fullName', data.fullName || '');
      sessionStorage.setItem('mukhayyam_role', data.role || '');
      sessionStorage.setItem('mukhayyam_assignedBus', data.assignedBus || '');
      sessionStorage.setItem('mukhayyam_permissions', JSON.stringify(data.permissions || []));
      sessionStorage.setItem('mukhayyam_committees', JSON.stringify(data.committees || []));
      setMsg('تم الدخول بنجاح، جاري التحويل...', 'ok');
      // Someone whose ONLY screen is check-in goes straight to it; everyone else gets the home page.
      const perms = data.permissions || [];
      const onlyCheckin = perms.length === 1 && perms[0] === 'checkin';
      const destination = onlyCheckin ? 'supervisor_app_professional.html' : 'hub.html';
      setTimeout(() => { window.location.href = destination; }, 500);
    } else {
      setMsg(data.error || 'خطأ غير معروف', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'دخول';
    }
  } catch (err) {
    setMsg('تعذّر الاتصال بالخادم: ' + err.message, 'error');
    submitBtn.disabled = false;
    submitBtn.textContent = 'دخول';
  }
});
</script>

</body>
</html>
