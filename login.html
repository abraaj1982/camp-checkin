<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الدخول — MUKHAYYAM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="theme.css">
<style>.box{max-width:400px;margin:8vh auto 0;padding:0 16px}.card{padding:28px 22px}</style>
</head>
<body>
<div class="wrap" style="max-width:none">
  <header class="hdr" style="justify-content:space-between"><div style="display:flex;align-items:center;gap:10px"><div class="logo">م</div><div><div class="t" id="hT"></div></div></div><div style="display:flex;gap:6px"><button class="tool" id="langBtn" aria-label="Language"></button><button class="tool" id="themeBtn"></button></div></header>
  <div class="box"><div class="card">
    <div style="text-align:center;margin-bottom:22px"><div class="logo" style="margin:0 auto 12px;width:56px;height:56px;font-size:28px;border-radius:16px">م</div><h1 style="font-size:22px" id="title"></h1></div>
    <form id="form" autocomplete="on">
      <label class="lbl" for="username" id="lblU"></label><input id="username" type="text" autocomplete="username" required style="margin-bottom:14px">
      <label class="lbl" for="password" id="lblP"></label><input id="password" type="password" autocomplete="current-password" required>
      <div id="msg" role="alert"></div>
      <button type="submit" class="btn full" id="btn" style="margin-top:18px"></button>
    </form>
  </div></div>
</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4lEBGPNxghwq9UmK0iljI5QdS-8iCvC-K09dDtbZCXGvGZyA4repTE3rFVVRp5zS4yw/exec';
const T = {
  ar: { dir: 'rtl', hT: 'مِخيَم', title: 'تسجيل الدخول', u: 'اسم المستخدم', p: 'كلمة المرور', go: 'دخول', going: 'جارٍ الدخول...', lang: 'English', dark: '🌙', light: '☀',
        bad: 'اسم المستخدم أو كلمة المرور غير صحيحة.', locked: 'الحساب مقفل مؤقتاً. تواصل مع السكرتارية.', disabled: 'الحساب معطَّل. تواصل مع السكرتارية.', net: 'تعذّر الاتصال. تحقق من الإنترنت وأعد المحاولة.', ok: 'تم الدخول...' },
  en: { dir: 'ltr', hT: 'MUKHAYYAM', title: 'Sign in', u: 'Username', p: 'Password', go: 'Sign in', going: 'Signing in...', lang: 'العربية', dark: '🌙', light: '☀',
        bad: 'Wrong username or password.', locked: 'Account temporarily locked. Contact the secretariat.', disabled: 'Account disabled. Contact the secretariat.', net: 'Could not connect. Check the internet and try again.', ok: 'Signed in...' }
};
const pref = { get(k, d) { try { return localStorage.getItem('mk_pref_' + k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('mk_pref_' + k, v); } catch (e) {} } };
const S = { lang: pref.get('lang', 'ar'), theme: pref.get('theme', 'light') };
const $ = id => document.getElementById(id);
function paint() {
  const t = T[S.lang]; document.documentElement.lang = S.lang; document.documentElement.dir = t.dir; document.documentElement.dataset.theme = S.theme;
  $('hT').textContent = t.hT; $('title').textContent = t.title; $('lblU').textContent = t.u; $('lblP').textContent = t.p; $('btn').textContent = t.go;
  $('langBtn').textContent = t.lang; $('themeBtn').textContent = S.theme === 'light' ? t.dark : t.light; document.title = t.title + ' — MUKHAYYAM';
}
function msg(cls, text) { $('msg').innerHTML = text ? '<div class="banner ' + cls + '"></div>' : ''; if (text) $('msg').firstChild.textContent = text; }
$('langBtn').onclick = () => { S.lang = S.lang === 'ar' ? 'en' : 'ar'; pref.set('lang', S.lang); paint(); };
$('themeBtn').onclick = () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; pref.set('theme', S.theme); paint(); };
paint();

$('form').addEventListener('submit', async e => {
  e.preventDefault(); msg('', ''); const t = T[S.lang];
  $('btn').disabled = true; $('btn').textContent = t.going;
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username: $('username').value.trim(), password: $('password').value }) });
    const data = await res.json();
    if (data.success) {
      sessionStorage.setItem('mukhayyam_token', data.token);
      sessionStorage.setItem('mukhayyam_fullName', data.fullName || '');
      sessionStorage.setItem('mukhayyam_role', data.role || '');
      sessionStorage.setItem('mukhayyam_assignedBus', data.assignedBus || '');
      sessionStorage.setItem('mukhayyam_permissions', JSON.stringify(data.permissions || []));
      sessionStorage.setItem('mukhayyam_committees', JSON.stringify(data.committees || []));
      msg('ok', t.ok);
      const p = data.permissions || [];
      // One screen only (check-in) -> straight to it; otherwise the home menu of that person's screens.
      location.href = (p.length === 1 && p[0] === 'checkin') ? 'supervisor.html' : 'hub.html';
      return;
    }
    const err = String(data.error || '');
    msg('bad', /locked/i.test(err) ? t.locked : /disabled/i.test(err) ? t.disabled : t.bad);
  } catch (err) { msg('warn', t.net); }
  $('btn').disabled = false; $('btn').textContent = t.go;
});
</script>
</body></html>
