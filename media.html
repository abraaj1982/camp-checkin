  if (d.view) go(d.view);
  else if (d.review) run(async () => { await call({ action: 'programReview', date: st.day, reviewed: d.review === '1' }); await load(); });
  else if (d.tpl) { const t = TEMPLATES[+d.tpl], l = L(); st.form.kind = t[1]; st.form.title = l[t[2]]; st.form.body = t[3] ? l[t[3]] : ''; render(); const f = $('ft'); if (f) f.focus(); }
  else if (d.kind) { st.form.kind = d.kind; render(); }
  else if (d.saveann) run(() => saveAnn(d.saveann));
  else if (d.edit) editAnn(d.edit);
  else if (d.annst) { const p = d.annst.split(':'); run(() => annStatus(p[0], p[1])); }
  else if (d.pt) { const [i, s] = d.pt.split(':'), t = st.teams[+i], v = Math.max(0, (Number(st.rf.pts[t]) || 0) + Number(s)); st.rf.pts[t] = String(v); const inp = $('pt' + i); if (inp) inp.value = v; paintPlaces(); }
  else if (d.saveres) run(() => saveRes(d.saveres === '1'));
  else if (d.respub) run(() => resPublish(d.respub.split(',')));
  else if (d.savepr) run(savePr);
  else if (d.saveteams) run(saveTeams);
  else if (d.savepg) run(saveProgram);
});
$('langBtn').onclick = () => { st.lang = st.lang === 'ar' ? 'en' : 'ar'; pref.set('lang', st.lang); render(); };
$('themeBtn').onclick = () => { st.theme = st.theme === 'light' ? 'dark' : 'light'; pref.set('theme', st.theme); render(); };
render(); load();
</script>
</body></html>
