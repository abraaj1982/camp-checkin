<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Camp Check-In</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #F0F4F8; padding: 20px; }
  .container { max-width: 500px; margin: 0 auto; }

  h1 { text-align: center; color: #0A6ED4; margin-bottom: 20px; font-size: 22px; }

  .card {
    background: white; border-radius: 12px; padding: 20px;
    margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .card h2 { font-size: 16px; color: #333; margin-bottom: 12px; }

  #reader { width: 100%; border-radius: 8px; overflow: hidden; }

  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .btn-blue { background: #0A6ED4; color: white; }
  .btn-green { background: #107E3E; color: white; }
  .btn-gray { background: #E0E0E0; color: #333; }

  .student-info {
    display: none; background: #E8F4FD; border-radius: 12px;
    padding: 20px; margin-bottom: 16px; border-left: 4px solid #0A6ED4;
  }

  .student-name { font-size: 20px; font-weight: bold; color: #333; }
  .student-detail { font-size: 14px; color: #666; margin-top: 8px; }
  .student-detail b { color: #333; }

  .loading { display: none; text-align: center; padding: 20px; color: #666; }

  .success-msg {
    display: none; background: #E1F5EB; border-left: 4px solid #107E3E;
    padding: 16px; border-radius: 8px; margin-bottom: 16px;
    color: #107E3E; font-weight: bold;
  }

  .error-msg {
    display: none; background: #FEE2E2; border-left: 4px solid #C30C13;
    padding: 16px; border-radius: 8px; margin-bottom: 16px;
    color: #C30C13; font-weight: bold;
  }
</style>
</head>
<body>
<div class="container">

  <h1>🏕️ Camp Check-In</h1>

  <!-- ===== رسائل النتيجة ===== -->
  <div id="successMsg" class="success-msg"></div>
  <div id="errorMsg" class="error-msg"></div>

  <!-- ===== خطوة 1: مسح QR ===== -->
  <div class="card">
    <h2>📷 Step 1: Scan QR Code</h2>
    <div id="reader"></div>
    <button class="btn btn-blue" onclick="startScanner()">Start Camera</button>
  </div>

  <!-- ===== Loading ===== -->
  <div id="loading" class="loading">⏳ Looking up student...</div>

  <!-- ===== خطوة 2: بيانات الطالب ===== -->
  <div id="studentInfo" class="student-info">
    <div class="student-name" id="sName">--</div>
    <div class="student-detail">
      <b>ID:</b> <span id="sId">--</span> &nbsp;|&nbsp;
      <b>Bus:</b> <span id="sBus">--</span> &nbsp;|&nbsp;
      <b>Team:</b> <span id="sTeam">--</span>
    </div>

    <button class="btn btn-green" onclick="doCheckIn()" style="margin-top: 16px;">
      ✓ Check In — Board the Bus
    </button>
    <button class="btn btn-gray" onclick="reset()">
      ← Scan Another Student
    </button>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════
// 🔗 هذا هو الرابط السحري — غيّره برابطك من Apps Script
// ══════════════════════════════════════════════════════
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby9c-rUHscvfi7QHPUtuEOBbsBeEbfRVvh0PjE2gtV53lHcEFExpTrRWrpGKbutOJcxAg/exec';
// مثال:
// const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby.../exec';

let scanner = null;
let currentStudent = null;

// ══════════════════════════════════════════════════════
// 📷 تشغيل الكاميرا ومسح QR
// ══════════════════════════════════════════════════════
async function startScanner() {
  hideAll();
  scanner = new Html5Qrcode('reader');
  try {
    await scanner.start(
      { facingMode: 'environment' },  // الكاميرا الخلفية
      { fps: 10, qrbox: { width: 250, height: 250 } },
      onQRScanned,  // لما يقرأ QR
      () => {}       // تجاهل الأخطاء المؤقتة
    );
  } catch (err) {
    showError('Camera error: ' + err.message);
  }
}

// ══════════════════════════════════════════════════════
// ✅ لما يقرأ QR — ابحث عن الطالب
// ══════════════════════════════════════════════════════
async function onQRScanned(qrText) {
  // أوقف الكاميرا
  await scanner.stop();
  
  // أظهر loading
  document.getElementById('loading').style.display = 'block';
  
  try {
    // 🔗 هنا الربط! — نرسل الـ ID لـ Apps Script
    const response = await fetch(SCRIPT_URL + '?action=lookup&studentId=' + qrText);
    const data = await response.json();
    
    document.getElementById('loading').style.display = 'none';
    
    if (data.found) {
      // ✅ لقينا الطالب — أظهر بياناته
      currentStudent = data;
      document.getElementById('sName').textContent = data.name;
      document.getElementById('sId').textContent = data.studentId;
      document.getElementById('sBus').textContent = 'Bus ' + data.bus;
      document.getElementById('sTeam').textContent = data.team;
      document.getElementById('studentInfo').style.display = 'block';
    } else {
      // ❌ ما لقينا الطالب
      showError('Student not found: ' + qrText);
    }
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    showError('Connection error — check your internet and SCRIPT_URL');
  }
}

// ══════════════════════════════════════════════════════
// 💾 تسجيل الحضور — حفظ في Google Sheet
// ══════════════════════════════════════════════════════
async function doCheckIn() {
  if (!currentStudent) return;
  
  try {
    // 🔗 هنا الربط! — نرسل البيانات لـ Apps Script ليحفظها
    const response = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({
        studentId: currentStudent.studentId,
        name: currentStudent.name,
        bus: currentStudent.bus,
        team: currentStudent.team,
        action: 'check-in'
      })
    });
    const data = await response.json();
    
    if (data.success) {
      showSuccess('✓ ' + currentStudent.name + ' checked in successfully!');
      document.getElementById('studentInfo').style.display = 'none';
    }
  } catch (err) {
    showError('Failed to save — try again');
  }
}

// ══════════════════════════════════════════════════════
// مساعدات
// ══════════════════════════════════════════════════════
function reset() {
  hideAll();
  currentStudent = null;
}

function hideAll() {
  document.getElementById('studentInfo').style.display = 'none';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('successMsg').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';
}

function showSuccess(msg) {
  hideAll();
  const el = document.getElementById('successMsg');
  el.textContent = msg;
  el.style.display = 'block';
}

function showError(msg) {
  hideAll();
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
}
</script>
</body>
</html>
