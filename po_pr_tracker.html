<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const STORAGE_KEY = "po_pr_tracker_requests_v1";

const SERVICE_TYPES = ["Hotel", "Car", "Tickets", "Other"];
const STATUSES = ["Pending", "Waiting PR approval", "Waiting PO approval", "Completed", "Cancelled"];

const STATUS_LABELS = {
  "Pending": "Pending",
  "Waiting PR approval": "Waiting PR approval",
  "Waiting PO approval": "Waiting PO approval",
  "Completed": "Completed",
  "Cancelled": "Cancelled",
};

// Each status gets its own strong, unmistakable color so scanning the table
// (or the search results) tells the stage apart at a glance without reading
// the text — amber/blue/purple/green/red, never two stages sharing a hue.
const STATUS_INLINE_STYLE = {
  "Pending": { background: "var(--sap-amber-bg)", color: "var(--sap-amber)", borderColor: "#F5DFA6" },
  "Waiting PR approval": { background: "#EAF2FC", color: "var(--sap-blue)", borderColor: "#BEDAF7" },
  "Waiting PO approval": { background: "var(--sap-purple-bg)", color: "var(--sap-purple)", borderColor: "#D9CCEA" },
  "Completed": { background: "var(--sap-green-bg)", color: "var(--sap-green)", borderColor: "#BFE3CB" },
  "Cancelled": { background: "var(--sap-red-bg)", color: "var(--sap-red)", borderColor: "#F5C2C2" },
};

// Grab-and-drag horizontal scroll for wide tables. Mouse only — touch
// already scrolls natively, and adding touch handlers here would fight it.
function useDragScroll() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let dragging = false;
    let startX = 0;
    let startScroll = 0;
    const onDown = (e) => {
      dragging = true;
      startX = e.pageX;
      startScroll = el.scrollLeft;
      el.classList.add("dragging");
    };
    const onMove = (e) => {
      if (!dragging) return;
      e.preventDefault();
      el.scrollLeft = startScroll - (e.pageX - startX);
    };
    const stop = () => {
      dragging = false;
      el.classList.remove("dragging");
    };
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", stop);
    return () => {
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", stop);
    };
  }, []);
  return ref;
}

// A fat, always-visible horizontal scrollbar drawn below the table and kept
// in sync with it both ways — the browser's native thin scrollbar is easy to
// miss entirely, this bar is not. Hidden once everything already fits.
function TableScrollbar({ targetRef }) {
  const trackRef = useRef(null);
  const [metrics, setMetrics] = useState({ thumbPct: 100, leftPct: 0, canScroll: false });
  const draggingRef = useRef(false);

  useEffect(() => {
    const el = targetRef.current;
    if (!el) return;
    const update = () => {
      const scrollable = el.scrollWidth - el.clientWidth;
      const thumbPct = Math.max((el.clientWidth / el.scrollWidth) * 100, 5);
      const leftPct = scrollable > 0 ? (el.scrollLeft / scrollable) * (100 - thumbPct) : 0;
      setMetrics({ thumbPct, leftPct, canScroll: scrollable > 2 });
    };
    update();
    el.addEventListener("scroll", update);
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => {
      el.removeEventListener("scroll", update);
      ro.disconnect();
    };
  }, [targetRef]);

  const scrollToClientX = (clientX) => {
    const el = targetRef.current;
    const track = trackRef.current;
    if (!el || !track) return;
    const rect = track.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    el.scrollLeft = ratio * (el.scrollWidth - el.clientWidth);
  };

  const onTrackDown = (e) => {
    draggingRef.current = true;
    scrollToClientX(e.clientX);
  };

  useEffect(() => {
    const onMove = (e) => { if (draggingRef.current) scrollToClientX(e.clientX); };
    const onUp = () => { draggingRef.current = false; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, []);

  if (!metrics.canScroll) return null;

  return (
    <div
      ref={trackRef}
      onMouseDown={onTrackDown}
      style={{ height: 14, background: "#EDEFF1", borderTop: "1px solid var(--sap-border)", position: "relative", cursor: "pointer" }}
      title="Drag to scroll the table left/right"
    >
      <div
        style={{
          position: "absolute",
          top: 2,
          left: `${metrics.leftPct}%`,
          width: `${metrics.thumbPct}%`,
          height: 10,
          background: "var(--sap-gray)",
          borderRadius: 5,
        }}
      />
    </div>
  );
}

// Speaks a plain-language reminder out loud using the browser's built-in
// text-to-speech — no server, no API key, works offline. Browsers sometimes
// block the very first speech attempt on a page until the visitor has
// clicked/tapped somewhere, so callers should also expose a manual replay
// button rather than relying on this firing silently.
function speakReminder(text) {
  try {
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance !== "function") return false;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.98;
    window.speechSynthesis.speak(utter);
    return true;
  } catch (err) {
    return false;
  }
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Native window.confirm()/alert() are blocked (or silently return falsy
// instantly) inside a sandboxed iframe such as the Artifacts viewer, which
// made destructive actions like Delete silently no-op. These in-app
// replacements work the same everywhere — the artifact link and a plain
// local HTML file alike.
let _confirmSetter = null;
let _confirmResolve = null;
function registerConfirmSetter(setter) { _confirmSetter = setter; }
function appConfirm(message) {
  return new Promise((resolve) => {
    _confirmResolve = resolve;
    _confirmSetter({ open: true, message });
  });
}

let _toastSetter = null;
function registerToastSetter(setter) { _toastSetter = setter; }
function appToast(message) {
  _toastSetter({ id: uid(), message });
}

function ConfirmHost() {
  const [state, setState] = useState({ open: false, message: "" });
  useEffect(() => { registerConfirmSetter(setState); }, []);

  const respond = (result) => {
    setState({ open: false, message: "" });
    if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
  };

  if (!state.open) return null;
  return (
    <div className="sap-modal-overlay fixed inset-0 flex items-center justify-center z-[200] p-4" onClick={() => respond(false)}>
      <div className="sap-modal w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
        <div className="p-5">
          <p className="text-sm" style={{ color: "var(--sap-text)" }}>{state.message}</p>
          <div className="flex justify-end gap-2 pt-4">
            <button onClick={() => respond(false)} className="sap-btn sap-btn-outline">Cancel</button>
            <button onClick={() => respond(true)} className="sap-btn sap-btn-blue">Confirm</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ToastHost() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    registerToastSetter((toast) => {
      setToasts((prev) => [...prev, toast]);
      setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== toast.id)), 4000);
    });
  }, []);

  if (toasts.length === 0) return null;
  return (
    <div className="fixed bottom-4 z-[200] flex flex-col gap-2" style={{ insetInlineEnd: 16 }}>
      {toasts.map((t) => (
        <div key={t.id} className="sap-card px-4 py-3 text-sm shadow-lg" style={{ background: "#fff", color: "var(--sap-text)", maxWidth: 320 }}>
          {t.message}
        </div>
      ))}
    </div>
  );
}

// Requests saved under the older 6-stage status list ("Processing", "Approved",
// "PO Issued") still carry those exact strings — since STATUS_LABELS and
// STATUS_INLINE_STYLE only know the current 5 stages, an unmigrated record
// would render a blank badge and fall through every workflow check. This maps
// old values onto their closest current stage the moment a request is read,
// so existing data displays and behaves correctly without a one-time script.
const LEGACY_STATUS_MAP = {
  "Processing": "Waiting PR approval",
  "Approved": "Waiting PO approval",
  "PO Issued": "Waiting PO approval",
};

function normalizeStatus(req) {
  const mapped = LEGACY_STATUS_MAP[req.status];
  return mapped ? { ...req, status: mapped } : req;
}

function loadRequests() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw).map(normalizeStatus) : [];
  } catch (e) {
    return [];
  }
}

function saveRequests(requests) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
    return true;
  } catch (e) {
    // Never fail quietly: a tracker that silently stops recording is worse
    // than one that refuses loudly.
    console.error("Failed to save to localStorage", e);
    const full = e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014);
    appToast(
      full
        ? "This browser's storage is full, so the last change was NOT saved. Export to Excel, then delete some old requests or their attachments."
        : "The last change could not be saved to this browser: " + (e && e.message ? e.message : e)
    );
    return false;
  }
}

// ---------------------------------------------------------------------------
// Optional shared database — real collaboration when opened via the
// Artifact link (window.claude.use("db")). Every viewer of that same link
// then reads and writes the same "requests" collection live. It is a
// no-op everywhere else (a local HTML file, GitHub Pages): window.claude
// doesn't exist there, so the app quietly falls back to the private,
// per-browser localStorage behaviour it always had — nobody loses the
// "fully local" option by this being added.
//
// Attachment BYTES are deliberately excluded from what gets shared: a
// document in this store is capped at 256 KiB, far under a real PDF/.msg.
// Only their name, size and any extracted text travel to the shared
// database (small, and already what search needs); the actual file stays
// in this browser's IndexedDB and only opens on the device that added it.
// ---------------------------------------------------------------------------
const SHARED_MIGRATION_KEY = "po_pr_tracker_shared_migrated_v1";

function stripAttachmentForSharing(a) {
  return { name: a.name, type: a.type, size: a.size, blobId: a.blobId || null, text: a.text || "" };
}

// The db body must be a plain JSON object with no `undefined` values, and
// the platform doesn't know about React's synthetic id-vs-fields shape —
// this is the one place that translates a request to what actually gets
// written, so every write path (single, batch, import) stays consistent.
function sanitizeRequestForDb(req) {
  const clean = { ...req };
  delete clean.id; // the id is the document's path, never part of its body
  clean.attachments = (req.attachments || []).map(stripAttachmentForSharing);
  Object.keys(clean).forEach((k) => { if (clean[k] === undefined) clean[k] = ""; });
  return clean;
}

function docToRequest(doc) {
  return normalizeStatus({ ...doc.data(), id: doc.id });
}

// Runs once per browser: if the shared database is empty but this browser
// already has locally-saved requests, offer to bring them in rather than
// silently showing an empty table where real work used to be.
async function migrateLocalRequestsToSharedDb(db) {
  try {
    if (localStorage.getItem(SHARED_MIGRATION_KEY)) return;
    const existing = await db.collection("requests").limit(1).get();
    if (!existing.empty) { localStorage.setItem(SHARED_MIGRATION_KEY, "1"); return; }
    const local = loadRequests();
    if (!local.length) { localStorage.setItem(SHARED_MIGRATION_KEY, "1"); return; }
    const proceed = await appConfirm(
      `This browser has ${local.length} request(s) saved locally, from before sharing was turned on. ` +
      `Upload them to the shared database so your colleague can see them too?`
    );
    localStorage.setItem(SHARED_MIGRATION_KEY, "1");
    if (!proceed) return;
    for (const r of local) {
      await db.collection("requests").doc(r.id || uid()).set(sanitizeRequestForDb(r));
    }
    appToast(`Uploaded ${local.length} request(s) to the shared database`);
  } catch (err) {
    console.error("Local-to-shared migration failed:", err);
  }
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

function isOverdue(req) {
  if (!req.requiredDate || req.status === "Completed" || req.status === "Cancelled") return false;
  const req_d = new Date(req.requiredDate);
  const now = new Date();
  return req_d < now;
}

function getAlertLevel(req) {
  if (req.status === "Completed" || req.status === "Cancelled") return null;
  if (isOverdue(req)) return "yellow";
  const pendingDays = daysSince(req.createdAt);
  if (req.status === "Pending" && pendingDays > 21) return "red";
  if (req.status === "Pending" && pendingDays > 7) return "orange";
  return null;
}

const ALERT_STYLES = {
  red: { rowStyle: { background: "var(--sap-red-bg)" }, dot: "var(--sap-red)", text: "var(--sap-red)", label: "Pending over 3 weeks" },
  orange: { rowStyle: { background: "var(--sap-orange-bg)" }, dot: "var(--sap-orange)", text: "var(--sap-orange)", label: "Pending over a week" },
  yellow: { rowStyle: { background: "var(--sap-amber-bg)" }, dot: "var(--sap-amber)", text: "var(--sap-amber)", label: "Overdue" },
};

const ACTION_SUGGESTIONS = {
  "Hotel": ["Contact the vendor", "Confirm availability", "Get the booking confirmation", "Create the PR in SAP and enter the PR number", "Issue the PO once approved", "Confirm the stay with the hotel"],
  "Car": ["Contact the rental company", "Confirm car and driver availability", "Confirm pickup time", "Create the PR in SAP and enter the PR number", "Issue the PO once approved", "Confirm the booking with the rental company"],
  "Tickets": ["Contact the travel agency", "Confirm seat availability and fares", "Create the PR in SAP and enter the PR number", "Issue the ticket after approval", "Issue the PO once approved"],
  "Other": ["Review request details with the requester", "Identify the right supplier", "Create the PR in SAP and enter the PR number", "Issue the PO after approval"],
};

const SERVICE_TYPE_PATTERNS = {
  "Hotel": /فندق|hotel|إقامة|غرفة|room|stay/,
  "Car": /سيارة|car|تأجير|ليموزين|rental|limo/,
  "Tickets": /تذكرة|تذاكر|ticket|طيران|رحلة|flight/,
};

// Single best guess — used where only one type is expected (e.g. Excel import).
function guessServiceType(text) {
  const t = text.toLowerCase();
  for (const type of ["Hotel", "Car", "Tickets"]) {
    if (SERVICE_TYPE_PATTERNS[type].test(t)) return type;
  }
  return "Other";
}

// One email can bundle several services at once (hotel + car + tickets for
// the same trip) — this returns every type mentioned, not just the first,
// so the parser can offer them as a multi-select instead of picking one.
function detectServiceTypes(text) {
  const t = text.toLowerCase();
  const found = ["Hotel", "Car", "Tickets"].filter((type) => SERVICE_TYPE_PATTERNS[type].test(t));
  return found.length ? found : ["Other"];
}

// Learns the vendors you've actually used before, per service type — no external API
function getKnownVendors(requests, serviceType) {
  const counts = {};
  requests
    .filter((r) => r.vendor && r.vendor.trim() && (!serviceType || r.serviceType === serviceType))
    .forEach((r) => {
      const v = r.vendor.trim();
      counts[v] = (counts[v] || 0) + 1;
    });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([vendor]) => vendor);
}

// Same idea for the request owner: the regex guess on free-form email text is
// unreliable (it can grab a signature line like "Content Safety" instead of
// the actual requester), so a name you've used before always wins over it.
function getKnownOwners(requests) {
  const counts = {};
  requests
    .filter((r) => r.owner && r.owner.trim())
    .forEach((r) => {
      const o = r.owner.trim();
      counts[o] = (counts[o] || 0) + 1;
    });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([owner]) => owner);
}

function getKnownBeneficiaries(requests) {
  const counts = {};
  requests
    .filter((r) => r.beneficiary && r.beneficiary.trim())
    .forEach((r) => {
      const b = r.beneficiary.trim();
      counts[b] = (counts[b] || 0) + 1;
    });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([name]) => name);
}

function matchKnownInText(text, knownValues) {
  const t = text.toLowerCase();
  return knownValues.find((v) => t.includes(v.toLowerCase())) || "";
}

const MONTH_WORD = "(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*";

function monthNumberFromWord(word) {
  const idx = MONTHS_EN_SHORT.indexOf(String(word).slice(0, 3).toLowerCase());
  return idx === -1 ? null : idx + 1;
}

function toIsoDate(year, month, day) {
  if (!year || !month || !day) return "";
  const y = String(year).length === 2 ? "20" + year : String(year);
  return `${y}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

// Travel emails write the stay as a range far more often than as one date:
// "10-15 Jan 2026", "12/1/26 - 15/1/26", "2026-01-10 to 2026-01-15". Reading
// both ends matters because an invoice months later quotes those dates.
function extractServiceDates(text) {
  const thisYear = new Date().getFullYear();

  // "10 - 15 Jan 2026"  /  "10-15 January"
  let m = text.match(new RegExp(`(\\d{1,2})\\s*[-–—/]\\s*(\\d{1,2})\\s+(${MONTH_WORD})\\.?\\s*(\\d{2,4})?`, "i"));
  if (m) {
    const month = monthNumberFromWord(m[3]);
    const year = m[4] || thisYear;
    if (month) return { from: toIsoDate(year, month, m[1]), to: toIsoDate(year, month, m[2]) };
  }

  // "10 Jan - 15 Feb 2026"
  m = text.match(new RegExp(`(\\d{1,2})\\s+(${MONTH_WORD})\\.?\\s*(\\d{2,4})?\\s*[-–—]\\s*(\\d{1,2})\\s+(${MONTH_WORD})\\.?\\s*(\\d{2,4})?`, "i"));
  if (m) {
    const m1 = monthNumberFromWord(m[2]);
    const m2 = monthNumberFromWord(m[5]);
    const y2 = m[6] || m[3] || thisYear;
    const y1 = m[3] || y2;
    if (m1 && m2) return { from: toIsoDate(y1, m1, m[1]), to: toIsoDate(y2, m2, m[4]) };
  }

  // ISO range: "2026-01-10 to 2026-01-15"
  m = text.match(/(\d{4}-\d{2}-\d{2})\s*(?:to|until|[-–—])\s*(\d{4}-\d{2}-\d{2})/i);
  if (m) return { from: m[1], to: m[2] };

  // Numeric range: "11/1/26 - 06/2/26" (day first, as written locally)
  m = text.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s*[-–—]\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) return { from: toIsoDate(m[3], m[2], m[1]), to: toIsoDate(m[6], m[5], m[4]) };

  // A single ISO date is better than nothing.
  m = text.match(/(\d{4}-\d{2}-\d{2})/);
  if (m) return { from: m[1], to: "" };

  // Single "15 Jan 2026"
  m = text.match(new RegExp(`(\\d{1,2})\\s+(${MONTH_WORD})\\.?\\s*(\\d{2,4})`, "i"));
  if (m) {
    const month = monthNumberFromWord(m[2]);
    if (month) return { from: toIsoDate(m[3], month, m[1]), to: "" };
  }

  return { from: "", to: "" };
}

function extractFromEmail(text, knownVendors, knownOwners, knownBeneficiaries) {
  const prMatch = text.match(/PR[\s#:.-]*([0-9]{4,})/i);
  const budgetMatch = text.match(/(?:ميزانية|budget|المبلغ|amount)[^\d]{0,10}([\d,]+(?:\.\d+)?)/i);
  const ownerMatch = text.match(/(?:من|المسؤول|السيد|الأخ|الأخت|from|requester|attn)[\s:]+([؀-ۿa-zA-Z\s]{2,30}?)(?:\n|,|،|$)/i);
  const vendorMatch = text.match(/(?:الموردة?|المورد|Vendor|Supplier)[\s:]+([؀-ۿa-zA-Z0-9\s]{2,40}?)(?:\n|,|،|$)/i);
  // The traveller is usually introduced explicitly ("guest name:", "for Mr X",
  // "باسم ..."), which is a far more reliable signal than the sender line.
  const beneficiaryMatch = text.match(
    /(?:guest\s*name|traveller|traveler|passenger|for\s+(?:mr|mrs|ms|dr)\.?|المسافر|باسم|للسيد|للأخ|لصالح)[\s:.]+([؀-ۿa-zA-Z.\s]{2,40}?)(?:\n|,|،|-|\d|$)/i
  );

  const serviceType = guessServiceType(text);
  const learnedVendor = matchKnownInText(text, knownVendors || []);
  const learnedOwner = matchKnownInText(text, knownOwners || []);
  const learnedBeneficiary = matchKnownInText(text, knownBeneficiaries || []);
  const guessedOwner = ownerMatch ? ownerMatch[1].trim() : "";
  const guessedBeneficiary = beneficiaryMatch ? beneficiaryMatch[1].trim() : "";
  const serviceDates = extractServiceDates(text);

  return {
    prNumber: prMatch ? prMatch[1] : "",
    budget: budgetMatch ? budgetMatch[1].replace(/,/g, "") : "",
    requiredDate: "",
    serviceDateFrom: serviceDates.from,
    serviceDateTo: serviceDates.to,
    // Never trust the free-text guess blindly — only auto-fill when it matches
    // someone you've actually logged as an owner before; otherwise leave it
    // blank and require you to pick/type the real owner yourself.
    owner: learnedOwner,
    ownerNeedsConfirmation: !learnedOwner && !!guessedOwner,
    ownerGuess: guessedOwner,
    beneficiary: learnedBeneficiary || guessedBeneficiary,
    vendor: learnedVendor || (vendorMatch ? vendorMatch[1].trim() : ""),
    serviceType,
  };
}

// Plain-language brief of what an email is actually asking for — built from
// what was actually extracted, not a guess dressed up as one.
function summarizeEmail({ owner, beneficiary, selectedTypes, budget, requiredDate, serviceDateFrom, serviceDateTo, prNumber }) {
  const who = owner || "an unconfirmed requester";
  const services = selectedTypes.length ? selectedTypes.join(", ") : "no recognizable service";
  const forWhom = beneficiary && beneficiary.trim() && beneficiary.trim() !== (owner || "").trim()
    ? ` on behalf of ${beneficiary.trim()}`
    : "";
  const parts = [
    `Requested by ${who}${forWhom}: ${selectedTypes.length} service${selectedTypes.length === 1 ? "" : "s"} — ${services}.`,
  ];
  if (serviceDateFrom || serviceDateTo) {
    parts.push(serviceDateTo && serviceDateFrom
      ? `Service dates ${serviceDateFrom} → ${serviceDateTo}.`
      : `Service date ${serviceDateFrom || serviceDateTo}.`);
  }
  if (requiredDate) parts.push(`Needed by ${requiredDate}.`);
  if (budget) parts.push(`Mentioned budget: ${Number(budget).toLocaleString()}.`);
  parts.push(
    prNumber
      ? `A PR number was already mentioned (${prNumber}) — verify which of the ${selectedTypes.length > 1 ? "requests below it belongs to" : "request below it belongs to"}.`
      : `No PR number yet — you'll need to create ${selectedTypes.length > 1 ? "one PR per service" : "a PR"} in SAP and enter ${selectedTypes.length > 1 ? "each" : "its"} number once issued.`
  );
  return parts.join(" ");
}

// Requests split out of one email get a colour of their own, drawn as a stripe
// down the left edge of every row in the group. Colour alone never carries the
// meaning — each row also says "1 of 3 · same email" — but the stripe is what
// makes the grouping visible at a glance in a long list. These tones are kept
// clear of the status palette so they can't be mistaken for a state.
const BATCH_COLORS = ["#5B7F95", "#8A6A9E", "#3F7D6E", "#9A6B4F", "#4A6FA5", "#8B6D3F"];

function batchColorFor(batchId) {
  if (!batchId) return null;
  let hash = 0;
  for (let i = 0; i < batchId.length; i++) hash = (hash * 31 + batchId.charCodeAt(i)) >>> 0;
  return BATCH_COLORS[hash % BATCH_COLORS.length];
}

// Tells the user exactly what to do next for this request, based on its
// current status and what's already filled in — the workflow guidance.
function getNextAction(req) {
  switch (req.status) {
    case "Pending":
      if (!req.vendor) return "Choose a supplier for this request";
      return "Create the PR in SAP, then enter the PR number here";
    case "Waiting PR approval":
      if (!req.prNumber) return "Enter the PR number, then wait for PR approval from SAP";
      return "Waiting for PR approval from SAP";
    case "Waiting PO approval":
      if (!req.poNumber) return "Enter the PO number, then wait for PO approval";
      return "Waiting for PO approval — confirm booking/delivery once approved";
    case "Completed":
      return "Completed — no action needed";
    case "Cancelled":
      return "Cancelled — no action needed";
    default:
      return "";
  }
}

  "Waiting PO approval": 3,
};

  } catch (e) {

// Days the request has sat in its current stage, measured from the last time
// the stage (or the party it waits on) actually changed.
function daysInStage(req) {
  return daysSince(req.stageSince || req.updatedAt || req.createdAt);
}

// How far past the stage's target this request is: >1 means breached.
function slaBreach(req, sla) {
  const target = (sla || DEFAULT_SLA_DAYS)[req.status];
  if (!target || req.status === "Completed" || req.status === "Cancelled") return null;
  const elapsed = daysInStage(req);
  if (elapsed <= target) return null;
  return { elapsed, target, over: elapsed - target };
}

// ---------------------------------------------------------------------------
// Deep search
//
// An invoice arriving months later carries the traveller's name, the hotel,
// the stay dates and an amount — rarely the same words that were typed when
// the request was created. So everything a request knows (including the text
// pulled out of its attached PDFs, and dates spelled out as month names in
// both languages) is folded into one blob, and a query matches when every
// word in it appears somewhere in that blob.
// ---------------------------------------------------------------------------
const MONTHS_EN = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
const MONTHS_EN_SHORT = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
const MONTHS_AR = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

// "2026-01-12" also becomes "january jan يناير 2026" so a search for the
// month name finds it.
function spellOutDate(dateStr) {
  if (!dateStr) return "";
  const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(dateStr);
  const monthIdx = parseInt(m[2], 10) - 1;
  if (monthIdx < 0 || monthIdx > 11) return String(dateStr);
  return [dateStr, MONTHS_EN[monthIdx], MONTHS_EN_SHORT[monthIdx], MONTHS_AR[monthIdx], m[1]].join(" ");
}

function buildSearchBlob(req) {
  const attachmentText = (req.attachments || [])
    .map((a) => [a.name, a.text].filter(Boolean).join(" "))
    .join(" ");
  return [
    req.prNumber,
    req.poNumber,
    req.owner,
    req.beneficiary,
    req.department,
    req.serviceType,
    req.vendor,
    req.status,
    req.waitingOn,
    req.budget,
    req.finalAmount,
    spellOutDate(req.requiredDate),
    spellOutDate(req.serviceDateFrom),
    spellOutDate(req.serviceDateTo),
    spellOutDate(req.completedDate),
    spellOutDate(req.createdAt ? String(req.createdAt).slice(0, 10) : ""),
    req.notes,
    req.emailSummary,
    attachmentText,
  ]
    .filter(Boolean)
    .join(" \n ")
    .toLowerCase();
}

// Every word must appear somewhere — so "radisson mohammed jan" narrows
// instead of returning everything that mentions any one of them.
function matchesSearch(req, query) {
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return true;
  const blob = buildSearchBlob(req);
  return terms.every((t) => blob.includes(t));
}

// ---------------------------------------------------------------------------
// Fingerprinting the source email
//
// Field-level duplicate checks can't see the simplest mistake of all: the same
// email being imported twice. A request often has no dates or traveller filled
// in yet, so there's nothing to compare — but the email text itself is an exact
// key. Hashing it lets the second import be caught before any work is redone.
// ---------------------------------------------------------------------------
function fingerprintEmail(text) {
  const normalized = String(text || "").toLowerCase().replace(/\s+/g, " ").trim();
  if (normalized.length < 20) return "";
  let h1 = 0x811c9dc5;
  let h2 = 0x01000193;
  for (let i = 0; i < normalized.length; i++) {
    const c = normalized.charCodeAt(i);
    h1 = (h1 ^ c) >>> 0;
    h1 = (h1 * 0x01000193) >>> 0;
    h2 = (h2 + c * (i + 1)) >>> 0;
  }
  return h1.toString(36) + "-" + h2.toString(36) + "-" + normalized.length.toString(36);
}

function findRequestsFromSameEmail(sourceHash, requests) {
  if (!sourceHash) return [];
  return requests.filter((r) => r.sourceHash === sourceHash);
}

// ---------------------------------------------------------------------------
// Duplicate detection: the same person, same service, overlapping dates.
// ---------------------------------------------------------------------------
function datesOverlap(aFrom, aTo, bFrom, bTo) {
  const aStart = aFrom || aTo;
  const bStart = bFrom || bTo;
  if (!aStart || !bStart) return false;
  const aEnd = aTo || aFrom;
  const bEnd = bTo || bFrom;
  return aStart <= bEnd && bStart <= aEnd;
}

function findPossibleDuplicates(candidate, requests) {
  const person = (candidate.beneficiary || candidate.owner || "").trim().toLowerCase();
  if (!person) return [];
  return requests.filter((r) => {
    if (r.id && r.id === candidate.id) return false;
    if (r.status === "Cancelled") return false;
    const otherPerson = (r.beneficiary || r.owner || "").trim().toLowerCase();
    if (otherPerson !== person) return false;
    if (r.serviceType !== candidate.serviceType) return false;

    const bothHaveDates =
      (candidate.serviceDateFrom || candidate.serviceDateTo) &&
      (r.serviceDateFrom || r.serviceDateTo);
    if (bothHaveDates) {
      return datesOverlap(
        candidate.serviceDateFrom, candidate.serviceDateTo,
        r.serviceDateFrom, r.serviceDateTo
      );
    }
    // With no dates to compare there is nothing to rule the match out, and a
    // second open request of the same service for the same person is exactly
    // the mistake worth questioning. Completed ones are left alone: repeat
    // bookings for a frequent traveller are normal.
    return r.status !== "Completed";
  });
}

// ---------------------------------------------------------------------------
// Attachment blobs live in IndexedDB, not localStorage
//
// A couple of PDFs base64-encoded into localStorage exhausts its ~5 MB quota,
// and the failure mode is silent: writes start throwing and the tracker stops
// saving. Only the small stuff (name, size, extracted text) stays in
// localStorage for search; the bytes go to IndexedDB, which is sized for it.
// ---------------------------------------------------------------------------
const ATTACHMENT_DB = "po_pr_tracker_files";
const ATTACHMENT_STORE = "files";

function openAttachmentDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("IndexedDB unavailable")); return; }
    const req = window.indexedDB.open(ATTACHMENT_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(ATTACHMENT_STORE)) db.createObjectStore(ATTACHMENT_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("Could not open the file store"));
  });
}

function putAttachmentBlob(id, dataUrl) {
  return openAttachmentDb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(ATTACHMENT_STORE, "readwrite");
    tx.objectStore(ATTACHMENT_STORE).put(dataUrl, id);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}

function getAttachmentBlob(id) {
  return openAttachmentDb().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(ATTACHMENT_STORE, "readonly");
    const get = tx.objectStore(ATTACHMENT_STORE).get(id);
    get.onsuccess = () => resolve(get.result || null);
    get.onerror = () => reject(get.error);
  }));
}

// ---------------------------------------------------------------------------
// Reading the text inside an attached PDF so search can reach it
// ---------------------------------------------------------------------------
const MAX_EXTRACTED_TEXT = 20000;

async function extractPdfText(file) {
  if (!window.pdfjsLib) return "";
  try {
    if (window.pdfjsLib.GlobalWorkerOptions && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
    const buffer = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      pages.push(content.items.map((it) => it.str).join(" "));
      if (pages.join(" ").length > MAX_EXTRACTED_TEXT) break;
    }
    return pages.join("\n").slice(0, MAX_EXTRACTED_TEXT);
  } catch (err) {
    console.warn("Could not read text out of this PDF:", err);
    return "";
  }
}

function stripHtmlToText(html) {
  return String(html)
    .replace(/<!--[\s\S]*?-->/g, "")
    .replace(/<style[\s\S]*?<\/style>/gi, "")
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|tr|li|h[1-6])>/gi, "\n")
    .replace(/<[^>]+>/g, "")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

// Outlook composed in HTML wraps its RTF as "compressed RTF from HTML": the
// original markup survives verbatim inside {\*\htmltagNNN ...} groups. This
// walks the RTF text respecting escaped braces (\{, \}) and reassembles the
// original HTML by concatenating those groups in order.
function extractHtmlFromRtf(rtf) {
  const out = [];
  const marker = /\{\\\*\\htmltag\d+ ?/g;
  let m;
  while ((m = marker.exec(rtf))) {
    let i = m.index + m[0].length;
    let depth = 1;
    let content = "";
    while (i < rtf.length && depth > 0) {
      const ch = rtf[i];
      if (ch === "\\" && (rtf[i + 1] === "{" || rtf[i + 1] === "}" || rtf[i + 1] === "\\")) {
        content += rtf[i + 1];
        i += 2;
        continue;
      }
      if (ch === "{") { depth++; content += ch; i++; continue; }
      if (ch === "}") { depth--; if (depth === 0) { i++; break; } content += ch; i++; continue; }
      content += ch;
      i++;
    }
    out.push(content);
    marker.lastIndex = i;
  }
  return out.join("");
}

// A message composed in plain Rich Text (not HTML) has no htmltag groups at
// all — just RTF control words around the real text. Crude but workable for
// pulling out readable text (names, dates, hotel names) for extraction.
function stripRtfControlWords(rtf) {
  return rtf
    .replace(/\{\\\*[^{}]*\}/g, "")
    .replace(/\\'[0-9A-Fa-f]{2}/g, "")
    .replace(/\\par[d]?\b\s?/g, "\n")
    .replace(/\\tab\b\s?/g, "\t")
    .replace(/\\[a-zA-Z]+-?\d*\s?/g, "")
    .replace(/[{}]/g, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

// PidTagRtfCompressed -> readable text, whichever the message actually used.
function rtfCompressedToText(compressedBytes) {
  const rtfBytes = window.decompressRTF(compressedBytes);
  const rtf = Array.from(rtfBytes, (b) => String.fromCharCode(b & 0xff)).join("");
  if (/\\fromhtml1/.test(rtf)) {
    return stripHtmlToText(extractHtmlFromRtf(rtf));
  }
  return stripRtfControlWords(rtf);
}

function decodeQuotedPrintable(text) {
  return text
    .replace(/=\r?\n/g, "")
    .replace(/=([0-9A-Fa-f]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
}

// Parses a plain .eml (MIME) file's headers/body well enough to pull out
// From, Subject, and a readable body — no external library needed since
// .eml is just text, unlike the binary Outlook .msg format below.
function parseEml(text) {
  const headerEnd = text.search(/\r?\n\r?\n/);
  const headerBlock = headerEnd === -1 ? text : text.slice(0, headerEnd);
  let bodyBlock = headerEnd === -1 ? "" : text.slice(headerEnd).replace(/^\r?\n\r?\n/, "");

  const getHeader = (name) => {
    const m = headerBlock.match(new RegExp(`^${name}:\\s*(.*(?:\\r?\\n[ \\t].*)*)`, "im"));
    return m ? m[1].replace(/\r?\n[ \t]+/g, " ").trim() : "";
  };

  const from = getHeader("From");
  const subject = getHeader("Subject");
  const contentType = getHeader("Content-Type");
  const transferEncoding = getHeader("Content-Transfer-Encoding").toLowerCase();

  // Multipart messages: just take the first text/plain (or text/html) part.
  const boundaryMatch = contentType.match(/boundary="?([^";]+)"?/i);
  if (boundaryMatch) {
    const boundary = boundaryMatch[1];
    const parts = bodyBlock.split(new RegExp(`--${boundary.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(--)?`));
    const plainPart = parts.find((p) => /Content-Type:\s*text\/plain/i.test(p));
    const htmlPart = parts.find((p) => /Content-Type:\s*text\/html/i.test(p));
    const chosen = plainPart || htmlPart || "";
    const partHeaderEnd = chosen.search(/\r?\n\r?\n/);
    let partBody = partHeaderEnd === -1 ? chosen : chosen.slice(partHeaderEnd).replace(/^\r?\n\r?\n/, "");
    if (/Content-Transfer-Encoding:\s*quoted-printable/i.test(chosen)) partBody = decodeQuotedPrintable(partBody);
    if (/Content-Type:\s*text\/html/i.test(chosen)) partBody = stripHtmlToText(partBody);
    bodyBlock = partBody;
  } else {
    if (transferEncoding === "quoted-printable") bodyBlock = decodeQuotedPrintable(bodyBlock);
    if (/text\/html/i.test(contentType)) bodyBlock = stripHtmlToText(bodyBlock);
  }

  return [from && `From: ${from}`, subject && `Subject: ${subject}`, "", bodyBlock.trim()]
    .filter((l) => l !== false && l !== undefined)
    .join("\n");
}

// Reads an Outlook .msg (via the bundled msgreader library) or a plain .eml
// file and returns its content as plain text, ready to drop into the paste
// box — so attaching the original email file works instead of only
// copy/paste.
function readEmailFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".msg")) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          if (typeof window.MsgReader !== "function") {
            reject(new Error("The .msg reader library did not load"));
            return;
          }
          const msg = new window.MsgReader(new Uint8Array(reader.result));
          const data = msg.getFileData();

          // Priority: HTML body (most common for modern Outlook) > compressed
          // RTF (Rich Text format messages, common in corporate Outlook) >
          // plain-text body (older/simple messages) — most real emails only
          // populate one of these, never PR_BODY, so this order matters.
          let body = "";
          if (data.bodyHtml && data.bodyHtml.trim()) {
            body = stripHtmlToText(data.bodyHtml);
          } else if (data.compressedRtf && typeof window.decompressRTF === "function") {
            try { body = rtfCompressedToText(data.compressedRtf); } catch (e) { body = ""; }
          }
          if (!body && data.body && data.body.trim()) {
            body = data.body.trim();
          }

          const recipients = (data.recipients || []).map((r) => r.name || r.smtpAddress || r.email).filter(Boolean).join(", ");
          const from = data.senderName || data.senderSmtpAddress || data.senderEmail || "";
          const lines = [
            from && `From: ${from}`,
            recipients && `To: ${recipients}`,
            data.subject && `Subject: ${data.subject}`,
            "",
            body,
          ].filter((l) => l !== false && l !== undefined && l !== "");
          resolve(lines.join("\n"));
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }
  if (name.endsWith(".eml")) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(parseEml(String(reader.result)));
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }
  return Promise.reject(new Error("Unsupported file type — please use .msg or .eml"));
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, type: file.type, size: file.size, dataUrl: reader.result });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Opening a data: URI link is inert in the Artifacts viewer sandbox — it
// requires the declared "downloads" capability instead. Falls back to a
// plain new-tab open for a local HTML file / GitHub Pages, where there is
// no window.claude runtime and the plain link works fine.
// Attachments saved before the move to IndexedDB still carry their bytes
// inline, so both shapes have to be readable.
async function resolveAttachmentData(attachment) {
  if (attachment.dataUrl) return attachment.dataUrl;
  if (attachment.blobId) {
    try {
      return await getAttachmentBlob(attachment.blobId);
    } catch (err) {
      return null;
    }
  }
  return null;
}

// The stored form is a data: URL; the download API wants the actual bytes.
// Handing it the URL string would save the base64 text as the file's contents.
function dataUrlToBlob(dataUrl) {
  const match = /^data:([^;,]*)(;base64)?,(.*)$/s.exec(dataUrl);
  if (!match) return null;
  const [, mime, isBase64, payload] = match;
  if (!isBase64) return new Blob([decodeURIComponent(payload)], { type: mime || "application/octet-stream" });
  const binary = atob(payload);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new Blob([bytes], { type: mime || "application/octet-stream" });
}

// The viewer only accepts a fixed set of extensions; Outlook's .msg isn't one
// of them, which is why opening one did nothing at all before.
const DOWNLOADABLE_EXTENSIONS = [
  "gif", "png", "jpg", "jpeg", "webp", "mp4", "webm", "txt", "json", "md",
  "docx", "pptx", "epub", "csv", "ttf", "html", "svg", "pdf", "xlsx",
];

function extensionOf(name) {
  const m = /\.([A-Za-z0-9]+)$/.exec(String(name || ""));
  return m ? m[1].toLowerCase() : "";
}

// Returns "" on success, or a reason the caller should surface. Never fails
// silently: a file that won't open with no explanation is the worst outcome.
async function openAttachment(attachment) {
  const data = await resolveAttachmentData(attachment);
  if (!data) {
    appToast(`"${attachment.name}" could not be found in this browser's file store`);
    return;
  }
  const blob = dataUrlToBlob(data);

  let downloads = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      downloads = await window.claude.use("downloads");
    }
  } catch (err) {
    downloads = null;
  }

  if (downloads) {
    if (!DOWNLOADABLE_EXTENSIONS.includes(extensionOf(attachment.name))) {
      appToast(
        attachment.text
          ? `${attachment.name} can't be handed to the browser here — use "View text" to read its contents.`
          : `${attachment.name} is a file type this viewer can't save. Open the tracker from the local HTML file to get at it.`
      );
      return;
    }
    try {
      await downloads.save({ filename: attachment.name, data: blob || data });
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") return; // the viewer said no; nothing to report
      appToast(`Could not open ${attachment.name}: ${(err && err.message) || code || "unknown error"}`);
    }
    return;
  }

  // Plain browser (local file / GitHub Pages): a blob URL handles large files
  // far better than a multi-megabyte data: URL.
  try {
    const url = blob ? URL.createObjectURL(blob) : data;
    const win = window.open(url, "_blank");
    if (!win) appToast(`Your browser blocked opening ${attachment.name} — allow pop-ups for this page.`);
    if (blob) setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) {
    appToast(`Could not open ${attachment.name}: ${err.message}`);
  }
}

// Reads a picked file into the shape stored on a request: the bytes go to
// IndexedDB (localStorage's few MB can't hold PDFs), while the name, size and
// any text extracted from a PDF stay on the request so search can reach them.
async function ingestAttachment(file, textOverride) {
  const base = await readFileAsDataURL(file);
  let text = "";
  if (textOverride !== undefined && textOverride !== null && textOverride !== "") {
    text = String(textOverride).slice(0, MAX_EXTRACTED_TEXT);
  } else if (/\.pdf$/i.test(file.name) || file.type === "application/pdf") {
    text = await extractPdfText(file);
  } else if (/\.(msg|eml)$/i.test(file.name)) {
    // A .msg/.eml can land here too — dropped into the general Attachments
    // picker instead of "Load the email file directly" above it. Either way
    // it's an email, so read it the same way, or "View text" would never
    // appear and the file would look unopenable for no visible reason.
    try {
      text = await readEmailFile(file);
    } catch (err) {
      text = "";
    }
  }

  const blobId = uid();
  try {
    await putAttachmentBlob(blobId, base.dataUrl);
    return { name: base.name, type: base.type, size: base.size, blobId, text };
  } catch (err) {
    // No IndexedDB (private mode, old browser): keep the bytes inline so the
    // attachment still works, accepting the storage cost.
    console.warn("Falling back to inline attachment storage:", err);
    return { ...base, text };
  }
}

function AttachmentPicker({ attachments, onChange }) {
  const [busy, setBusy] = useState(false);

  const handleFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;
    setBusy(true);
    try {
      const read = [];
      for (const file of files) read.push(await ingestAttachment(file));
      onChange([...(attachments || []), ...read]);
      const withText = read.filter((a) => a.text).length;
      if (withText) appToast(`Read the text inside ${withText} PDF(s) — it's searchable now`);
    } catch (err) {
      appToast("Could not read one of the files: " + err.message);
    } finally {
      setBusy(false);
    }
  };

  const removeAt = (i) => onChange(attachments.filter((_, idx) => idx !== i));

  return (
    <div>
      <label className="sap-label">Attachments (ticket, confirmation, etc.)</label>
      <input type="file" multiple onChange={handleFiles} className="sap-input" />
      {busy && <p className="text-xs mt-1" style={{ color: "var(--sap-gray)" }}>Reading file(s)...</p>}
      {attachments && attachments.length > 0 && (
        <ul className="mt-2 space-y-1">
          {attachments.map((a, i) => (
            <li key={i} className="flex items-center justify-between text-xs sap-card px-2 py-1">
              <button type="button" onClick={() => openAttachment(a)} className="sap-link" style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}>
                📎 {a.name} {a.size ? `(${Math.round(a.size / 1024)} KB)` : ""}
              </button>
              <button type="button" onClick={() => removeAt(i)} className="sap-link-danger">Remove</button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

const EXCEL_STATUS_MAP = {
  "done": "Completed",
  "completed": "Completed",
  "مكتمل": "Completed",
  "منتهي": "Completed",
  "pending": "Pending",
  "معلق": "Pending",
  "processing": "Waiting PR approval",
  "قيد المعالجة": "Waiting PR approval",
  "approved": "Waiting PO approval",
  "تمت الموافقة": "Waiting PO approval",
  "po issued": "Waiting PO approval",
  "تم إصدار po": "Waiting PO approval",
  "cancelled": "Cancelled",
  "ملغي": "Cancelled",
};

function mapExcelStatus(raw) {
  if (!raw) return "Pending";
  const key = String(raw).trim().toLowerCase();
  return EXCEL_STATUS_MAP[key] || "Pending";
}

function findCol(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) {
    const found = keys.find((k) => k.trim().toLowerCase() === c.toLowerCase());
    if (found) return row[found];
  }
  return "";
}

// Real-world "Following PO/PR" style trackers write free-text status notes
// instead of a clean enum ("waiting PR approval", "please issue PO", "Done",
// "Deleted"...). This interprets that phrasing into our workflow stages.
function mapFreeTextStatus(raw, hasPr, hasPo) {
  const text = String(raw || "").trim().toLowerCase();
  if (!text) return hasPo ? "Waiting PO approval" : hasPr ? "Waiting PR approval" : "Pending";
  if (/delet|cancel/.test(text)) return "Cancelled";
  if (/^done$|complet/.test(text)) return "Completed";
  if (/waiting po|please issue po/.test(text)) return "Waiting PO approval";
  if (/waiting pr|please issue the pr|creat/.test(text)) return "Waiting PR approval";
  if (/still not/.test(text)) return "Pending";
  // Unrecognized free text (e.g. a name typed in by mistake) — fall back to
  // what's actually filled in rather than guessing from the words.
  return hasPo ? "Waiting PO approval" : hasPr ? "Waiting PR approval" : "Pending";
}

// The owner/requester name isn't its own column in this format — it's the
// leading words of the description, e.g. "Samer Al Husaini 10-15 Jan 2025 -
// Ramada". Pull out the name portion before a date, dash, or digit.
function extractOwnerFromDescription(desc) {
  if (!desc) return "";
  const match = String(desc).match(/^([A-Za-z؀-ۿ][A-Za-z؀-ۿ.\s]{1,35}?)(?=\s*(?:\d|-|,|$))/);
  return match ? match[1].trim() : "";
}

// Detects the dual-header "Purchase Order / Purchase Requisition" layout
// (group titles on row 1, real column names PO/PR/approval/amount on row 2)
// used by real SAP-exported trackers, as opposed to a single clean header row.
function detectSapDualHeader(sheet) {
  const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", blankrows: false });
  for (let i = 0; i < Math.min(raw.length, 4); i++) {
    const row = raw[i].map((c) => String(c).trim().toLowerCase());
    const poIdx = row.indexOf("po");
    const prIdx = row.indexOf("pr");
    if (poIdx !== -1 && prIdx !== -1 && prIdx > poIdx) {
      return { headerRowIndex: i, poIdx, prIdx, raw };
    }
  }
  return null;
}

function parseSapDualHeaderRows({ headerRowIndex, poIdx, prIdx, raw }) {
  const dataRows = raw.slice(headerRowIndex + 1);
  // The PO group has its own (usually unused) approval column right after it;
  // the real free-text workflow status lives right after the PR column.
  const prStatusIdx = prIdx + 1;
  const amountIdx = prIdx + 2;
  const descIdx = amountIdx + 1;
  const supplierIdx = descIdx + 1;

  return dataRows
    .filter((r) => r.some((cell) => String(cell).trim() !== ""))
    .map((r) => {
      const poNumber = r[poIdx] ? String(r[poIdx]).trim() : "";
      const prNumber = r[prIdx] ? String(r[prIdx]).trim() : "";
      const statusText = r[prStatusIdx] || "";
      const description = r[descIdx] ? String(r[descIdx]).trim() : "";
      return {
        id: uid(),
        prNumber,
        poNumber,
        owner: extractOwnerFromDescription(description),
        department: "",
        serviceType: guessServiceType(description + " " + (r[supplierIdx] || "")),
        vendor: r[supplierIdx] ? String(r[supplierIdx]).trim() : "",
        budget: r[amountIdx] ? String(r[amountIdx]).trim() : "",
        finalAmount: "",
        requiredDate: "",
        completedDate: "",
        status: mapFreeTextStatus(statusText, !!prNumber, !!poNumber),
        notes: description,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };
    });
}

function parseExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];

        const sapLayout = detectSapDualHeader(sheet);
        if (sapLayout) {
          resolve(parseSapDualHeaderRows(sapLayout));
          return;
        }

        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        const parsed = rows.map((row) => ({
          id: uid(),
          prNumber: String(findCol(row, ["PR", "PR Number", "PR رقم", "رقم PR"]) || ""),
          poNumber: String(findCol(row, ["PO", "PO Number", "PO رقم", "رقم PO"]) || ""),
          owner: String(findCol(row, ["Owner", "Requester", "المسؤول"]) || ""),
          department: String(findCol(row, ["Department", "القسم"]) || ""),
          serviceType: String(findCol(row, ["Service", "Service Type", "نوع الخدمة"]) || "Other"),
          vendor: String(findCol(row, ["Vendor", "Supplier", "الموردة", "المورد"]) || ""),
          budget: String(findCol(row, ["Budget", "الميزانية"]) || ""),
          finalAmount: String(findCol(row, ["Amount", "Final Amount", "المبلغ النهائي"]) || ""),
          requiredDate: String(findCol(row, ["Required Date", "Date", "التاريخ المطلوب"]) || ""),
          completedDate: String(findCol(row, ["Completed Date", "تاريخ الانتهاء"]) || ""),
          status: mapExcelStatus(findCol(row, ["Status", "الحالة"])),
          notes: String(findCol(row, ["Description", "Notes", "الوصف", "الملاحظات"]) || ""),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        }));
        resolve(parsed);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

// XLSX.writeFile() drives a plain <a download> click under the hood, which is
// inert inside the Artifacts viewer sandbox (same restriction that affects
// attachment downloads) — it looked like the button did nothing at all. This
// builds the file's bytes and hands them to the declared "downloads"
// capability when running as an Artifact, falling back to the normal
// anchor-click download for a local HTML file / GitHub Pages.
// Cell fill/font colors matching each status's badge in the app, so the
// exported sheet reads the same way the on-screen table does — the header
// row gets the same treatment in the brand's indigo.
const EXCEL_STATUS_FILL = {
  "Pending": "FFF4E0",
  "Waiting PR approval": "EAF2FC",
  "Waiting PO approval": "F1EBFE",
  "Completed": "E4F9F1",
  "Cancelled": "FFE9ED",
};
const EXCEL_STATUS_FONT = {
  "Pending": "C97A00",
  "Waiting PR approval": "0A6ED4",
  "Waiting PO approval": "8B5CF6",
  "Completed": "00B37E",
  "Cancelled": "FF4D6A",
};
const EXCEL_HEADER_FILL = "3D5AFE";
const EXCEL_BORDER = { style: "thin", color: { rgb: "E7EAF3" } };
const EXCEL_COLUMNS = [
  "PR Number", "PO Number", "Requester", "Beneficiary", "Service From", "Service To",
  "Department", "Service Type", "Vendor", "Status", "Budget", "Final Amount",
  "Required Date", "Completed Date", "Notes", "Created",
];

async function exportToExcel(requests) {
  if (!window.XLSX || typeof window.XLSX.write !== "function") {
    appToast("Could not load the Excel export library — check your internet connection and try again.");
    return;
  }
  const rows = requests.map((r) => ({
    "PR Number": r.prNumber,
    "PO Number": r.poNumber,
    "Requester": r.owner,
    "Beneficiary": r.beneficiary,
    "Service From": r.serviceDateFrom,
    "Service To": r.serviceDateTo,
    "Department": r.department,
    "Service Type": r.serviceType,
    "Vendor": r.vendor,
    "Status": STATUS_LABELS[r.status] || r.status,
    "Budget": r.budget,
    "Final Amount": r.finalAmount,
    "Required Date": r.requiredDate,
    "Completed Date": r.completedDate,
    "Notes": r.notes,
    "Created": r.createdAt ? r.createdAt.slice(0, 10) : "",
  }));
  const ws = XLSX.utils.json_to_sheet(rows, { header: EXCEL_COLUMNS });

  // Header row: bold white text on the brand indigo fill.
  EXCEL_COLUMNS.forEach((_, colIdx) => {
    const addr = XLSX.utils.encode_cell({ r: 0, c: colIdx });
    if (!ws[addr]) return;
    ws[addr].s = {
      font: { bold: true, color: { rgb: "FFFFFF" } },
      fill: { fgColor: { rgb: EXCEL_HEADER_FILL } },
      alignment: { vertical: "center" },
      border: { top: EXCEL_BORDER, bottom: EXCEL_BORDER, left: EXCEL_BORDER, right: EXCEL_BORDER },
    };
  });

  // Data rows: color the Status cell like its badge, and give every cell a
  // faint border so it reads as a real table rather than bare text.
  const statusColIdx = EXCEL_COLUMNS.indexOf("Status");
  requests.forEach((r, rowIdx) => {
    EXCEL_COLUMNS.forEach((_, colIdx) => {
      const addr = XLSX.utils.encode_cell({ r: rowIdx + 1, c: colIdx });
      if (!ws[addr]) return;
      const isStatus = colIdx === statusColIdx;
      const label = STATUS_LABELS[r.status] || r.status;
      ws[addr].s = {
        border: { top: EXCEL_BORDER, bottom: EXCEL_BORDER, left: EXCEL_BORDER, right: EXCEL_BORDER },
        ...(isStatus
          ? {
              font: { bold: true, color: { rgb: EXCEL_STATUS_FONT[label] || "6B7186" } },
              fill: { fgColor: { rgb: EXCEL_STATUS_FILL[label] || "F4F6FB" } },
              alignment: { horizontal: "center" },
            }
          : {}),
      };
    });
  });

  ws["!cols"] = [
    { wch: 12 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 12 }, { wch: 12 },
    { wch: 14 }, { wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 10 }, { wch: 12 },
    { wch: 12 }, { wch: 14 }, { wch: 30 }, { wch: 12 },
  ];
  ws["!autofilter"] = { ref: `A1:${XLSX.utils.encode_col(EXCEL_COLUMNS.length - 1)}1` };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Requests");
  const stamp = new Date().toISOString().slice(0, 10);
  const filename = `PR_PO_Tracker_${stamp}.xlsx`;
  const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

  let downloads = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      downloads = await window.claude.use("downloads");
    }
  } catch (err) {
    downloads = null;
  }

  if (downloads) {
    try {
      await downloads.save({ filename, data: blob });
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") return; // the viewer said no; nothing to report
      appToast(`Could not export Excel: ${(err && err.message) || code || "unknown error"}`);
    }
    return;
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function ImportExcelModal({ onImport, onCancel }) {
  const [pending, setPending] = useState(null);
  const [fileName, setFileName] = useState("");

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    try {
      const parsed = await parseExcelFile(file);
      setPending(parsed);
    } catch (err) {
      appToast("Could not read the file: " + err.message);
    }
  };

  return (
    <div className="flex flex-col gap-4">
      <div>
        <label className="sap-label">Choose an Excel file</label>
        <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="sap-input" />
      </div>

      {pending && (
        <div>
          <p className="text-sm mb-2" style={{ color: "var(--sap-gray)" }}>
            Found <span className="font-bold" style={{ color: "var(--sap-text)" }}>{pending.length}</span> row(s) in "{fileName}". Review before confirming:
          </p>
          <div className="sap-card overflow-auto" style={{ maxHeight: "16rem" }}>
            <table className="sap-table">
              <thead>
                <tr>
                  <th>PR</th>
                  <th>PO</th>
                  <th>Owner</th>
                  <th>Status</th>
                  <th>Vendor</th>
                </tr>
              </thead>
              <tbody>
                {pending.map((r) => (
                  <tr key={r.id}>
                    <td>{r.prNumber || "—"}</td>
                    <td>{r.poNumber || "—"}</td>
                    <td>{r.owner || "—"}</td>
                    <td>{STATUS_LABELS[r.status]}</td>
                    <td>{r.vendor || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div className="flex justify-end gap-2 pt-2">
        <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
        <button
          type="button"
          disabled={!pending}
          onClick={() => onImport(pending)}
          className="sap-btn sap-btn-blue"
        >
          Confirm Import ({pending ? pending.length : 0})
        </button>
      </div>
    </div>
  );
}

// One entry per selected service type: its own vendor, its own PR number
// (each service is its own SAP request tied to its own supplier), and its
// own editable suggested-action checklist.
function makeTypeEntry(type, vendor, customActions) {
  return { vendor: vendor || "", prNumber: "", actionSteps: getActionsForType(type, customActions), newStep: "" };
}

function EmailParserForm({ requests, onSave, onCancel, onContentReplaced }) {
  const [emailText, setEmailText] = useState("");
  const [extracted, setExtracted] = useState(null); // shared fields: owner, requiredDate, budget
  const [selectedTypes, setSelectedTypes] = useState([]);
  const [typeEntries, setTypeEntries] = useState({}); // { Hotel: {vendor, prNumber, actionSteps, newStep}, ... }
  const [customActions, setCustomActions] = useState(loadCustomActions);
  const [attachments, setAttachments] = useState([]);
  const [loadingFile, setLoadingFile] = useState(false);
  const [sourceHash, setSourceHash] = useState("");
  const [suppliers, setSuppliers] = useState(loadSuppliers);

  const knownVendorsAll = useMemo(() => getKnownVendors(requests), [requests]);
  const knownOwners = useMemo(() => getKnownOwners(requests), [requests]);
  const knownBeneficiaries = useMemo(() => getKnownBeneficiaries(requests), [requests]);

  const registerSupplier = (type, vendor) => {
    if (!vendor || !vendor.trim()) return;
    const list = getRegisteredSuppliers(suppliers, type);
    if (list.some((v) => v.toLowerCase() === vendor.trim().toLowerCase())) return;
    const updated = { ...suppliers, [type]: [...list, vendor.trim()] };
    setSuppliers(updated);
    saveSuppliers(updated);
    appToast(`Registered "${vendor.trim()}" as an approved ${type} supplier`);
  };

  const extractAndSetForm = (text) => {
    setSourceHash(fingerprintEmail(text));
    const detectedTypes = detectServiceTypes(text);
    const primaryType = guessServiceType(text);
    const knownForGuess = getKnownVendors(requests, primaryType);
    const data = extractFromEmail(text, knownForGuess.length ? knownForGuess : knownVendorsAll, knownOwners, knownBeneficiaries);

    setExtracted({
      owner: data.owner,
      ownerNeedsConfirmation: data.ownerNeedsConfirmation,
      ownerGuess: data.ownerGuess,
      beneficiary: data.beneficiary,
      requiredDate: data.requiredDate,
      serviceDateFrom: data.serviceDateFrom,
      serviceDateTo: data.serviceDateTo,
      budget: data.budget,
      prNumber: data.prNumber,
      notes: text.slice(0, 500),
    });
    setSelectedTypes(detectedTypes);
    const entries = {};
    detectedTypes.forEach((type) => {
      // Only the type the single-guess extractor actually landed on gets the
      // auto-detected vendor/PR — the others are separate suppliers you fill in.
      entries[type] = makeTypeEntry(type, type === primaryType ? data.vendor : "", customActions);
      if (type === primaryType && data.prNumber) entries[type].prNumber = data.prNumber;
    });
    setTypeEntries(entries);
  };

  const handleExtract = async () => {
    if (!emailText.trim()) {
      appToast("Please paste the email content first");
      return;
    }
    const seen = findRequestsFromSameEmail(fingerprintEmail(emailText), requests);
    if (seen.length) {
      const when = seen[0].createdAt ? String(seen[0].createdAt).slice(0, 10) : "earlier";
      const proceed = await appConfirm(
        `You already logged this exact email on ${when}. It created ${seen.length} request(s): ` +
        `${seen.map((r) => r.serviceType + (r.poNumber ? ` (PO ${r.poNumber})` : "")).join(", ")}. ` +
        `Log it again anyway?`
      );
      if (!proceed) return;
    }
    extractAndSetForm(emailText);
    if (onContentReplaced) onContentReplaced();
  };

  // Clears everything belonging to the email currently under review, so a
  // newly loaded email never inherits the previous one's attachment, vendor
  // or service selection.
  const resetForNewEmail = () => {
    setEmailText("");
    setExtracted(null);
    setSelectedTypes([]);
    setTypeEntries({});
    setAttachments([]);
    setSourceHash("");
  };

  const handleEmailFile = async (e) => {
    const file = e.target.files[0];
    // Reset the input right away: it lets the same file be picked again after
    // a mistake, and avoids touching the event after the awaits below.
    e.target.value = "";
    if (!file) return;

    // Loading a second email replaces the one being reviewed — say so instead
    // of silently swapping the content out from under the user.
    if (extracted) {
      const proceed = await appConfirm(
        `You're still reviewing an email that hasn't been saved yet. Loading "${file.name}" will replace it — save the current one first if you need it. Continue?`
      );
      if (!proceed) return;
    }

    setLoadingFile(true);
    try {
      const text = await readEmailFile(file);
      const fileAttachment = await ingestAttachment(file, text);

      setEmailText(text);
      setAttachments([fileAttachment]);
      if (text.trim()) {
        const seen = findRequestsFromSameEmail(fingerprintEmail(text), requests);
        if (seen.length) {
          const when = seen[0].createdAt ? String(seen[0].createdAt).slice(0, 10) : "earlier";
          const proceed = await appConfirm(
            `You already logged this exact email on ${when}. It created ${seen.length} request(s): ` +
            `${seen.map((r) => r.serviceType + (r.poNumber ? ` (PO ${r.poNumber})` : "")).join(", ")}. ` +
            `Log it again anyway?`
          );
          if (!proceed) { setLoadingFile(false); return; }
        }
        extractAndSetForm(text);
        if (onContentReplaced) onContentReplaced();
        appToast(`Loaded "${file.name}" — review the extracted fields below`);
      } else {
        setExtracted(null);
        setSelectedTypes([]);
        setTypeEntries({});
        appToast(`Loaded "${file.name}" but found no readable text in it — paste the content manually instead`);
      }
    } catch (err) {
      appToast("Could not read this email file: " + err.message);
    } finally {
      setLoadingFile(false);
    }
  };

  const handleStartOver = async () => {
    if (extracted) {
      const proceed = await appConfirm("Discard the email you're reviewing and start over?");
      if (!proceed) return;
    }
    resetForNewEmail();
    if (onContentReplaced) onContentReplaced();
  };

  const toggleType = (type) => {
    if (selectedTypes.includes(type)) {
      setSelectedTypes(selectedTypes.filter((t) => t !== type));
    } else {
      setSelectedTypes([...selectedTypes, type]);
      if (!typeEntries[type]) {
        setTypeEntries({ ...typeEntries, [type]: makeTypeEntry(type, "", customActions) });
      }
    }
  };

  const updateEntry = (type, patch) => setTypeEntries({ ...typeEntries, [type]: { ...typeEntries[type], ...patch } });

  const updateStep = (type, i, value) => {
    const steps = typeEntries[type].actionSteps.map((s, idx) => (idx === i ? value : s));
    updateEntry(type, { actionSteps: steps });
  };
  const removeStep = (type, i) => updateEntry(type, { actionSteps: typeEntries[type].actionSteps.filter((_, idx) => idx !== i) });
  const addStep = (type) => {
    const text = (typeEntries[type].newStep || "").trim();
    if (!text) return;
    updateEntry(type, { actionSteps: [...typeEntries[type].actionSteps, text], newStep: "" });
  };
  const saveActionsAsDefault = (type) => {
    const updated = { ...customActions, [type]: typeEntries[type].actionSteps };
    setCustomActions(updated);
    saveCustomActions(updated);
    appToast(`Saved this checklist as the default for future "${type}" requests`);
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!extracted.owner) {
      appToast("Please enter the requester's name");
      return;
    }
    if (selectedTypes.length === 0) {
      appToast("Select at least one service this email is requesting");
      return;
    }
    const batchId = selectedTypes.length > 1 ? uid() : null;
    const emailSummary = summarizeEmail({
      owner: extracted.owner,
      beneficiary: extracted.beneficiary,
      selectedTypes,
      budget: extracted.budget,
      requiredDate: extracted.requiredDate,
      serviceDateFrom: extracted.serviceDateFrom,
      serviceDateTo: extracted.serviceDateTo,
      prNumber: extracted.prNumber,
    });
    const forms = selectedTypes.map((type) => ({
      ...emptyForm(),
      owner: extracted.owner,
      beneficiary: extracted.beneficiary || "",
      requiredDate: extracted.requiredDate,
      serviceDateFrom: extracted.serviceDateFrom || "",
      serviceDateTo: extracted.serviceDateTo || "",
      budget: extracted.budget,
      notes: extracted.notes,
      attachments,
      serviceType: type,
      vendor: typeEntries[type].vendor,
      prNumber: typeEntries[type].prNumber,
      waitingOn: DEFAULT_WAITING_ON["Pending"],
      batchId,
      batchSize: selectedTypes.length,
      emailSummary,
      sourceHash,
    }));

    // Catch the same trip being logged twice — the usual cause of a duplicate
    // PO going out to the same supplier.
    const clashes = forms
      .map((f) => ({ form: f, dup: findPossibleDuplicates(f, requests)[0] }))
      .filter((x) => x.dup);
    if (clashes.length) {
      const { form, dup } = clashes[0];
      const proceed = await appConfirm(
        `A ${form.serviceType} request for ${dup.beneficiary || dup.owner} already covers overlapping dates ` +
        `(${dup.serviceDateFrom || "?"} → ${dup.serviceDateTo || "?"}, status ${STATUS_LABELS[dup.status]}` +
        `${dup.poNumber ? `, PO ${dup.poNumber}` : ""}). Save anyway?`
      );
      if (!proceed) return;
    }

    onSave(forms);
  };

  return (
    <div className="flex flex-col gap-4">
      <div>
        <div className="flex items-center justify-between mb-1">
          <label className="sap-label" style={{ marginBottom: 0 }}>Load the email file directly (.msg from Outlook, or .eml)</label>
          {extracted && (
            <button type="button" onClick={handleStartOver} className="sap-link">Start over</button>
          )}
        </div>
        <input type="file" accept=".msg,.eml" onChange={handleEmailFile} className="sap-input" disabled={loadingFile} />
        {loadingFile && <p className="text-xs mt-1" style={{ color: "var(--sap-blue)" }}>Reading and extracting the email…</p>}
        {extracted && !loadingFile && (
          <p className="text-xs mt-1" style={{ color: "var(--sap-gray)" }}>
            One email is under review below. Save it first, or load another file to replace it.
          </p>
        )}
      </div>

      <div>
        <label className="sap-label">...or paste the email content here</label>
        <textarea
          value={emailText}
          onChange={(e) => setEmailText(e.target.value)}
          rows="6"
          placeholder="Paste the email text from the department or SAP here..."
          className="sap-textarea"
        ></textarea>
        <div className="flex justify-end mt-2">
          <button type="button" onClick={handleExtract} className="sap-btn sap-btn-blue">
            🔍 Extract Data
          </button>
        </div>
      </div>

      <AttachmentPicker attachments={attachments} onChange={setAttachments} />

      {extracted && (
        <form onSubmit={handleSubmit} className="flex flex-col gap-4" style={{ borderTop: "1px solid var(--sap-border)", paddingTop: "1rem" }}>
          {findRequestsFromSameEmail(sourceHash, requests).length > 0 && (
            <div className="p-3 text-sm" style={{ background: "var(--sap-red-bg)", border: "1px solid #F5C2C2", borderRadius: "2px", color: "var(--sap-red)" }}>
              <p className="font-semibold">⚠️ This exact email is already logged</p>
              <p className="mt-1">
                It created {findRequestsFromSameEmail(sourceHash, requests).length} request(s):{" "}
                {findRequestsFromSameEmail(sourceHash, requests).map((r) => r.serviceType).join(", ")}.
                Saving again will duplicate them.
              </p>
            </div>
          )}

          <div className="p-3 text-sm" style={{ background: "var(--sap-purple-bg)", border: "1px solid #D9CCEA", borderRadius: "2px", color: "var(--sap-purple)" }}>
            <p className="font-semibold mb-1">🧠 Summary — what this email is asking for:</p>
            <p>{summarizeEmail({ owner: extracted.owner, beneficiary: extracted.beneficiary, selectedTypes, budget: extracted.budget, requiredDate: extracted.requiredDate, serviceDateFrom: extracted.serviceDateFrom, serviceDateTo: extracted.serviceDateTo, prNumber: extracted.prNumber })}</p>
          </div>

          <div className="sap-panel-info p-3 text-sm" style={{ color: "var(--sap-blue-dark)" }}>
            <p className="font-semibold mb-2">
              🤖 Confirm or adjust which services apply. Each checked service becomes its own tracked request (its own supplier, PR, and PO), since they don't share the same approval.
            </p>
            <div className="flex flex-wrap gap-3">
              {SERVICE_TYPES.filter((s) => s !== "Other").concat("Other").map((type) => (
                <label key={type} className="flex items-center gap-1.5 text-sm" style={{ color: "var(--sap-text)" }}>
                  <input type="checkbox" checked={selectedTypes.includes(type)} onChange={() => toggleType(type)} />
                  {type}
                </label>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="sap-label">Owner (requester) *</label>
              <input
                value={extracted.owner}
                onChange={(e) => setExtracted({ ...extracted, owner: e.target.value, ownerNeedsConfirmation: false })}
                className="sap-input"
                style={!extracted.owner ? { borderColor: "var(--sap-red)" } : undefined}
                placeholder="Select or type the requester's name"
                required
              />
              {extracted.ownerNeedsConfirmation && (
                <p className="text-xs mt-1 font-semibold" style={{ color: "var(--sap-red)" }}>
                  ⚠️ Could not confirm the owner from this email (found "{extracted.ownerGuess}" — might just be a signature/footer line). Please pick or type the real requester below.
                </p>
              )}
              {knownOwners.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                  <span className="text-xs" style={{ color: "var(--sap-gray)" }}>Previous requesters:</span>
                  {knownOwners.slice(0, 8).map((o) => (
                    <button
                      type="button"
                      key={o}
                      onClick={() => setExtracted({ ...extracted, owner: o, ownerNeedsConfirmation: false })}
                      className="text-xs px-2 py-0.5"
                      style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-text)" }}
                    >
                      {o}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div>
              <label className="sap-label">Beneficiary / traveller (who the service is for)</label>
              <input
                value={extracted.beneficiary || ""}
                onChange={(e) => setExtracted({ ...extracted, beneficiary: e.target.value })}
                className="sap-input"
                placeholder="Leave blank if the requester is also the traveller"
              />
              <p className="text-xs mt-1" style={{ color: "var(--sap-gray)" }}>
                Invoices arrive under this name months later — filling it in is what makes them findable.
              </p>
              {knownBeneficiaries.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                  <span className="text-xs" style={{ color: "var(--sap-gray)" }}>Previous travellers:</span>
                  {knownBeneficiaries.slice(0, 8).map((b) => (
                    <button
                      type="button"
                      key={b}
                      onClick={() => setExtracted({ ...extracted, beneficiary: b })}
                      className="text-xs px-2 py-0.5"
                      style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-text)" }}
                    >
                      {b}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div>
              <label className="sap-label">Service start (check-in / departure)</label>
              <input type="date" value={extracted.serviceDateFrom || ""} onChange={(e) => setExtracted({ ...extracted, serviceDateFrom: e.target.value })} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Service end (check-out / return)</label>
              <input type="date" value={extracted.serviceDateTo || ""} onChange={(e) => setExtracted({ ...extracted, serviceDateTo: e.target.value })} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Required by (when you need it done)</label>
              <input type="date" value={extracted.requiredDate} onChange={(e) => setExtracted({ ...extracted, requiredDate: e.target.value })} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Budget (shared, split it manually per request if needed)</label>
              <input type="number" value={extracted.budget} onChange={(e) => setExtracted({ ...extracted, budget: e.target.value })} className="sap-input" />
            </div>
          </div>

          {selectedTypes.map((type) => {
            const entry = typeEntries[type];
            if (!entry) return null;
            const registered = getRegisteredSuppliers(suppliers, type);
            const learned = getKnownVendors(requests, type);
