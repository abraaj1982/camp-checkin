    --sap-green: #107E3E;
    --sap-green-bg: #E6F4EA;
    --sap-orange: #E9730C;
    --sap-orange-bg: #FEF3E6;
    --sap-red: #BB0000;
    --sap-red-bg: #FDEDED;
    --sap-purple: #6B4A96;
    --sap-purple-bg: #F0EBF7;
    --sap-amber: #DF9000;
    --sap-amber-bg: #FEF6E6;
    --sap-gray: #6A6D70;
    --sap-text: #32363A;
    --sap-bg: #F5F6F7;
    --sap-border: #D9D9D9;
  }

  * { box-sizing: border-box; }
  body { font-family: 'Roboto', 'Segoe UI', sans-serif; background: var(--sap-bg); color: var(--sap-text); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #b9bdc2; border-radius: 2px; }

  .sap-shell { min-height: 100vh; }

  .sap-header {
    background: linear-gradient(180deg, var(--sap-blue) 0%, #08508f 100%);
    color: #fff;
    border-bottom: 3px solid var(--sap-blue-dark);
  }

  .sap-btn {
    border-radius: 2px;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border: 1px solid transparent;
    transition: background .15s ease;
    white-space: nowrap;
  }
  .sap-btn-primary { background: #fff; color: var(--sap-blue); border-color: #fff; }
  .sap-btn-primary:hover { background: #EAF2FC; }
  .sap-btn-ghost { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.4); }
  .sap-btn-ghost:hover { background: rgba(255,255,255,0.22); }
  .sap-btn-outline { background: #fff; color: var(--sap-text); border-color: var(--sap-border); }
  .sap-btn-outline:hover { background: #F5F6F7; }
  .sap-btn-blue { background: var(--sap-blue); color: #fff; }
  .sap-btn-blue:hover { background: #085caf; }
  .sap-btn-blue:disabled { background: #a9c8ea; cursor: not-allowed; }
  .sap-link { color: var(--sap-blue); font-size: 12.5px; font-weight: 600; }
  .sap-link:hover { text-decoration: underline; }
  .sap-link-danger { color: var(--sap-red); font-size: 12.5px; font-weight: 600; }
  .sap-link-danger:hover { text-decoration: underline; }
  .sap-link-green { color: var(--sap-green); font-size: 12.5px; font-weight: 600; }
  .sap-link-green:hover { text-decoration: underline; }

  .sap-card {
    background: #fff;
    border: 1px solid var(--sap-border);
    border-radius: 2px;
  }

  .sap-tile {
    background: #fff;
    border: 1px solid var(--sap-border);
    border-top: 3px solid var(--sap-gray);
    border-radius: 2px;

  }
  .sap-tile-value { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .sap-tile-label { font-size: 12px; color: var(--sap-gray); margin-top: 4px; }

  .sap-input, .sap-select, .sap-textarea {
    border: 1px solid var(--sap-border);
    border-radius: 2px;
    padding: 7px 10px;
    font-size: 13.5px;
    background: #fff;
    color: var(--sap-text);
    width: 100%;
  }
  .sap-input:focus, .sap-select:focus, .sap-textarea:focus {
    outline: none;
    border-color: var(--sap-blue);
    box-shadow: 0 0 0 2px rgba(10,110,212,0.15);
  }
  .sap-label { display: block; font-size: 12px; font-weight: 600; color: var(--sap-gray); margin-bottom: 4px; }

  .sap-table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .sap-table thead th {
    background: #F5F6F7;
    color: var(--sap-gray);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    padding: 10px 14px;
    border-bottom: 2px solid var(--sap-border);
    text-align: left;
  }
  .sap-table tbody td { padding: 10px 14px; border-bottom: 1px solid #ECECEC; }
  .sap-table tbody tr:hover { background: #F5FAFF; }

  .sap-badge {
    display: inline-block;
    padding: 2px 10px;
    font-size: 11.5px;
    font-weight: 700;
    border-radius: 10px;
    border: 1px solid transparent;
  }

  .sap-modal-overlay { background: rgba(50,54,58,0.55); }
  .sap-modal {
    background: #fff;
    border-radius: 2px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.25);
  }
  .sap-modal-header {
    background: var(--sap-bg);
    border-bottom: 1px solid var(--sap-border);
  }

  .sap-panel-info {
    background: #EAF2FC;
    border: 1px solid #BEDAF7;
    border-radius: 2px;
  }

  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; top: 0; left: 0; width: 100%; padding: 24px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const STORAGE_KEY = "po_pr_tracker_requests_v1";

const SERVICE_TYPES = ["Hotel", "Car", "Tickets", "Other"];
const STATUSES = ["Pending", "Processing", "Approved", "PO Issued", "Completed", "Cancelled"];

const STATUS_LABELS = {
  "Pending": "Pending",
  "Processing": "Processing",
  "Approved": "Approved",
  "PO Issued": "PO Issued",
  "Completed": "Completed",
  "Cancelled": "Cancelled",
};

const STATUS_INLINE_STYLE = {
  "Pending": { background: "var(--sap-amber-bg)", color: "var(--sap-amber)", borderColor: "#F5DFA6" },
  "Processing": { background: "#EAF2FC", color: "var(--sap-blue)", borderColor: "#BEDAF7" },
  "Approved": { background: "var(--sap-purple-bg)", color: "var(--sap-purple)", borderColor: "#D9CCEA" },
  "PO Issued": { background: "#EAF2FC", color: "var(--sap-blue-dark)", borderColor: "#BEDAF7" },
  "Completed": { background: "var(--sap-green-bg)", color: "var(--sap-green)", borderColor: "#BFE3CB" },
  "Cancelled": { background: "#F0F0F0", color: "var(--sap-gray)", borderColor: "#D9D9D9" },
};

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Native window.confirm()/alert() are blocked (or silently return falsy
// instantly) inside a sandboxed iframe such as the Artifacts viewer, which
// made destructive actions like Delete silently no-op. These in-app
// replacements work the same everywhere — the artifact link and a plain
// local HTML file alike.
let _confirmSetter = null;
let _confirmResolve = null;
function registerConfirmSetter(setter) { _confirmSetter = setter; }
function appConfirm(message) {
  return new Promise((resolve) => {
    _confirmResolve = resolve;
    _confirmSetter({ open: true, message });
  });
}

let _toastSetter = null;
function registerToastSetter(setter) { _toastSetter = setter; }
function appToast(message) {
  _toastSetter({ id: uid(), message });
}

function ConfirmHost() {
  const [state, setState] = useState({ open: false, message: "" });
  useEffect(() => { registerConfirmSetter(setState); }, []);

  const respond = (result) => {
    setState({ open: false, message: "" });
    if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
  };

  if (!state.open) return null;
  return (
    <div className="sap-modal-overlay fixed inset-0 flex items-center justify-center z-[200] p-4" onClick={() => respond(false)}>
      <div className="sap-modal w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
        <div className="p-5">
          <p className="text-sm" style={{ color: "var(--sap-text)" }}>{state.message}</p>
          <div className="flex justify-end gap-2 pt-4">
            <button onClick={() => respond(false)} className="sap-btn sap-btn-outline">Cancel</button>
            <button onClick={() => respond(true)} className="sap-btn sap-btn-blue">Confirm</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ToastHost() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    registerToastSetter((toast) => {
      setToasts((prev) => [...prev, toast]);
      setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== toast.id)), 4000);
    });
  }, []);

  if (toasts.length === 0) return null;
  return (
    <div className="fixed bottom-4 z-[200] flex flex-col gap-2" style={{ insetInlineEnd: 16 }}>
      {toasts.map((t) => (
        <div key={t.id} className="sap-card px-4 py-3 text-sm shadow-lg" style={{ background: "#fff", color: "var(--sap-text)", maxWidth: 320 }}>
          {t.message}
        </div>
      ))}
    </div>
  );
}

function loadRequests() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveRequests(requests) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
  } catch (e) {
    console.error("Failed to save to localStorage", e);
  }
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

function isOverdue(req) {
  if (!req.requiredDate || req.status === "Completed" || req.status === "Cancelled") return false;
  const req_d = new Date(req.requiredDate);
  const now = new Date();
  return req_d < now;
}

function getAlertLevel(req) {
  if (req.status === "Completed" || req.status === "Cancelled") return null;
  if (isOverdue(req)) return "yellow";
  const pendingDays = daysSince(req.createdAt);
  if (req.status === "Pending" && pendingDays > 21) return "red";
  if (req.status === "Pending" && pendingDays > 7) return "orange";
  return null;
}

const ALERT_STYLES = {
  red: { rowStyle: { background: "var(--sap-red-bg)" }, dot: "var(--sap-red)", text: "var(--sap-red)", label: "Pending over 3 weeks" },
  orange: { rowStyle: { background: "var(--sap-orange-bg)" }, dot: "var(--sap-orange)", text: "var(--sap-orange)", label: "Pending over a week" },
  yellow: { rowStyle: { background: "var(--sap-amber-bg)" }, dot: "var(--sap-amber)", text: "var(--sap-amber)", label: "Overdue" },
};

const ACTION_SUGGESTIONS = {
  "Hotel": ["Contact the vendor", "Confirm availability", "Get the booking confirmation", "Create the PR in SAP and enter the PR number", "Issue the PO once approved", "Confirm the stay with the hotel"],
  "Car": ["Contact the rental company", "Confirm car and driver availability", "Confirm pickup time", "Create the PR in SAP and enter the PR number", "Issue the PO once approved", "Confirm the booking with the rental company"],
  "Tickets": ["Contact the travel agency", "Confirm seat availability and fares", "Create the PR in SAP and enter the PR number", "Issue the ticket after approval", "Issue the PO once approved"],
  "Other": ["Review request details with the requester", "Identify the right supplier", "Create the PR in SAP and enter the PR number", "Issue the PO after approval"],
};

const SERVICE_TYPE_PATTERNS = {
  "Hotel": /فندق|hotel|إقامة|غرفة|room|stay/,
  "Car": /سيارة|car|تأجير|ليموزين|rental|limo/,
  "Tickets": /تذكرة|تذاكر|ticket|طيران|رحلة|flight/,
};

// Single best guess — used where only one type is expected (e.g. Excel import).
function guessServiceType(text) {
  const t = text.toLowerCase();
  for (const type of ["Hotel", "Car", "Tickets"]) {
    if (SERVICE_TYPE_PATTERNS[type].test(t)) return type;
  }
  return "Other";
}

// One email can bundle several services at once (hotel + car + tickets for
// the same trip) — this returns every type mentioned, not just the first,
// so the parser can offer them as a multi-select instead of picking one.
function detectServiceTypes(text) {
  const t = text.toLowerCase();
  const found = ["Hotel", "Car", "Tickets"].filter((type) => SERVICE_TYPE_PATTERNS[type].test(t));
  return found.length ? found : ["Other"];
}

// Learns the vendors you've actually used before, per service type — no external API
function getKnownVendors(requests, serviceType) {
  const counts = {};
  requests
    .filter((r) => r.vendor && r.vendor.trim() && (!serviceType || r.serviceType === serviceType))
    .forEach((r) => {
      const v = r.vendor.trim();
      counts[v] = (counts[v] || 0) + 1;
    });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([vendor]) => vendor);
}

// Same idea for the request owner: the regex guess on free-form email text is
// unreliable (it can grab a signature line like "Content Safety" instead of
// the actual requester), so a name you've used before always wins over it.
function getKnownOwners(requests) {
  const counts = {};
  requests
    .filter((r) => r.owner && r.owner.trim())
    .forEach((r) => {
      const o = r.owner.trim();
      counts[o] = (counts[o] || 0) + 1;
    });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([owner]) => owner);
}

function matchKnownInText(text, knownValues) {
  const t = text.toLowerCase();
  return knownValues.find((v) => t.includes(v.toLowerCase())) || "";
}

function extractFromEmail(text, knownVendors, knownOwners) {
  const prMatch = text.match(/PR[\s#:.-]*([0-9]{4,})/i);
  const budgetMatch = text.match(/(?:ميزانية|budget|المبلغ|amount)[^\d]{0,10}([\d,]+(?:\.\d+)?)/i);
  const dateMatch = text.match(/(\d{4}-\d{2}-\d{2})/);
  const ownerMatch = text.match(/(?:من|المسؤول|السيد|الأخ|الأخت|from|requester|attn)[\s:]+([؀-ۿa-zA-Z\s]{2,30}?)(?:\n|,|،|$)/i);
  const vendorMatch = text.match(/(?:الموردة?|المورد|Vendor|Supplier)[\s:]+([؀-ۿa-zA-Z0-9\s]{2,40}?)(?:\n|,|،|$)/i);

  const serviceType = guessServiceType(text);
  const learnedVendor = matchKnownInText(text, knownVendors || []);
  const learnedOwner = matchKnownInText(text, knownOwners || []);
  const guessedOwner = ownerMatch ? ownerMatch[1].trim() : "";

  return {
    prNumber: prMatch ? prMatch[1] : "",
    budget: budgetMatch ? budgetMatch[1].replace(/,/g, "") : "",
    requiredDate: dateMatch ? dateMatch[1] : "",
    // Never trust the free-text guess blindly — only auto-fill when it matches
    // someone you've actually logged as an owner before; otherwise leave it
    // blank and require you to pick/type the real owner yourself.
    owner: learnedOwner,
    ownerNeedsConfirmation: !learnedOwner && !!guessedOwner,
    ownerGuess: guessedOwner,
    vendor: learnedVendor || (vendorMatch ? vendorMatch[1].trim() : ""),
    serviceType,
  };
}

const ACTIONS_STORAGE_KEY = "po_pr_tracker_actions_v1";

function loadCustomActions() {
  try {
    const raw = localStorage.getItem(ACTIONS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveCustomActions(actions) {
  try {
    localStorage.setItem(ACTIONS_STORAGE_KEY, JSON.stringify(actions));
  } catch (e) {
    console.error("Failed to save actions", e);
  }
}

function getActionsForType(serviceType, customActions) {
  return (customActions && customActions[serviceType]) || ACTION_SUGGESTIONS[serviceType] || ACTION_SUGGESTIONS["Other"];
}

// A curated, per-service-type list of registered/approved suppliers you
// maintain yourself — separate from the vendors auto-learned from past
// requests, so the app can tell "recommend from your approved list" apart
// from "this is a supplier we haven't used/registered before".
const SUPPLIERS_STORAGE_KEY = "po_pr_tracker_suppliers_v1";

function loadSuppliers() {
  try {
    const raw = localStorage.getItem(SUPPLIERS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveSuppliers(suppliers) {
  try {
    localStorage.setItem(SUPPLIERS_STORAGE_KEY, JSON.stringify(suppliers));
  } catch (e) {
    console.error("Failed to save suppliers", e);
  }
}

function getRegisteredSuppliers(suppliers, serviceType) {
  return (suppliers && suppliers[serviceType]) || [];
}

// Plain-language brief of what an email is actually asking for — built from
// what was actually extracted, not a guess dressed up as one.
function summarizeEmail({ owner, selectedTypes, budget, requiredDate, prNumber }) {
  const who = owner || "an unconfirmed requester";
  const services = selectedTypes.length ? selectedTypes.join(", ") : "no recognizable service";
  const parts = [
    `This email is from/about ${who}, requesting ${selectedTypes.length} service${selectedTypes.length === 1 ? "" : "s"}: ${services}.`,
  ];
  if (requiredDate) parts.push(`Needed by ${requiredDate}.`);
  if (budget) parts.push(`Mentioned budget: ${Number(budget).toLocaleString()}.`);
  parts.push(
    prNumber
      ? `A PR number was already mentioned (${prNumber}) — verify which of the ${selectedTypes.length > 1 ? "requests below it belongs to" : "request below it belongs to"}.`
      : `No PR number yet — you'll need to create ${selectedTypes.length > 1 ? "one PR per service" : "a PR"} in SAP and enter ${selectedTypes.length > 1 ? "each" : "its"} number once issued.`
  );
  return parts.join(" ");
}

// Tells the user exactly what to do next for this request, based on its
// current status and what's already filled in — the workflow guidance.
function getNextAction(req) {
  switch (req.status) {
    case "Pending":
      if (!req.vendor) return "Choose a supplier for this request";
      return "Create the PR in SAP, then enter the PR number here";
    case "Processing":
      return "Waiting for PR approval from SAP";
    case "Approved":
      if (!req.prNumber) return "Enter the PR number now that it's approved";
      return "Proceed to issue the PO with the supplier";
    case "PO Issued":
      if (!req.poNumber) return "Enter the PO number";
      return "Confirm booking/delivery with the supplier, then mark Completed";
    case "Completed":
      return "Completed — no action needed";
    case "Cancelled":
      return "Cancelled — no action needed";
    default:
      return "";
  }
}

function stripHtmlToText(html) {
  return String(html)
    .replace(/<!--[\s\S]*?-->/g, "")
    .replace(/<style[\s\S]*?<\/style>/gi, "")
    .replace(/<script[\s\S]*?<\/script>/gi, "")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|tr|li|h[1-6])>/gi, "\n")
    .replace(/<[^>]+>/g, "")
    .replace(/&nbsp;/g, " ")
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

// Outlook composed in HTML wraps its RTF as "compressed RTF from HTML": the
// original markup survives verbatim inside {\*\htmltagNNN ...} groups. This
// walks the RTF text respecting escaped braces (\{, \}) and reassembles the
// original HTML by concatenating those groups in order.
function extractHtmlFromRtf(rtf) {
  const out = [];
  const marker = /\{\\\*\\htmltag\d+ ?/g;
  let m;
  while ((m = marker.exec(rtf))) {
    let i = m.index + m[0].length;
    let depth = 1;
    let content = "";
    while (i < rtf.length && depth > 0) {
      const ch = rtf[i];
      if (ch === "\\" && (rtf[i + 1] === "{" || rtf[i + 1] === "}" || rtf[i + 1] === "\\")) {
        content += rtf[i + 1];
        i += 2;
        continue;
      }
      if (ch === "{") { depth++; content += ch; i++; continue; }
      if (ch === "}") { depth--; if (depth === 0) { i++; break; } content += ch; i++; continue; }
      content += ch;
      i++;
    }
    out.push(content);
    marker.lastIndex = i;
  }
  return out.join("");
}

// A message composed in plain Rich Text (not HTML) has no htmltag groups at
// all — just RTF control words around the real text. Crude but workable for
// pulling out readable text (names, dates, hotel names) for extraction.
function stripRtfControlWords(rtf) {
  return rtf
    .replace(/\{\\\*[^{}]*\}/g, "")
    .replace(/\\'[0-9A-Fa-f]{2}/g, "")
    .replace(/\\par[d]?\b\s?/g, "\n")
    .replace(/\\tab\b\s?/g, "\t")
    .replace(/\\[a-zA-Z]+-?\d*\s?/g, "")
    .replace(/[{}]/g, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

// PidTagRtfCompressed -> readable text, whichever the message actually used.
function rtfCompressedToText(compressedBytes) {
  const rtfBytes = window.decompressRTF(compressedBytes);
  const rtf = Array.from(rtfBytes, (b) => String.fromCharCode(b & 0xff)).join("");
  if (/\\fromhtml1/.test(rtf)) {
    return stripHtmlToText(extractHtmlFromRtf(rtf));
  }
  return stripRtfControlWords(rtf);
}

function decodeQuotedPrintable(text) {
  return text
    .replace(/=\r?\n/g, "")
    .replace(/=([0-9A-Fa-f]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
}

// Parses a plain .eml (MIME) file's headers/body well enough to pull out
// From, Subject, and a readable body — no external library needed since
// .eml is just text, unlike the binary Outlook .msg format below.
function parseEml(text) {
  const headerEnd = text.search(/\r?\n\r?\n/);
  const headerBlock = headerEnd === -1 ? text : text.slice(0, headerEnd);
  let bodyBlock = headerEnd === -1 ? "" : text.slice(headerEnd).replace(/^\r?\n\r?\n/, "");

  const getHeader = (name) => {
    const m = headerBlock.match(new RegExp(`^${name}:\\s*(.*(?:\\r?\\n[ \\t].*)*)`, "im"));
    return m ? m[1].replace(/\r?\n[ \t]+/g, " ").trim() : "";
  };

  const from = getHeader("From");
  const subject = getHeader("Subject");
  const contentType = getHeader("Content-Type");
  const transferEncoding = getHeader("Content-Transfer-Encoding").toLowerCase();

  // Multipart messages: just take the first text/plain (or text/html) part.
  const boundaryMatch = contentType.match(/boundary="?([^";]+)"?/i);
  if (boundaryMatch) {
    const boundary = boundaryMatch[1];
    const parts = bodyBlock.split(new RegExp(`--${boundary.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(--)?`));
    const plainPart = parts.find((p) => /Content-Type:\s*text\/plain/i.test(p));
    const htmlPart = parts.find((p) => /Content-Type:\s*text\/html/i.test(p));
    const chosen = plainPart || htmlPart || "";
    const partHeaderEnd = chosen.search(/\r?\n\r?\n/);
    let partBody = partHeaderEnd === -1 ? chosen : chosen.slice(partHeaderEnd).replace(/^\r?\n\r?\n/, "");
    if (/Content-Transfer-Encoding:\s*quoted-printable/i.test(chosen)) partBody = decodeQuotedPrintable(partBody);
    if (/Content-Type:\s*text\/html/i.test(chosen)) partBody = stripHtmlToText(partBody);
    bodyBlock = partBody;
  } else {
    if (transferEncoding === "quoted-printable") bodyBlock = decodeQuotedPrintable(bodyBlock);
    if (/text\/html/i.test(contentType)) bodyBlock = stripHtmlToText(bodyBlock);
  }

  return [from && `From: ${from}`, subject && `Subject: ${subject}`, "", bodyBlock.trim()]
    .filter((l) => l !== false && l !== undefined)
    .join("\n");
}

// Reads an Outlook .msg (via the bundled msgreader library) or a plain .eml
// file and returns its content as plain text, ready to drop into the paste
// box — so attaching the original email file works instead of only
// copy/paste.
function readEmailFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".msg")) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          if (typeof window.MsgReader !== "function") {
            reject(new Error("The .msg reader library did not load"));
            return;
          }
          const msg = new window.MsgReader(new Uint8Array(reader.result));
          const data = msg.getFileData();

          // Priority: HTML body (most common for modern Outlook) > compressed
          // RTF (Rich Text format messages, common in corporate Outlook) >
          // plain-text body (older/simple messages) — most real emails only
          // populate one of these, never PR_BODY, so this order matters.
          let body = "";
          if (data.bodyHtml && data.bodyHtml.trim()) {
            body = stripHtmlToText(data.bodyHtml);
          } else if (data.compressedRtf && typeof window.decompressRTF === "function") {
            try { body = rtfCompressedToText(data.compressedRtf); } catch (e) { body = ""; }
          }
          if (!body && data.body && data.body.trim()) {
            body = data.body.trim();
          }

          const recipients = (data.recipients || []).map((r) => r.name || r.smtpAddress || r.email).filter(Boolean).join(", ");
          const from = data.senderName || data.senderSmtpAddress || data.senderEmail || "";
          const lines = [
            from && `From: ${from}`,
            recipients && `To: ${recipients}`,
            data.subject && `Subject: ${data.subject}`,
            "",
            body,
          ].filter((l) => l !== false && l !== undefined && l !== "");
          resolve(lines.join("\n"));
        } catch (err) {
          reject(err);
        }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }
  if (name.endsWith(".eml")) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(parseEml(String(reader.result)));
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }
  return Promise.reject(new Error("Unsupported file type — please use .msg or .eml"));
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve({ name: file.name, type: file.type, size: file.size, dataUrl: reader.result });
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Opening a data: URI link is inert in the Artifacts viewer sandbox — it
// requires the declared "downloads" capability instead. Falls back to a
// plain new-tab open for a local HTML file / GitHub Pages, where there is
// no window.claude runtime and the plain link works fine.
async function openAttachment(attachment) {
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const downloads = await window.claude.use("downloads");
      if (downloads) {
        await downloads.save({ filename: attachment.name, data: attachment.dataUrl });
        return;
      }
    }
  } catch (err) {
    // fall through to the plain-browser path below
  }
  window.open(attachment.dataUrl, "_blank");
}

function AttachmentPicker({ attachments, onChange }) {
  const [busy, setBusy] = useState(false);

  const handleFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setBusy(true);
    try {
      const read = await Promise.all(files.map(readFileAsDataURL));
      onChange([...(attachments || []), ...read]);
    } catch (err) {
      appToast("Could not read one of the files: " + err.message);
    } finally {
      setBusy(false);
      e.target.value = "";
    }
  };

  const removeAt = (i) => onChange(attachments.filter((_, idx) => idx !== i));

  return (
    <div>
      <label className="sap-label">Attachments (ticket, confirmation, etc.)</label>
      <input type="file" multiple onChange={handleFiles} className="sap-input" />
      {busy && <p className="text-xs mt-1" style={{ color: "var(--sap-gray)" }}>Reading file(s)...</p>}
      {attachments && attachments.length > 0 && (
        <ul className="mt-2 space-y-1">
          {attachments.map((a, i) => (
            <li key={i} className="flex items-center justify-between text-xs sap-card px-2 py-1">
              <button type="button" onClick={() => openAttachment(a)} className="sap-link" style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}>
                📎 {a.name} {a.size ? `(${Math.round(a.size / 1024)} KB)` : ""}

              <button type="button" onClick={() => removeAt(i)} className="sap-link-danger">Remove</button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

const EXCEL_STATUS_MAP = {
  "done": "Completed",
  "completed": "Completed",
  "مكتمل": "Completed",
  "منتهي": "Completed",
  "pending": "Pending",
  "معلق": "Pending",
  "processing": "Processing",
  "قيد المعالجة": "Processing",
  "approved": "Approved",
  "تمت الموافقة": "Approved",
  "po issued": "PO Issued",
  "تم إصدار po": "PO Issued",
};

function mapExcelStatus(raw) {
  if (!raw) return "Pending";
  const key = String(raw).trim().toLowerCase();
  return EXCEL_STATUS_MAP[key] || "Pending";
}

function findCol(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) {
    const found = keys.find((k) => k.trim().toLowerCase() === c.toLowerCase());
    if (found) return row[found];
  }
  return "";
}

// Real-world "Following PO/PR" style trackers write free-text status notes
// instead of a clean enum ("waiting PR approval", "please issue PO", "Done",
// "Deleted"...). This interprets that phrasing into our workflow stages.
function mapFreeTextStatus(raw, hasPr, hasPo) {
  const text = String(raw || "").trim().toLowerCase();
  if (!text) return hasPo ? "PO Issued" : hasPr ? "Processing" : "Pending";
  if (/delet|cancel/.test(text)) return "Cancelled";
  if (/^done$|complet/.test(text)) return "Completed";
  if (/waiting po|please issue po/.test(text)) return "Approved";
  if (/waiting pr|please issue the pr|creat/.test(text)) return "Processing";
  if (/still not/.test(text)) return "Pending";
  // Unrecognized free text (e.g. a name typed in by mistake) — fall back to
  // what's actually filled in rather than guessing from the words.
  return hasPo ? "PO Issued" : hasPr ? "Processing" : "Pending";
}

// The owner/requester name isn't its own column in this format — it's the
// leading words of the description, e.g. "Samer Al Husaini 10-15 Jan 2025 -
// Ramada". Pull out the name portion before a date, dash, or digit.
function extractOwnerFromDescription(desc) {
  if (!desc) return "";
  const match = String(desc).match(/^([A-Za-z؀-ۿ][A-Za-z؀-ۿ.\s]{1,35}?)(?=\s*(?:\d|-|,|$))/);
  return match ? match[1].trim() : "";
}

// Detects the dual-header "Purchase Order / Purchase Requisition" layout
// (group titles on row 1, real column names PO/PR/approval/amount on row 2)
// used by real SAP-exported trackers, as opposed to a single clean header row.
function detectSapDualHeader(sheet) {
  const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", blankrows: false });
  for (let i = 0; i < Math.min(raw.length, 4); i++) {
    const row = raw[i].map((c) => String(c).trim().toLowerCase());
    const poIdx = row.indexOf("po");
    const prIdx = row.indexOf("pr");
    if (poIdx !== -1 && prIdx !== -1 && prIdx > poIdx) {
      return { headerRowIndex: i, poIdx, prIdx, raw };
    }
  }
  return null;
}

function parseSapDualHeaderRows({ headerRowIndex, poIdx, prIdx, raw }) {
  const dataRows = raw.slice(headerRowIndex + 1);
  // The PO group has its own (usually unused) approval column right after it;
  // the real free-text workflow status lives right after the PR column.
  const prStatusIdx = prIdx + 1;
  const amountIdx = prIdx + 2;
  const descIdx = amountIdx + 1;
  const supplierIdx = descIdx + 1;

  return dataRows
    .filter((r) => r.some((cell) => String(cell).trim() !== ""))
    .map((r) => {
      const poNumber = r[poIdx] ? String(r[poIdx]).trim() : "";
      const prNumber = r[prIdx] ? String(r[prIdx]).trim() : "";
      const statusText = r[prStatusIdx] || "";
      const description = r[descIdx] ? String(r[descIdx]).trim() : "";
      return {
        id: uid(),
        prNumber,
        poNumber,
        owner: extractOwnerFromDescription(description),
        department: "",
        serviceType: guessServiceType(description + " " + (r[supplierIdx] || "")),
        vendor: r[supplierIdx] ? String(r[supplierIdx]).trim() : "",
        budget: r[amountIdx] ? String(r[amountIdx]).trim() : "",
        finalAmount: "",
        requiredDate: "",
        completedDate: "",
        status: mapFreeTextStatus(statusText, !!prNumber, !!poNumber),
        notes: description,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };
    });
}

function parseExcelFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];

        const sapLayout = detectSapDualHeader(sheet);
        if (sapLayout) {
          resolve(parseSapDualHeaderRows(sapLayout));
          return;
        }

        const rows = XLSX.utils.sheet_to_json(sheet, { defval: "" });
        const parsed = rows.map((row) => ({
          id: uid(),
          prNumber: String(findCol(row, ["PR", "PR Number", "PR رقم", "رقم PR"]) || ""),
          poNumber: String(findCol(row, ["PO", "PO Number", "PO رقم", "رقم PO"]) || ""),
          owner: String(findCol(row, ["Owner", "Requester", "المسؤول"]) || ""),
          department: String(findCol(row, ["Department", "القسم"]) || ""),
          serviceType: String(findCol(row, ["Service", "Service Type", "نوع الخدمة"]) || "Other"),
          vendor: String(findCol(row, ["Vendor", "Supplier", "الموردة", "المورد"]) || ""),
          budget: String(findCol(row, ["Budget", "الميزانية"]) || ""),
          finalAmount: String(findCol(row, ["Amount", "Final Amount", "المبلغ النهائي"]) || ""),
          requiredDate: String(findCol(row, ["Required Date", "Date", "التاريخ المطلوب"]) || ""),
          completedDate: String(findCol(row, ["Completed Date", "تاريخ الانتهاء"]) || ""),
          status: mapExcelStatus(findCol(row, ["Status", "الحالة"])),
          notes: String(findCol(row, ["Description", "Notes", "الوصف", "الملاحظات"]) || ""),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        }));
        resolve(parsed);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

function exportToExcel(requests) {
  const rows = requests.map((r) => ({
    "PR Number": r.prNumber,
    "PO Number": r.poNumber,
    "Owner": r.owner,
    "Department": r.department,
    "Service Type": r.serviceType,
    "Vendor": r.vendor,
    "Status": STATUS_LABELS[r.status] || r.status,
    "Budget": r.budget,
    "Final Amount": r.finalAmount,
    "Required Date": r.requiredDate,
    "Completed Date": r.completedDate,
    "Notes": r.notes,
    "Created": r.createdAt ? r.createdAt.slice(0, 10) : "",
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Requests");
  const stamp = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `PR_PO_Tracker_${stamp}.xlsx`);
}

// One entry per selected service type: its own vendor, its own PR number
// (each service is its own SAP request tied to its own supplier), and its
// own editable suggested-action checklist.
function makeTypeEntry(type, vendor, customActions) {
  return { vendor: vendor || "", prNumber: "", actionSteps: getActionsForType(type, customActions), newStep: "" };
}

function EmailParserForm({ requests, onSave, onCancel }) {
  const [emailText, setEmailText] = useState("");
  const [extracted, setExtracted] = useState(null); // shared fields: owner, requiredDate, budget
  const [selectedTypes, setSelectedTypes] = useState([]);
  const [typeEntries, setTypeEntries] = useState({}); // { Hotel: {vendor, prNumber, actionSteps, newStep}, ... }
  const [customActions, setCustomActions] = useState(loadCustomActions);
  const [attachments, setAttachments] = useState([]);
  const [loadingFile, setLoadingFile] = useState(false);
  const [suppliers, setSuppliers] = useState(loadSuppliers);

  const knownVendorsAll = useMemo(() => getKnownVendors(requests), [requests]);
  const knownOwners = useMemo(() => getKnownOwners(requests), [requests]);

  const registerSupplier = (type, vendor) => {
    if (!vendor || !vendor.trim()) return;
    const list = getRegisteredSuppliers(suppliers, type);
    if (list.some((v) => v.toLowerCase() === vendor.trim().toLowerCase())) return;
    const updated = { ...suppliers, [type]: [...list, vendor.trim()] };
    setSuppliers(updated);
    saveSuppliers(updated);
    appToast(`Registered "${vendor.trim()}" as an approved ${type} supplier`);
  };

  const extractAndSetForm = (text) => {
    const detectedTypes = detectServiceTypes(text);
    const primaryType = guessServiceType(text);
    const knownForGuess = getKnownVendors(requests, primaryType);
    const data = extractFromEmail(text, knownForGuess.length ? knownForGuess : knownVendorsAll, knownOwners);

    setExtracted({
      owner: data.owner,
      ownerNeedsConfirmation: data.ownerNeedsConfirmation,
      ownerGuess: data.ownerGuess,
      requiredDate: data.requiredDate,
      budget: data.budget,
      prNumber: data.prNumber,
      notes: text.slice(0, 500),
    });
    setSelectedTypes(detectedTypes);
    const entries = {};
    detectedTypes.forEach((type) => {
      // Only the type the single-guess extractor actually landed on gets the
      // auto-detected vendor/PR — the others are separate suppliers you fill in.
      entries[type] = makeTypeEntry(type, type === primaryType ? data.vendor : "", customActions);
      if (type === primaryType && data.prNumber) entries[type].prNumber = data.prNumber;
    });
    setTypeEntries(entries);
  };

  const handleExtract = () => {
    if (!emailText.trim()) {
      appToast("Please paste the email content first");
      return;
    }
    extractAndSetForm(emailText);
  };

  const handleEmailFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setLoadingFile(true);
    try {
      const text = await readEmailFile(file);
      setEmailText(text);
      const fileAttachment = await readFileAsDataURL(file);
      setAttachments((prev) => [...prev, fileAttachment]);
      if (text.trim()) {
        extractAndSetForm(text);
        appToast(`Loaded and read "${file.name}" — review the extracted fields below`);
      } else {
        appToast(`Loaded "${file.name}" but found no readable text — check the pasted content`);
      }
    } catch (err) {
      appToast("Could not read this email file: " + err.message);
    } finally {
      setLoadingFile(false);
      e.target.value = "";
    }
  };

  const toggleType = (type) => {
    if (selectedTypes.includes(type)) {
      setSelectedTypes(selectedTypes.filter((t) => t !== type));
    } else {
      setSelectedTypes([...selectedTypes, type]);
      if (!typeEntries[type]) {
        setTypeEntries({ ...typeEntries, [type]: makeTypeEntry(type, "", customActions) });
      }
    }
  };

  const updateEntry = (type, patch) => setTypeEntries({ ...typeEntries, [type]: { ...typeEntries[type], ...patch } });

  const updateStep = (type, i, value) => {
    const steps = typeEntries[type].actionSteps.map((s, idx) => (idx === i ? value : s));
    updateEntry(type, { actionSteps: steps });
  };
  const removeStep = (type, i) => updateEntry(type, { actionSteps: typeEntries[type].actionSteps.filter((_, idx) => idx !== i) });
  const addStep = (type) => {
    const text = (typeEntries[type].newStep || "").trim();
    if (!text) return;
    updateEntry(type, { actionSteps: [...typeEntries[type].actionSteps, text], newStep: "" });
  };
  const saveActionsAsDefault = (type) => {
    const updated = { ...customActions, [type]: typeEntries[type].actionSteps };
    setCustomActions(updated);
    saveCustomActions(updated);
    appToast(`Saved this checklist as the default for future "${type}" requests`);
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!extracted.owner) {
      appToast("Please enter the requester's name");
      return;
    }
    if (selectedTypes.length === 0) {
      appToast("Select at least one service this email is requesting");
      return;
    }
    const batchId = selectedTypes.length > 1 ? uid() : null;
    const emailSummary = summarizeEmail({
      owner: extracted.owner,
      selectedTypes,
      budget: extracted.budget,
      requiredDate: extracted.requiredDate,
      prNumber: extracted.prNumber,
    });
    const forms = selectedTypes.map((type) => ({
      ...emptyForm(),
      owner: extracted.owner,
      requiredDate: extracted.requiredDate,
      budget: extracted.budget,
      notes: extracted.notes,
      attachments,
      serviceType: type,
      vendor: typeEntries[type].vendor,
      prNumber: typeEntries[type].prNumber,
      batchId,
      batchSize: selectedTypes.length,
      emailSummary,
    }));
    onSave(forms);
  };

  return (
    <div className="flex flex-col gap-4">
      <div>
        <label className="sap-label">Load the email file directly (.msg from Outlook, or .eml)</label>
        <input type="file" accept=".msg,.eml" onChange={handleEmailFile} className="sap-input" />
        {loadingFile && <p className="text-xs mt-1" style={{ color: "var(--sap-gray)" }}>Reading and extracting the email...</p>}
      </div>

      <div>
        <label className="sap-label">...or paste the email content here</label>
        <textarea
          value={emailText}
          onChange={(e) => setEmailText(e.target.value)}
          rows="6"
          placeholder="Paste the email text from the department or SAP here..."
          className="sap-textarea"
        ></textarea>
        <div className="flex justify-end mt-2">
          <button type="button" onClick={handleExtract} className="sap-btn sap-btn-blue">
            🔍 Extract Data
          </button>
        </div>
      </div>

      <AttachmentPicker attachments={attachments} onChange={setAttachments} />

      {extracted && (
        <form onSubmit={handleSubmit} className="flex flex-col gap-4" style={{ borderTop: "1px solid var(--sap-border)", paddingTop: "1rem" }}>
          <div className="p-3 text-sm" style={{ background: "var(--sap-purple-bg)", border: "1px solid #D9CCEA", borderRadius: "2px", color: "var(--sap-purple)" }}>
            <p className="font-semibold mb-1">🧠 Summary — what this email is asking for:</p>
            <p>{summarizeEmail({ owner: extracted.owner, selectedTypes, budget: extracted.budget, requiredDate: extracted.requiredDate, prNumber: extracted.prNumber })}</p>
          </div>

          <div className="sap-panel-info p-3 text-sm" style={{ color: "var(--sap-blue-dark)" }}>
            <p className="font-semibold mb-2">
              🤖 Confirm or adjust which services apply. Each checked service becomes its own tracked request (its own supplier, PR, and PO), since they don't share the same approval.
            </p>
            <div className="flex flex-wrap gap-3">
              {SERVICE_TYPES.filter((s) => s !== "Other").concat("Other").map((type) => (
                <label key={type} className="flex items-center gap-1.5 text-sm" style={{ color: "var(--sap-text)" }}>
                  <input type="checkbox" checked={selectedTypes.includes(type)} onChange={() => toggleType(type)} />
                  {type}
                </label>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="sap-label">Owner (requester) *</label>
              <input
                value={extracted.owner}
                onChange={(e) => setExtracted({ ...extracted, owner: e.target.value, ownerNeedsConfirmation: false })}
                className="sap-input"
                style={!extracted.owner ? { borderColor: "var(--sap-red)" } : undefined}
                placeholder="Select or type the requester's name"
                required
              />
              {extracted.ownerNeedsConfirmation && (
                <p className="text-xs mt-1 font-semibold" style={{ color: "var(--sap-red)" }}>
                  ⚠️ Could not confirm the owner from this email (found "{extracted.ownerGuess}" — might just be a signature/footer line). Please pick or type the real requester below.
                </p>
              )}
              {knownOwners.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                  <span className="text-xs" style={{ color: "var(--sap-gray)" }}>Previous requesters:</span>
                  {knownOwners.slice(0, 8).map((o) => (
                    <button
                      type="button"
                      key={o}
                      onClick={() => setExtracted({ ...extracted, owner: o, ownerNeedsConfirmation: false })}
                      className="text-xs px-2 py-0.5"
                      style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-text)" }}
                    >
                      {o}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div>
              <label className="sap-label">Required Date (shared across these requests)</label>
              <input type="date" value={extracted.requiredDate} onChange={(e) => setExtracted({ ...extracted, requiredDate: e.target.value })} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Budget (shared, split it manually per request if needed)</label>
              <input type="number" value={extracted.budget} onChange={(e) => setExtracted({ ...extracted, budget: e.target.value })} className="sap-input" />
            </div>
          </div>

          {selectedTypes.map((type) => {
            const entry = typeEntries[type];
            if (!entry) return null;
            const registered = getRegisteredSuppliers(suppliers, type);
            const learned = getKnownVendors(requests, type);
            const registeredLower = registered.map((v) => v.toLowerCase());
            const extraLearned = learned.filter((v) => !registeredLower.includes(v.toLowerCase()));
            const isUnregistered = entry.vendor.trim() && registered.length > 0 && !registeredLower.includes(entry.vendor.trim().toLowerCase());
            return (
              <div key={type} className="sap-card p-3" style={{ borderTop: "3px solid var(--sap-blue)" }}>
                <p className="font-semibold mb-2" style={{ color: "var(--sap-text)" }}>🧾 {type} request</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                  <div>
                    <label className="sap-label">Vendor / Supplier</label>
                    <input value={entry.vendor} onChange={(e) => updateEntry(type, { vendor: e.target.value })} className="sap-input" />
                    {(registered.length > 0 || extraLearned.length > 0) && (
                      <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                        <span className="text-xs" style={{ color: "var(--sap-gray)" }}>
                          {registered.length > 0 ? "Recommended (registered):" : "Usual vendors:"}
                        </span>
                        {registered.slice(0, 6).map((v) => (
                          <button
                            type="button"
                            key={v}
                            onClick={() => updateEntry(type, { vendor: v })}
                            className="text-xs px-2 py-0.5"
                            style={{ background: "var(--sap-green-bg)", border: "1px solid #BFE3CB", borderRadius: "10px", color: "var(--sap-green)" }}
                          >
                            ⭐ {v}
                          </button>
                        ))}
                        {extraLearned.slice(0, 4).map((v) => (
                          <button
                            type="button"
                            key={v}
                            onClick={() => updateEntry(type, { vendor: v })}
                            className="text-xs px-2 py-0.5"
                            style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-text)" }}
                          >
                            {v}
                          </button>
                        ))}
                      </div>
                    )}
                    {isUnregistered && (
                      <div className="mt-1.5 text-xs font-semibold flex items-center gap-2" style={{ color: "var(--sap-orange)" }}>
                        <span>⚠️ "{entry.vendor}" isn't on your registered {type} supplier list.</span>
                        <button type="button" onClick={() => registerSupplier(type, entry.vendor)} className="sap-link">+ Register it</button>
                      </div>
                    )}
                  </div>
                  <div>
                    <label className="sap-label">PR Number (if any)</label>
                    <input value={entry.prNumber} onChange={(e) => updateEntry(type, { prNumber: e.target.value })} className="sap-input" />
                  </div>
                </div>

                <p className="text-sm font-semibold mb-1" style={{ color: "var(--sap-blue-dark)" }}>💡 Suggested actions:</p>
                <ul className="space-y-1">
                  {entry.actionSteps.map((a, i) => (
                    <li key={i} className="flex items-center gap-2">
                      <span style={{ color: "var(--sap-blue)" }}>{i + 1}.</span>
                      <input
                        value={a}
                        onChange={(e) => updateStep(type, i, e.target.value)}
                        className="sap-input"
                        style={{ flex: 1 }}
                      />
                      <button type="button" onClick={() => removeStep(type, i)} className="sap-link-danger">Remove</button>
                    </li>
                  ))}
                </ul>
                <div className="flex gap-2 mt-2">
                  <input
                    value={entry.newStep}
                    onChange={(e) => updateEntry(type, { newStep: e.target.value })}
                    placeholder="Add a new action..."
                    className="sap-input"
                    style={{ flex: 1 }}
                  />
                  <button type="button" onClick={() => addStep(type)} className="sap-btn sap-btn-outline">+ Add</button>
                </div>
                <button type="button" onClick={() => saveActionsAsDefault(type)} className="mt-2 sap-link" style={{ display: "block" }}>
                  💾 Save this checklist as the default for "{type}" requests
                </button>
              </div>
            );
          })}

          <div>
            <label className="sap-label">Additional Notes (shared)</label>
            <textarea value={extracted.notes} onChange={(e) => setExtracted({ ...extracted, notes: e.target.value })} rows="3" className="sap-textarea"></textarea>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
            <button type="submit" className="sap-btn sap-btn-blue">
              Save {selectedTypes.length > 1 ? `${selectedTypes.length} Requests` : "Request"}
            </button>
          </div>
        </form>
      )}
    </div>
  );
}

function StatusUpdateForm({ req, onSave, onCancel }) {
  const [status, setStatus] = useState(req.status);
  const [prNumber, setPrNumber] = useState(req.prNumber);
  const [poNumber, setPoNumber] = useState(req.poNumber);
  const [notes, setNotes] = useState(req.notes || "");
  const [completedDate, setCompletedDate] = useState(req.completedDate || "");
  const [attachments, setAttachments] = useState(req.attachments || []);

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (status === "Approved" && !prNumber) {
      if (!(await appConfirm("Make sure to enter the PR number before approving. Continue without a PR number?"))) return;
    }
    if (status === "PO Issued" && !poNumber) {
      if (!(await appConfirm("Make sure to enter the PO number before marking as 'PO Issued'. Continue?"))) return;
    }
    onSave({
      ...req,
      status,
      prNumber,
      poNumber,
      notes,
      attachments,
      completedDate: status === "Completed" && !completedDate
        ? new Date().toISOString().slice(0, 10)
        : completedDate,
    });
  };

  return (
    <form onSubmit={handleSubmit} className="flex flex-col gap-4">
      <div className="sap-panel-info p-3 text-sm" style={{ color: "var(--sap-blue-dark)" }}>
        <span className="font-semibold">Next step: </span>{getNextAction(req)}

      <div>
        <label className="sap-label">New Status</label>
        <select value={status} onChange={(e) => setStatus(e.target.value)} className="sap-select">
          {STATUSES.map((s) => <option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
        </select>
      </div>
      <div className="grid grid-cols-2 gap-4">
        <div>
          <label className="sap-label">PR Number</label>
          <input value={prNumber} onChange={(e) => setPrNumber(e.target.value)} className="sap-input" />
        </div>
        <div>
          <label className="sap-label">PO Number</label>
          <input value={poNumber} onChange={(e) => setPoNumber(e.target.value)} className="sap-input" />
        </div>
      </div>
      <div>
        <label className="sap-label">Completed Date</label>
        <input type="date" value={completedDate} onChange={(e) => setCompletedDate(e.target.value)} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Notes</label>
        <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows="3" className="sap-textarea"></textarea>

function SupplierManagerModal({ onClose }) {
  const [suppliers, setSuppliers] = useState(loadSuppliers);
  const [activeType, setActiveType] = useState(SERVICE_TYPES[0]);
  const [newSupplier, setNewSupplier] = useState("");

  const persist = (updated) => {
    setSuppliers(updated);
    saveSuppliers(updated);
  };

  const addSupplier = () => {
    const name = newSupplier.trim();
    if (!name) return;
    const list = suppliers[activeType] || [];
    if (list.some((v) => v.toLowerCase() === name.toLowerCase())) {
      appToast(`"${name}" is already registered for ${activeType}`);
      return;
    }
    persist({ ...suppliers, [activeType]: [...list, name] });
    setNewSupplier("");
  };

  const removeSupplier = (type, name) => {
    persist({ ...suppliers, [type]: (suppliers[type] || []).filter((v) => v !== name) });
  };

  return (
    <div className="flex flex-col gap-4">
      <p className="text-sm" style={{ color: "var(--sap-gray)" }}>
        Register the suppliers you actually work with, per service type. When parsing an email, these show up as ⭐ recommended choices — anything else typed in gets flagged as an unregistered/new supplier.
      </p>
      <div className="flex gap-2">
        <select value={activeType} onChange={(e) => setActiveType(e.target.value)} className="sap-select" style={{ maxWidth: 160 }}>
          {SERVICE_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
        <input
          value={newSupplier}
          onChange={(e) => setNewSupplier(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addSupplier(); } }}
          placeholder={`Add a ${activeType} supplier...`}
          className="sap-input"
          style={{ flex: 1 }}
        />
        <button type="button" onClick={addSupplier} className="sap-btn sap-btn-blue">+ Add</button>
      </div>

      <div className="flex flex-col gap-3">
        {SERVICE_TYPES.map((type) => (
          <div key={type} className="sap-card p-3">
            <p className="font-semibold text-sm mb-2" style={{ color: "var(--sap-text)" }}>{type}</p>
            {(suppliers[type] || []).length === 0 ? (
              <p className="text-xs" style={{ color: "var(--sap-gray)" }}>No registered suppliers yet.</p>
            ) : (
              <ul className="flex flex-wrap gap-2">
                {(suppliers[type] || []).map((v) => (
                  <li key={v} className="flex items-center gap-1 text-xs px-2 py-1" style={{ background: "var(--sap-green-bg)", border: "1px solid #BFE3CB", borderRadius: "10px", color: "var(--sap-green)" }}>
                    ⭐ {v}
                    <button type="button" onClick={() => removeSupplier(type, v)} className="font-bold" style={{ color: "var(--sap-red)" }}>×</button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        ))}
      </div>

      <div className="flex justify-end pt-2">
        <button type="button" onClick={onClose} className="sap-btn sap-btn-blue">Done</button>
      </div>
    </div>
  );
}

function App() {
  const [requests, setRequests] = useState(loadRequests);
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [ownerFilter, setOwnerFilter] = useState("all");
  const [serviceFilter, setServiceFilter] = useState("all");
  const [dateFilter, setDateFilter] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingReq, setEditingReq] = useState(null);
  const [statusReq, setStatusReq] = useState(null);
  const [showParser, setShowParser] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [printReq, setPrintReq] = useState(null);
  const [showDaily, setShowDaily] = useState(false);
  const [showSuppliers, setShowSuppliers] = useState(false);
  const [viewBatchId, setViewBatchId] = useState(null);

  useEffect(() => {
    saveRequests(requests);
  }, [requests]);

  const owners = useMemo(() => {
    const set = new Set(requests.map((r) => r.owner).filter(Boolean));
    return Array.from(set);
  }, [requests]);

  const stats = useMemo(() => {
    const pending = requests.filter((r) => r.status === "Pending").length;
    const processing = requests.filter((r) => r.status === "Processing").length;
    const completed = requests.filter((r) => r.status === "Completed").length;
    const overdue = requests.filter((r) => isOverdue(r)).length;
    return { pending, processing, completed, overdue, total: requests.length };
  }, [requests]);

  const filtered = useMemo(() => {
    let list = [...requests];
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter((r) =>
        [r.owner, r.prNumber, r.poNumber, r.vendor, r.serviceType, r.notes]
          .filter(Boolean)
          .some((v) => v.toLowerCase().includes(q))
      );
    }
    if (statusFilter !== "all") list = list.filter((r) => r.status === statusFilter);
    if (ownerFilter !== "all") list = list.filter((r) => r.owner === ownerFilter);
    if (serviceFilter !== "all") list = list.filter((r) => r.serviceType === serviceFilter);
    if (dateFilter) list = list.filter((r) => r.requiredDate === dateFilter);

    const statusOrder = { Pending: 0, Processing: 1, Approved: 2, "PO Issued": 3, Completed: 4 };
    list.sort((a, b) => {
      const diff = statusOrder[a.status] - statusOrder[b.status];
      if (diff !== 0) return diff;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    return list;
  }, [requests, search, statusFilter, ownerFilter, serviceFilter, dateFilter]);

  const handleSaveNew = (form) => {
    if (form.id) {
      setRequests((prev) => prev.map((r) => (r.id === form.id ? { ...r, ...form, updatedAt: new Date().toISOString() } : r)));
    } else {
      const newReq = {
        ...form,
        id: uid(),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };
      setRequests((prev) => [newReq, ...prev]);
    }
    setShowForm(false);
    setEditingReq(null);
  };

  // Used when one email covers several services at once (hotel + car +
  // ticket) split into separate tracked requests — appends all of them in a
  // single state update so they don't clobber each other.
  const handleSaveMultiple = (forms) => {
    const now = new Date().toISOString();
    const newReqs = forms.map((form) => ({ ...form, id: uid(), createdAt: now, updatedAt: now }));
    setRequests((prev) => [...newReqs, ...prev]);
    setShowParser(false);
  };

  const handleStatusSave = (updated) => {
    setRequests(requests.map((r) => (r.id === updated.id ? { ...updated, updatedAt: new Date().toISOString() } : r)));
    setStatusReq(null);
  };

  const handleDelete = async (id) => {
    if (!(await appConfirm("Are you sure you want to delete this request?"))) return;
    setRequests((prev) => prev.filter((r) => r.id !== id));
  };

  const handleImport = (parsedRows) => {
    setRequests((prev) => [...parsedRows, ...prev]);
    setShowImport(false);
    appToast(`Successfully imported ${parsedRows.length} request(s)`);
  };

  const handlePrint = (req) => {
    setPrintReq(req);
    setTimeout(() => {
      window.print();
      setPrintReq(null);
    }, 100);
  };

  const dailyItems = useMemo(() => {
    return requests
      .filter((r) => r.status !== "Completed")
      .map((r) => ({ req: r, alert: getAlertLevel(r) }))
      .filter(({ req, alert }) => alert || (req.status === "Approved" && !req.prNumber) || (req.status === "PO Issued" && !req.poNumber))
      .sort((a, b) => {
        const order = { red: 0, yellow: 1, orange: 2 };
        return (order[a.alert] ?? 3) - (order[b.alert] ?? 3);
      });
  }, [requests]);

  const batchSiblings = useMemo(() => {
    const map = {};
    requests.forEach((r) => {
      if (!r.batchId) return;
      if (!map[r.batchId]) map[r.batchId] = [];
      map[r.batchId].push(r);
    });
    return map;
  }, [requests]);

  return (
    <div className="sap-shell">
      <header className="sap-header sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between flex-wrap gap-3">
          <div>
            <h1 className="text-xl font-extrabold">PR / PO Tracker</h1>
            <p className="text-xs opacity-90 mt-0.5">Purchase request &amp; approval tracking</p>
          </div>
          <div className="flex gap-2 flex-wrap justify-end">
            <button onClick={() => setShowDaily(true)} className="sap-btn sap-btn-ghost">
              ⏰ Today's Follow-up {dailyItems.length > 0 && `(${dailyItems.length})`}
            </button>
            <button onClick={() => setShowImport(true)} className="sap-btn sap-btn-ghost">
              📥 Import Excel
            </button>
            <button onClick={() => exportToExcel(requests)} className="sap-btn sap-btn-ghost">
              📤 Export Excel
            </button>
            <button onClick={() => setShowParser(true)} className="sap-btn sap-btn-ghost">
              📧 Parse Email
            </button>
            <button onClick={() => setShowSuppliers(true)} className="sap-btn sap-btn-ghost">
              ⭐ Suppliers
            </button>
            <button onClick={() => { setEditingReq(null); setShowForm(true); }} className="sap-btn sap-btn-primary">
              + New Request
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-6 py-6">
        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
          <StatCard label="Total" value={stats.total} borderColor="var(--sap-gray)" />
          <StatCard label="Pending" value={stats.pending} borderColor="var(--sap-amber)" />
          <StatCard label="Processing" value={stats.processing} borderColor="var(--sap-blue)" />
          <StatCard label="Completed" value={stats.completed} borderColor="var(--sap-green)" />
          <StatCard label="Overdue" value={stats.overdue} borderColor="var(--sap-red)" />
        </div>

        <div className="sap-card p-4 mb-6 flex flex-wrap gap-3 items-end">
          <div className="flex-1 min-w-[200px]">
            <label className="sap-label">Search</label>
            <input
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search by owner, PR/PO number, vendor..."
              className="sap-input"
            />
          </div>
          <div>
            <label className="sap-label">Status</label>
            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="sap-select">
              <option value="all">All</option>
              {STATUSES.map((s) => <option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
            </select>
          </div>
          <div>
            <label className="sap-label">Owner</label>
            <select value={ownerFilter} onChange={(e) => setOwnerFilter(e.target.value)} className="sap-select">
              <option value="all">All</option>
              {owners.map((o) => <option key={o} value={o}>{o}</option>)}
            </select>
          </div>
          <div>
            <label className="sap-label">Service Type</label>
            <select value={serviceFilter} onChange={(e) => setServiceFilter(e.target.value)} className="sap-select">
              <option value="all">All</option>
              {SERVICE_TYPES.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label className="sap-label">Required Date</label>
            <input type="date" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} className="sap-input" />
          </div>
          {(search || statusFilter !== "all" || ownerFilter !== "all" || serviceFilter !== "all" || dateFilter) && (
            <button
              onClick={() => { setSearch(""); setStatusFilter("all"); setOwnerFilter("all"); setServiceFilter("all"); setDateFilter(""); }}
              className="sap-link"
              style={{ padding: "8px 4px" }}
            >
              Clear filters
            </button>
          )}
        </div>

        <div className="sap-card overflow-hidden">
          <div className="overflow-x-auto">
            <table className="sap-table">
              <thead>
                <tr>
                  <th>PR</th>
                  <th>PO</th>
                  <th>Owner</th>
                  <th>Service</th>
                  <th>Vendor</th>
                  <th>Status</th>
                  <th>Required Date</th>
                  <th>Budget</th>
                  <th>Alert</th>
                  <th>Next Step</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 && (
                  <tr>
                    <td colSpan="11" className="text-center py-10" style={{ color: "var(--sap-gray)" }}>No matching requests</td>
                  </tr>
                )}
                {filtered.map((r) => {
                  const alert = getAlertLevel(r);
                  const style = alert ? ALERT_STYLES[alert] : null;
                  return (
                    <tr key={r.id} style={style ? style.rowStyle : undefined}>
                      <td>{r.prNumber || "—"}</td>
                      <td>{r.poNumber || "—"}</td>
                      <td>
                        {r.owner}
                        {r.attachments && r.attachments.length > 0 && (
                          <span className="ml-1" title={`${r.attachments.length} attachment(s)`}>📎{r.attachments.length}</span>
                        )}
                        {r.batchId && batchSiblings[r.batchId] && batchSiblings[r.batchId].length > 1 && (
                          <button
                            type="button"
                            onClick={() => setViewBatchId(r.batchId)}
                            className="ml-1 text-xs font-semibold"
                            style={{ color: "var(--sap-purple)" }}
                            title="These requests came from the same email"
                          >
                            🔗{batchSiblings[r.batchId].length}
                          </button>
                        )}
                      </td>
                      <td>{r.serviceType}</td>
                      <td>{r.vendor || "—"}</td>
                      <td>
                        <span className="sap-badge" style={STATUS_INLINE_STYLE[r.status]}>
                          {STATUS_LABELS[r.status]}
                        </span>
                      </td>
                      <td>{r.requiredDate || "—"}</td>
                      <td>{r.budget ? Number(r.budget).toLocaleString() : "—"}</td>
                      <td>
                        {style ? (
                          <span className="flex items-center gap-1 text-xs font-semibold" style={{ color: style.text }}>
                            <span className="inline-block rounded-full" style={{ width: 8, height: 8, background: style.dot }}></span>
                            {style.label}
                          </span>
                        ) : "—"}
                      </td>
                      <td className="text-xs" style={{ color: "var(--sap-blue-dark)", maxWidth: 220 }}>{getNextAction(r)}</td>
                      <td className="whitespace-nowrap">
                        <button onClick={() => setStatusReq(r)} className="sap-link mr-3">Update Status</button>
                        <button onClick={() => { setEditingReq(r); setShowForm(true); }} className="sap-link mr-3" style={{ color: "var(--sap-gray)" }}>Edit</button>
                        <button onClick={() => handlePrint(r)} className="sap-link-green mr-3">Print PO</button>
                        <button onClick={() => handleDelete(r.id)} className="sap-link-danger">Delete</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </main>

      {showForm && (
        <Modal title={editingReq ? "Edit Request" : "New Request"} onClose={() => { setShowForm(false); setEditingReq(null); }}>
          <RequestForm initial={editingReq} onSave={handleSaveNew} onCancel={() => { setShowForm(false); setEditingReq(null); }} />
        </Modal>
      )}

      {statusReq && (
        <Modal title={`Update Status — ${statusReq.owner}`} onClose={() => setStatusReq(null)}>
          <StatusUpdateForm req={statusReq} onSave={handleStatusSave} onCancel={() => setStatusReq(null)} />
        </Modal>
      )}

      {showParser && (
        <Modal title="Parse Request From Email" onClose={() => setShowParser(false)}>
          <EmailParserForm
            requests={requests}
            onSave={handleSaveMultiple}
            onCancel={() => setShowParser(false)}
          />
        </Modal>
      )}

      {showImport && (
        <Modal title="Import From Excel" onClose={() => setShowImport(false)}>
          <ImportExcelModal onImport={handleImport} onCancel={() => setShowImport(false)} />
        </Modal>
      )}

      {showDaily && (
        <Modal title="⏰ Today's Follow-up" onClose={() => setShowDaily(false)}>
          {dailyItems.length === 0 ? (
            <p className="text-center py-8" style={{ color: "var(--sap-gray)" }}>No requests need attention today 🎉</p>
          ) : (
            <div className="flex flex-col gap-3">
              {dailyItems.map(({ req, alert }) => {
                const style = alert ? ALERT_STYLES[alert] : null;
                const missingPr = req.status === "Approved" && !req.prNumber;
                const missingPo = req.status === "PO Issued" && !req.poNumber;
                return (
                  <div key={req.id} className="sap-card p-3" style={style ? style.rowStyle : { background: "#F5F6F7" }}>
                    <div className="flex items-center justify-between">
                      <span className="font-semibold" style={{ color: "var(--sap-text)" }}>{req.owner} — {req.serviceType} {req.vendor ? `(${req.vendor})` : ""}</span>
                      <span className="sap-badge" style={STATUS_INLINE_STYLE[req.status]}>{STATUS_LABELS[req.status]}</span>
                    </div>
                    <div className="text-sm mt-1 space-y-0.5">
                      {style && <p className="font-semibold" style={{ color: style.text }}>⚠️ {style.label}</p>}
                      {missingPr && <p className="font-semibold" style={{ color: "var(--sap-red)" }}>💾 Reminder: PR number not entered for this request</p>}
                      {missingPo && <p className="font-semibold" style={{ color: "var(--sap-red)" }}>💾 Reminder: PO number not entered for this request</p>}
                      <p style={{ color: "var(--sap-blue-dark)" }}><span className="font-semibold">Next step:</span> {getNextAction(req)}</p>
                    </div>
                    <button
                      onClick={() => { setShowDaily(false); setStatusReq(req); }}
                      className="mt-2 sap-link"
                    >
                      Update status now
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </Modal>
      )}

      {printReq && <PrintablePO req={printReq} />}

      {showSuppliers && (
        <Modal title="⭐ Registered Suppliers" onClose={() => setShowSuppliers(false)}>
          <SupplierManagerModal onClose={() => setShowSuppliers(false)} />
        </Modal>
      )}

      {viewBatchId && batchSiblings[viewBatchId] && (
        <Modal title="🔗 Linked requests from the same email" onClose={() => setViewBatchId(null)}>
          <div className="flex flex-col gap-3">
            <p className="text-sm" style={{ color: "var(--sap-gray)" }}>
              {batchSiblings[viewBatchId][0].emailSummary || "These requests were split from one email into separate services."}
            </p>
            {batchSiblings[viewBatchId].map((r) => (
              <div key={r.id} className="sap-card p-3 flex items-center justify-between">
                <div>
                  <p className="font-semibold" style={{ color: "var(--sap-text)" }}>{r.serviceType} {r.vendor ? `— ${r.vendor}` : ""}</p>
                  <p className="text-xs" style={{ color: "var(--sap-gray)" }}>PR: {r.prNumber || "—"} · PO: {r.poNumber || "—"}</p>
                </div>
                <span className="sap-badge" style={STATUS_INLINE_STYLE[r.status]}>{STATUS_LABELS[r.status]}</span>
              </div>
            ))}
          </div>
        </Modal>
      )}
      <ConfirmHost />
      <ToastHost />
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Render error caught by boundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 640, margin: "80px auto", padding: 24 }}>
          <div className="sap-card p-4">
            <h2 className="font-bold mb-2" style={{ color: "var(--sap-red)" }}>⚠️ Something went wrong displaying this page</h2>
            <p className="text-sm mb-3" style={{ color: "var(--sap-text)" }}>
              Your saved requests are safe (they live in this browser's storage, not in this screen). Reloading should recover the app.
            </p>
            <pre className="text-xs p-2 mb-3" style={{ background: "#F5F6F7", color: "var(--sap-gray)", overflow: "auto", whiteSpace: "pre-wrap" }}>
              {String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}
            </pre>
            <button onClick={() => window.location.reload()} className="sap-btn sap-btn-blue">Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
