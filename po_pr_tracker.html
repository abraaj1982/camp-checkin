function RequestForm({ initial, onSave, onCancel, requests }) {
  const [form, setForm] = useState(initial || emptyForm());
  // Only a brand-new request can cover several services at once (its own
  // supplier/PR/PO per service, same as the email parser) — an existing
  // request is already tied to one service and stays a single edit.
  const [multiTypes, setMultiTypes] = useState(initial ? [initial.serviceType] : [form.serviceType]);

  const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });

  const toggleType = (type) => {
    setMultiTypes((prev) =>
      prev.includes(type) ? prev.filter((t) => t !== type) : [...prev, type]
    );
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.owner || multiTypes.length === 0) {
      appToast("Please enter the requester and select at least one service");
      return;
    }

    if (!initial && multiTypes.length > 1) {
      // Same shared fields, one tracked request per selected service — each
      // gets its own row so its own vendor/PR/PO/status can be set later.
      const forms = multiTypes.map((type) => ({ ...form, serviceType: type }));
      const clashes = forms
        .map((f) => ({ form: f, dup: findPossibleDuplicates(f, requests || [])[0] }))
        .filter((x) => x.dup);
      if (clashes.length) {
        const { form: f, dup } = clashes[0];
        const proceed = await appConfirm(
          `A ${f.serviceType} request for ${dup.beneficiary || dup.owner} already covers overlapping dates ` +
          `(${dup.serviceDateFrom || "?"} → ${dup.serviceDateTo || "?"}, status ${STATUS_LABELS[dup.status]}` +
          `${dup.poNumber ? `, PO ${dup.poNumber}` : ""}). Save these anyway?`
        );
        if (!proceed) return;
      }
      onSave(forms);
      return;
    }

    const singleForm = { ...form, serviceType: multiTypes[0] };
    const duplicates = findPossibleDuplicates(singleForm, requests || []);
    if (duplicates.length) {
      const d = duplicates[0];
      const proceed = await appConfirm(
        `A ${d.serviceType} request for ${d.beneficiary || d.owner} already covers overlapping dates ` +
        `(${d.serviceDateFrom || "?"} → ${d.serviceDateTo || "?"}, status ${STATUS_LABELS[d.status]}` +
        `${d.poNumber ? `, PO ${d.poNumber}` : ""}). Save this one anyway?`
      );
      if (!proceed) return;
    }
    onSave(singleForm);
  };

  return (
    <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label className="sap-label">Requester (who asked) *</label>
        <input value={form.owner} onChange={set("owner")} className="sap-input" required />
      </div>
      <div>
        <label className="sap-label">Beneficiary / traveller (who it's for)</label>
        <input
          value={form.beneficiary || ""}
          onChange={set("beneficiary")}
          className="sap-input"
          placeholder="Leave blank if same as the requester"
        />
      </div>
      <div>
        <label className="sap-label">Service start (check-in / departure)</label>
        <input type="date" value={form.serviceDateFrom || ""} onChange={set("serviceDateFrom")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Service end (check-out / return)</label>
        <input type="date" value={form.serviceDateTo || ""} onChange={set("serviceDateTo")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Department</label>
        <select value={form.department} onChange={set("department")} className="sap-select">
          <option value="">— Select —</option>
          {PURCHASING_GROUPS.map((g) => <option key={g.code} value={g.label}>{g.label} ({g.code})</option>)}
        </select>
      </div>
      <div>
        <label className="sap-label">Waiting on</label>
        <select value={form.waitingOn || ""} onChange={set("waitingOn")} className="sap-select">
          <option value="">—</option>
          {WAITING_ON.map((w) => <option key={w} value={w}>{WAITING_ON_LABELS[w]}</option>)}
        </select>
      </div>
      <div>
        <label className="sap-label">
          Service Type * {!initial && <span className="font-normal" style={{ color: "var(--sap-gray)" }}>(check more than one if this request covers several services)</span>}
        </label>
        {initial ? (
          <select value={multiTypes[0]} onChange={(e) => setMultiTypes([e.target.value])} className="sap-select">
            {SERVICE_TYPES.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        ) : (
          <div className="flex flex-wrap gap-3 sap-input" style={{ height: "auto" }}>
            {SERVICE_TYPES.map((type) => (
              <label key={type} className="flex items-center gap-1.5 text-sm" style={{ color: "var(--sap-text)" }}>
                <input type="checkbox" checked={multiTypes.includes(type)} onChange={() => toggleType(type)} />
                {type}
              </label>
            ))}
          </div>
        )}
      </div>
      <div>
        <label className="sap-label">Vendor</label>
        <input value={form.vendor} onChange={set("vendor")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Budget</label>
        <input type="number" value={form.budget} onChange={set("budget")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Final Amount</label>
        <input type="number" value={form.finalAmount} onChange={set("finalAmount")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Required Date</label>
        <input type="date" value={form.requiredDate} onChange={set("requiredDate")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Completed Date</label>
        <input type="date" value={form.completedDate} onChange={set("completedDate")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">PR Number</label>
        <input value={form.prNumber} onChange={set("prNumber")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">PR raised by</label>
        <select value={form.prRaisedBy || "me"} onChange={set("prRaisedBy")} className="sap-select">
          <option value="me">Me — I create it in SAP</option>
          <option value="requester">The requester — it arrived already raised</option>
        </select>
      </div>
      <div className="md:col-span-2">
        <label className="sap-label">Charged to</label>
        <ChargeFields value={form} onChange={(v) => setForm({ ...form, chargeTo: v.chargeTo, projectName: v.projectName, network: v.network, activity: v.activity, costCenter: v.costCenter })} />
      </div>
      <div>
        <label className="sap-label">PO Number</label>
        <input value={form.poNumber} onChange={set("poNumber")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Status</label>
        <select value={form.status} onChange={set("status")} className="sap-select">
          {STATUSES.map((s) => <option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
        </select>
      </div>
      <div className="md:col-span-2">
        <label className="sap-label">Notes</label>
        <textarea value={form.notes} onChange={set("notes")} rows="3" className="sap-textarea"></textarea>
      </div>
      <div className="md:col-span-2">
        <AttachmentPicker attachments={form.attachments} onChange={(attachments) => setForm({ ...form, attachments })} />
      </div>
      <div className="md:col-span-2 flex justify-end gap-2 pt-2">
        <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
        <button type="submit" className="sap-btn sap-btn-blue">Save Request</button>
      </div>
    </form>
  );
}

function StatusUpdateForm({ req, onSave, onCancel }) {
  const [status, setStatus] = useState(req.status);
  const [prNumber, setPrNumber] = useState(req.prNumber);
  const [poNumber, setPoNumber] = useState(req.poNumber);
  const [notes, setNotes] = useState(req.notes || "");
  const [completedDate, setCompletedDate] = useState(req.completedDate || "");
  const [attachments, setAttachments] = useState(req.attachments || []);
  const [waitingOn, setWaitingOn] = useState(req.waitingOn || DEFAULT_WAITING_ON[req.status] || "");
  const [charge, setCharge] = useState({
    chargeTo: req.chargeTo || "", projectName: req.projectName || "", network: req.network || "",
    activity: req.activity || "", costCenter: req.costCenter || "",
  });

  // Moving to a new stage normally hands the request to a different party;
  // follow that automatically so the queue stays truthful without extra work.
  const handleStatusChange = (e) => {
    const next = e.target.value;
    setStatus(next);
    if ((req.waitingOn || "") === (DEFAULT_WAITING_ON[req.status] || "") || req.waitingOn === "Me") {
      // An approved PR with no PO yet is mine to act on: I create the PO.
      setWaitingOn(next === "Waiting PO approval" && !poNumber ? "Me" : (DEFAULT_WAITING_ON[next] || ""));
    }
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    // Raising the PR myself needs to know who pays — and for a project, its
    // Network and Activity. SAP rejects the PR without them, so the tracker does too.
    if (req.status === "Pending" && status !== "Pending" && status !== "Cancelled" && req.prRaisedBy !== "requester") {
      if (!charge.chargeTo) {
        appToast("Choose Project or Cost Center below before moving past Pending.");
        return;
      }
      if (charge.chargeTo === "project" && (!charge.network.trim() || !charge.activity.trim())) {
        appToast("The PR can't be created without the project's Network and Activity — enter them below first.");
        return;
      }
    }
    if (status === "Waiting PO approval" && !prNumber) {
      if (!(await appConfirm("Make sure to enter the PR number now that it's approved. Continue without a PR number?"))) return;
    }
    // Hard requirement, not a confirm-and-continue: Completed must have the
    // PO document attached first. No bypass — this stays open until one is
    // actually attached below.
    if (status === "Completed" && attachments.length === 0) {
      appToast("Attach the PO document below before marking this request as Completed.");
      return;
    }
    if (status === "Completed" && !poNumber) {
      if (!(await appConfirm("Make sure to enter the PO number before marking as Completed. Continue?"))) return;
    }
    const stageChanged = status !== req.status || waitingOn !== (req.waitingOn || "");
    onSave({
      ...req,
      status,
      prNumber,
      poNumber,
      notes,
      attachments,
      waitingOn,
      chargeTo: charge.chargeTo,
      projectName: charge.chargeTo === "project" ? charge.projectName.trim() : "",
      network: charge.chargeTo === "project" ? charge.network.trim() : "",
      activity: charge.chargeTo === "project" ? charge.activity.trim() : "",
      costCenter: charge.chargeTo === "cost_center" ? charge.costCenter.trim() : "",
      // Restart the clock only when the request actually moved on, so "5 days
      // with SAP" means exactly that, not "5 days since I last edited a note".
      stageSince: stageChanged ? new Date().toISOString() : (req.stageSince || req.createdAt),
      completedDate: status === "Completed" && !completedDate
        ? new Date().toISOString().slice(0, 10)
        : completedDate,
    });
  };

  const breach = slaBreach(req, loadSla());

  return (
    <form onSubmit={handleSubmit} className="flex flex-col gap-4">
      <div className="sap-panel-info p-3 text-sm" style={{ color: "var(--sap-blue-dark)" }}>
        <span className="font-semibold">Next step: </span>{getNextAction(req)}
        <div className="mt-1 text-xs">
          In this stage for <strong>{daysInStage(req)}</strong> day(s)
          {req.waitingOn ? <> · waiting on <strong>{WAITING_ON_LABELS[req.waitingOn] || req.waitingOn}</strong></> : null}
          {breach ? <span style={{ color: "var(--sap-red)" }}> · {breach.over} day(s) past the {breach.target}-day target</span> : null}
        </div>
      </div>
      {status === "Completed" && attachments.length === 0 && (
        <div className="p-3 text-sm font-semibold" style={{ background: "var(--sap-red-bg)", border: "1px solid #F5C2C2", borderRadius: "10px", color: "var(--sap-red)" }}>
          ⚠️ Attach the PO document below first — Completed can't be saved without it.
        </div>
      )}
      <div className="grid grid-cols-2 gap-4">
        <div>
          <label className="sap-label">New Status</label>
          <select value={status} onChange={handleStatusChange} className="sap-select">
            {STATUSES.map((s) => <option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
          </select>
        </div>
        <div>
          <label className="sap-label">Waiting on</label>
          <select value={waitingOn} onChange={(e) => setWaitingOn(e.target.value)} className="sap-select">
            <option value="">—</option>
            {WAITING_ON.map((w) => <option key={w} value={w}>{WAITING_ON_LABELS[w]}</option>)}
          </select>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-4">
        <div>
          <label className="sap-label">PR Number</label>
          <input value={prNumber} onChange={(e) => setPrNumber(e.target.value)} className="sap-input" />
        </div>
        <div>
          <label className="sap-label">PO Number</label>
          <input value={poNumber} onChange={(e) => setPoNumber(e.target.value)} className="sap-input" />
        </div>
      </div>
      <div>
        <label className="sap-label">Charged to</label>
        <ChargeFields value={charge} onChange={setCharge} compact />
      </div>
      <div>
        <label className="sap-label">Completed Date</label>
        <input type="date" value={completedDate} onChange={(e) => setCompletedDate(e.target.value)} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Notes</label>
        <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows="3" className="sap-textarea"></textarea>
      </div>
      <AttachmentPicker attachments={attachments} onChange={setAttachments} />
      <div className="flex justify-end gap-2 pt-2">
        <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
        <button type="submit" className="sap-btn sap-btn-blue">Update Status</button>
      </div>
    </form>
  );
}

// A dialog holding a multi-step form must not be dismissible by a stray click
// on the backdrop: the content's height changes as you work through it (an
// email with three services is far taller than an empty form), so a click
// aimed at a control that just moved lands on the backdrop instead and would
// throw away everything entered so far. Closing is therefore explicit only —
// the × button or Escape.
function Modal({ title, onClose, children, scrollResetKey, wide }) {
  const cardRef = useRef(null);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  // When the dialog's content is replaced (e.g. a different email is loaded),
  // bring the reader back to the top instead of leaving them staring at
  // whitespace where the previous, longer content used to be.
  useEffect(() => {
    if (scrollResetKey !== undefined && cardRef.current) cardRef.current.scrollTop = 0;
  }, [scrollResetKey]);

  return (
    <div className="sap-modal-overlay fixed inset-0 flex items-center justify-center z-50 p-4">
      <div ref={cardRef} className={`sap-modal w-full ${wide ? "max-w-3xl" : "max-w-2xl"} max-h-[90vh] overflow-y-auto`}>
        <div className="sap-modal-header flex items-center justify-between px-6 py-4 sticky top-0" style={{ zIndex: 1 }}>
          <h2 className="text-base font-bold" style={{ color: "var(--sap-text)" }}>{title}</h2>
          <button onClick={onClose} className="text-xl leading-none" style={{ color: "var(--sap-gray)" }} title="Close (Esc)">×</button>
        </div>
        <div className="p-6">{children}</div>
      </div>
    </div>
  );
}

// A ranked bar: the row label carries identity, the value is direct-labeled,
// and the track stays recessive so the filled length is what the eye reads.
function BarRow({ label, value, max, formatted, color, note }) {
  const pct = max > 0 ? Math.max((value / max) * 100, value > 0 ? 2 : 0) : 0;
  return (
    <div className="mb-2" title={`${label}: ${formatted !== undefined ? formatted : value}`}>
      <div className="flex items-baseline justify-between gap-3 mb-1">
        <span className="text-xs" style={{ color: "var(--sap-text)" }}>{label}</span>
        <span className="text-xs font-semibold" style={{ color: "var(--sap-text)", fontVariantNumeric: "tabular-nums" }}>
          {formatted !== undefined ? formatted : value}
          {note ? <span className="font-normal" style={{ color: "var(--sap-gray)" }}> {note}</span> : null}
        </span>
      </div>
      <div style={{ background: "#EDEFF1", height: 8, borderRadius: 2 }}>
        <div style={{ width: `${pct}%`, height: 8, background: color || "var(--sap-blue)", borderRadius: 4 }}></div>
      </div>
    </div>
  );
}

// Types the browser can render directly in an <iframe>/<img> from a data:
// URL — no download needed, so no "Let this Artifact download a file?"
// prompt either. PDFs and common image formats cover the vast majority of
// what actually gets attached (tickets, PO scans, confirmations).
const INLINE_PREVIEWABLE_EXTENSIONS = ["pdf", "png", "jpg", "jpeg", "gif", "webp", "svg"];

function AttachmentsView({ req }) {
  const files = req.attachments || [];
  const [openTextIndex, setOpenTextIndex] = useState(null);
  const [previewIndex, setPreviewIndex] = useState(null);
  const [previewSrc, setPreviewSrc] = useState(null);
  const [previewLoading, setPreviewLoading] = useState(false);

  if (!files.length) {
    return <p className="text-center py-8" style={{ color: "var(--sap-gray)" }}>No files attached to this request.</p>;
  }

  const togglePreview = async (a, i) => {
    if (previewIndex === i) {
      setPreviewIndex(null);
      setPreviewSrc(null);
      return;
    }
    setPreviewIndex(i);
    setPreviewSrc(null);
    setPreviewLoading(true);
    const data = await resolveAttachmentData(a);
    setPreviewLoading(false);
    if (!data) {
      appToast(`"${a.name}" could not be found in this browser's file store`);
      setPreviewIndex(null);
      return;
    }
    setPreviewSrc(data);
  };

  return (
    <div className="flex flex-col gap-2">
      <p className="text-sm" style={{ color: "var(--sap-gray)" }}>
        {req.serviceType} · {req.owner}{req.beneficiary ? ` · for ${req.beneficiary}` : ""}
      </p>
      {files.map((a, i) => {
        const downloadable = DOWNLOADABLE_EXTENSIONS.includes(extensionOf(a.name));
        const canPreview = INLINE_PREVIEWABLE_EXTENSIONS.includes(extensionOf(a.name));
        const isPdf = extensionOf(a.name) === "pdf";
        return (
          <div key={i} className="sap-card p-3">
            <div className="flex items-center justify-between gap-3">
              <div style={{ minWidth: 0 }}>
                <span className="font-semibold text-sm" style={{ color: "var(--sap-text)" }}>📎 {a.name}</span>
                <p className="text-xs mt-0.5" style={{ color: "var(--sap-gray)" }}>
                  {a.size ? `${Math.round(a.size / 1024)} KB` : "size unknown"}
                  {a.text ? " · its text is searchable" : ""}
                  {!downloadable && !canPreview ? " · this file type can't be opened by the viewer, read it below" : ""}
                </p>
              </div>
              <div className="flex gap-2 whitespace-nowrap">
                {a.text ? (
                  <button
                    type="button"
                    onClick={() => setOpenTextIndex(openTextIndex === i ? null : i)}
                    className="sap-btn sap-btn-outline"
                  >
                    {openTextIndex === i ? "Hide text" : "View text"}
                  </button>
                ) : null}
                {canPreview ? (
                  <button type="button" onClick={() => togglePreview(a, i)} className="sap-btn sap-btn-outline">
                    {previewIndex === i ? "Hide preview" : "Preview"}
                  </button>
                ) : (
                  <button type="button" onClick={() => openAttachment(a)} className="sap-btn sap-btn-outline">Open file</button>
                )}
              </div>
            </div>
            {openTextIndex === i && (
              <pre
                className="text-xs mt-3 p-3"
                style={{
                  background: "#F5F6F7",
                  border: "1px solid var(--sap-border)",
                  borderRadius: 2,
                  whiteSpace: "pre-wrap",
                  wordBreak: "break-word",
                  maxHeight: 320,
                  overflow: "auto",
                  color: "var(--sap-text)",
                }}
              >
                {a.text}
              </pre>
            )}
            {previewIndex === i && (
              <div className="mt-3" style={{ border: "1px solid var(--sap-border)", borderRadius: 8, overflow: "hidden" }}>
                {previewLoading ? (
                  <p className="text-xs p-3" style={{ color: "var(--sap-gray)" }}>Loading preview…</p>
                ) : previewSrc ? (
                  isPdf ? (
                    <iframe src={previewSrc} title={a.name} style={{ width: "100%", height: 480, border: "none" }} />
                  ) : (
                    <img src={previewSrc} alt={a.name} style={{ width: "100%", display: "block" }} />
                  )
                ) : null}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ReportsView({ requests, sla }) {
  const open = requests.filter((r) => r.status !== "Completed" && r.status !== "Cancelled");
  const waitingOnMe = open.filter((r) => r.waitingOn === "Me").length;
  const pastTarget = open.filter((r) => slaBreach(r, sla)).length;

  const countBy = (list, keyFn) => {
    const out = {};
    list.forEach((r) => {
      const k = keyFn(r);
      if (!k) return;
      out[k] = (out[k] || 0) + 1;
    });
    return out;
  };

  const byStatus = countBy(requests, (r) => r.status);
  const byWaiting = countBy(open, (r) => r.waitingOn);
  const byService = countBy(requests, (r) => r.serviceType);

  const spendByVendor = {};
  requests.forEach((r) => {
    const vendor = (r.vendor || "").trim();
    if (!vendor) return;
    const amount = Number(r.finalAmount || r.budget || 0);
    if (!amount || isNaN(amount)) return;
    spendByVendor[vendor] = (spendByVendor[vendor] || 0) + amount;
  });
  const topVendors = Object.entries(spendByVendor).sort((a, b) => b[1] - a[1]).slice(0, 8);

  // Only completed requests can tell you how long the round trip really takes.
  const completed = requests.filter((r) => r.status === "Completed" && r.completedDate && r.createdAt);
  const cycleTimes = completed.map((r) =>
    Math.max(0, Math.round((new Date(r.completedDate) - new Date(r.createdAt)) / 86400000))
  );
  const avgCycle = cycleTimes.length
    ? Math.round(cycleTimes.reduce((a, b) => a + b, 0) / cycleTimes.length)
    : null;

  // Average days currently parked with each party — the closest honest answer
  // to "who holds things up", without a full change history.
  const ageByParty = {};
  open.forEach((r) => {
    if (!r.waitingOn) return;
    if (!ageByParty[r.waitingOn]) ageByParty[r.waitingOn] = [];
    ageByParty[r.waitingOn].push(daysInStage(r));
  });
  const avgAge = Object.entries(ageByParty).map(([party, days]) => [
    party,
    Math.round(days.reduce((a, b) => a + b, 0) / days.length),
  ]).sort((a, b) => b[1] - a[1]);

  const maxOf = (entries) => entries.reduce((m, [, v]) => Math.max(m, v), 0);

  if (requests.length === 0) {
    return <p className="text-center py-8" style={{ color: "var(--sap-gray)" }}>Nothing to report yet — add a few requests first.</p>;
  }

  const SectionCard = ({ icon, title, children }) => (
    <section className="sap-card" style={{ padding: "20px 22px" }}>
      <h3
        className="font-bold text-sm mb-4 flex items-center gap-2"
        style={{ color: "var(--sap-text)", letterSpacing: "-0.01em" }}
      >
        <span>{icon}</span> {title}
      </h3>
      {children}
    </section>
  );

  return (
    <div className="flex flex-col gap-4">
      <div className="grid grid-cols-3 gap-4">
        <div className="sap-tile" style={{ background: "linear-gradient(145deg, #EAF2FC, #fff)" }}>
          <div className="sap-tile-value" style={{ color: "var(--sap-blue)" }}>{open.length}</div>
          <div className="sap-tile-label">Open requests</div>
        </div>
        <div className="sap-tile" style={{ background: "linear-gradient(145deg, var(--sap-red-bg), #fff)" }}>
          <div className="sap-tile-value" style={{ color: "var(--sap-red)" }}>{waitingOnMe}</div>
          <div className="sap-tile-label">Waiting on me</div>
        </div>
        <div className="sap-tile" style={{ background: "linear-gradient(145deg, var(--sap-orange-bg), #fff)" }}>
          <div className="sap-tile-value" style={{ color: "var(--sap-orange)" }}>{pastTarget}</div>
          <div className="sap-tile-label">Past stage target</div>
        </div>
      </div>

      <SectionCard icon="⏳" title="Where the open work is sitting">
        {avgAge.length === 0 ? (
          <p className="text-xs" style={{ color: "var(--sap-gray)" }}>No open requests with a party assigned.</p>
        ) : (
          avgAge.map(([party, days]) => (
            <BarRow
              key={party}
              label={`${WAITING_ON_LABELS[party] || party} · ${ageByParty[party].length} request(s)`}
              value={days}
              max={maxOf(avgAge)}
              formatted={`${days}d`}
              note="avg wait"
              color={(WAITING_ON_STYLE[party] || {}).color}
            />
          ))
        )}
      </SectionCard>

      <SectionCard icon="📋" title="Requests by stage">
        {Object.entries(byStatus).map(([status, count]) => (
          <BarRow
            key={status}
            label={STATUS_LABELS[status] || status}
            value={count}
            max={maxOf(Object.entries(byStatus))}
            color={(STATUS_INLINE_STYLE[status] || {}).color}
          />
        ))}
      </SectionCard>

      <SectionCard icon="💰" title="Spend by supplier (top 8)">
        {topVendors.length === 0 ? (
          <p className="text-xs" style={{ color: "var(--sap-gray)" }}>No amounts recorded yet.</p>
        ) : (
          topVendors.map(([vendor, amount]) => (
            <BarRow
              key={vendor}
              label={vendor}
              value={amount}
              max={maxOf(topVendors)}
              formatted={Math.round(amount).toLocaleString()}
            />
          ))
        )}
      </SectionCard>

      <SectionCard icon="🧳" title="Volume by service type">
        {Object.entries(byService).map(([type, count]) => (
          <BarRow key={type} label={type} value={count} max={maxOf(Object.entries(byService))} />
        ))}
      </SectionCard>

      <section
        className="sap-card"
        style={{
          padding: "18px 22px",
          background: "linear-gradient(135deg, var(--sap-blue), #6C7CFF)",
          border: "none",
        }}
      >
        <p className="text-sm" style={{ color: "#fff" }}>
          {avgCycle === null
            ? "No completed requests yet, so there's no cycle time to measure."
            : <>⚡ Completed requests took <strong>{avgCycle} day(s)</strong> on average from first logged to done, across {cycleTimes.length} request(s).</>}
        </p>
      </section>
    </div>
  );
}

function SupplierManagerModal({ onClose, sla, onSlaChange }) {
  const [suppliers, setSuppliers] = useState(loadSuppliers);
  const [activeType, setActiveType] = useState(SERVICE_TYPES[0]);
  const [newSupplier, setNewSupplier] = useState("");

  const updateSla = (status, value) => {
    const days = parseInt(value, 10);
    const updated = { ...sla, [status]: isNaN(days) ? 0 : days };
    saveSla(updated);
    onSlaChange(updated);
  };

  const persist = (updated) => {
    setSuppliers(updated);
    saveSuppliers(updated);
  };

  const addSupplier = () => {
    const name = newSupplier.trim();
    if (!name) return;
    const list = suppliers[activeType] || [];
    if (list.some((v) => v.toLowerCase() === name.toLowerCase())) {
      appToast(`"${name}" is already registered for ${activeType}`);
      return;
    }
    persist({ ...suppliers, [activeType]: [...list, name] });
    setNewSupplier("");
  };

  const removeSupplier = (type, name) => {
    persist({ ...suppliers, [type]: (suppliers[type] || []).filter((v) => v !== name) });
  };

  return (
    <div className="flex flex-col gap-4">
      <p className="text-sm" style={{ color: "var(--sap-gray)" }}>
        Register the suppliers you actually work with, per service type. When parsing an email, these show up as ⭐ recommended choices — anything else typed in gets flagged as an unregistered/new supplier.
      </p>
      <div className="flex gap-2">
        <select value={activeType} onChange={(e) => setActiveType(e.target.value)} className="sap-select" style={{ maxWidth: 160 }}>
          {SERVICE_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
        <input
          value={newSupplier}
          onChange={(e) => setNewSupplier(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addSupplier(); } }}
          placeholder={`Add a ${activeType} supplier...`}
          className="sap-input"
          style={{ flex: 1 }}
        />
        <button type="button" onClick={addSupplier} className="sap-btn sap-btn-blue">+ Add</button>
      </div>

      <div className="flex flex-col gap-3">
        {SERVICE_TYPES.map((type) => (
          <div key={type} className="sap-card p-3">
            <p className="font-semibold text-sm mb-2" style={{ color: "var(--sap-text)" }}>{type}</p>
            {(suppliers[type] || []).length === 0 ? (
              <p className="text-xs" style={{ color: "var(--sap-gray)" }}>No registered suppliers yet.</p>
            ) : (
              <ul className="flex flex-wrap gap-2">
                {(suppliers[type] || []).map((v) => (
                  <li key={v} className="flex items-center gap-1 text-xs px-2 py-1" style={{ background: "var(--sap-green-bg)", border: "1px solid #BFE3CB", borderRadius: "10px", color: "var(--sap-green)" }}>
                    ⭐ {v}
                    <button type="button" onClick={() => removeSupplier(type, v)} className="font-bold" style={{ color: "var(--sap-red)" }}>×</button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        ))}
      </div>

      <div style={{ borderTop: "1px solid var(--sap-border)", paddingTop: "1rem" }}>
        <p className="font-semibold text-sm mb-1" style={{ color: "var(--sap-text)" }}>⏱ Stage targets (SLA)</p>
        <p className="text-xs mb-3" style={{ color: "var(--sap-gray)" }}>
          How many days a request may sit in each stage before it's flagged as late. This is what turns "it's been a while" into a number you can act on.
        </p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          {Object.keys(DEFAULT_SLA_DAYS).map((status) => (
            <div key={status}>
              <label className="sap-label">{STATUS_LABELS[status]}</label>
              <input
                type="number"
                min="0"
                value={sla[status]}
                onChange={(e) => updateSla(status, e.target.value)}
                className="sap-input"
              />
            </div>
          ))}
        </div>
      </div>

      <div className="flex justify-end pt-2">
        <button type="button" onClick={onClose} className="sap-btn sap-btn-blue">Done</button>
      </div>
    </div>
  );
}

// One row: a field's ready-to-paste value next to a one-click Copy button.
// Click-to-copy beats re-typing by hand into SAP, and beats a screenshot
// annotation this app has no way to draw anyway.
function CopyRow({ label, value, hint, multiline }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try {
      await navigator.clipboard.writeText(value || "");
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (err) {
      appToast("Could not copy — select and copy the text manually.");
    }
  };
  return (
    <div className={`flex gap-3 py-1.5 ${multiline ? "items-start" : "items-center"}`} style={{ borderBottom: "1px solid #F1F2F8" }}>
      <div style={{ flex: "0 0 160px" }}>
        <div className="text-xs font-semibold" style={{ color: "var(--sap-gray)" }}>{label}</div>
        {hint && <div className="text-xs" style={{ color: "var(--sap-gray)" }}>{hint}</div>}
      </div>
      <div
        className="text-sm flex-1"
        style={{
          color: value ? "var(--sap-text)" : "var(--sap-gray)",
          fontFamily: multiline ? "inherit" : "monospace",
          whiteSpace: multiline ? "pre-wrap" : "nowrap",
          overflow: multiline ? "visible" : "hidden",
          textOverflow: multiline ? "clip" : "ellipsis",
        }}
      >
        {value || "— empty —"}
      </div>
      <button
        type="button"
        onClick={copy}
        disabled={!value}
        className="sap-btn sap-btn-outline"
        style={!value ? { opacity: 0.4, cursor: "not-allowed" } : {}}
      >
        {copied ? "✓ Copied" : "Copy"}
      </button>
    </div>
  );
}

function CopyForSapModal({ req, onClose }) {
  const shortText = [req.serviceType, req.beneficiary || req.owner, req.vendor].filter(Boolean).join(" - ");
  const pgrCode = purchasingGroupCodeFor(req.department);
  const sample = useSample();
  const [aiNote, setAiNote] = useState("");
  const [aiBusy, setAiBusy] = useState(false);
  // PR tab while the PR still has to be raised; PO tab once a PR exists and
  // is approved (or arrived already raised by the requester).
  const prExists = !!(req.prNumber || "").trim();
  const [mode, setMode] = useState(
    req.status === "Completed" ? "SES"
      : req.status === "Waiting PO approval" || (req.prRaisedBy === "requester" && prExists) ? "PO" : "PR"
  );

  const writeNoteWithAi = async () => {
    if (!sample || aiBusy) return;
    setAiBusy(true);
    setAiNote("");
    const facts = {
      serviceType: req.serviceType, requester: req.owner, traveller: req.beneficiary || req.owner,
      from: req.serviceDateFrom, to: req.serviceDateTo, requiredBy: req.requiredDate,
      department: req.department, vendor: req.vendor, budget: req.budget,
      chargedTo: req.chargeTo === "project" ? `Project ${req.projectName || ""} (Network ${req.network || "?"}, Activity ${req.activity || "?"})` : req.chargeTo === "cost_center" ? `Cost center ${req.costCenter || ""}` : "",
      emailSummary: req.emailSummary || "", notes: (req.notes || "").slice(0, 1500),
      ...(mode === "PO" && prExists ? { basedOnPR: req.prNumber } : {}),
    };
    const prompt = [
      `Write the Header Note for an SAP ${mode === "PO" ? "Purchase Order" : "Purchase Requisition"} from these request details.`,
      "Professional English, 2-4 sentences, plain text only (no bullets, no markdown, no greeting).",
      "Say what service is required, for whom, the dates and number of days/nights, the project/department, the supplier if known, and who requested it.",
      "Use only the facts given; leave out anything that is empty. Dates as DD.MM.YYYY.",
      "",
      JSON.stringify(facts),
    ].join("\n");
    try {
      await sample(prompt, { onText: ({ text }) => setAiNote(text) });
    } catch (e) {
      setAiNote(e.text || "");
      const m = sampleErrorText(e);
      if (m) appToast(m);
    } finally {
      setAiBusy(false);
    }
  };

  const tab = (id, label) => (
    <button
      type="button"
      onClick={() => { setMode(id); setAiNote(""); }}
      className="text-sm font-semibold px-4 py-1.5"
      style={{
        borderRadius: 999,
        border: "none",
        cursor: "pointer",
        background: mode === id ? "linear-gradient(135deg, #3D5AFE, #6C7CFF)" : "transparent",
        color: mode === id ? "#fff" : "var(--sap-gray)",
      }}
    >
      {label}
    </button>
  );
  const chargeRows = req.chargeTo === "project" ? (
    <>
      <CopyRow label="Network" value={req.network} hint={!req.network ? "⛔ Required — ask the requester" : "Project account assignment"} />
      <CopyRow label="Activity" value={req.activity} hint={!req.activity ? "⛔ Required — ask the requester" : ""} />
      {req.projectName && <CopyRow label="Project" value={req.projectName} hint="For reference" />}
    </>
  ) : req.chargeTo === "cost_center" ? (
    <CopyRow label="Cost Center" value={req.costCenter} hint={!req.costCenter ? "Enter the cost center on the SAP screen" : ""} />
  ) : (
    <div className="p-2 text-xs my-1" style={{ background: "var(--sap-amber-bg)", border: "1px solid #F5DFA6", borderRadius: 8, color: "var(--sap-amber)" }}>
      ⚠ Not set whether this is charged to a Project (Network + Activity) or a Cost Center — set it in Update Status.
    </div>
  );
  const headerNote = aiNote || (mode === "PO" && prExists ? `${buildHeaderNote(req)} Based on approved PR ${req.prNumber}.` : buildHeaderNote(req));
  const noteButton = sample && (
    <div className="flex justify-end mb-1">
      <button type="button" onClick={writeNoteWithAi} disabled={aiBusy} className="sap-link">
        {aiBusy ? "✨ Writing…" : aiNote ? "✨ Rewrite with AI" : "✨ Write a better Header Note with AI"}
      </button>
    </div>
  );
  const pgrRow = (
    <CopyRow
      label="Purchasing Group"
      value={pgrCode ? `${pgrCode} — ${req.department}` : ""}
      hint={!req.department ? "Set the Department field on this request first" : (!pgrCode ? "No matching SAP code for this department" : "")}
    />
  );

  return (
    <div className="flex flex-col gap-1">
      <div className="flex items-center gap-1 p-1 mb-3 self-start" style={{ background: "#F1F3F9", borderRadius: 999 }}>
        {tab("PR", "1 · Purchase Requisition")}
        {tab("PO", "2 · Purchase Order")}
        {tab("SES", `3 · ${receiptTypeFor(req) === "GR" ? "Goods Receipt" : receiptTypeFor(req) === "SES" ? "Service Entry Sheet" : "SES / GR"}`)}
      </div>

      {mode === "PR" && (
        <>
          {req.prRaisedBy === "requester" && prExists && (
            <div className="p-3 text-sm mb-2" style={{ background: "var(--sap-amber-bg)", border: "1px solid #F5DFA6", borderRadius: 10, color: "var(--sap-amber)" }}>
              ⚠️ PR <strong>{req.prNumber}</strong> was already raised by the requester — don't create it again. Use the <strong>Purchase Order</strong> tab once it's approved.
            </div>
          )}
          <p className="text-sm mb-2" style={{ color: "var(--sap-gray)" }}>
            Copy each field below, then paste it into the matching column on the SAP "Create Purchase Requisition" screen.
          </p>
          <CopyRow label="Header Note" value={headerNote} hint={aiNote ? "✨ Written by AI" : "Paste into the Texts / Header Note box"} multiline />
          {noteButton}
          <CopyRow label="Short Text" value={shortText} />
          <CopyRow label="Delivery Date" value={toSapDate(req.serviceDateFrom || req.requiredDate)} />
          <CopyRow label="Vendor" value={req.vendor} />
          <CopyRow label="Requisnr." value={req.owner} hint="Requester" />
          <CopyRow label="Quantity" value="1" />
          {pgrRow}

              </div>

              </div>
            ) : null}
            <p className="text-sm mb-2" style={{ color: "var(--sap-gray)" }}>
              Post the {receiptLabel(req)} against the PO in SAP and attach the invoice, so Finance can pay the supplier.
            </p>
            <CopyRow label="PO Number" value={req.poNumber} />
            <CopyRow label="Vendor" value={req.vendor} />
            <CopyRow label="Invoice No." value={req.invoiceNumber || ""} hint={!req.invoiceNumber ? "Not recorded yet" : ""} />
            <CopyRow label="Invoice Date" value={req.invoiceDate ? toSapDate(req.invoiceDate) : ""} hint="Date the invoice arrived" />
            <CopyRow label="Amount" value={req.invoiceAmount || req.finalAmount || ""} />
            <CopyRow label="Short Text" value={`${receiptShort(req)} - ${shortText}`} />
            {chargeRows}
            <div className="p-3 text-xs mt-3" style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-gray)" }}>
              {invoices.length
                ? <>Invoice file{invoices.length > 1 ? "s" : ""} to attach in SAP: <strong>{invoices.map((a) => a.name).join(", ")}</strong> (open it from 📎 Files in the table).</>
                : <>No invoice file attached here yet — attach it under <strong>Invoice received</strong> so it's on hand for SAP.</>}
              {" "}Then tick the box in the table (or <strong>Invoice → Service Entry Sheet / GR</strong>) to close the PO.
            </div>
          </>
        );
      })()}

      <div className="flex justify-end pt-3">
        <button type="button" onClick={onClose} className="sap-btn sap-btn-blue">Done</button>
      </div>
    </div>
  );
}

// Compact one-line-per-request view of the tracker for the assistant's prompt:
// only the fields worth reasoning over, long free text trimmed, newest first,
// and capped so the whole prompt stays well inside the 64 KiB limit.
function requestsForAssistant(requests) {
  const rows = [...requests]
    .sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")))
    .map((r) => ({
      pr: r.prNumber || "", prBy: r.prRaisedBy === "requester" ? "requester" : "me", po: r.poNumber || "", requester: r.owner || "", for: r.beneficiary || "",
      service: r.serviceType || "", vendor: r.vendor || "", status: r.status || "",
      dept: r.department || "", charge: r.chargeTo || "", project: r.projectName || "", network: r.network || "", activity: r.activity || "", costCenter: r.costCenter || "",
      missing: isOpenReq(r) ? requestGaps(r) : [], from: r.serviceDateFrom || "", to: r.serviceDateTo || "",
      requiredBy: r.requiredDate || "", budget: r.budget || "", ses: !!r.serviceEntrySheet,
      invoiceReceived: r.invoiceDate || "", invoiceNo: r.invoiceNumber || "",
      afterPo: (() => { const g = grSesState(r); return g.stage === "due" ? `${receiptShort(r)} due ${g.due}${g.overdue ? " (OVERDUE)" : ""}` : g.stage; })(),
      files: (r.attachments || []).length, created: String(r.createdAt || "").slice(0, 10),
      summary: (r.emailSummary || "").slice(0, 160),
    }));
  let out = "";
  for (const row of rows) {
    const line = JSON.stringify(row) + "\n";
    if (out.length + line.length > 40000) break;
    out += line;
  }
  return { text: out, shown: out ? out.trim().split("\n").length : 0, total: rows.length };
}

function AssistantChat({ requests }) {
  const sample = useSample();
  const [turns, setTurns] = useState([]); // [{role, content}]
  const [draft, setDraft] = useState("");
  const [busy, setBusy] = useState(false);
  const [live, setLive] = useState("");
  const ctlRef = useRef(null);
  const endRef = useRef(null);

  useEffect(() => { if (endRef.current) endRef.current.scrollIntoView({ block: "end" }); }, [turns, live]);

  const [showKey, setShowKey] = useState(false);
  const apiMode = !!(sample && sample.mode === "api");

  if (!sample || showKey) {
    return <AiKeySetup onDone={sample ? () => setShowKey(false) : null} />;
  }

  const send = async (text) => {
    const msg = (text || draft).trim();
    if (!msg || busy) return;
    const data = requestsForAssistant(requests);
    const rules = [
      "You are the assistant built into a PR/PO tracker used by a procurement coordinator (hotels, car rentals, tickets for staff travel; requests become SAP Purchase Requisitions then POs).",
      `Today is ${todayIso()}. Company flow: PR (Purchase Requisition) → PR approval → PO (Purchase Order, created from the approved PR) → PO approval. Statuses: Pending (no PR yet — the coordinator must create it) → Waiting PR approval (PR exists, follow up its approval) → Waiting PO approval (PR approved; if "po" is empty the coordinator still has to create the PO) → Completed (or Cancelled). "prBy": "requester" means the PR arrived already raised by the requester (only follow up), "me" means the coordinator raises it. After the PO is approved and sent, the supplier's invoice arrives; from the day it arrives there are 14 days to post a Service Entry Sheet (SES, for services) or a Goods Receipt (GR, for material) in SAP with the invoice attached, so Finance can pay. "afterPo" shows that step: waiting_invoice, "SES/GR due <date>" (flag OVERDUE ones first), or done. "ses" = SES/GR done. "charge": "project" requests are charged to the project and need both "network" and "activity" before the PR/PO can be created; "cost_center" requests only need the cost center. "missing" lists what a request still lacks — always point these out and offer to draft the email asking for them.`,
      "Answer from the data below only — never invent requests, numbers or names. If the data can't answer, say so.",
      "Reply in the language the coordinator writes in (Arabic or English). Be concise and well-organized; use short lists when helpful. When asked to draft an email, SAP text or a message, write it ready to paste.",
      `Tracker data (${data.shown} of ${data.total} requests, newest first, one JSON object per line):`,
      data.text || "(no requests yet)",
    ].join("\n");
    const nextTurns = [...turns, { role: "user", content: msg }];
    setTurns(nextTurns);
    setDraft("");
    setLive("");
    setBusy(true);
    ctlRef.current = new AbortController();
    try {
      const { text: answer } = await sample([{ role: "user", content: rules }, ...nextTurns.slice(-12)], {
        cache: false,
        signal: ctlRef.current.signal,
        onText: ({ text }) => setLive(text),
      });
      setTurns((prev) => [...prev, { role: "assistant", content: answer }]);
    } catch (e) {
      const m = sampleErrorText(e);
      const kept = e.text || "";
      if (kept || m) setTurns((prev) => [...prev, { role: "assistant", content: kept + (m ? (kept ? "\n\n" : "") + "⚠️ " + m : "") }]);
    } finally {
      setLive("");
      setBusy(false);
    }
  };

  const bubble = (role, content, key) => (
    <div key={key} className={`flex ${role === "user" ? "justify-end" : "justify-start"}`}>
      <div
        className="text-sm px-4 py-2.5"
        dir="auto"
        style={{
          maxWidth: "85%",
          whiteSpace: "pre-wrap",
          borderRadius: role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
          background: role === "user" ? "linear-gradient(135deg, #3D5AFE, #6C7CFF)" : "#F4F6FB",
          color: role === "user" ? "#fff" : "var(--sap-text)",
          border: role === "user" ? "none" : "1px solid var(--sap-border)",
        }}
      >
        {content}
      </div>
    </div>
  );

  return (
    <div className="flex flex-col" style={{ height: "62vh" }}>
      <div className="flex-1 overflow-y-auto flex flex-col gap-2.5 pr-1">
        {turns.length === 0 && !busy && (
          <div className="flex flex-col items-center text-center gap-3 py-6">
            <div style={{ fontSize: 34 }}>🤖</div>
            <p className="text-sm" style={{ color: "var(--sap-gray)", maxWidth: 420 }}>
              Ask anything about your requests — what's pending, who's waiting on what, totals by department — or have it draft follow-ups and SAP text. Arabic or English.
            </p>
            <div className="flex flex-wrap justify-center gap-2">
              {ASSISTANT_STARTERS.map((s) => (
                <button key={s} type="button" onClick={() => send(s)} className="text-xs px-3 py-1.5" style={{ background: "#fff", border: "1px solid var(--sap-border)", borderRadius: 999, color: "var(--sap-text)", cursor: "pointer" }}>
                  {s}
                </button>
              ))}
            </div>
          </div>
        )}
        {turns.map((t, i) => bubble(t.role, t.content, i))}
        {busy && bubble("assistant", live || "Thinking…", "live")}
        <div ref={endRef} />
      </div>
      <div className="flex gap-2 pt-3" style={{ borderTop: "1px solid var(--sap-border)" }}>
        <input
          value={draft}
          dir="auto"
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } }}
          placeholder="Ask about your requests…"
          className="sap-input"
          style={{ flex: 1 }}
          disabled={busy}
        />
        {busy ? (
          <button type="button" onClick={() => ctlRef.current && ctlRef.current.abort()} className="sap-btn sap-btn-outline">Stop</button>
        ) : (
          <button type="button" onClick={() => send()} disabled={!draft.trim()} className="sap-btn sap-btn-blue">Send</button>
        )}
        {turns.length > 0 && !busy && (
          <button type="button" onClick={() => setTurns([])} className="sap-btn sap-btn-outline" title="Start a new conversation">New</button>
        )}
      </div>
      <div className="flex justify-between items-center gap-2 mt-1.5">
        <p className="text-xs" style={{ color: "var(--sap-gray)" }}>
          {apiMode ? "Runs on your Anthropic API key (billed to your API account)." : "Runs on your Claude account."} AI answers can be wrong — double-check before acting.
        </p>
        {apiMode && (
          <button type="button" onClick={() => setShowKey(true)} className="text-xs" style={{ background: "none", border: "none", color: "#3D5AFE", cursor: "pointer", whiteSpace: "nowrap" }}>🔑 API key</button>
        )}
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Desktop reminders every few hours
//
// A web page can't run once the browser is closed, but while the tracker is
// open — even in a background tab or a minimized window — it checks every
// minute and, every 3 or 4 hours during working hours, pops up a system
// notification listing what's still waiting on me. Where the browser blocks
// notifications (e.g. inside an embedded viewer), it falls back to the
// in-page popup, the voice reminder and a count in the tab title.
// ---------------------------------------------------------------------------
const REMINDER_PREFS_KEY = "prpo-desktop-reminders";
const REMINDER_LAST_KEY = "prpo-desktop-reminders-last";
const DEFAULT_REMINDER_PREFS = { hours: 0, workFrom: 7, workTo: 18, workdaysOnly: true, voice: true };

function loadReminderPrefs() {
  try { return { ...DEFAULT_REMINDER_PREFS, ...JSON.parse(localStorage.getItem(REMINDER_PREFS_KEY) || "{}") }; }
  catch (e) { return { ...DEFAULT_REMINDER_PREFS }; }
}
function saveReminderPrefs(p) { try { localStorage.setItem(REMINDER_PREFS_KEY, JSON.stringify(p)); } catch (e) { /* ignore */ } }
function readLastReminder() { try { return Number(localStorage.getItem(REMINDER_LAST_KEY) || 0); } catch (e) { return 0; } }
function writeLastReminder(t) { try { localStorage.setItem(REMINDER_LAST_KEY, String(t)); } catch (e) { /* ignore */ } }

function notificationSupport() {
  if (typeof window === "undefined" || !("Notification" in window)) return "unsupported";
  return Notification.permission; // "default" | "granted" | "denied"
}

// Fri/Sat weekend, as in Saudi Arabia.
function withinWorkingHours(prefs, d = new Date()) {
  if (prefs.workdaysOnly && (d.getDay() === 5 || d.getDay() === 6)) return false;
  const h = d.getHours() + d.getMinutes() / 60;
  return h >= prefs.workFrom && h < prefs.workTo;
}

function showDesktopNotification(title, body, onClick) {
  if (notificationSupport() !== "granted") return false;
  try {
    const n = new Notification(title, { body, tag: "prpo-reminder", renotify: true, requireInteraction: true });
    n.onclick = () => { try { window.focus(); } catch (e) { /* ignore */ } n.close(); if (onClick) onClick(); };
    return true;
  } catch (e) {
    return false;
  }
}
