// SAP wants dates as DD.MM.YYYY — this app stores them as ISO (YYYY-MM-DD).
function toSapDate(iso) {
  if (!iso) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  return m ? `${m[3]}.${m[2]}.${m[1]}` : iso;
}

function daysBetween(fromIso, toIso) {
  if (!fromIso || !toIso) return null;
  const diff = Math.round((new Date(toIso) - new Date(fromIso)) / 86400000);
  return diff >= 0 ? diff : null;
}

// The SAP "Header Note" is a free-text paragraph, not a short label — this
// spells the request out in full so whoever approves the PR doesn't have to
// guess who it's for, for how long, or which project it belongs to.
function buildHeaderNote(req) {
  const who = req.beneficiary || req.owner || "the traveller";
  const nights = daysBetween(req.serviceDateFrom, req.serviceDateTo);
  let duration = "";
  if (req.serviceDateFrom && req.serviceDateTo) {
    duration = ` for ${nights > 0 ? nights : 1} day(s) (${toSapDate(req.serviceDateFrom)} to ${toSapDate(req.serviceDateTo)})`;
  } else if (req.serviceDateFrom) {
    duration = ` on ${toSapDate(req.serviceDateFrom)}`;
  }
  const parts = [
    `This request requires a ${req.serviceType || "service"} booking for ${who}${duration}.`,
  ];
  if (req.department) parts.push(`Project/Department: ${req.department}.`);
  if (req.chargeTo === "project") {
    const ref = [req.projectName && `project ${req.projectName}`, req.network && `Network ${req.network}`, req.activity && `Activity ${req.activity}`].filter(Boolean).join(", ");
    parts.push(`Charged to the project${ref ? ` (${ref})` : ""}.`);
  } else if (req.chargeTo === "cost_center") {
    parts.push(`Charged to cost center${req.costCenter ? ` ${req.costCenter}` : ""}.`);

  if (req.vendor) parts.push(`Vendor: ${req.vendor}.`);
  parts.push(`Requested by: ${req.owner || "—"}.`);
  if (req.notes && req.notes.trim()) parts.push(`Notes: ${req.notes.trim().slice(0, 300)}`);
  return parts.join(" ");

// Grab-and-drag horizontal scroll for wide tables. Mouse only — touch
// already scrolls natively, and adding touch handlers here would fight it.
function useDragScroll() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let dragging = false;
    let startX = 0;
    let startScroll = 0;
    const onDown = (e) => {
      dragging = true;
      startX = e.pageX;
      startScroll = el.scrollLeft;
      el.classList.add("dragging");
    };
    const onMove = (e) => {
      if (!dragging) return;
      e.preventDefault();
      el.scrollLeft = startScroll - (e.pageX - startX);
    };
    const stop = () => {
      dragging = false;
      el.classList.remove("dragging");
    };
    el.addEventListener("mousedown", onDown);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", stop);
    return () => {
      el.removeEventListener("mousedown", onDown);
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", stop);
    };
  }, []);
  return ref;
}

// A fat, always-visible horizontal scrollbar drawn below the table and kept
// in sync with it both ways — the browser's native thin scrollbar is easy to
// miss entirely, this bar is not. Hidden once everything already fits.
function TableScrollbar({ targetRef }) {
  const trackRef = useRef(null);
  const [metrics, setMetrics] = useState({ thumbPct: 100, leftPct: 0, canScroll: false });
  const draggingRef = useRef(false);

  useEffect(() => {
    const el = targetRef.current;
    if (!el) return;
    const update = () => {
      const scrollable = el.scrollWidth - el.clientWidth;
      const thumbPct = Math.max((el.clientWidth / el.scrollWidth) * 100, 5);
      const leftPct = scrollable > 0 ? (el.scrollLeft / scrollable) * (100 - thumbPct) : 0;
      setMetrics({ thumbPct, leftPct, canScroll: scrollable > 2 });
    };
    update();
    el.addEventListener("scroll", update);
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => {
      el.removeEventListener("scroll", update);
      ro.disconnect();
    };
  }, [targetRef]);

  const scrollToClientX = (clientX) => {
    const el = targetRef.current;
    const track = trackRef.current;
    if (!el || !track) return;
    const rect = track.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    el.scrollLeft = ratio * (el.scrollWidth - el.clientWidth);
  };

  const onTrackDown = (e) => {
    draggingRef.current = true;
    scrollToClientX(e.clientX);
  };

  useEffect(() => {
    const onMove = (e) => { if (draggingRef.current) scrollToClientX(e.clientX); };
    const onUp = () => { draggingRef.current = false; };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
    return () => {
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    };
  }, []);

  if (!metrics.canScroll) return null;

  return (
    <div
      ref={trackRef}
      onMouseDown={onTrackDown}
      style={{ height: 14, background: "#EDEFF1", borderTop: "1px solid var(--sap-border)", position: "relative", cursor: "pointer" }}
      title="Drag to scroll the table left/right"
    >
      <div
        style={{
          position: "absolute",

          left: `${metrics.leftPct}%`,
          width: `${metrics.thumbPct}%`,

          background: "var(--sap-gray)",

  );
}

// Speaks a plain-language reminder out loud using the browser's built-in
// text-to-speech — no server, no API key, works offline. Browsers sometimes
// block the very first speech attempt on a page until the visitor has
// clicked/tapped somewhere, so callers should also expose a manual replay
// button rather than relying on this firing silently.
function speakReminder(text) {
  try {
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance !== "function") return false;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 0.98;
    window.speechSynthesis.speak(utter);
    return true;
  } catch (err) {
    return false;
  }
}

// ---------------------------------------------------------------------------
// AI assistant — Claude. Two ways to reach it, tried in this order:
//  1. Opened inside Claude (the shared link): the Artifact's "sample"
//     capability, running on the viewer's own Claude account.
//  2. Opened as a plain HTML file: the viewer's own Anthropic API key, which
//     they paste in once. The key is kept only in that browser's localStorage
//     — never written into this file — and usage is billed to their API account.
// With neither, every AI control stays hidden and the rule-based features
// keep working on their own.
// ---------------------------------------------------------------------------
const AI_KEY_STORE = "prpo-anthropic-api-key";
const AI_MODEL = "claude-opus-5-5";
const ANTHROPIC_SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm";

  try { return localStorage.getItem(AI_KEY_STORE) || ""; } catch (e) { return ""; }
}

    if (key) localStorage.setItem(AI_KEY_STORE, key);
    else localStorage.removeItem(AI_KEY_STORE);
  } catch (e) { /* storage blocked — the key just won't persist */ }
  _aiListeners.forEach((fn) => fn());

let _claudeSamplePromise = null;
function getClaudeSample() {
  if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
  if (!_claudeSamplePromise) _claudeSamplePromise = Promise.resolve(window.claude.use("sample")).catch(() => null);
  return _claudeSamplePromise;
}

let _apiSample = null; // { key, fn }
async function getSample() {
  const viaClaude = await getClaudeSample();
  if (viaClaude) return viaClaude;
  const key = readApiKey();
  if (!key) return null;
  if (!_apiSample || _apiSample.key !== key) _apiSample = { key, fn: makeApiSample(key) };
  return _apiSample.fn;
}

function useSample() {
  const [fn, setFn] = useState(null);
  useEffect(() => {
    let alive = true;
    const refresh = () => getSample().then((s) => { if (alive) setFn(() => s); });
    refresh();
    _aiListeners.add(refresh);
    return () => { alive = false; _aiListeners.delete(refresh); };
  }, []);
  return fn;
}

// --- API-key mode: the official Anthropic SDK, loaded only when first used ---
let _sdkPromise = null;
function loadAnthropicSdk() {
  if (!_sdkPromise) {
    // Function-wrapped so the in-page JSX compiler leaves the dynamic import alone.
    _sdkPromise = new Function("u", "return import(u)")(ANTHROPIC_SDK_URL)
      .then((m) => m.default || m.Anthropic)
      .catch((e) => { _sdkPromise = null; throw e; });
  }
  return _sdkPromise;
}

// The sample capability accepts a string or a list of turns; the API wants
// alternating turns that start and end with the user.
function toApiMessages(input) {
  const turns = typeof input === "string" ? [{ role: "user", content: input }] : input || [];
  const out = [];
  for (const t of turns) {
    const role = t.role === "assistant" ? "assistant" : "user";
    const content = String(t.content || "").trim();
    if (!content) continue;
    const last = out[out.length - 1];
    if (last && last.role === role) last.content += "\n\n" + content;
    else out.push({ role, content });
  }
  while (out.length && out[0].role !== "user") out.shift();
  while (out.length && out[out.length - 1].role !== "user") out.pop();
  return out;
}

function apiError(e, text) {
  if (e && e.code && !e.status) return { ...e, text: e.text || text || "" };
  const name = String((e && e.name) || (e && e.constructor && e.constructor.name) || "");
  const status = e && e.status;
  const msg = String((e && e.message) || "");
  let code = "failed";
  if (/abort/i.test(name) || /aborted/i.test(msg)) code = "cancelled";
  else if (status === 401 || status === 403) code = "invalid_key";
  else if (/credit balance/i.test(msg)) code = "no_credit";
  else if (status === 429) code = "rate_limited";
  else if (status === 529 || status === 503 || /overloaded/i.test(msg)) code = "overloaded";
  else if (status === 413 || (status === 400 && /too long|too large|exceed/i.test(msg))) code = "prompt_too_large";
  else if (!status) code = "network";
  return { code, message: msg, text: text || "" };
}

function parseJsonReply(text) {
  const t = String(text || "").trim().replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/, "").trim();
  try { return JSON.parse(t); } catch (e) { /* fall through */ }
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* fall through */ } }
  return undefined;
}

function makeApiSample(apiKey) {
  const run = async (input, opts = {}) => {
    const { onText, signal } = opts;
    let text = "";
    try {
      const messages = toApiMessages(input);
      if (!messages.length) throw { code: "failed", message: "Nothing to send." };
      const Anthropic = await loadAnthropicSdk();
      const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
      const stream = client.beta.messages.stream(
        {
          model: AI_MODEL,
          max_tokens: 16000,
          thinking: { type: "adaptive" },
          // If Claude declines a request, the API retries it on Anthropic's
          // recommended fallback model instead of returning a refusal.
          betas: ["server-side-fallback-2026-07-01"],
          fallbacks: "default",
          messages,
        },
        { signal }
      );
      stream.on("text", (delta) => {
        text += delta;
        if (onText) onText({ text, delta });
      });
      const msg = await stream.finalMessage();
      const finalText = (msg.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
      if (msg.stop_reason === "refusal") throw { code: "refused", text: finalText };
      if (onText && finalText !== text) onText({ text: finalText, delta: "" });
      return { text: finalText, truncated: msg.stop_reason === "max_tokens" };
    } catch (e) {
      throw apiError(e, text);
    }
  };
  run.json = async (input, opts = {}) => {
    const turns = typeof input === "string" ? [{ role: "user", content: input }] : [...(input || [])];
    turns.push({ role: "user", content: "Reply with the JSON value only — no prose, no code fences." });
    const { text } = await run(turns, opts);
    const parsed = parseJsonReply(text);
    if (parsed === undefined) throw { code: "invalid_json", text };
    return parsed;
  };
  run.mode = "api";
  return run;
}

// Native window.confirm()/alert() are blocked (or silently return falsy
// instantly) inside a sandboxed iframe such as the Artifacts viewer, which
// made destructive actions like Delete silently no-op. These in-app
// replacements work the same everywhere — the artifact link and a plain
// local HTML file alike.
let _confirmSetter = null;
let _confirmResolve = null;
function registerConfirmSetter(setter) { _confirmSetter = setter; }
function appConfirm(message) {
  return new Promise((resolve) => {
    _confirmResolve = resolve;
    _confirmSetter({ open: true, message });
  });
}

let _toastSetter = null;
function registerToastSetter(setter) { _toastSetter = setter; }
function appToast(message) {
  _toastSetter({ id: uid(), message });
}

function ConfirmHost() {
  const [state, setState] = useState({ open: false, message: "" });
  useEffect(() => { registerConfirmSetter(setState); }, []);

  const respond = (result) => {
    setState({ open: false, message: "" });
    if (_confirmResolve) { _confirmResolve(result); _confirmResolve = null; }
  };

  if (!state.open) return null;
  return (
    <div className="sap-modal-overlay fixed inset-0 flex items-center justify-center z-[200] p-4" onClick={() => respond(false)}>
      <div className="sap-modal w-full max-w-sm" onClick={(e) => e.stopPropagation()}>
        <div className="p-5">
          <p className="text-sm" style={{ color: "var(--sap-text)" }}>{state.message}</p>
          <div className="flex justify-end gap-2 pt-4">
            <button onClick={() => respond(false)} className="sap-btn sap-btn-outline">Cancel</button>
            <button onClick={() => respond(true)} className="sap-btn sap-btn-blue">Confirm</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ToastHost() {
  const [toasts, setToasts] = useState([]);
  useEffect(() => {
    registerToastSetter((toast) => {
      setToasts((prev) => [...prev, toast]);
      setTimeout(() => setToasts((prev) => prev.filter((t) => t.id !== toast.id)), 4000);
    });
  }, []);

  if (toasts.length === 0) return null;
  return (
    <div className="fixed bottom-4 z-[200] flex flex-col gap-2" style={{ insetInlineEnd: 16 }}>
      {toasts.map((t) => (
        <div key={t.id} className="sap-card px-4 py-3 text-sm shadow-lg" style={{ background: "#fff", color: "var(--sap-text)", maxWidth: 320 }}>
          {t.message}
        </div>
      ))}
    </div>
  );
}

// Requests saved under the older 6-stage status list ("Processing", "Approved",
// "PO Issued") still carry those exact strings — since STATUS_LABELS and
// STATUS_INLINE_STYLE only know the current 5 stages, an unmigrated record
// would render a blank badge and fall through every workflow check. This maps
// old values onto their closest current stage the moment a request is read,
// so existing data displays and behaves correctly without a one-time script.
const LEGACY_STATUS_MAP = {
  "Processing": "Waiting PR approval",
  "Approved": "Waiting PO approval",
  "PO Issued": "Waiting PO approval",
};

function normalizeStatus(req) {
  const mapped = LEGACY_STATUS_MAP[req.status];
  return mapped ? { ...req, status: mapped } : req;
}

function loadRequests() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw).map(normalizeStatus) : [];
  } catch (e) {
    return [];
  }
}

function saveRequests(requests) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(requests));
    return true;
  } catch (e) {
    // Never fail quietly: a tracker that silently stops recording is worse
    // than one that refuses loudly.
    console.error("Failed to save to localStorage", e);
    const full = e && (e.name === "QuotaExceededError" || e.code === 22 || e.code === 1014);
    appToast(
      full
        ? "This browser's storage is full, so the last change was NOT saved. Export to Excel, then delete some old requests or their attachments."
        : "The last change could not be saved to this browser: " + (e && e.message ? e.message : e)
    );
    return false;
  }
}

// ---------------------------------------------------------------------------
// Optional shared database — real collaboration when opened via the
// Artifact link (window.claude.use("db")). Every viewer of that same link
// then reads and writes the same "requests" collection live. It is a
// no-op everywhere else (a local HTML file, GitHub Pages): window.claude
// doesn't exist there, so the app quietly falls back to the private,
// per-browser localStorage behaviour it always had — nobody loses the
// "fully local" option by this being added.
//
// Attachment BYTES are deliberately excluded from what gets shared: a
// document in this store is capped at 256 KiB, far under a real PDF/.msg.
// Only their name, size and any extracted text travel to the shared
// database (small, and already what search needs); the actual file stays
// in this browser's IndexedDB and only opens on the device that added it.
// ---------------------------------------------------------------------------
const SHARED_MIGRATION_KEY = "po_pr_tracker_shared_migrated_v1";

function stripAttachmentForSharing(a) {
  return { name: a.name, type: a.type, size: a.size, blobId: a.blobId || null, text: a.text || "" };
}

// The db body must be a plain JSON object with no `undefined` values, and
// the platform doesn't know about React's synthetic id-vs-fields shape —
// this is the one place that translates a request to what actually gets
// written, so every write path (single, batch, import) stays consistent.
function sanitizeRequestForDb(req) {
  const clean = { ...req };
  delete clean.id; // the id is the document's path, never part of its body
  clean.attachments = (req.attachments || []).map(stripAttachmentForSharing);
  Object.keys(clean).forEach((k) => { if (clean[k] === undefined) clean[k] = ""; });
  return clean;
}

function docToRequest(doc) {
  return normalizeStatus({ ...doc.data(), id: doc.id });
}

// Runs once per browser: if the shared database is empty but this browser
// already has locally-saved requests, offer to bring them in rather than
// silently showing an empty table where real work used to be.
async function migrateLocalRequestsToSharedDb(db) {
  try {
    if (localStorage.getItem(SHARED_MIGRATION_KEY)) return;
    const existing = await db.collection("requests").limit(1).get();
    if (!existing.empty) { localStorage.setItem(SHARED_MIGRATION_KEY, "1"); return; }
    const local = loadRequests();
    if (!local.length) { localStorage.setItem(SHARED_MIGRATION_KEY, "1"); return; }
    const proceed = await appConfirm(
      `This browser has ${local.length} request(s) saved locally, from before sharing was turned on. ` +
      `Upload them to the shared database so your colleague can see them too?`
    );
    localStorage.setItem(SHARED_MIGRATION_KEY, "1");
    if (!proceed) return;
    for (const r of local) {
      await db.collection("requests").doc(r.id || uid()).set(sanitizeRequestForDb(r));
    }
    appToast(`Uploaded ${local.length} request(s) to the shared database`);
  } catch (err) {
    console.error("Local-to-shared migration failed:", err);
  }
}

function daysSince(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

function isOverdue(req) {
  if (!req.requiredDate || req.status === "Completed" || req.status === "Cancelled") return false;
  const req_d = new Date(req.requiredDate);
  const now = new Date();
  return req_d < now;
}

function getAlertLevel(req) {
  if (req.status === "Completed" || req.status === "Cancelled") return null;
  if (isOverdue(req)) return "yellow";
  const pendingDays = daysSince(req.createdAt);
  if (req.status === "Pending" && pendingDays > 21) return "red";
  if (req.status === "Pending" && pendingDays > 7) return "orange";
  return null;
}

const ALERT_STYLES = {
  red: { rowStyle: { background: "var(--sap-red-bg)" }, dot: "var(--sap-red)", text: "var(--sap-red)", label: "Pending over 3 weeks" },
  orange: { rowStyle: { background: "var(--sap-orange-bg)" }, dot: "var(--sap-orange)", text: "var(--sap-orange)", label: "Pending over a week" },
  yellow: { rowStyle: { background: "var(--sap-amber-bg)" }, dot: "var(--sap-amber)", text: "var(--sap-amber)", label: "Overdue" },
};

const ACTION_SUGGESTIONS = {
  "Hotel": ["Contact the vendor", "Confirm availability", "Get the booking confirmation", "Create the PR in SAP and enter the PR number", "Issue the PO once approved", "Confirm the stay with the hotel"],
  "Car": ["Contact the rental company", "Confirm car and driver availability", "Confirm pickup time", "Create the PR in SAP and enter the PR number", "Issue the PO once approved", "Confirm the booking with the rental company"],
  "Tickets": ["Contact the travel agency", "Confirm seat availability and fares", "Create the PR in SAP and enter the PR number", "Issue the ticket after approval", "Issue the PO once approved"],
  "Other": ["Review request details with the requester", "Identify the right supplier", "Create the PR in SAP and enter the PR number", "Issue the PO after approval"],
};

const SERVICE_TYPE_PATTERNS = {
  "Hotel": /فندق|hotel|إقامة|غرفة|room|stay/,
  "Car": /سيارة|car|تأجير|ليموزين|rental|limo/,
  "Tickets": /تذكرة|تذاكر|ticket|طيران|رحلة|flight/,
};

// Single best guess — used where only one type is expected (e.g. Excel import).
function guessServiceType(text) {
  const t = text.toLowerCase();
  for (const type of ["Hotel", "Car", "Tickets"]) {
    if (SERVICE_TYPE_PATTERNS[type].test(t)) return type;
  }
  return "Other";
}

// One email can bundle several services at once (hotel + car + tickets for
// the same trip) — this returns every type mentioned, not just the first,
// so the parser can offer them as a multi-select instead of picking one.
function detectServiceTypes(text) {
  const t = text.toLowerCase();
  const found = ["Hotel", "Car", "Tickets"].filter((type) => SERVICE_TYPE_PATTERNS[type].test(t));
  return found.length ? found : ["Other"];
}

// Learns the vendors you've actually used before, per service type — no external API
function getKnownVendors(requests, serviceType) {
  const counts = {};
  requests
    .filter((r) => r.vendor && r.vendor.trim() && (!serviceType || r.serviceType === serviceType))
    .forEach((r) => {
      const v = r.vendor.trim();
      counts[v] = (counts[v] || 0) + 1;
    });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([vendor]) => vendor);
}

// Same idea for the request owner: the regex guess on free-form email text is
// unreliable (it can grab a signature line like "Content Safety" instead of
// the actual requester), so a name you've used before always wins over it.
function getKnownOwners(requests) {
  const counts = {};
  requests
    .filter((r) => r.owner && r.owner.trim())
    .forEach((r) => {
      const o = r.owner.trim();
      counts[o] = (counts[o] || 0) + 1;
    });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([owner]) => owner);
}

function getKnownBeneficiaries(requests) {
  const counts = {};
  requests
    .filter((r) => r.beneficiary && r.beneficiary.trim())
    .forEach((r) => {
      const b = r.beneficiary.trim();
      counts[b] = (counts[b] || 0) + 1;
    });
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([name]) => name);
}

function matchKnownInText(text, knownValues) {
  const t = text.toLowerCase();
  return knownValues.find((v) => t.includes(v.toLowerCase())) || "";
}

const MONTH_WORD = "(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*";

function monthNumberFromWord(word) {
  const idx = MONTHS_EN_SHORT.indexOf(String(word).slice(0, 3).toLowerCase());
  return idx === -1 ? null : idx + 1;
}

function toIsoDate(year, month, day) {
  if (!year || !month || !day) return "";
  const y = String(year).length === 2 ? "20" + year : String(year);
  return `${y}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

// Travel emails write the stay as a range far more often than as one date:
// "10-15 Jan 2026", "12/1/26 - 15/1/26", "2026-01-10 to 2026-01-15". Reading
// both ends matters because an invoice months later quotes those dates.
function extractServiceDates(text) {
  const thisYear = new Date().getFullYear();

  // "10 - 15 Jan 2026"  /  "10-15 January"
  let m = text.match(new RegExp(`(\\d{1,2})\\s*[-–—/]\\s*(\\d{1,2})\\s+(${MONTH_WORD})\\.?\\s*(\\d{2,4})?`, "i"));
  if (m) {
    const month = monthNumberFromWord(m[3]);
    const year = m[4] || thisYear;
    if (month) return { from: toIsoDate(year, month, m[1]), to: toIsoDate(year, month, m[2]) };
  }

  // "10 Jan - 15 Feb 2026"
  m = text.match(new RegExp(`(\\d{1,2})\\s+(${MONTH_WORD})\\.?\\s*(\\d{2,4})?\\s*[-–—]\\s*(\\d{1,2})\\s+(${MONTH_WORD})\\.?\\s*(\\d{2,4})?`, "i"));
  if (m) {
    const m1 = monthNumberFromWord(m[2]);
    const m2 = monthNumberFromWord(m[5]);
    const y2 = m[6] || m[3] || thisYear;
    const y1 = m[3] || y2;
    if (m1 && m2) return { from: toIsoDate(y1, m1, m[1]), to: toIsoDate(y2, m2, m[4]) };
  }

  // ISO range: "2026-01-10 to 2026-01-15"
  m = text.match(/(\d{4}-\d{2}-\d{2})\s*(?:to|until|[-–—])\s*(\d{4}-\d{2}-\d{2})/i);
  if (m) return { from: m[1], to: m[2] };

  // Numeric range: "11/1/26 - 06/2/26" (day first, as written locally)
  m = text.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})\s*[-–—]\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) return { from: toIsoDate(m[3], m[2], m[1]), to: toIsoDate(m[6], m[5], m[4]) };

  // A single ISO date is better than nothing.
  m = text.match(/(\d{4}-\d{2}-\d{2})/);
  if (m) return { from: m[1], to: "" };

  // Single "15 Jan 2026"
  m = text.match(new RegExp(`(\\d{1,2})\\s+(${MONTH_WORD})\\.?\\s*(\\d{2,4})`, "i"));
  if (m) {
    const month = monthNumberFromWord(m[2]);
    if (month) return { from: toIsoDate(m[3], month, m[1]), to: "" };
  }

  return { from: "", to: "" };
}

function extractFromEmail(text, knownVendors, knownOwners, knownBeneficiaries) {
  const prMatch = text.match(/PR[\s#:.-]*([0-9]{4,})/i);
  const budgetMatch = text.match(/(?:ميزانية|budget|المبلغ|amount)[^\d]{0,10}([\d,]+(?:\.\d+)?)/i);
  const ownerMatch = text.match(/(?:من|المسؤول|السيد|الأخ|الأخت|from|requester|attn)[\s:]+([؀-ۿa-zA-Z\s]{2,30}?)(?:\n|,|،|$)/i);
  const vendorMatch = text.match(/(?:الموردة?|المورد|Vendor|Supplier)[\s:]+([؀-ۿa-zA-Z0-9\s]{2,40}?)(?:\n|,|،|$)/i);
  // The traveller is usually introduced explicitly ("guest name:", "for Mr X",
  // "باسم ..."), which is a far more reliable signal than the sender line.
  const beneficiaryMatch = text.match(
    /(?:guest\s*name|traveller|traveler|passenger|for\s+(?:mr|mrs|ms|dr)\.?|المسافر|باسم|للسيد|للأخ|لصالح)[\s:.]+([؀-ۿa-zA-Z.\s]{2,40}?)(?:\n|,|،|-|\d|$)/i
  );

  const serviceType = guessServiceType(text);
  const learnedVendor = matchKnownInText(text, knownVendors || []);
  const learnedOwner = matchKnownInText(text, knownOwners || []);
  const learnedBeneficiary = matchKnownInText(text, knownBeneficiaries || []);
  const guessedOwner = ownerMatch ? ownerMatch[1].trim() : "";
  const guessedBeneficiary = beneficiaryMatch ? beneficiaryMatch[1].trim() : "";
  const serviceDates = extractServiceDates(text);

  return {
    prNumber: prMatch ? prMatch[1] : "",
    budget: budgetMatch ? budgetMatch[1].replace(/,/g, "") : "",
    requiredDate: "",
    serviceDateFrom: serviceDates.from,
    serviceDateTo: serviceDates.to,
    // Never trust the free-text guess blindly — only auto-fill when it matches
    // someone you've actually logged as an owner before; otherwise leave it
    // blank and require you to pick/type the real owner yourself.
    owner: learnedOwner,
    ownerNeedsConfirmation: !learnedOwner && !!guessedOwner,
    ownerGuess: guessedOwner,
    beneficiary: learnedBeneficiary || guessedBeneficiary,
    vendor: learnedVendor || (vendorMatch ? vendorMatch[1].trim() : ""),
    serviceType,
  };
}

// Plain-language brief of what an email is actually asking for — built from
// what was actually extracted, not a guess dressed up as one.
function summarizeEmail({ owner, beneficiary, selectedTypes, budget, requiredDate, serviceDateFrom, serviceDateTo, prNumber }) {
  const who = owner || "an unconfirmed requester";
  const services = selectedTypes.length ? selectedTypes.join(", ") : "no recognizable service";
  const forWhom = beneficiary && beneficiary.trim() && beneficiary.trim() !== (owner || "").trim()
    ? ` on behalf of ${beneficiary.trim()}`
    : "";
  const parts = [
    `Requested by ${who}${forWhom}: ${selectedTypes.length} service${selectedTypes.length === 1 ? "" : "s"} — ${services}.`,
  ];
  if (serviceDateFrom || serviceDateTo) {
    parts.push(serviceDateTo && serviceDateFrom
      ? `Service dates ${serviceDateFrom} → ${serviceDateTo}.`
      : `Service date ${serviceDateFrom || serviceDateTo}.`);
  }
  if (requiredDate) parts.push(`Needed by ${requiredDate}.`);
  if (budget) parts.push(`Mentioned budget: ${Number(budget).toLocaleString()}.`);
  parts.push(
    prNumber
      ? `A PR number was already mentioned (${prNumber}) — verify which of the ${selectedTypes.length > 1 ? "requests below it belongs to" : "request below it belongs to"}.`
      : `No PR number yet — you'll need to create ${selectedTypes.length > 1 ? "one PR per service" : "a PR"} in SAP and enter ${selectedTypes.length > 1 ? "each" : "its"} number once issued.`
  );
  return parts.join(" ");
}

// Requests split out of one email get a colour of their own, drawn as a stripe
// down the left edge of every row in the group. Colour alone never carries the
// meaning — each row also says "1 of 3 · same email" — but the stripe is what
// makes the grouping visible at a glance in a long list. These tones are kept
// clear of the status palette so they can't be mistaken for a state.
const BATCH_COLORS = ["#5B7F95", "#8A6A9E", "#3F7D6E", "#9A6B4F", "#4A6FA5", "#8B6D3F"];

function batchColorFor(batchId) {
  if (!batchId) return null;
  let hash = 0;
  for (let i = 0; i < batchId.length; i++) hash = (hash * 31 + batchId.charCodeAt(i)) >>> 0;
  return BATCH_COLORS[hash % BATCH_COLORS.length];
}

// ---------------------------------------------------------------------------
// After the PO: invoice → Goods Receipt / Service Entry Sheet (14 days)
//
// Once the PO is out, the supplier's invoice arrives some time later. From
// the day it arrives there are 14 days to post a Service Entry Sheet (for a
// service — hotel, car, tickets) or a Goods Receipt (for material) in SAP,
// with the invoice attached, so Finance can pay the supplier.
// ---------------------------------------------------------------------------
const GR_SES_DAYS = 14;
const RECEIPT_TYPES = {
  SES: { short: "SES", label: "Service Entry Sheet", icon: "🛎️", kind: "Service" },
  GR: { short: "GR", label: "Goods Receipt", icon: "📦", kind: "Material" },
};
function receiptTypeFor(req) {
  if (req.receiptType === "SES" || req.receiptType === "GR") return req.receiptType;
  return req.serviceType === "Other" ? "" : "SES"; // hotels, cars and tickets are services
}
function receiptShort(req) { const t = receiptTypeFor(req); return t ? RECEIPT_TYPES[t].short : "SES / GR"; }
function receiptLabel(req) { const t = receiptTypeFor(req); return t ? RECEIPT_TYPES[t].label : "Service Entry Sheet / Goods Receipt"; }
function addDaysIso(iso, n) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function signedDays(fromIso, toIso) {
  return Math.round((new Date(toIso + "T00:00:00") - new Date(fromIso + "T00:00:00")) / 86400000);
}
function localTodayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// "none" (PO not done yet) → "waiting_invoice" → "due" (clock running) → "done".
function grSesState(req) {
  if (req.status !== "Completed") return { stage: "none" };
  if (req.serviceEntrySheet) return { stage: "done" };
  if (!req.invoiceDate) return { stage: "waiting_invoice" };
  const due = addDaysIso(req.invoiceDate, GR_SES_DAYS);
  const daysLeft = signedDays(localTodayIso(), due);
  return { stage: "due", due, daysLeft, overdue: daysLeft < 0, soon: daysLeft >= 0 && daysLeft <= 3 };
}

// Rule-based first read of an invoice PDF's text.
function parseInvoiceText(text) {
  const t = String(text || "");
  const grab = (re) => { const m = t.match(re); return m ? m[1].trim() : ""; };
  const invoiceNumber =
    grab(/(?:tax\s+)?invoice\s*(?:no\.?|number|#|num)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/]{2,24})/i) ||
    grab(/(?:رقم الفاتورة)\s*[:\-]?\s*([A-Z0-9][A-Z0-9\-\/]{2,24})/i);
  const amount = grab(/(?:grand\s+total|total\s+amount|amount\s+due|net\s+amount|total\s+due|total|الإجمالي|المجموع|المبلغ الإجمالي)[^\d\n]{0,25}([\d,]+(?:\.\d{1,2})?)/i).replace(/,/g, "");
  const poNumber = grab(/(?:P\.?O\.?|purchase\s+order)\s*(?:no\.?|number|#)?\s*[:\-]?\s*(\d{6,12})/i);
  return { invoiceNumber, amount, poNumber };
}

function InvoiceModal({ req, startDone, onSave, onCancel }) {
  const sample = useSample();
  const [type, setType] = useState(receiptTypeFor(req) || "SES");
  const [receivedOn, setReceivedOn] = useState(req.invoiceDate || localTodayIso());
  const [invoiceNumber, setInvoiceNumber] = useState(req.invoiceNumber || "");
  const [amount, setAmount] = useState(req.invoiceAmount || "");
  const [files, setFiles] = useState([]); // new invoice files to attach
  const [done, setDone] = useState(!!startDone || !!req.serviceEntrySheet);
  const [docNumber, setDocNumber] = useState(req.grSesNumber || "");
  const [doneOn, setDoneOn] = useState(req.grSesDate || localTodayIso());
  const [reading, setReading] = useState(false);
  const [check, setCheck] = useState(null); // AI's cross-check of invoice vs. request
  const existingInvoices = (req.attachments || []).filter((a) => a.kind === "invoice");
  const hasInvoiceFile = existingInvoices.length > 0 || files.length > 0;
  const due = receivedOn ? addDaysIso(receivedOn, GR_SES_DAYS) : "";
  const left = due ? signedDays(localTodayIso(), due) : null;
  const T = RECEIPT_TYPES[type];

  const readInvoice = async (att) => {
    const text = att.text || "";
    if (!text.trim()) return;
    const rules = parseInvoiceText(text);
    if (rules.invoiceNumber) setInvoiceNumber((v) => v || rules.invoiceNumber);
    if (rules.amount) setAmount((v) => v || rules.amount);
    if (!sample) {
      if (rules.poNumber && req.poNumber && rules.poNumber !== String(req.poNumber).trim()) {
        setCheck({ ok: false, notes: [`The invoice mentions PO ${rules.poNumber}, but this request's PO is ${req.poNumber}.`] });
      }
      return;
    }
    setReading(true);
    try {
      const r = await sample.json([
        "Read this supplier invoice and check it against the purchase order it should belong to.",
        'Reply with ONLY this JSON: {"invoiceNumber":"","invoiceDate":"","amount":"","currency":"","vendor":"","poNumber":"","guest":"","issues":[""]}',
        "- amount: the total payable, digits and decimal point only. invoiceDate as YYYY-MM-DD. Use \"\" for anything not on the invoice; never guess.",
        "- issues: short plain notes on anything that doesn't match the PO details below (different PO number, supplier, traveller/guest name, dates, or an amount above the budget). Empty array if it all matches.",
        "",
        "PO details: " + JSON.stringify({ poNumber: req.poNumber, vendor: req.vendor, traveller: req.beneficiary || req.owner, from: req.serviceDateFrom, to: req.serviceDateTo, budget: req.budget, service: req.serviceType }),
        "",
        "INVOICE TEXT:",
        text.slice(0, 15000),
      ].join("\n"));
      const str = (v) => (typeof v === "string" ? v.trim() : typeof v === "number" ? String(v) : "");
      if (str(r.invoiceNumber)) setInvoiceNumber(str(r.invoiceNumber));
      if (str(r.amount)) setAmount(str(r.amount).replace(/[^\d.]/g, ""));
      const issues = Array.isArray(r.issues) ? r.issues.map(str).filter(Boolean).slice(0, 5) : [];
      setCheck({ ok: issues.length === 0, notes: issues, vendor: str(r.vendor), currency: str(r.currency), invoiceDate: str(r.invoiceDate) });
    } catch (e) {
      const m = sampleErrorText(e);
      if (m) appToast(m);
    } finally {
      setReading(false);
    }
  };

  const onFiles = async (e) => {
    const list = Array.from(e.target.files || []);
    e.target.value = "";
    for (const f of list) {
      const att = { ...(await ingestAttachment(f)), kind: "invoice" };
      setFiles((prev) => [...prev, att]);
      readInvoice(att);
    }
  };

  const save = async () => {
    if (!receivedOn) { appToast("Enter the date the invoice arrived."); return; }
    if (done && !hasInvoiceFile) {
      if (!(await appConfirm(`No invoice is attached. The ${T.label} in SAP needs the invoice — mark it done anyway?`))) return;
    }
    onSave({
      receiptType: type,
      invoiceDate: receivedOn,
      invoiceNumber: invoiceNumber.trim(),
      invoiceAmount: String(amount).trim(),
      finalAmount: req.finalAmount || String(amount).trim(),
      attachments: [...(req.attachments || []), ...files],
      serviceEntrySheet: done,
      grSesNumber: done ? docNumber.trim() : "",
      grSesDate: done ? doneOn : "",
    });
  };

  const typeBtn = (id) => {
    const on = type === id;
    const t = RECEIPT_TYPES[id];
    return (
      <button
        key={id}
        type="button"
        onClick={() => setType(id)}
        className="text-left p-3"
        style={{ borderRadius: 12, cursor: "pointer", flex: 1, background: on ? "#EEF1FF" : "#fff", border: `2px solid ${on ? "#3D5AFE" : "var(--sap-border)"}` }}
      >
        <div className="text-sm font-semibold" style={{ color: on ? "#3D5AFE" : "var(--sap-text)" }}>{t.icon} {t.kind} → {t.label}</div>
      </button>
    );
  };

  return (
    <div className="flex flex-col gap-4 text-sm">
      <div className="flex gap-2 flex-wrap">{typeBtn("SES")}{typeBtn("GR")}</div>

      <div className="p-3" style={{ background: "#fff", border: "1px solid var(--sap-border)", borderRadius: 14 }}>
        <p className="font-semibold mb-2" style={{ color: "var(--sap-text)" }}>🧾 The invoice</p>
        <div className="flex flex-wrap items-center gap-2 mb-3">
          <label className="sap-btn sap-btn-outline" style={{ cursor: "pointer" }}>
            📎 Attach invoice{sample ? " — AI reads it" : ""}
            <input type="file" accept=".pdf,image/*" multiple onChange={onFiles} style={{ display: "none" }} />
          </label>
          {[...existingInvoices, ...files].map((a, i) => (
            <span key={i} className="text-xs px-2 py-1" style={{ background: "#F1F3F9", borderRadius: 999 }}>📄 {a.name}</span>
          ))}
          {reading && <span className="text-xs font-semibold" style={{ color: "#3D5AFE" }}>✨ Reading the invoice…</span>}
        </div>
        {check && (
          <div className="p-2 mb-3 text-xs" style={{ borderRadius: 10, background: check.ok ? "var(--sap-green-bg)" : "var(--sap-amber-bg)", color: check.ok ? "var(--sap-green)" : "var(--sap-amber)", border: `1px solid ${check.ok ? "#BFE3CB" : "#F5DFA6"}` }}>
            {check.ok ? (
              <span className="font-semibold">✅ The invoice matches this PO{check.vendor ? ` (${check.vendor})` : ""}.</span>
            ) : (
              <>
                <p className="font-semibold mb-0.5">⚠️ Check before posting:</p>
                {check.notes.map((n, i) => <p key={i} dir="auto">• {n}</p>)}
              </>
            )}
          </div>
        )}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <div>
            <label className="sap-label">Invoice received on *</label>
            <input type="date" value={receivedOn} onChange={(e) => setReceivedOn(e.target.value)} className="sap-input" />
          </div>
          <div>
            <label className="sap-label">Invoice number</label>
            <input value={invoiceNumber} onChange={(e) => setInvoiceNumber(e.target.value)} className="sap-input" />
          </div>
          <div>
            <label className="sap-label">Amount{check && check.currency ? ` (${check.currency})` : ""}</label>
            <input value={amount} onChange={(e) => setAmount(e.target.value)} className="sap-input" />
          </div>
        </div>
        {due && !done && (
          <p className="mt-2 font-semibold" style={{ color: left < 0 ? "var(--sap-red)" : left <= 3 ? "var(--sap-amber)" : "var(--sap-blue-dark)" }}>
            ⏱ {T.label} due by {toSapDate(due)} — {left < 0 ? `${-left} day(s) overdue` : left === 0 ? "due today" : `${left} day(s) left`} (14 days from the invoice).
          </p>
        )}
      </div>

      <div className="p-3" style={{ background: done ? "var(--sap-green-bg)" : "#fff", border: `1px solid ${done ? "#BFE3CB" : "var(--sap-border)"}`, borderRadius: 14 }}>
        <label className="flex items-center gap-2 font-semibold" style={{ color: "var(--sap-text)", cursor: "pointer" }}>
          <input type="checkbox" checked={done} onChange={(e) => setDone(e.target.checked)} style={{ width: 18, height: 18 }} />
          ✅ {T.label} done in SAP (invoice attached there)
        </label>
        {done && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
            <div>
              <label className="sap-label">{T.short} document number (optional)</label>
              <input value={docNumber} onChange={(e) => setDocNumber(e.target.value)} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Done on</label>
              <input type="date" value={doneOn} onChange={(e) => setDoneOn(e.target.value)} className="sap-input" />
            </div>
          </div>
        )}
      </div>

      <div className="flex justify-end gap-2">
        <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
        <button type="button" onClick={save} disabled={reading} className="sap-btn sap-btn-blue">Save</button>
      </div>
    </div>
  );
}

// ---------------------------------------------------------------------------
// Who pays: a Cost Center or a Project
//
// A cost-center request is simply charged to that cost center. A project
// request is charged to the project itself, through its Network and Activity
// — and SAP won't take the PR (or the PO) without both, so they are hard
// requirements, chased from the moment the email arrives.
// ---------------------------------------------------------------------------
const CHARGE_TYPES = [
  { id: "cost_center", icon: "🏢", title: "Cost Center", hint: "Charged to the cost center — nothing else needed" },
  { id: "project", icon: "🏗️", title: "Project", hint: "Charged to the project — Network & Activity are required" },
];

function detectCharge(text) {
  const t = String(text || "");
  const grab = (re) => { const m = t.match(re); return m ? m[1].trim() : ""; };
  const network =
    grab(/\bnetwork\s*(?:no\.?|number|#|code)?\s*[:\-]?\s*([A-Z]{0,3}\d{4,12})\b/i) ||
    grab(/(?:رقم الشبكة|الشبكة|نتورك|النتورك)\s*[:\-]?\s*([A-Z]{0,3}\d{4,12})/i);
  const activity =
    grab(/\bactivity\s*(?:no\.?|number|#|code)?\s*[:\-]?\s*([A-Z]{0,3}\d{2,6})\b/i) ||
    grab(/(?:رقم النشاط|النشاط|اكتيفيتي|الاكتيفيتي)\s*[:\-]?\s*([A-Z]{0,3}\d{2,6})/i);
  const costCenter =
    grab(/\bcost\s*cent(?:er|re)\s*(?:no\.?|number|#|code)?\s*[:\-]?\s*([A-Z]{0,4}\d{3,10})\b/i) ||
    grab(/(?:مركز التكلفة|مركز تكلفة|كوست سنتر)\s*[:\-]?\s*([A-Z]{0,4}\d{3,10})/i);
  const projectName =
    grab(/\bproject\s*(?:name|no\.?|number|#|code)?\s*[:\-]\s*([^\n,;]{2,60})/i) ||
    grab(/(?:اسم المشروع|المشروع|مشروع)\s*[:\-]\s*([^\n،,;]{2,60})/i);
  const mentionsProject = !!(network || activity || projectName) || /\b(network|wbs)\b|\bproject\b|مشروع|نتورك|اكتيفيتي/i.test(t);
  const mentionsCC = !!costCenter || /cost\s*cent(?:er|re)|مركز (?:ال)?تكلفة|كوست سنتر/i.test(t);
  let chargeTo = "";
  if (network || activity) chargeTo = "project";
  else if (mentionsCC && !mentionsProject) chargeTo = "cost_center";
  else if (mentionsProject && !mentionsCC) chargeTo = "project";
  return { chargeTo, costCenter, projectName, network, activity };
}

// What a request still lacks before its PR can go into SAP — the same rule
// everywhere: intake, the table, Today's Follow-up and the status gate.
function requestGaps(req) {
  const gaps = [];
  if (!(req.serviceDateFrom || req.requiredDate)) gaps.push("Dates");
  if (!(req.department || "").trim()) gaps.push("Department");
  if (!req.chargeTo) gaps.push("Project or Cost Center");
  if (req.chargeTo === "project") {
    if (!(req.network || "").trim()) gaps.push("Network");
    if (!(req.activity || "").trim()) gaps.push("Activity");
  }
  if (req.status !== "Pending" && !(req.prNumber || "").trim()) gaps.push("PR number");
  return gaps;
}

function chargeLine(req) {
  if (req.chargeTo === "project") {
    const bits = [req.projectName, req.network && `NW ${req.network}`, req.activity && `Act ${req.activity}`].filter(Boolean);
    return `🏗️ Project${bits.length ? " · " + bits.join(" · ") : ""}`;
  }
  if (req.chargeTo === "cost_center") return `🏢 Cost Center${req.costCenter ? " · " + req.costCenter : ""}`;
  return "";
}

// One editor for the charge, used at intake, in New Request and in Update Status.
function ChargeFields({ value, onChange, compact }) {
  const v = value || {};
  const set = (k) => (e) => onChange({ ...v, [k]: e.target.value });
  const missingStyle = (x) => (!(x || "").trim() ? { borderColor: "var(--sap-red)", background: "#FFF7F8" } : undefined);
  return (
    <div className="flex flex-col gap-2">
      <div className={`grid grid-cols-1 ${compact ? "" : "md:"}grid-cols-2 gap-2`}>
        {CHARGE_TYPES.map((c) => {
          const on = v.chargeTo === c.id;
          return (
            <button
              key={c.id}
              type="button"
              onClick={() => onChange({ ...v, chargeTo: on ? "" : c.id })}
              className="text-left p-3"
              style={{
                borderRadius: 12,
                cursor: "pointer",
                background: on ? "#EEF1FF" : "#fff",
                border: `2px solid ${on ? "#3D5AFE" : "var(--sap-border)"}`,
              }}
            >
              <div className="text-sm font-semibold" style={{ color: on ? "#3D5AFE" : "var(--sap-text)" }}>{c.icon} {c.title}</div>
              {!compact && <div className="text-xs mt-0.5" style={{ color: "var(--sap-gray)" }}>{c.hint}</div>}
            </button>
          );
        })}
      </div>
      {v.chargeTo === "project" && (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
          <div>
            <label className="sap-label">Project (name / number)</label>
            <input value={v.projectName || ""} onChange={set("projectName")} className="sap-input" />
          </div>
          <div>
            <label className="sap-label">Network *</label>
            <input value={v.network || ""} onChange={set("network")} className="sap-input" style={missingStyle(v.network)} placeholder="Required" />
          </div>
          <div>
            <label className="sap-label">Activity *</label>
            <input value={v.activity || ""} onChange={set("activity")} className="sap-input" style={missingStyle(v.activity)} placeholder="Required" />
          </div>
        </div>
      )}
      {v.chargeTo === "project" && (!(v.network || "").trim() || !(v.activity || "").trim()) && (
        <p className="text-xs font-semibold" style={{ color: "var(--sap-red)" }}>⛔ The PR/PO can't be created without the Network and Activity — get them from the requester.</p>
      )}
      {v.chargeTo === "cost_center" && (
        <div style={{ maxWidth: 320 }}>
          <label className="sap-label">Cost Center (if given)</label>
          <input value={v.costCenter || ""} onChange={set("costCenter")} className="sap-input" />
        </div>
      )}
    </div>
  );
}

// ---------------------------------------------------------------------------
// "Ask for the missing info" — a ready-to-send, professional email to the
// person who sent the request, listing exactly what's missing. Claude writes
// it when available; otherwise a polished template does. Copy it, or open it
// straight in the email app.
// ---------------------------------------------------------------------------
const SIGNATURE_KEY = "prpo-signature";
const MISSING_ASKS = {
  "Traveller / for": { en: "The full name(s) of the traveller(s)/guest(s), as shown on their ID or passport", ar: "الاسم الكامل للمسافر/الضيف كما هو في الهوية أو جواز السفر" },
  "Service": { en: "The service required (hotel, car rental, flight tickets, etc.)", ar: "نوع الخدمة المطلوبة (فندق، تأجير سيارة، تذاكر طيران، إلخ)" },
  "Dates": { en: "The exact dates (check-in and check-out, or departure and return)", ar: "التواريخ المحددة (تاريخ الدخول والخروج، أو الذهاب والعودة)" },
  "Department": { en: "The department this request belongs to", ar: "القسم أو الإدارة التي يتبع لها الطلب" },
  "Charged to": { en: "Whether the cost is charged to a project or to a cost center", ar: "هل التكلفة على مشروع أم على مركز تكلفة (Cost Center)" },
  "Project or Cost Center": { en: "Whether the cost is charged to a project or to a cost center", ar: "هل التكلفة على مشروع أم على مركز تكلفة (Cost Center)" },
  "Project": { en: "The project name/number", ar: "اسم أو رقم المشروع" },
  "Network": { en: "The project Network number", ar: "رقم الـ Network الخاص بالمشروع" },
  "Activity": { en: "The Activity number under the project Network", ar: "رقم الـ Activity التابع للـ Network" },
  "PR number": { en: "The PR number already raised for this request", ar: "رقم طلب الشراء (PR) الذي تم رفعه لهذا الطلب" },
  "supplier": { en: "Your preferred supplier, if any", ar: "المورد المفضّل لديكم إن وُجد" },
};
function missingAsk(label, lang) {
  const key = /supplier$/i.test(label) ? "supplier" : /^PR number/.test(label) ? "PR number" : label;
  const m = MISSING_ASKS[key];
  return m ? m[lang] : label;
}

// "Al-Harbi, Sara <sara@x.com>" → { name: "Sara Al-Harbi", email: "sara@x.com" }
function parseEmailHeader(text) {
  const t = String(text || "");
  const fromLine = (t.match(/^From:\s*(.+)$/im) || [])[1] || "";
  const email = (fromLine.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/) || [])[0] || "";
  let name = fromLine.replace(/<[^>]*>/g, "").replace(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g, "").replace(/["'()]/g, "").trim();
  if (/^[^,]+,\s*[^,]+$/.test(name)) { const [last, first] = name.split(/,\s*/); name = `${first} ${last}`; }
  const subject = ((t.match(/^Subject:\s*(.+)$/im) || [])[1] || "").trim();
  return { name, email, subject };
}

function firstNameOf(name) {
  const clean = String(name || "").replace(/^(mr|mrs|ms|dr|eng)\.?\s+/i, "").trim();
  return clean.split(/\s+/)[0] || "";
}

function templateDraft({ lang, toName, facts, questions, missingLabels, blocker, signature }) {
  const first = firstNameOf(toName);
  const sig = signature || (lang === "ar" ? "منسق المشتريات" : "Procurement Coordinator");
  const svcAr = { Hotel: "حجز فندق", Car: "تأجير سيارة", Tickets: "حجز تذاكر", Other: "الخدمة" };
  const service = lang === "ar"
    ? String(facts.service || "").split(/\s*&\s*/).map((x) => svcAr[x] || x).filter(Boolean).join(" و")
    : (facts.service ? `${String(facts.service).toLowerCase().replace("tickets", "ticket")} booking` : "");
  const what = [service, facts.traveller && (lang === "ar" ? `لـ ${facts.traveller}` : `for ${facts.traveller}`), facts.dates && `(${facts.dates})`].filter(Boolean).join(" ");
  if (lang === "ar") {
    const list = missingLabels.map((l) => missingAsk(l, "ar"));
    return [
      `الأستاذ/ة ${toName || ""} المحترم/ة،`.replace("  ", " "),
      "",
      "تحية طيبة وبعد،",
      "",
      `نشكركم على طلبكم${what ? ` بخصوص ${what}` : ""}، وقد بدأنا في إجراءاته. ولاستكمال إجراءات رفع طلب الشراء (PR) في نظام SAP، نرجو التكرم بتزويدنا بالمعلومات التالية:`,
      "",
      ...list.map((q, i) => `${i + 1}. ${q}`),
      "",
      ...(blocker ? ["علماً بأنه لا يمكن إنشاء طلب الشراء بدون رقم الـ Network والـ Activity الخاصين بالمشروع.", ""] : []),
      "وسنباشر بإكمال الإجراءات فور استلامها.",
      "",
      "مع خالص التحية،",
      sig,
    ].join("\n");
  }
  const list = questions.length ? questions : missingLabels.map((l) => missingAsk(l, "en"));
  return [
    `Dear ${first || "Sir/Madam"},`,
    "",
    `Thank you for your request${what ? ` regarding the ${what}` : ""}. We have started processing it.`,
    "",
    "To proceed with raising the Purchase Requisition (PR) in SAP, could you please provide the following:",
    "",
    ...list.map((q, i) => `${i + 1}. ${q}`),
    "",
    ...(blocker ? ["Please note that the PR cannot be created without the project's Network and Activity numbers.", ""] : []),
    "We will proceed as soon as we receive these details.",
    "",
    "Kind regards,",
    sig,
  ].join("\n");
}

// ---------------------------------------------------------------------------
// Where the PR stands when a request email arrives
//
// The company flow is always PR → PR approval → PO → PO approval. A request
// email can land at any point of it: asking me to raise the PR, or with a PR
// the requester already raised (approved or not) that I only follow up and
// turn into a PO. The stage picked at intake sets the starting status, who
// it's waiting on and what the next step is.
// ---------------------------------------------------------------------------
const PR_STAGES = [
  { id: "none", icon: "🆕", title: "No PR yet — I'll create it", hint: "Starts as Pending · next: create the PR in SAP", status: "Pending", waitingOn: "Me", raisedBy: "me" },
  { id: "created", icon: "⏳", title: "PR already created — not approved yet", hint: "Starts as Waiting PR approval · next: follow up the approval", status: "Waiting PR approval", waitingOn: "SAP", raisedBy: "requester" },
  { id: "approved", icon: "✅", title: "PR already approved — create the PO", hint: "Starts as Waiting PO approval · next: create the PO from this PR", status: "Waiting PO approval", waitingOn: "Me", raisedBy: "requester" },
];
const PR_STAGE_BY_ID = Object.fromEntries(PR_STAGES.map((st) => [st.id, st]));

// Rule-based first guess, before anyone (or the AI) confirms it: a PR number
// in the email means the PR exists; "approved"/"released" near it means it's
// approved — unless the email says it's still pending/awaiting approval.
function detectPrStage(text, prNumber) {
  const t = String(text || "").toLowerCase();
  if (!prNumber && !/\bpr\b[^.\n]{0,40}(created|raised|approved|released|attached)|تم (إنشاء|انشاء|رفع|اعتماد) (ال)?pr/i.test(t)) return "none";
  const notYet = /not (yet )?(been )?approved|pending (for )?approval|awaiting (for )?approval|waiting (for )?(the )?approval|under approval|in approval|بانتظار (ال)?(موافقة|اعتماد)|لم (يتم|تتم|يعتمد)|قيد (ال)?(موافقة|اعتماد)/i;
  const done = /\bapproved\b|\breleased\b|fully approved|تمت (ال)?موافقة|تم (ال)?اعتماد|معتمد/i;
  if (notYet.test(t)) return "created";
  if (done.test(t)) return "approved";
  return "created";
}

// Tells the user exactly what to do next for this request, based on its
// current status and what's already filled in — the workflow guidance.
function getNextAction(req) {
  const byRequester = req.prRaisedBy === "requester";
  switch (req.status) {
    case "Pending":
      if (req.chargeTo === "project" && (!req.network || !req.activity))
        return "Get the Network & Activity from the requester — the PR can't be created without them";
      if (!req.chargeTo) return "Confirm whether this is charged to a Project or a Cost Center";
      if (!req.vendor) return "Choose a supplier, then create the PR in SAP (📋 Copy for SAP)";
      return "Create the PR in SAP (📋 Copy for SAP), then enter the PR number here";
    case "Waiting PR approval":
      if (!req.prNumber) return "Enter the PR number, then follow up its approval";
      return byRequester
        ? `PR ${req.prNumber} was raised by ${req.owner || "the requester"} — follow up its approval, then create the PO`
        : `Follow up the approval of PR ${req.prNumber}, then create the PO`;
    case "Waiting PO approval":
      if (!req.prNumber) return "Enter the approved PR number this PO is based on";
      if (!req.poNumber) return `PR ${req.prNumber} is approved — create the PO in SAP with reference to it (📋 Copy for SAP), then enter the PO number`;
      return "Waiting for PO approval — confirm booking/delivery once approved";
    case "Completed": {
      const g = grSesState(req);
      if (g.stage === "waiting_invoice") return "PO sent — when the supplier's invoice arrives, click 🧾 Invoice received";
      if (g.stage === "due") {
        return g.overdue
          ? `${receiptLabel(req)} is ${-g.daysLeft} day(s) overdue — post it in SAP with the invoice now`
          : `Post the ${receiptLabel(req)} in SAP with the invoice — due ${toSapDate(g.due)} (${g.daysLeft === 0 ? "today" : `${g.daysLeft} day(s) left`})`;
      }
      return `Closed — invoice received and ${receiptShort(req)} done`;
    }
    case "Cancelled":
      return "Cancelled — no action needed";
    default:
      return "";
  }
}
