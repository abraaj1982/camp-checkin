            const registeredLower = registered.map((v) => v.toLowerCase());
            const extraLearned = learned.filter((v) => !registeredLower.includes(v.toLowerCase()));
            const isUnregistered = entry.vendor.trim() && registered.length > 0 && !registeredLower.includes(entry.vendor.trim().toLowerCase());
            return (
              <div key={type} className="sap-card p-3" style={{ borderTop: "3px solid var(--sap-blue)" }}>
                <p className="font-semibold mb-2" style={{ color: "var(--sap-text)" }}>🧾 {type} request</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                  <div>
                    <label className="sap-label">Vendor / Supplier</label>
                    <input value={entry.vendor} onChange={(e) => updateEntry(type, { vendor: e.target.value })} className="sap-input" />
                    {(registered.length > 0 || extraLearned.length > 0) && (
                      <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                        <span className="text-xs" style={{ color: "var(--sap-gray)" }}>
                          {registered.length > 0 ? "Recommended (registered):" : "Usual vendors:"}
                        </span>
                        {registered.slice(0, 6).map((v) => (
                          <button
                            type="button"
                            key={v}
                            onClick={() => updateEntry(type, { vendor: v })}
                            className="text-xs px-2 py-0.5"
                            style={{ background: "var(--sap-green-bg)", border: "1px solid #BFE3CB", borderRadius: "10px", color: "var(--sap-green)" }}
                          >
                            ⭐ {v}
                          </button>
                        ))}
                        {extraLearned.slice(0, 4).map((v) => (
                          <button
                            type="button"
                            key={v}
                            onClick={() => updateEntry(type, { vendor: v })}
                            className="text-xs px-2 py-0.5"
                            style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-text)" }}
                          >
                            {v}
                          </button>
                        ))}
                      </div>
                    )}
                    {isUnregistered && (
                      <div className="mt-1.5 text-xs font-semibold flex items-center gap-2" style={{ color: "var(--sap-orange)" }}>
                        <span>⚠️ "{entry.vendor}" isn't on your registered {type} supplier list.</span>
                        <button type="button" onClick={() => registerSupplier(type, entry.vendor)} className="sap-link">+ Register it</button>
                      </div>
                    )}
                  </div>
                  <div>
                    <label className="sap-label">PR Number (if any)</label>
                    <input value={entry.prNumber} onChange={(e) => updateEntry(type, { prNumber: e.target.value })} className="sap-input" />
                  </div>
                </div>

                <p className="text-sm font-semibold mb-1" style={{ color: "var(--sap-blue-dark)" }}>💡 Suggested actions:</p>
                <ul className="space-y-1">
                  {entry.actionSteps.map((a, i) => (
                    <li key={i} className="flex items-center gap-2">
                      <span style={{ color: "var(--sap-blue)" }}>{i + 1}.</span>
                      <input
                        value={a}
                        onChange={(e) => updateStep(type, i, e.target.value)}
                        className="sap-input"
                        style={{ flex: 1 }}
                      />
                      <button type="button" onClick={() => removeStep(type, i)} className="sap-link-danger">Remove</button>
                    </li>
                  ))}
                </ul>
                <div className="flex gap-2 mt-2">
                  <input
                    value={entry.newStep}
                    onChange={(e) => updateEntry(type, { newStep: e.target.value })}
                    placeholder="Add a new action..."
                    className="sap-input"
                    style={{ flex: 1 }}
                  />
                  <button type="button" onClick={() => addStep(type)} className="sap-btn sap-btn-outline">+ Add</button>
                </div>
                <button type="button" onClick={() => saveActionsAsDefault(type)} className="mt-2 sap-link" style={{ display: "block" }}>
                  💾 Save this checklist as the default for "{type}" requests
                </button>
              </div>
            );
          })}

          <div>
            <label className="sap-label">Additional Notes (shared)</label>
            <textarea value={extracted.notes} onChange={(e) => setExtracted({ ...extracted, notes: e.target.value })} rows="3" className="sap-textarea"></textarea>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
            <button type="submit" className="sap-btn sap-btn-blue">
              Save {selectedTypes.length > 1 ? `${selectedTypes.length} Requests` : "Request"}
            </button>
          </div>
        </form>
      )}
    </div>
  );
}

function emptyForm() {
  return {
    id: null,
    prNumber: "",
    poNumber: "",
    owner: "",
    // Who the service is actually for — often not the person who asked.
    // Invoices arrive months later under this name, so it is the key that
    // makes them findable.
    beneficiary: "",
    department: "",
    serviceType: SERVICE_TYPES[0],
    vendor: "",
    budget: "",
    finalAmount: "",
    requiredDate: "",
    // The dates of the service itself (check-in/check-out, travel), as
    // distinct from the date the work has to be finished by.
    serviceDateFrom: "",
    serviceDateTo: "",
    completedDate: "",
    status: "Pending",
    waitingOn: "Me",
    stageSince: "",
    notes: "",
    attachments: [],
  };
}

function StatCard({ label, value, borderColor }) {
  return (
    <div className="sap-tile" style={{ borderTopColor: borderColor }}>
      <div className="sap-tile-value">{value}</div>
      <div className="sap-tile-label">{label}</div>
    </div>
  );
}

function RequestForm({ initial, onSave, onCancel, requests }) {
  const [form, setForm] = useState(initial || emptyForm());
  // Only a brand-new request can cover several services at once (its own
  // supplier/PR/PO per service, same as the email parser) — an existing
  // request is already tied to one service and stays a single edit.
  const [multiTypes, setMultiTypes] = useState(initial ? [initial.serviceType] : [form.serviceType]);

  const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });

  const toggleType = (type) => {
    setMultiTypes((prev) =>
      prev.includes(type) ? prev.filter((t) => t !== type) : [...prev, type]
    );
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.owner || multiTypes.length === 0) {
      appToast("Please enter the requester and select at least one service");
      return;
    }

    if (!initial && multiTypes.length > 1) {
      // Same shared fields, one tracked request per selected service — each
      // gets its own row so its own vendor/PR/PO/status can be set later.
      const forms = multiTypes.map((type) => ({ ...form, serviceType: type }));
      const clashes = forms
        .map((f) => ({ form: f, dup: findPossibleDuplicates(f, requests || [])[0] }))
        .filter((x) => x.dup);
      if (clashes.length) {
        const { form: f, dup } = clashes[0];
        const proceed = await appConfirm(
          `A ${f.serviceType} request for ${dup.beneficiary || dup.owner} already covers overlapping dates ` +
          `(${dup.serviceDateFrom || "?"} → ${dup.serviceDateTo || "?"}, status ${STATUS_LABELS[dup.status]}` +
          `${dup.poNumber ? `, PO ${dup.poNumber}` : ""}). Save these anyway?`
        );
        if (!proceed) return;
      }
      onSave(forms);
      return;
    }

    const singleForm = { ...form, serviceType: multiTypes[0] };
    const duplicates = findPossibleDuplicates(singleForm, requests || []);
    if (duplicates.length) {
      const d = duplicates[0];
      const proceed = await appConfirm(
        `A ${d.serviceType} request for ${d.beneficiary || d.owner} already covers overlapping dates ` +
        `(${d.serviceDateFrom || "?"} → ${d.serviceDateTo || "?"}, status ${STATUS_LABELS[d.status]}` +
        `${d.poNumber ? `, PO ${d.poNumber}` : ""}). Save this one anyway?`
      );
      if (!proceed) return;
    }
    onSave(singleForm);
  };

  return (
    <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label className="sap-label">Requester (who asked) *</label>
        <input value={form.owner} onChange={set("owner")} className="sap-input" required />
      </div>
      <div>
        <label className="sap-label">Beneficiary / traveller (who it's for)</label>
        <input
          value={form.beneficiary || ""}
          onChange={set("beneficiary")}
          className="sap-input"
          placeholder="Leave blank if same as the requester"
        />
      </div>
      <div>
        <label className="sap-label">Service start (check-in / departure)</label>
        <input type="date" value={form.serviceDateFrom || ""} onChange={set("serviceDateFrom")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Service end (check-out / return)</label>
        <input type="date" value={form.serviceDateTo || ""} onChange={set("serviceDateTo")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Department</label>
        <input value={form.department} onChange={set("department")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Waiting on</label>
        <select value={form.waitingOn || ""} onChange={set("waitingOn")} className="sap-select">
          <option value="">—</option>
          {WAITING_ON.map((w) => <option key={w} value={w}>{WAITING_ON_LABELS[w]}</option>)}
        </select>
      </div>
      <div>
        <label className="sap-label">
          Service Type * {!initial && <span className="font-normal" style={{ color: "var(--sap-gray)" }}>(check more than one if this request covers several services)</span>}
        </label>
        {initial ? (
          <select value={multiTypes[0]} onChange={(e) => setMultiTypes([e.target.value])} className="sap-select">
            {SERVICE_TYPES.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        ) : (
          <div className="flex flex-wrap gap-3 sap-input" style={{ height: "auto" }}>
            {SERVICE_TYPES.map((type) => (
              <label key={type} className="flex items-center gap-1.5 text-sm" style={{ color: "var(--sap-text)" }}>
                <input type="checkbox" checked={multiTypes.includes(type)} onChange={() => toggleType(type)} />
                {type}
              </label>
            ))}
          </div>
        )}
      </div>
      <div>
        <label className="sap-label">Vendor</label>
        <input value={form.vendor} onChange={set("vendor")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Budget</label>
        <input type="number" value={form.budget} onChange={set("budget")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Final Amount</label>
        <input type="number" value={form.finalAmount} onChange={set("finalAmount")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Required Date</label>
        <input type="date" value={form.requiredDate} onChange={set("requiredDate")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Completed Date</label>
        <input type="date" value={form.completedDate} onChange={set("completedDate")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">PR Number</label>
        <input value={form.prNumber} onChange={set("prNumber")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">PO Number</label>
        <input value={form.poNumber} onChange={set("poNumber")} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Status</label>
        <select value={form.status} onChange={set("status")} className="sap-select">
          {STATUSES.map((s) => <option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
        </select>
      </div>
      <div className="md:col-span-2">
        <label className="sap-label">Notes</label>
        <textarea value={form.notes} onChange={set("notes")} rows="3" className="sap-textarea"></textarea>
      </div>
      <div className="md:col-span-2">
        <AttachmentPicker attachments={form.attachments} onChange={(attachments) => setForm({ ...form, attachments })} />
      </div>
      <div className="md:col-span-2 flex justify-end gap-2 pt-2">
        <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
        <button type="submit" className="sap-btn sap-btn-blue">Save Request</button>
      </div>
    </form>
  );
}

function StatusUpdateForm({ req, onSave, onCancel }) {
  const [status, setStatus] = useState(req.status);
  const [prNumber, setPrNumber] = useState(req.prNumber);
  const [poNumber, setPoNumber] = useState(req.poNumber);
  const [notes, setNotes] = useState(req.notes || "");
  const [completedDate, setCompletedDate] = useState(req.completedDate || "");
  const [attachments, setAttachments] = useState(req.attachments || []);
  const [waitingOn, setWaitingOn] = useState(req.waitingOn || DEFAULT_WAITING_ON[req.status] || "");

  // Moving to a new stage normally hands the request to a different party;
  // follow that automatically so the queue stays truthful without extra work.
  const handleStatusChange = (e) => {
    const next = e.target.value;
    setStatus(next);
    if ((req.waitingOn || "") === (DEFAULT_WAITING_ON[req.status] || "")) {
      setWaitingOn(DEFAULT_WAITING_ON[next] || "");
    }
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (status === "Waiting PO approval" && !prNumber) {
      if (!(await appConfirm("Make sure to enter the PR number now that it's approved. Continue without a PR number?"))) return;
    }
    // Hard requirement, not a confirm-and-continue: Completed must have the
    // PO document attached first. No bypass — this stays open until one is
    // actually attached below.
    if (status === "Completed" && attachments.length === 0) {
      appToast("Attach the PO document below before marking this request as Completed.");
      return;
    }
    if (status === "Completed" && !poNumber) {
      if (!(await appConfirm("Make sure to enter the PO number before marking as Completed. Continue?"))) return;
    }
    const stageChanged = status !== req.status || waitingOn !== (req.waitingOn || "");
    onSave({
      ...req,
      status,
      prNumber,
      poNumber,
      notes,
      attachments,
      waitingOn,
      // Restart the clock only when the request actually moved on, so "5 days
      // with SAP" means exactly that, not "5 days since I last edited a note".
      stageSince: stageChanged ? new Date().toISOString() : (req.stageSince || req.createdAt),
      completedDate: status === "Completed" && !completedDate
        ? new Date().toISOString().slice(0, 10)
        : completedDate,
    });
  };

  const breach = slaBreach(req, loadSla());

  return (
    <form onSubmit={handleSubmit} className="flex flex-col gap-4">
      <div className="sap-panel-info p-3 text-sm" style={{ color: "var(--sap-blue-dark)" }}>
        <span className="font-semibold">Next step: </span>{getNextAction(req)}
        <div className="mt-1 text-xs">
          In this stage for <strong>{daysInStage(req)}</strong> day(s)
          {req.waitingOn ? <> · waiting on <strong>{WAITING_ON_LABELS[req.waitingOn] || req.waitingOn}</strong></> : null}
          {breach ? <span style={{ color: "var(--sap-red)" }}> · {breach.over} day(s) past the {breach.target}-day target</span> : null}
        </div>
      </div>
      {status === "Completed" && attachments.length === 0 && (
        <div className="p-3 text-sm font-semibold" style={{ background: "var(--sap-red-bg)", border: "1px solid #F5C2C2", borderRadius: "10px", color: "var(--sap-red)" }}>
          ⚠️ Attach the PO document below first — Completed can't be saved without it.
        </div>
      )}
      <div className="grid grid-cols-2 gap-4">
        <div>
          <label className="sap-label">New Status</label>
          <select value={status} onChange={handleStatusChange} className="sap-select">
            {STATUSES.map((s) => <option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
          </select>
        </div>
        <div>
          <label className="sap-label">Waiting on</label>
          <select value={waitingOn} onChange={(e) => setWaitingOn(e.target.value)} className="sap-select">
            <option value="">—</option>
            {WAITING_ON.map((w) => <option key={w} value={w}>{WAITING_ON_LABELS[w]}</option>)}
          </select>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-4">
        <div>
          <label className="sap-label">PR Number</label>
          <input value={prNumber} onChange={(e) => setPrNumber(e.target.value)} className="sap-input" />
        </div>
        <div>
          <label className="sap-label">PO Number</label>
          <input value={poNumber} onChange={(e) => setPoNumber(e.target.value)} className="sap-input" />
        </div>
      </div>
      <div>
        <label className="sap-label">Completed Date</label>
        <input type="date" value={completedDate} onChange={(e) => setCompletedDate(e.target.value)} className="sap-input" />
      </div>
      <div>
        <label className="sap-label">Notes</label>
        <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows="3" className="sap-textarea"></textarea>
      </div>
      <AttachmentPicker attachments={attachments} onChange={setAttachments} />
      <div className="flex justify-end gap-2 pt-2">
        <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
        <button type="submit" className="sap-btn sap-btn-blue">Update Status</button>
      </div>
    </form>
  );
}

// A dialog holding a multi-step form must not be dismissible by a stray click
// on the backdrop: the content's height changes as you work through it (an
// email with three services is far taller than an empty form), so a click
// aimed at a control that just moved lands on the backdrop instead and would
// throw away everything entered so far. Closing is therefore explicit only —
// the × button or Escape.
function Modal({ title, onClose, children, scrollResetKey, wide }) {
  const cardRef = useRef(null);

  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  // When the dialog's content is replaced (e.g. a different email is loaded),
  // bring the reader back to the top instead of leaving them staring at
  // whitespace where the previous, longer content used to be.
  useEffect(() => {
    if (scrollResetKey !== undefined && cardRef.current) cardRef.current.scrollTop = 0;
  }, [scrollResetKey]);

  return (
    <div className="sap-modal-overlay fixed inset-0 flex items-center justify-center z-50 p-4">
      <div ref={cardRef} className={`sap-modal w-full ${wide ? "max-w-3xl" : "max-w-2xl"} max-h-[90vh] overflow-y-auto`}>
        <div className="sap-modal-header flex items-center justify-between px-6 py-4 sticky top-0" style={{ zIndex: 1 }}>
          <h2 className="text-base font-bold" style={{ color: "var(--sap-text)" }}>{title}</h2>
          <button onClick={onClose} className="text-xl leading-none" style={{ color: "var(--sap-gray)" }} title="Close (Esc)">×</button>
        </div>
        <div className="p-6">{children}</div>
      </div>
    </div>
  );
}

// A ranked bar: the row label carries identity, the value is direct-labeled,
// and the track stays recessive so the filled length is what the eye reads.
function BarRow({ label, value, max, formatted, color, note }) {
  const pct = max > 0 ? Math.max((value / max) * 100, value > 0 ? 2 : 0) : 0;
  return (
    <div className="mb-2" title={`${label}: ${formatted !== undefined ? formatted : value}`}>
      <div className="flex items-baseline justify-between gap-3 mb-1">
        <span className="text-xs" style={{ color: "var(--sap-text)" }}>{label}</span>
        <span className="text-xs font-semibold" style={{ color: "var(--sap-text)", fontVariantNumeric: "tabular-nums" }}>
          {formatted !== undefined ? formatted : value}
          {note ? <span className="font-normal" style={{ color: "var(--sap-gray)" }}> {note}</span> : null}
        </span>
      </div>
      <div style={{ background: "#EDEFF1", height: 8, borderRadius: 2 }}>
        <div style={{ width: `${pct}%`, height: 8, background: color || "var(--sap-blue)", borderRadius: 4 }}></div>
      </div>
    </div>
  );
}

// Types the browser can render directly in an <iframe>/<img> from a data:
// URL — no download needed, so no "Let this Artifact download a file?"
// prompt either. PDFs and common image formats cover the vast majority of
// what actually gets attached (tickets, PO scans, confirmations).
const INLINE_PREVIEWABLE_EXTENSIONS = ["pdf", "png", "jpg", "jpeg", "gif", "webp", "svg"];

function AttachmentsView({ req }) {
  const files = req.attachments || [];
  const [openTextIndex, setOpenTextIndex] = useState(null);
  const [previewIndex, setPreviewIndex] = useState(null);
  const [previewSrc, setPreviewSrc] = useState(null);
  const [previewLoading, setPreviewLoading] = useState(false);

  if (!files.length) {
    return <p className="text-center py-8" style={{ color: "var(--sap-gray)" }}>No files attached to this request.</p>;
  }

  const togglePreview = async (a, i) => {
    if (previewIndex === i) {
      setPreviewIndex(null);
      setPreviewSrc(null);
      return;
    }
    setPreviewIndex(i);
    setPreviewSrc(null);
    setPreviewLoading(true);
    const data = await resolveAttachmentData(a);
    setPreviewLoading(false);
    if (!data) {
      appToast(`"${a.name}" could not be found in this browser's file store`);
      setPreviewIndex(null);
      return;
    }
    setPreviewSrc(data);
  };

  return (
    <div className="flex flex-col gap-2">
      <p className="text-sm" style={{ color: "var(--sap-gray)" }}>
        {req.serviceType} · {req.owner}{req.beneficiary ? ` · for ${req.beneficiary}` : ""}
      </p>
      {files.map((a, i) => {
        const downloadable = DOWNLOADABLE_EXTENSIONS.includes(extensionOf(a.name));
        const canPreview = INLINE_PREVIEWABLE_EXTENSIONS.includes(extensionOf(a.name));
        const isPdf = extensionOf(a.name) === "pdf";
        return (
          <div key={i} className="sap-card p-3">
            <div className="flex items-center justify-between gap-3">
              <div style={{ minWidth: 0 }}>
                <span className="font-semibold text-sm" style={{ color: "var(--sap-text)" }}>📎 {a.name}</span>
                <p className="text-xs mt-0.5" style={{ color: "var(--sap-gray)" }}>
                  {a.size ? `${Math.round(a.size / 1024)} KB` : "size unknown"}
                  {a.text ? " · its text is searchable" : ""}
                  {!downloadable && !canPreview ? " · this file type can't be opened by the viewer, read it below" : ""}
                </p>
              </div>
              <div className="flex gap-2 whitespace-nowrap">
                {a.text ? (
                  <button
                    type="button"
                    onClick={() => setOpenTextIndex(openTextIndex === i ? null : i)}
                    className="sap-btn sap-btn-outline"
                  >
                    {openTextIndex === i ? "Hide text" : "View text"}
                  </button>
                ) : null}
                {canPreview ? (
                  <button type="button" onClick={() => togglePreview(a, i)} className="sap-btn sap-btn-outline">
                    {previewIndex === i ? "Hide preview" : "Preview"}
                  </button>
                ) : (
                  <button type="button" onClick={() => openAttachment(a)} className="sap-btn sap-btn-outline">Open file</button>
                )}
              </div>
            </div>
            {openTextIndex === i && (
              <pre
                className="text-xs mt-3 p-3"
                style={{
                  background: "#F5F6F7",
                  border: "1px solid var(--sap-border)",
                  borderRadius: 2,
                  whiteSpace: "pre-wrap",
                  wordBreak: "break-word",
                  maxHeight: 320,
                  overflow: "auto",
                  color: "var(--sap-text)",
                }}
              >
                {a.text}
              </pre>
            )}
            {previewIndex === i && (
              <div className="mt-3" style={{ border: "1px solid var(--sap-border)", borderRadius: 8, overflow: "hidden" }}>
                {previewLoading ? (
                  <p className="text-xs p-3" style={{ color: "var(--sap-gray)" }}>Loading preview…</p>
                ) : previewSrc ? (
                  isPdf ? (
                    <iframe src={previewSrc} title={a.name} style={{ width: "100%", height: 480, border: "none" }} />
                  ) : (
                    <img src={previewSrc} alt={a.name} style={{ width: "100%", display: "block" }} />
                  )
                ) : null}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ReportsView({ requests, sla }) {
  const open = requests.filter((r) => r.status !== "Completed" && r.status !== "Cancelled");
  const waitingOnMe = open.filter((r) => r.waitingOn === "Me").length;
  const pastTarget = open.filter((r) => slaBreach(r, sla)).length;

  const countBy = (list, keyFn) => {
    const out = {};
    list.forEach((r) => {
      const k = keyFn(r);
      if (!k) return;
      out[k] = (out[k] || 0) + 1;
    });
    return out;
  };

  const byStatus = countBy(requests, (r) => r.status);
  const byWaiting = countBy(open, (r) => r.waitingOn);
  const byService = countBy(requests, (r) => r.serviceType);

  const spendByVendor = {};
  requests.forEach((r) => {
    const vendor = (r.vendor || "").trim();
    if (!vendor) return;
    const amount = Number(r.finalAmount || r.budget || 0);
    if (!amount || isNaN(amount)) return;
    spendByVendor[vendor] = (spendByVendor[vendor] || 0) + amount;
  });
  const topVendors = Object.entries(spendByVendor).sort((a, b) => b[1] - a[1]).slice(0, 8);

  // Only completed requests can tell you how long the round trip really takes.
  const completed = requests.filter((r) => r.status === "Completed" && r.completedDate && r.createdAt);
  const cycleTimes = completed.map((r) =>
    Math.max(0, Math.round((new Date(r.completedDate) - new Date(r.createdAt)) / 86400000))
  );
  const avgCycle = cycleTimes.length
    ? Math.round(cycleTimes.reduce((a, b) => a + b, 0) / cycleTimes.length)
    : null;

  // Average days currently parked with each party — the closest honest answer
  // to "who holds things up", without a full change history.
  const ageByParty = {};
  open.forEach((r) => {
    if (!r.waitingOn) return;
    if (!ageByParty[r.waitingOn]) ageByParty[r.waitingOn] = [];
    ageByParty[r.waitingOn].push(daysInStage(r));
  });
  const avgAge = Object.entries(ageByParty).map(([party, days]) => [
    party,
    Math.round(days.reduce((a, b) => a + b, 0) / days.length),
  ]).sort((a, b) => b[1] - a[1]);

  const maxOf = (entries) => entries.reduce((m, [, v]) => Math.max(m, v), 0);

  if (requests.length === 0) {
    return <p className="text-center py-8" style={{ color: "var(--sap-gray)" }}>Nothing to report yet — add a few requests first.</p>;
  }

  const SectionCard = ({ icon, title, children }) => (
    <section className="sap-card" style={{ padding: "20px 22px" }}>
      <h3
        className="font-bold text-sm mb-4 flex items-center gap-2"
        style={{ color: "var(--sap-text)", letterSpacing: "-0.01em" }}
      >
        <span>{icon}</span> {title}
      </h3>
      {children}
    </section>
  );

  return (
    <div className="flex flex-col gap-4">
      <div className="grid grid-cols-3 gap-4">
        <div className="sap-tile" style={{ background: "linear-gradient(145deg, #EAF2FC, #fff)" }}>
          <div className="sap-tile-value" style={{ color: "var(--sap-blue)" }}>{open.length}</div>
          <div className="sap-tile-label">Open requests</div>
        </div>
        <div className="sap-tile" style={{ background: "linear-gradient(145deg, var(--sap-red-bg), #fff)" }}>
          <div className="sap-tile-value" style={{ color: "var(--sap-red)" }}>{waitingOnMe}</div>
          <div className="sap-tile-label">Waiting on me</div>
        </div>
        <div className="sap-tile" style={{ background: "linear-gradient(145deg, var(--sap-orange-bg), #fff)" }}>
          <div className="sap-tile-value" style={{ color: "var(--sap-orange)" }}>{pastTarget}</div>
          <div className="sap-tile-label">Past stage target</div>
        </div>
      </div>

      <SectionCard icon="⏳" title="Where the open work is sitting">
        {avgAge.length === 0 ? (
          <p className="text-xs" style={{ color: "var(--sap-gray)" }}>No open requests with a party assigned.</p>
        ) : (
          avgAge.map(([party, days]) => (
            <BarRow
              key={party}
              label={`${WAITING_ON_LABELS[party] || party} · ${ageByParty[party].length} request(s)`}
              value={days}
              max={maxOf(avgAge)}
              formatted={`${days}d`}
              note="avg wait"
              color={(WAITING_ON_STYLE[party] || {}).color}
            />
          ))
        )}
      </SectionCard>

      <SectionCard icon="📋" title="Requests by stage">
        {Object.entries(byStatus).map(([status, count]) => (
          <BarRow
            key={status}
            label={STATUS_LABELS[status] || status}
            value={count}
            max={maxOf(Object.entries(byStatus))}
            color={(STATUS_INLINE_STYLE[status] || {}).color}
          />
        ))}
      </SectionCard>

      <SectionCard icon="💰" title="Spend by supplier (top 8)">
        {topVendors.length === 0 ? (
          <p className="text-xs" style={{ color: "var(--sap-gray)" }}>No amounts recorded yet.</p>
        ) : (
          topVendors.map(([vendor, amount]) => (
            <BarRow
              key={vendor}
              label={vendor}
              value={amount}
              max={maxOf(topVendors)}
              formatted={Math.round(amount).toLocaleString()}
            />
          ))
        )}
      </SectionCard>

      <SectionCard icon="🧳" title="Volume by service type">
        {Object.entries(byService).map(([type, count]) => (
          <BarRow key={type} label={type} value={count} max={maxOf(Object.entries(byService))} />
        ))}
      </SectionCard>

      <section
        className="sap-card"
        style={{
          padding: "18px 22px",
          background: "linear-gradient(135deg, var(--sap-blue), #6C7CFF)",
          border: "none",
        }}
      >
        <p className="text-sm" style={{ color: "#fff" }}>
          {avgCycle === null
            ? "No completed requests yet, so there's no cycle time to measure."
            : <>⚡ Completed requests took <strong>{avgCycle} day(s)</strong> on average from first logged to done, across {cycleTimes.length} request(s).</>}
        </p>
      </section>
    </div>
  );
}

function SupplierManagerModal({ onClose, sla, onSlaChange }) {
  const [suppliers, setSuppliers] = useState(loadSuppliers);
  const [activeType, setActiveType] = useState(SERVICE_TYPES[0]);
  const [newSupplier, setNewSupplier] = useState("");

  const updateSla = (status, value) => {
    const days = parseInt(value, 10);
    const updated = { ...sla, [status]: isNaN(days) ? 0 : days };
    saveSla(updated);
    onSlaChange(updated);
  };

  const persist = (updated) => {
    setSuppliers(updated);
    saveSuppliers(updated);
  };

  const addSupplier = () => {
    const name = newSupplier.trim();
    if (!name) return;
    const list = suppliers[activeType] || [];
    if (list.some((v) => v.toLowerCase() === name.toLowerCase())) {
      appToast(`"${name}" is already registered for ${activeType}`);
      return;
    }
    persist({ ...suppliers, [activeType]: [...list, name] });
    setNewSupplier("");
  };

  const removeSupplier = (type, name) => {
    persist({ ...suppliers, [type]: (suppliers[type] || []).filter((v) => v !== name) });
  };

  return (
    <div className="flex flex-col gap-4">
      <p className="text-sm" style={{ color: "var(--sap-gray)" }}>
        Register the suppliers you actually work with, per service type. When parsing an email, these show up as ⭐ recommended choices — anything else typed in gets flagged as an unregistered/new supplier.
      </p>
      <div className="flex gap-2">
        <select value={activeType} onChange={(e) => setActiveType(e.target.value)} className="sap-select" style={{ maxWidth: 160 }}>
          {SERVICE_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
        <input
          value={newSupplier}
          onChange={(e) => setNewSupplier(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addSupplier(); } }}
          placeholder={`Add a ${activeType} supplier...`}
          className="sap-input"
          style={{ flex: 1 }}
        />
        <button type="button" onClick={addSupplier} className="sap-btn sap-btn-blue">+ Add</button>
      </div>

      <div className="flex flex-col gap-3">
        {SERVICE_TYPES.map((type) => (
          <div key={type} className="sap-card p-3">
            <p className="font-semibold text-sm mb-2" style={{ color: "var(--sap-text)" }}>{type}</p>
            {(suppliers[type] || []).length === 0 ? (
              <p className="text-xs" style={{ color: "var(--sap-gray)" }}>No registered suppliers yet.</p>
            ) : (
              <ul className="flex flex-wrap gap-2">
                {(suppliers[type] || []).map((v) => (
                  <li key={v} className="flex items-center gap-1 text-xs px-2 py-1" style={{ background: "var(--sap-green-bg)", border: "1px solid #BFE3CB", borderRadius: "10px", color: "var(--sap-green)" }}>
                    ⭐ {v}
                    <button type="button" onClick={() => removeSupplier(type, v)} className="font-bold" style={{ color: "var(--sap-red)" }}>×</button>
                  </li>
                ))}
              </ul>
            )}
          </div>
        ))}
      </div>

      <div style={{ borderTop: "1px solid var(--sap-border)", paddingTop: "1rem" }}>
        <p className="font-semibold text-sm mb-1" style={{ color: "var(--sap-text)" }}>⏱ Stage targets (SLA)</p>
        <p className="text-xs mb-3" style={{ color: "var(--sap-gray)" }}>
          How many days a request may sit in each stage before it's flagged as late. This is what turns "it's been a while" into a number you can act on.
        </p>
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          {Object.keys(DEFAULT_SLA_DAYS).map((status) => (
            <div key={status}>
              <label className="sap-label">{STATUS_LABELS[status]}</label>
              <input
                type="number"
                min="0"
                value={sla[status]}
                onChange={(e) => updateSla(status, e.target.value)}
                className="sap-input"
              />
            </div>
          ))}
        </div>
      </div>

      <div className="flex justify-end pt-2">
        <button type="button" onClick={onClose} className="sap-btn sap-btn-blue">Done</button>
      </div>
    </div>
  );
}

function App() {
  const [requests, setRequests] = useState(loadRequests);
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [ownerFilter, setOwnerFilter] = useState("all");
  const [serviceFilter, setServiceFilter] = useState("all");
  const [dateFilter, setDateFilter] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editingReq, setEditingReq] = useState(null);
  const [statusReq, setStatusReq] = useState(null);
  const [showParser, setShowParser] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [showDaily, setShowDaily] = useState(false);
  const [showSuppliers, setShowSuppliers] = useState(false);
  const [viewBatchId, setViewBatchId] = useState(null);
  const [parserContentVersion, setParserContentVersion] = useState(0);
  const [waitingFilter, setWaitingFilter] = useState("all");
  const [viewFilesReq, setViewFilesReq] = useState(null);
  const [showReports, setShowReports] = useState(false);
  const [sla, setSla] = useState(loadSla);
  const [sharedDb, setSharedDb] = useState(null);
  const [syncStatus, setSyncStatus] = useState("local"); // local | connecting | shared | error
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const dragScrollRef = useDragScroll();
  // "Attach PO" doesn't need its own modal — one hidden file input shared by
  // every row, aimed at whichever row's button was clicked last.
  const [attachPoRowId, setAttachPoRowId] = useState(null);
  const attachPoInputRef = useRef(null);

  // Always keep the private per-browser cache current — a fallback that
  // costs nothing and matters if sharing ever becomes unavailable mid-session.
  useEffect(() => {
    saveRequests(requests);
  }, [requests]);

  // Try the shared database once on load. Nothing here runs outside the
  // Artifact link, where window.claude simply doesn't exist.
  useEffect(() => {
    let unsubscribe = null;
    let cancelled = false;
    (async () => {
      if (!window.claude || typeof window.claude.use !== "function") return;
      setSyncStatus("connecting");
      try {
        const db = await window.claude.use("db");
        if (!db || cancelled) return;
        await migrateLocalRequestsToSharedDb(db);
        if (cancelled) return;
        setSharedDb(db);
        setSyncStatus("shared");
        unsubscribe = db.collection("requests").onSnapshot(
          (snap) => setRequests(snap.docs.map(docToRequest)),
          (err) => {
            console.error("Shared sync error:", err);
            setSyncStatus("error");
            appToast("Shared sync stopped (" + err.code + ") — this browser's own copy is still safe.");
          }
        );
      } catch (err) {
        setSyncStatus("local");
      }
    })();
    return () => { cancelled = true; if (unsubscribe) unsubscribe(); };
  }, []);

  const owners = useMemo(() => {
    const set = new Set(requests.map((r) => r.owner).filter(Boolean));
    return Array.from(set);
  }, [requests]);

  const stats = useMemo(() => {
    const pending = requests.filter((r) => r.status === "Pending").length;
    const processing = requests.filter((r) => r.status === "Waiting PR approval").length;
    const completed = requests.filter((r) => r.status === "Completed").length;
    const overdue = requests.filter((r) => isOverdue(r)).length;
    return { pending, processing, completed, overdue, total: requests.length };
  }, [requests]);

  const filtered = useMemo(() => {
    let list = [...requests];
    // Deep search: every word must land somewhere in the request — including
    // the traveller's name, the stay dates spelled out as month names, and the
    // text pulled out of attached PDFs.
    if (search.trim()) list = list.filter((r) => matchesSearch(r, search.trim()));
    if (statusFilter !== "all") list = list.filter((r) => r.status === statusFilter);
    if (ownerFilter !== "all") list = list.filter((r) => r.owner === ownerFilter);
    if (serviceFilter !== "all") list = list.filter((r) => r.serviceType === serviceFilter);
    if (waitingFilter !== "all") list = list.filter((r) => (r.waitingOn || "") === waitingFilter);
    if (dateFilter) {
      list = list.filter((r) =>
        r.requiredDate === dateFilter ||
        (r.serviceDateFrom && r.serviceDateTo && r.serviceDateFrom <= dateFilter && dateFilter <= r.serviceDateTo) ||
        r.serviceDateFrom === dateFilter
      );
    }

    const statusOrder = { Pending: 0, "Waiting PR approval": 1, "Waiting PO approval": 2, Completed: 3 };
    list.sort((a, b) => {
      const diff = statusOrder[a.status] - statusOrder[b.status];
      if (diff !== 0) return diff;
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    return list;
  }, [requests, search, statusFilter, ownerFilter, serviceFilter, waitingFilter, dateFilter]);

  const handleSaveNew = async (formOrForms) => {
    if (Array.isArray(formOrForms)) {
      await saveNewRequests(formOrForms);
      setShowForm(false);
      setEditingReq(null);
      return;
    }
    const form = formOrForms;
    const now = new Date().toISOString();
    if (form.id) {
      const updated = { ...form, updatedAt: now };
      if (sharedDb) {
        await sharedDb.collection("requests").doc(form.id).set(sanitizeRequestForDb({ ...requests.find((r) => r.id === form.id), ...updated }));
      } else {
        setRequests((prev) => prev.map((r) => (r.id === form.id ? { ...r, ...updated } : r)));
      }
    } else {
      const newReq = { ...form, id: uid(), createdAt: now, updatedAt: now };
      if (sharedDb) {
        await sharedDb.collection("requests").doc(newReq.id).set(sanitizeRequestForDb(newReq));
      } else {
        setRequests((prev) => [newReq, ...prev]);
      }
    }
    setShowForm(false);
    setEditingReq(null);
  };

  // Used when one email covers several services at once (hotel + car +
  // ticket) split into separate tracked requests — appends all of them in a
  // single state update so they don't clobber each other.
  const saveNewRequests = async (forms) => {
    const now = new Date().toISOString();
    const newReqs = forms.map((form) => ({ ...form, id: uid(), createdAt: now, updatedAt: now }));
    if (sharedDb) {
      await Promise.all(newReqs.map((r) => sharedDb.collection("requests").doc(r.id).set(sanitizeRequestForDb(r))));
    } else {
      setRequests((prev) => [...newReqs, ...prev]);
    }
  };

  const handleSaveMultiple = async (forms) => {
    await saveNewRequests(forms);
    setShowParser(false);
  };

  const handleStatusSave = async (updated) => {
    const withStamp = { ...updated, updatedAt: new Date().toISOString() };
    if (sharedDb) {
      await sharedDb.collection("requests").doc(updated.id).set(sanitizeRequestForDb(withStamp));
    } else {
      setRequests((prev) => prev.map((r) => (r.id === updated.id ? withStamp : r)));
    }
    setStatusReq(null);
  };

  const handleDelete = async (id) => {
    if (!(await appConfirm("Are you sure you want to delete this request?"))) return;
    if (sharedDb) {
      await sharedDb.collection("requests").doc(id).delete();
    } else {
      setRequests((prev) => prev.filter((r) => r.id !== id));
    }
  };

  // Partial-field update shared by the Service Entry Sheet checkbox and any
  // other single-field toggle — goes through the same shared-db-or-local
  // path as every other mutation so it stays in sync across browsers.
  const handleFieldUpdate = async (id, patch) => {
    const withStamp = { ...patch, updatedAt: new Date().toISOString() };
    if (sharedDb) {
      const current = requests.find((r) => r.id === id);
      await sharedDb.collection("requests").doc(id).set(sanitizeRequestForDb({ ...current, ...withStamp }));
    } else {
      setRequests((prev) => prev.map((r) => (r.id === id ? { ...r, ...withStamp } : r)));
    }
  };

  const handleToggleSes = (req) => handleFieldUpdate(req.id, { serviceEntrySheet: !req.serviceEntrySheet });

  const handleAttachPoClick = (req) => {
    setAttachPoRowId(req.id);
    if (attachPoInputRef.current) attachPoInputRef.current.click();
  };

  const handleAttachPoFile = async (e) => {
    const file = e.target.files[0];
    const rowId = attachPoRowId;
    e.target.value = "";
    setAttachPoRowId(null);
    if (!file || !rowId) return;
    const req = requests.find((r) => r.id === rowId);
    if (!req) return;
    try {
      const attachment = await ingestAttachment(file);
      await handleFieldUpdate(rowId, { attachments: [...(req.attachments || []), attachment] });
      appToast(`Attached "${file.name}" — open it from the 📎 Files column`);
    } catch (err) {
      appToast("Could not attach this file: " + err.message);
    }
  };

  const toggleSelected = (id) => {
    setSelectedIds((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  };

  const toggleSelectAllFiltered = () => {
    setSelectedIds((prev) => {
      const allSelected = filtered.length > 0 && filtered.every((r) => prev.has(r.id));
      if (allSelected) return new Set();
      return new Set(filtered.map((r) => r.id));
    });
  };

  const handleDeleteSelected = async () => {
    const ids = Array.from(selectedIds);
    if (ids.length === 0) return;
    const label = ids.length === 1 ? "this request" : `these ${ids.length} requests`;
    if (!(await appConfirm(`Delete ${label}? This cannot be undone.`))) return;
    if (sharedDb) {
      await Promise.all(ids.map((id) => sharedDb.collection("requests").doc(id).delete()));
    } else {
      setRequests((prev) => prev.filter((r) => !ids.includes(r.id)));
    }
    setSelectedIds(new Set());
    appToast(`Deleted ${ids.length} request(s).`);
  };

  const handleImport = async (parsedRows) => {
    if (sharedDb) {
      await Promise.all(parsedRows.map((r) => sharedDb.collection("requests").doc(r.id || uid()).set(sanitizeRequestForDb(r))));
    } else {
      setRequests((prev) => [...parsedRows, ...prev]);
    }
    setShowImport(false);
    appToast(`Successfully imported ${parsedRows.length} request(s)`);
  };

  const dailyItems = useMemo(() => {
    return requests
      .filter((r) => r.status !== "Completed" && r.status !== "Cancelled")
      .map((r) => ({ req: r, alert: getAlertLevel(r), breach: slaBreach(r, sla) }))
      .filter(({ req, alert, breach }) =>
        alert || breach ||
        (req.status === "Waiting PO approval" && (!req.prNumber || !req.poNumber)))
      // What's sitting with me comes first — that's the part I can actually
      // move today; the rest is chasing other people.
      .sort((a, b) => {
        const mine = (x) => (x.req.waitingOn === "Me" ? 0 : 1);
        if (mine(a) !== mine(b)) return mine(a) - mine(b);
        const overdue = (x) => (x.breach ? x.breach.over : 0);
        if (overdue(a) !== overdue(b)) return overdue(b) - overdue(a);
        const order = { red: 0, yellow: 1, orange: 2 };
        return (order[a.alert] ?? 3) - (order[b.alert] ?? 3);
      });
  }, [requests, sla]);

  // Voice reminder: once the data has actually loaded (not on the very first
  // empty render) and there's something needing action, say so out loud. Only
  // once per page load — reopening the tab or reloading will say it again,
  // but it won't repeat itself every time requests re-renders.
  const spokenRef = useRef(false);
  const reminderMessage = useMemo(() => {
    if (dailyItems.length === 0) return "";
    const mine = dailyItems.filter((x) => x.req.waitingOn === "Me").length;
    return `You have ${dailyItems.length} pending request${dailyItems.length === 1 ? "" : "s"} that need attention` +
      (mine > 0 ? `, ${mine} of them waiting on you.` : ".");
  }, [dailyItems]);

  const [showAutoReminder, setShowAutoReminder] = useState(false);
  useEffect(() => {
    if (spokenRef.current || !reminderMessage) return;
    spokenRef.current = true;
    speakReminder(reminderMessage);
    setShowAutoReminder(true);
  }, [reminderMessage]);

  const batchSiblings = useMemo(() => {
    const map = {};
    requests.forEach((r) => {
      if (!r.batchId) return;
      if (!map[r.batchId]) map[r.batchId] = [];
      map[r.batchId].push(r);
    });
    return map;
  }, [requests]);

  return (
    <div className="sap-shell">
      <header className="sap-header sticky top-0 z-10">
        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between flex-wrap gap-3">
          <div className="flex items-center gap-3">
            <div
              style={{
                width: 40, height: 40, borderRadius: 12, flexShrink: 0,
                background: "linear-gradient(135deg, var(--sap-blue), #6C7CFF)",
                display: "flex", alignItems: "center", justifyContent: "center",
                color: "#fff", fontWeight: 800, fontSize: 15,
                boxShadow: "0 6px 16px rgba(61,90,254,.35)",
              }}
            >
              PO
            </div>
            <div>
              <h1 className="text-xl font-extrabold">PR / PO Tracker</h1>
              <p className="text-xs mt-0.5" style={{ color: "var(--sap-gray)" }}>Purchase request &amp; approval tracking</p>
              <p className="text-xs mt-1 font-semibold" style={{ color: syncStatus === "shared" ? "var(--sap-green)" : syncStatus === "connecting" ? "var(--sap-blue)" : syncStatus === "error" ? "var(--sap-red)" : "var(--sap-gray)" }}>
                {syncStatus === "shared" && "🔗 Shared — everyone on this link sees the same data"}
                {syncStatus === "connecting" && "⏳ Connecting to shared data…"}
                {syncStatus === "error" && "⚠️ Shared sync stopped — showing this browser's own copy"}
                {syncStatus === "local" && "💻 Local to this browser only"}
              </p>
            </div>
          </div>
          <div className="flex gap-2 flex-wrap justify-end">
            <button onClick={() => setShowDaily(true)} className="sap-btn sap-btn-ghost">
              ⏰ Today's Follow-up {dailyItems.length > 0 && `(${dailyItems.length})`}
            </button>
            {reminderMessage && (
              <button
                onClick={() => speakReminder(reminderMessage)}
                className="sap-btn sap-btn-ghost"
                title="Play the voice reminder again — browsers sometimes block it from playing automatically until you click something on the page"
              >
                🔊 Voice reminder
              </button>
            )}
            <button onClick={() => setShowImport(true)} className="sap-btn sap-btn-ghost">
              📥 Import Excel
            </button>
            <button onClick={() => exportToExcel(requests)} className="sap-btn sap-btn-ghost">
              📤 Export Excel
            </button>
            <button onClick={() => setShowParser(true)} className="sap-btn sap-btn-ghost">
              📎 Attach Email
            </button>
            <button onClick={() => setShowReports(true)} className="sap-btn sap-btn-ghost">
              📊 Reports
            </button>
            <button onClick={() => setShowSuppliers(true)} className="sap-btn sap-btn-ghost">
              ⚙️ Setup
            </button>
            <button onClick={() => { setEditingReq(null); setShowForm(true); }} className="sap-btn sap-btn-primary">
              + New Request
            </button>
          </div>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-6 py-6">
        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-6">
          <StatCard label="Total" value={stats.total} borderColor="var(--sap-gray)" />
          <StatCard label="Pending" value={stats.pending} borderColor="var(--sap-amber)" />
          <StatCard label="Waiting PR approval" value={stats.processing} borderColor="var(--sap-blue)" />
          <StatCard label="Completed" value={stats.completed} borderColor="var(--sap-green)" />
          <StatCard label="Overdue" value={stats.overdue} borderColor="var(--sap-red)" />
        </div>

        <div className="sap-card p-4 mb-6 flex flex-wrap gap-3 items-end">
          <div className="flex-1 min-w-[200px]">
            <label className="sap-label">Search</label>
            <input
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Deep search: traveller, hotel, month, PR/PO, amount, text inside attached PDFs…"
              className="sap-input"
            />
          </div>
          <div>
            <label className="sap-label">Status</label>
            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} className="sap-select">
              <option value="all">All</option>
              {STATUSES.map((s) => <option key={s} value={s}>{STATUS_LABELS[s]}</option>)}
            </select>
          </div>
          <div>
            <label className="sap-label">Owner</label>
            <select value={ownerFilter} onChange={(e) => setOwnerFilter(e.target.value)} className="sap-select">
              <option value="all">All</option>
              {owners.map((o) => <option key={o} value={o}>{o}</option>)}
            </select>
          </div>
          <div>
            <label className="sap-label">Service Type</label>
            <select value={serviceFilter} onChange={(e) => setServiceFilter(e.target.value)} className="sap-select">
              <option value="all">All</option>
              {SERVICE_TYPES.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div>
            <label className="sap-label">Waiting On</label>
            <select value={waitingFilter} onChange={(e) => setWaitingFilter(e.target.value)} className="sap-select">
              <option value="all">All</option>
              {WAITING_ON.map((w) => <option key={w} value={w}>{WAITING_ON_LABELS[w]}</option>)}
            </select>
          </div>
          <div>
            <label className="sap-label">Date (service or required)</label>
            <input type="date" value={dateFilter} onChange={(e) => setDateFilter(e.target.value)} className="sap-input" />
          </div>
          {(search || statusFilter !== "all" || ownerFilter !== "all" || serviceFilter !== "all" || waitingFilter !== "all" || dateFilter) && (
            <button
              onClick={() => { setSearch(""); setStatusFilter("all"); setOwnerFilter("all"); setServiceFilter("all"); setWaitingFilter("all"); setDateFilter(""); }}
              className="sap-link"
              style={{ padding: "8px 4px" }}
            >
              Clear filters
            </button>
          )}
        </div>

        <div className="flex items-center gap-3 mb-2" style={{ flexWrap: "wrap" }}>
          <span className="text-xs" style={{ color: "var(--sap-gray)" }}>
            {selectedIds.size > 0 ? `${selectedIds.size} selected` : `${filtered.length} shown`}
          </span>
          <button
            type="button"
            onClick={handleDeleteSelected}
            disabled={selectedIds.size === 0}
            className="sap-btn sap-btn-outline"
            style={selectedIds.size === 0 ? { opacity: 0.5, cursor: "not-allowed" } : { color: "var(--sap-red)", borderColor: "var(--sap-red)" }}
          >
            🗑 Delete selected
          </button>
        </div>

        <div className="sap-card overflow-hidden">
          <div className="overflow-x-auto drag-scroll" ref={dragScrollRef}>
            <table className="sap-table">
              <thead>
                <tr>
                  <th style={{ width: 30 }}>
                    <input
                      type="checkbox"
                      checked={filtered.length > 0 && filtered.every((r) => selectedIds.has(r.id))}
                      onChange={toggleSelectAllFiltered}
                      title="Select all shown"
                    />
                  </th>
                  <th>PR</th>
                  <th>PO</th>
                  <th>Requester / For</th>
                  <th>Files</th>
                  <th>Service</th>
                  <th>Vendor</th>
                  <th>Status</th>
                  <th style={{ whiteSpace: "nowrap" }}>Service Entry Sheet</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 && (
                  <tr>
                    <td colSpan="10" className="text-center py-10" style={{ color: "var(--sap-gray)" }}>No matching requests</td>
                  </tr>
                )}
                {filtered.map((r) => {
                  const alert = getAlertLevel(r);
                  const style = alert ? ALERT_STYLES[alert] : null;
                  const breach = slaBreach(r, sla);
                  const stageDays = daysInStage(r);
                  const group = r.batchId ? batchSiblings[r.batchId] : null;
                  const grouped = group && group.length > 1;
                  const groupColor = grouped ? batchColorFor(r.batchId) : null;
                  const groupIndex = grouped ? group.findIndex((x) => x.id === r.id) + 1 : 0;
                  return (
                    <tr
                      key={r.id}
                      style={{
                        ...(style ? style.rowStyle : {}),
                        ...(groupColor ? { boxShadow: `inset 4px 0 0 0 ${groupColor}` } : {}),
                      }}
                    >
                      <td>
                        <input type="checkbox" checked={selectedIds.has(r.id)} onChange={() => toggleSelected(r.id)} />
                      </td>
                      <td>{r.prNumber || "—"}</td>
                      <td>{r.poNumber || "—"}</td>
                      <td style={{ minWidth: 130 }}>
                        {r.owner}
                        {r.beneficiary && r.beneficiary.trim() && r.beneficiary.trim() !== (r.owner || "").trim() && (
                          <div className="text-xs" style={{ color: "var(--sap-blue-dark)" }}>
                            for <strong>{r.beneficiary}</strong>
                          </div>
                        )}
                        {grouped && (
                          <button
                            type="button"
                            onClick={() => setViewBatchId(r.batchId)}
                            className="text-xs font-semibold mt-1"
                            style={{ color: groupColor, display: "block", textAlign: "left", background: "none", border: "none", padding: 0, cursor: "pointer" }}
                            title="All the requests that came out of this one email"
                          >
                            ▌{groupIndex} of {group.length} · same email
                          </button>
                        )}
                      </td>
                      <td>
                        {r.attachments && r.attachments.length > 0 ? (
                          <button
                            type="button"
                            onClick={() => setViewFilesReq(r)}
                            className="sap-link whitespace-nowrap"
                            style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}
                            title={r.attachments.map((a) => a.name).join(", ")}
                          >
                            📎 {r.attachments.length}
                          </button>
                        ) : (
                          <span style={{ color: "var(--sap-gray)" }}>—</span>
                        )}
                      </td>
                      <td>{r.serviceType}</td>
                      <td>{r.vendor || "—"}</td>
                      <td>
                        <span className="sap-badge" style={STATUS_INLINE_STYLE[r.status]}>
                          {STATUS_LABELS[r.status]}
                        </span>
                      </td>
                      <td className="text-center">
                        <input
                          type="checkbox"
                          checked={!!r.serviceEntrySheet}
                          onChange={() => handleToggleSes(r)}
                          title="Tick once the Service Entry Sheet is done and this PO is closed"
                          style={{ width: 18, height: 18, cursor: "pointer" }}
                        />
                      </td>
                      <td className="whitespace-nowrap">
                        <button onClick={() => setStatusReq(r)} className="sap-link mr-3">Update Status</button>
                        <button onClick={() => handleAttachPoClick(r)} className="sap-link mr-3" style={{ color: "var(--sap-purple)" }}>📎 Attach PO</button>
                        <button onClick={() => handleDelete(r.id)} className="sap-link-danger">Delete</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <TableScrollbar targetRef={dragScrollRef} />
        </div>
        <input
          ref={attachPoInputRef}
          type="file"
          onChange={handleAttachPoFile}
          style={{ display: "none" }}
        />
      </main>

      {showForm && (
        <Modal title={editingReq ? "Edit Request" : "New Request"} onClose={() => { setShowForm(false); setEditingReq(null); }}>
          <RequestForm initial={editingReq} requests={requests} onSave={handleSaveNew} onCancel={() => { setShowForm(false); setEditingReq(null); }} />
        </Modal>
      )}

      {statusReq && (
        <Modal title={`Update Status — ${statusReq.owner}`} onClose={() => setStatusReq(null)}>
          <StatusUpdateForm req={statusReq} onSave={handleStatusSave} onCancel={() => setStatusReq(null)} />
        </Modal>
      )}

      {showParser && (
        <Modal
          title="Attach Email"
          onClose={() => setShowParser(false)}
          scrollResetKey={parserContentVersion}
        >
          <EmailParserForm
            requests={requests}
            onSave={handleSaveMultiple}
            onCancel={() => setShowParser(false)}
            onContentReplaced={() => setParserContentVersion((v) => v + 1)}
          />
        </Modal>
      )}

      {showImport && (
        <Modal title="Import From Excel" onClose={() => setShowImport(false)}>
          <ImportExcelModal onImport={handleImport} onCancel={() => setShowImport(false)} />
        </Modal>
      )}

      {showAutoReminder && (
        <Modal title="🔔 Reminder" onClose={() => setShowAutoReminder(false)}>
          <div className="flex flex-col gap-4">
            <p className="text-sm" style={{ color: "var(--sap-text)" }}>{reminderMessage}</p>
            <div className="flex justify-end gap-2">
              <button
                type="button"
                onClick={() => setShowAutoReminder(false)}
                className="sap-btn sap-btn-outline"
              >
                Dismiss
              </button>
              <button
                type="button"
                onClick={() => { setShowAutoReminder(false); setShowDaily(true); }}
                className="sap-btn sap-btn-blue"
              >
                View details
              </button>
            </div>
          </div>
        </Modal>
      )}

      {showDaily && (
        <Modal title="⏰ Today's Follow-up" onClose={() => setShowDaily(false)}>
          {dailyItems.length === 0 ? (
            <p className="text-center py-8" style={{ color: "var(--sap-gray)" }}>No requests need attention today 🎉</p>
          ) : (
            <div className="flex flex-col gap-3">
              {dailyItems.map(({ req, alert, breach }) => {
                const style = alert ? ALERT_STYLES[alert] : null;
                const missingPr = req.status === "Waiting PO approval" && !req.prNumber;
                const missingPo = req.status === "Waiting PO approval" && !req.poNumber;
                return (
                  <div key={req.id} className="sap-card p-3" style={style ? style.rowStyle : { background: "#F5F6F7" }}>
                    <div className="flex items-center justify-between">
                      <span className="font-semibold" style={{ color: "var(--sap-text)" }}>{req.owner} — {req.serviceType} {req.vendor ? `(${req.vendor})` : ""}</span>
                      <span className="sap-badge" style={STATUS_INLINE_STYLE[req.status]}>{STATUS_LABELS[req.status]}</span>
                    </div>
                    <div className="text-sm mt-1 space-y-0.5">
                      {style && <p className="font-semibold" style={{ color: style.text }}>⚠️ {style.label}</p>}
                      {breach && (
                        <p className="font-semibold" style={{ color: "var(--sap-red)" }}>
                          ⏱ {breach.elapsed} day(s) in “{STATUS_LABELS[req.status]}” — {breach.over} past the {breach.target}-day target
                        </p>
                      )}
                      {req.waitingOn && (
                        <p style={{ color: "var(--sap-gray)" }}>
                          Waiting on <strong>{WAITING_ON_LABELS[req.waitingOn]}</strong> for {daysInStage(req)} day(s)
                        </p>
                      )}
                      {missingPr && <p className="font-semibold" style={{ color: "var(--sap-red)" }}>💾 Reminder: PR number not entered for this request</p>}
                      {missingPo && <p className="font-semibold" style={{ color: "var(--sap-red)" }}>💾 Reminder: PO number not entered for this request</p>}
                      <p style={{ color: "var(--sap-blue-dark)" }}><span className="font-semibold">Next step:</span> {getNextAction(req)}</p>
                    </div>
                    <button
                      onClick={() => { setShowDaily(false); setStatusReq(req); }}
                      className="mt-2 sap-link"
                    >
                      Update status now
                    </button>
                  </div>
                );
              })}
            </div>
          )}
        </Modal>
      )}


      {viewFilesReq && (
        <Modal title="📎 Attachments" onClose={() => setViewFilesReq(null)}>
          <AttachmentsView req={viewFilesReq} />
        </Modal>
      )}

      {showReports && (
        <Modal title="📊 Reports" onClose={() => setShowReports(false)} wide>
          <ReportsView requests={requests} sla={sla} />
        </Modal>
      )}

      {showSuppliers && (
        <Modal title="⚙️ Setup — suppliers & stage targets" onClose={() => setShowSuppliers(false)}>
          <SupplierManagerModal onClose={() => setShowSuppliers(false)} sla={sla} onSlaChange={setSla} />
        </Modal>
      )}

      {viewBatchId && batchSiblings[viewBatchId] && (
        <Modal title="🔗 Linked requests from the same email" onClose={() => setViewBatchId(null)}>
          <div className="flex flex-col gap-3">
            <p className="text-sm" style={{ color: "var(--sap-gray)" }}>
              {batchSiblings[viewBatchId][0].emailSummary || "These requests were split from one email into separate services."}
            </p>
            {batchSiblings[viewBatchId].map((r) => (
              <div key={r.id} className="sap-card p-3 flex items-center justify-between">
                <div>
                  <p className="font-semibold" style={{ color: "var(--sap-text)" }}>{r.serviceType} {r.vendor ? `— ${r.vendor}` : ""}</p>
                  <p className="text-xs" style={{ color: "var(--sap-gray)" }}>PR: {r.prNumber || "—"} · PO: {r.poNumber || "—"}</p>
                </div>
                <span className="sap-badge" style={STATUS_INLINE_STYLE[r.status]}>{STATUS_LABELS[r.status]}</span>
              </div>
            ))}
          </div>
        </Modal>
      )}
      <ConfirmHost />
      <ToastHost />
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Render error caught by boundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ maxWidth: 640, margin: "80px auto", padding: 24 }}>
          <div className="sap-card p-4">
            <h2 className="font-bold mb-2" style={{ color: "var(--sap-red)" }}>⚠️ Something went wrong displaying this page</h2>
            <p className="text-sm mb-3" style={{ color: "var(--sap-text)" }}>
              Your saved requests are safe (they live in this browser's storage, not in this screen). Reloading should recover the app.
            </p>
            <pre className="text-xs p-2 mb-3" style={{ background: "#F5F6F7", color: "var(--sap-gray)", overflow: "auto", whiteSpace: "pre-wrap" }}>
              {String(this.state.error && (this.state.error.stack || this.state.error.message || this.state.error))}
            </pre>
            <button onClick={() => window.location.reload()} className="sap-btn sap-btn-blue">Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary><App /></ErrorBoundary>
);
</script>
</body>
</html>
