async function exportToExcel(requests) {
  if (!window.XLSX || typeof window.XLSX.write !== "function") {
    appToast("Could not load the Excel export library — check your internet connection and try again.");
    return;
  }
  const rows = requests.map((r) => ({
    "PR Number": r.prNumber,
    "PR Raised By": r.prRaisedBy === "requester" ? "Requester" : "Me",
    "PO Number": r.poNumber,
    "Requester": r.owner,
    "Beneficiary": r.beneficiary,
    "Service From": r.serviceDateFrom,
    "Service To": r.serviceDateTo,
    "Department": r.department,
    "Charged To": r.chargeTo === "project" ? "Project" : r.chargeTo === "cost_center" ? "Cost Center" : "",
    "Project": r.projectName || "",
    "Network": r.network || "",
    "Activity": r.activity || "",
    "Cost Center": r.costCenter || "",
    "Service Type": r.serviceType,
    "Vendor": r.vendor,
    "Status": STATUS_LABELS[r.status] || r.status,
    "Budget": r.budget,
    "Final Amount": r.finalAmount,
    "Required Date": r.requiredDate,
    "Completed Date": r.completedDate,
    "Invoice Received": r.invoiceDate || "",
    "Invoice No.": r.invoiceNumber || "",
    "Invoice Amount": r.invoiceAmount || "",
    "SES/GR Type": r.status === "Completed" ? receiptShort(r) : "",
    "SES/GR Due": r.invoiceDate ? addDaysIso(r.invoiceDate, GR_SES_DAYS) : "",
    "SES/GR Status": (() => {
      const g = grSesState(r);
      if (g.stage === "done") return `Done${r.grSesDate ? " " + r.grSesDate : ""}`;
      if (g.stage === "due") return g.overdue ? `Overdue ${-g.daysLeft} day(s)` : `Due in ${g.daysLeft} day(s)`;
      if (g.stage === "waiting_invoice") return "Waiting invoice";
      return "";
    })(),
    "SES/GR No.": r.grSesNumber || "",
    "Notes": r.notes,
    "Created": r.createdAt ? r.createdAt.slice(0, 10) : "",
  }));
  const ws = XLSX.utils.json_to_sheet(rows, { header: EXCEL_COLUMNS });

  // Header row: bold white text on the brand indigo fill.
  EXCEL_COLUMNS.forEach((_, colIdx) => {
    const addr = XLSX.utils.encode_cell({ r: 0, c: colIdx });
    if (!ws[addr]) return;
    ws[addr].s = {
      font: { bold: true, color: { rgb: "FFFFFF" } },
      fill: { fgColor: { rgb: EXCEL_HEADER_FILL } },
      alignment: { vertical: "center" },
      border: { top: EXCEL_BORDER, bottom: EXCEL_BORDER, left: EXCEL_BORDER, right: EXCEL_BORDER },
    };
  });

  // Data rows: color the Status cell like its badge, and give every cell a
  // faint border so it reads as a real table rather than bare text.
  const statusColIdx = EXCEL_COLUMNS.indexOf("Status");
  requests.forEach((r, rowIdx) => {
    EXCEL_COLUMNS.forEach((_, colIdx) => {
      const addr = XLSX.utils.encode_cell({ r: rowIdx + 1, c: colIdx });
      if (!ws[addr]) return;
      const isStatus = colIdx === statusColIdx;
      const label = STATUS_LABELS[r.status] || r.status;
      ws[addr].s = {
        border: { top: EXCEL_BORDER, bottom: EXCEL_BORDER, left: EXCEL_BORDER, right: EXCEL_BORDER },
        ...(isStatus
          ? {
              font: { bold: true, color: { rgb: EXCEL_STATUS_FONT[label] || "6B7186" } },
              fill: { fgColor: { rgb: EXCEL_STATUS_FILL[label] || "F4F6FB" } },
              alignment: { horizontal: "center" },
            }
          : {}),
      };
    });
  });

  ws["!cols"] = [
    { wch: 12 }, { wch: 13 }, { wch: 12 }, { wch: 18 }, { wch: 18 }, { wch: 12 }, { wch: 12 },
    { wch: 14 }, { wch: 13 }, { wch: 18 }, { wch: 14 }, { wch: 10 }, { wch: 13 }, { wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 10 }, { wch: 12 },
    { wch: 12 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 13 }, { wch: 11 }, { wch: 12 }, { wch: 18 }, { wch: 14 }, { wch: 30 }, { wch: 12 },
  ];
  ws["!autofilter"] = { ref: `A1:${XLSX.utils.encode_col(EXCEL_COLUMNS.length - 1)}1` };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Requests");
  const stamp = new Date().toISOString().slice(0, 10);
  const filename = `PR_PO_Tracker_${stamp}.xlsx`;
  const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });

  let downloads = null;
  try {
    if (window.claude && typeof window.claude.use === "function") {
      downloads = await window.claude.use("downloads");
    }
  } catch (err) {
    downloads = null;
  }

  if (downloads) {
    try {
      await downloads.save({ filename, data: blob });
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") return; // the viewer said no; nothing to report
      appToast(`Could not export Excel: ${(err && err.message) || code || "unknown error"}`);
    }
    return;
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function ImportExcelModal({ onImport, onCancel }) {
  const [pending, setPending] = useState(null);
  const [fileName, setFileName] = useState("");

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setFileName(file.name);
    try {
      const parsed = await parseExcelFile(file);
      setPending(parsed);
    } catch (err) {
      appToast("Could not read the file: " + err.message);
    }
  };

  return (
    <div className="flex flex-col gap-4">
      <div>
        <label className="sap-label">Choose an Excel file</label>
        <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFile} className="sap-input" />
      </div>

      {pending && (
        <div>
          <p className="text-sm mb-2" style={{ color: "var(--sap-gray)" }}>
            Found <span className="font-bold" style={{ color: "var(--sap-text)" }}>{pending.length}</span> row(s) in "{fileName}". Review before confirming:
          </p>
          <div className="sap-card overflow-auto" style={{ maxHeight: "16rem" }}>
            <table className="sap-table">
              <thead>
                <tr>
                  <th>PR</th>
                  <th>PO</th>
                  <th>Owner</th>
                  <th>Status</th>
                  <th>Vendor</th>
                </tr>
              </thead>
              <tbody>
                {pending.map((r) => (
                  <tr key={r.id}>
                    <td>{r.prNumber || "—"}</td>
                    <td>{r.poNumber || "—"}</td>
                    <td>{r.owner || "—"}</td>
                    <td>{STATUS_LABELS[r.status]}</td>
                    <td>{r.vendor || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <div className="flex justify-end gap-2 pt-2">
        <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
        <button
          type="button"
          disabled={!pending}
          onClick={() => onImport(pending)}
          className="sap-btn sap-btn-blue"
        >
          Confirm Import ({pending ? pending.length : 0})
        </button>
      </div>
    </div>
  );
}

// One entry per selected service type: its own vendor, its own PR number
// (each service is its own SAP request tied to its own supplier), and its
// own editable suggested-action checklist.
function makeTypeEntry(type, vendor, customActions) {
  return { vendor: vendor || "", prNumber: "", actionSteps: getActionsForType(type, customActions), newStep: "" };
}

function EmailParserForm({ requests, onSave, onCancel, onContentReplaced }) {
  const [emailText, setEmailText] = useState("");
  const [extracted, setExtracted] = useState(null); // shared fields: owner, requiredDate, budget
  const [selectedTypes, setSelectedTypes] = useState([]);
  const [typeEntries, setTypeEntries] = useState({}); // { Hotel: {vendor, prNumber, actionSteps, newStep}, ... }
  const [customActions, setCustomActions] = useState(loadCustomActions);
  const [attachments, setAttachments] = useState([]);
  const [loadingFile, setLoadingFile] = useState(false);
  const [sourceHash, setSourceHash] = useState("");
  const [suppliers, setSuppliers] = useState(loadSuppliers);

  const knownVendorsAll = useMemo(() => getKnownVendors(requests), [requests]);
  const knownOwners = useMemo(() => getKnownOwners(requests), [requests]);
  const knownBeneficiaries = useMemo(() => getKnownBeneficiaries(requests), [requests]);

  const sample = useSample();
  const [aiBusy, setAiBusy] = useState(false);
  const [ai, setAi] = useState(null); // { summary, city, questions[], suggestions[] }
  // Where the PR stands in this email: "none" | "created" | "approved".
  const [prStage, setPrStage] = useState("none");
  const [prStageSource, setPrStageSource] = useState(""); // "", "email", "ai", "you"
  const prStageByYou = useRef(false);
  const [showDraft, setShowDraft] = useState(false);
  const choosePrStage = (id) => { prStageByYou.current = true; setPrStage(id); setPrStageSource("you"); };
  const aiCtl = useRef(null);

  // Claude reads the raw email the way a person would — handles any phrasing,
  // Arabic or English, forwarded chains — and fills the same fields the
  // rule-based reader does, then says what's still missing and suggests
  // suppliers. Every value it returns is checked before it touches the form.
  const aiExtract = async () => {
    if (!sample || !emailText.trim() || aiBusy) return;
    if (!extracted) extractAndSetForm(emailText);
    aiCtl.current = new AbortController();
    setAiBusy(true);
    const departments = PURCHASING_GROUPS.map((g) => g.label);
    const known = {
      previousRequesters: knownOwners.slice(0, 25),
      previousTravellers: knownBeneficiaries.slice(0, 25),
      previousVendors: knownVendorsAll.slice(0, 30),
      registeredSuppliers: suppliers,
    };
    const prompt = [
      "You help a procurement coordinator log a travel/service request from an email into a tracker, before they raise an SAP Purchase Requisition (PR) and then a Purchase Order (PO).",
      "Read the whole email carefully, the way an experienced coordinator would — including forwarded messages, signatures that reveal the department, and any attachment text. When messages in a thread disagree, the latest one wins. Work out what is actually provided and what is missing.",
      "Read the email below and reply with ONLY one JSON object, exactly this shape:",
      '{"owner":"","beneficiary":"","serviceTypes":["Hotel"],"serviceDateFrom":"","serviceDateTo":"","requiredDate":"","budget":"","department":"","city":"","vendors":{"Hotel":""},"prNumber":"","prStage":"none","prStageEvidence":"","chargeTo":"","projectName":"","network":"","activity":"","costCenter":"","senderName":"","senderEmail":"","summary":"","questionsForSender":[""],"vendorSuggestions":[{"type":"Hotel","name":"","why":"","source":"your list"}]}',
      "Rules:",
      "- owner: the person who asked for the service (never a signature footer, disclaimer or company name). beneficiary: who the service is for (traveller/guest names, comma-separated); \"\" if the same person.",
      '- serviceTypes: every service requested, each one of "Hotel", "Car", "Tickets", "Other".',
      `- Dates as YYYY-MM-DD. Today is ${todayIso()}; resolve relative dates ("next Sunday") against it. Use "" when a date is not stated — never guess.`,
      `- department: exactly one of these values, or "" if the email does not make it clear: ${departments.join(" | ")}.`,
      "- vendors: only suppliers actually named in the email, keyed by service type.",
      "- prNumber: the SAP Purchase Requisition number if the email (or an attachment text) gives one, digits only; otherwise \"\".",
      '- prStage: where the PR stands. "none" = the sender asks the coordinator to start the process/raise the PR (no PR exists yet). "created" = a PR already exists but is not approved yet (or its approval status is not stated). "approved" = the email says the PR is approved/released, so only the PO is left.',
      "- prStageEvidence: the short phrase from the email that shows the PR stage, or \"\".",
      '- chargeTo: who pays. "project" if the cost goes to a project (the email names a project, network, activity or WBS); "cost_center" if it goes to a cost center/department with no project; "" if the email does not make it clear.',
      "- projectName, network, activity, costCenter: exactly as written in the email, otherwise \"\". Never invent them.",
      "- senderName / senderEmail: the person who sent the latest message (the one to reply to), from the From line or signature; \"\" if unknown.",
      "- budget: digits only, or \"\".",
      "- summary: one or two plain sentences on what is being requested, for whom, where and when.",
      "- questionsForSender: short, polite questions for anything missing or ambiguous that only the sender can answer (exact dates, number of nights/rooms, traveller names, city, project/department, preferences). Only if the email says a PR already exists but gives no number, ask for the PR number; otherwise never ask about PR or PO numbers. If it is unclear whether this is charged to a project or a cost center, ask. If it is a project and the Network or Activity number is missing, always ask for it (the PR cannot be created without both). Empty array if nothing is missing.",
      "- vendorSuggestions: up to 3 per requested service that has no vendor yet. Prefer the coordinator's registered or previous suppliers below when they fit the city; set source to \"your list\" for those and \"suggestion\" for general well-known options in that city.",
      "",
      "Coordinator's own data: " + JSON.stringify(known),
      "",
      "EMAIL:",
      emailText.slice(0, 24000),
    ].join("\n");
    try {
      const r = await sample.json(prompt, { signal: aiCtl.current.signal });
      if (!r || typeof r !== "object") throw { code: "invalid_json" };
      const str = (v) => (typeof v === "string" ? v.trim() : "");
      const date = (v) => (ISO_DATE.test(str(v)) ? str(v) : "");
      const types = Array.isArray(r.serviceTypes) ? r.serviceTypes.filter((t) => SERVICE_TYPES.includes(t)) : [];
      const vendors = r.vendors && typeof r.vendors === "object" ? r.vendors : {};
      const dept = departments.includes(str(r.department)) ? str(r.department) : "";

      setExtracted((prev) => {
        const p = prev || {};
        return {
          ...p,
          owner: str(r.owner) || p.owner || "",
          ownerNeedsConfirmation: str(r.owner) ? false : p.ownerNeedsConfirmation,
          beneficiary: str(r.beneficiary) || p.beneficiary || "",
          serviceDateFrom: date(r.serviceDateFrom) || p.serviceDateFrom || "",
          serviceDateTo: date(r.serviceDateTo) || p.serviceDateTo || "",
          requiredDate: date(r.requiredDate) || p.requiredDate || "",
          budget: str(r.budget).replace(/[^\d.]/g, "") || p.budget || "",
          department: dept || p.department || "",
          prNumber: str(r.prNumber) || p.prNumber || "",
          chargeTo: ["project", "cost_center"].includes(str(r.chargeTo)) ? str(r.chargeTo) : (p.chargeTo || ""),
          projectName: str(r.projectName) || p.projectName || "",
          network: str(r.network) || p.network || "",
          activity: str(r.activity) || p.activity || "",
          costCenter: str(r.costCenter) || p.costCenter || "",
          senderName: p.senderName || str(r.senderName),
          senderEmail: p.senderEmail || (/@/.test(str(r.senderEmail)) ? str(r.senderEmail) : ""),
          notes: p.notes || emailText.slice(0, 500),
        };
      });
      if (types.length) {
        setSelectedTypes(types);
        setTypeEntries((prev) => {
          const next = { ...prev };
          types.forEach((t) => {
            const entry = next[t] || makeTypeEntry(t, "", customActions);
            next[t] = { ...entry, vendor: entry.vendor || str(vendors[t]) };
          });
          return next;
        });
      }
      const aiPr = str(r.prNumber).replace(/[^\d]/g, "");
      if (aiPr) {
        setTypeEntries((prev) => {
          const next = { ...prev };
          Object.keys(next).forEach((t) => { if (!next[t].prNumber) next[t] = { ...next[t], prNumber: aiPr }; });
          return next;
        });
      }
      if (PR_STAGE_BY_ID[str(r.prStage)]) {
        // Never overrule a choice the coordinator already made by hand.
        if (!prStageByYou.current) {
          setPrStage(str(r.prStage));
          setPrStageSource("ai");
        }
      }
      setAi({
        prStageEvidence: str(r.prStageEvidence),
        summary: str(r.summary),
        city: str(r.city),
        questions: Array.isArray(r.questionsForSender) ? r.questionsForSender.map(str).filter(Boolean).slice(0, 8) : [],
        suggestions: Array.isArray(r.vendorSuggestions)
          ? r.vendorSuggestions
              .filter((s) => s && SERVICE_TYPES.includes(s.type) && str(s.name))
              .map((s) => ({ type: s.type, name: str(s.name), why: str(s.why), source: str(s.source) }))
              .slice(0, 9)
          : [],
      });
      if (onContentReplaced) onContentReplaced();
    } catch (e) {
      const m = sampleErrorText(e);
      if (m) appToast(m);
    } finally {
      setAiBusy(false);
    }
  };

  // The AI reads every new email on its own — no extra click. It runs once per
  // email (keyed by the email's fingerprint); "Re-read" runs it again on demand.
  const aiAutoFor = useRef("");
  useEffect(() => {
    if (!sample || !sourceHash || !extracted || aiBusy) return;
    if (aiAutoFor.current === sourceHash) return;
    aiAutoFor.current = sourceHash;
    aiExtract();
  }, [sample, sourceHash, extracted]);

  const registerSupplier = (type, vendor) => {
    if (!vendor || !vendor.trim()) return;
    const list = getRegisteredSuppliers(suppliers, type);
    if (list.some((v) => v.toLowerCase() === vendor.trim().toLowerCase())) return;
    const updated = { ...suppliers, [type]: [...list, vendor.trim()] };
    setSuppliers(updated);
    saveSuppliers(updated);
    appToast(`Registered "${vendor.trim()}" as an approved ${type} supplier`);
  };

  const extractAndSetForm = (text) => {
    setAi(null);
    setSourceHash(fingerprintEmail(text));
    const detectedTypes = detectServiceTypes(text);
    const primaryType = guessServiceType(text);
    const knownForGuess = getKnownVendors(requests, primaryType);
    const data = extractFromEmail(text, knownForGuess.length ? knownForGuess : knownVendorsAll, knownOwners, knownBeneficiaries);

    setExtracted({
      owner: data.owner,
      ownerNeedsConfirmation: data.ownerNeedsConfirmation,
      ownerGuess: data.ownerGuess,
      beneficiary: data.beneficiary,
      requiredDate: data.requiredDate,
      serviceDateFrom: data.serviceDateFrom,
      serviceDateTo: data.serviceDateTo,
      budget: data.budget,
      department: "",
      prNumber: data.prNumber,
      ...detectCharge(text),
      ...(() => { const h = parseEmailHeader(text); return { senderName: h.name, senderEmail: h.email, emailSubject: h.subject }; })(),
      notes: text.slice(0, 500),
    });
    setShowDraft(false);
    const guessedStage = detectPrStage(text, data.prNumber);
    prStageByYou.current = false;
    setPrStage(guessedStage);
    setPrStageSource(guessedStage === "none" ? "" : "email");
    setSelectedTypes(detectedTypes);
    const entries = {};
    detectedTypes.forEach((type) => {
      // Only the type the single-guess extractor actually landed on gets the
      // auto-detected vendor/PR — the others are separate suppliers you fill in.
      entries[type] = makeTypeEntry(type, type === primaryType ? data.vendor : "", customActions);
      if (type === primaryType && data.prNumber) entries[type].prNumber = data.prNumber;
    });
    setTypeEntries(entries);
  };

  const handleExtract = async () => {
    if (!emailText.trim()) {
      appToast("Please paste the email content first");
      return;
    }
    const seen = findRequestsFromSameEmail(fingerprintEmail(emailText), requests);
    if (seen.length) {
      const when = seen[0].createdAt ? String(seen[0].createdAt).slice(0, 10) : "earlier";
      const proceed = await appConfirm(
        `You already logged this exact email on ${when}. It created ${seen.length} request(s): ` +
        `${seen.map((r) => r.serviceType + (r.poNumber ? ` (PO ${r.poNumber})` : "")).join(", ")}. ` +
        `Log it again anyway?`
      );
      if (!proceed) return;
    }
    extractAndSetForm(emailText);
    if (onContentReplaced) onContentReplaced();
  };

  // Clears everything belonging to the email currently under review, so a
  // newly loaded email never inherits the previous one's attachment, vendor
  // or service selection.
  const resetForNewEmail = () => {
    setEmailText("");
    setExtracted(null);
    setSelectedTypes([]);
    setTypeEntries({});
    setAttachments([]);
    setSourceHash("");
    setAi(null);
    setPrStage("none");
    setPrStageSource("");
    prStageByYou.current = false;
    setShowDraft(false);
    aiAutoFor.current = "";
    if (aiCtl.current) aiCtl.current.abort();
  };

  const handleEmailFile = async (e) => {
    const file = e.target.files[0];
    // Reset the input right away: it lets the same file be picked again after
    // a mistake, and avoids touching the event after the awaits below.
    e.target.value = "";
    if (!file) return;

    // Loading a second email replaces the one being reviewed — say so instead
    // of silently swapping the content out from under the user.
    if (extracted) {
      const proceed = await appConfirm(
        `You're still reviewing an email that hasn't been saved yet. Loading "${file.name}" will replace it — save the current one first if you need it. Continue?`
      );
      if (!proceed) return;
    }

    setLoadingFile(true);
    try {
      const text = await readEmailFile(file);
      const fileAttachment = await ingestAttachment(file, text);

      setEmailText(text);
      setAttachments([fileAttachment]);
      if (text.trim()) {
        const seen = findRequestsFromSameEmail(fingerprintEmail(text), requests);
        if (seen.length) {
          const when = seen[0].createdAt ? String(seen[0].createdAt).slice(0, 10) : "earlier";
          const proceed = await appConfirm(
            `You already logged this exact email on ${when}. It created ${seen.length} request(s): ` +
            `${seen.map((r) => r.serviceType + (r.poNumber ? ` (PO ${r.poNumber})` : "")).join(", ")}. ` +
            `Log it again anyway?`
          );
          if (!proceed) { setLoadingFile(false); return; }
        }
        extractAndSetForm(text);
        if (onContentReplaced) onContentReplaced();
        appToast(`Loaded "${file.name}" — review the extracted fields below`);
      } else {
        setExtracted(null);
        setSelectedTypes([]);
        setTypeEntries({});
        appToast(`Loaded "${file.name}" but found no readable text in it — paste the content manually instead`);
      }
    } catch (err) {
      appToast("Could not read this email file: " + err.message);
    } finally {
      setLoadingFile(false);
    }
  };

  const handleStartOver = async () => {
    if (extracted) {
      const proceed = await appConfirm("Discard the email you're reviewing and start over?");
      if (!proceed) return;
    }
    resetForNewEmail();
    if (onContentReplaced) onContentReplaced();
  };

  const toggleType = (type) => {
    if (selectedTypes.includes(type)) {
      setSelectedTypes(selectedTypes.filter((t) => t !== type));
    } else {
      setSelectedTypes([...selectedTypes, type]);
      if (!typeEntries[type]) {
        setTypeEntries({ ...typeEntries, [type]: makeTypeEntry(type, "", customActions) });
      }
    }
  };

  const updateEntry = (type, patch) => setTypeEntries({ ...typeEntries, [type]: { ...typeEntries[type], ...patch } });

  const updateStep = (type, i, value) => {
    const steps = typeEntries[type].actionSteps.map((s, idx) => (idx === i ? value : s));
    updateEntry(type, { actionSteps: steps });
  };
  const removeStep = (type, i) => updateEntry(type, { actionSteps: typeEntries[type].actionSteps.filter((_, idx) => idx !== i) });
  const addStep = (type) => {
    const text = (typeEntries[type].newStep || "").trim();
    if (!text) return;
    updateEntry(type, { actionSteps: [...typeEntries[type].actionSteps, text], newStep: "" });
  };
  const saveActionsAsDefault = (type) => {
    const updated = { ...customActions, [type]: typeEntries[type].actionSteps };
    setCustomActions(updated);
    saveCustomActions(updated);
    appToast(`Saved this checklist as the default for future "${type}" requests`);
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!extracted.owner) {
      appToast("Please enter the requester's name");
      return;
    }
    if (selectedTypes.length === 0) {
      appToast("Select at least one service this email is requesting");
      return;
    }
    const stage = PR_STAGE_BY_ID[prStage] || PR_STAGES[0];
    const prFor = (type) => (typeEntries[type].prNumber || "").trim() || (stage.id !== "none" ? (extracted.prNumber || "").trim() : "");
    if (stage.id !== "none") {
      const noPr = selectedTypes.filter((type) => !prFor(type));
      if (noPr.length) {
        appToast(`Enter the PR number from the email for: ${noPr.join(", ")} — or choose "No PR yet" if it hasn't been raised.`);
        return;
      }
    }
    const batchId = selectedTypes.length > 1 ? uid() : null;
    const emailSummary = summarizeEmail({
      owner: extracted.owner,
      beneficiary: extracted.beneficiary,
      selectedTypes,
      budget: extracted.budget,
      requiredDate: extracted.requiredDate,
      serviceDateFrom: extracted.serviceDateFrom,
      serviceDateTo: extracted.serviceDateTo,
      prNumber: extracted.prNumber,
    });
    const forms = selectedTypes.map((type) => ({
      ...emptyForm(),
      owner: extracted.owner,
      beneficiary: extracted.beneficiary || "",
      requiredDate: extracted.requiredDate,
      serviceDateFrom: extracted.serviceDateFrom || "",
      serviceDateTo: extracted.serviceDateTo || "",
      budget: extracted.budget,
      department: extracted.department || "",
      notes: extracted.notes,
      attachments,
      serviceType: type,
      vendor: typeEntries[type].vendor,
      prNumber: prFor(type),
      chargeTo: extracted.chargeTo || "",
      projectName: extracted.chargeTo === "project" ? (extracted.projectName || "").trim() : "",
      network: extracted.chargeTo === "project" ? (extracted.network || "").trim() : "",
      activity: extracted.chargeTo === "project" ? (extracted.activity || "").trim() : "",
      costCenter: extracted.chargeTo === "cost_center" ? (extracted.costCenter || "").trim() : "",
      senderName: extracted.senderName || "",
      senderEmail: extracted.senderEmail || "",
      emailSubject: extracted.emailSubject || "",
      status: stage.status,
      waitingOn: stage.waitingOn,
      prRaisedBy: stage.raisedBy,
      batchId,
      batchSize: selectedTypes.length,
      emailSummary,
      sourceHash,
    }));

    // A follow-up email about a PR that's already in the tracker should update
    // that request, not create a second one.
    const knownPr = forms
      .map((f) => ({ form: f, hit: f.prNumber && requests.find((r) => (r.prNumber || "").trim() === f.prNumber.trim()) }))
      .find((x) => x.hit);
    if (knownPr) {
      const { hit } = knownPr;
      const proceed = await appConfirm(
        `PR ${hit.prNumber} is already in the tracker (${hit.serviceType} for ${hit.beneficiary || hit.owner}, status ${STATUS_LABELS[hit.status]}). ` +
        `If this email is a follow-up, cancel and use "Update Status" on that request instead. Save a new request anyway?`
      );
      if (!proceed) return;
    }

    // Catch the same trip being logged twice — the usual cause of a duplicate
    // PO going out to the same supplier.
    const clashes = forms
      .map((f) => ({ form: f, dup: findPossibleDuplicates(f, requests)[0] }))
      .filter((x) => x.dup);
    if (clashes.length) {
      const { form, dup } = clashes[0];
      const proceed = await appConfirm(
        `A ${form.serviceType} request for ${dup.beneficiary || dup.owner} already covers overlapping dates ` +
        `(${dup.serviceDateFrom || "?"} → ${dup.serviceDateTo || "?"}, status ${STATUS_LABELS[dup.status]}` +
        `${dup.poNumber ? `, PO ${dup.poNumber}` : ""}). Save anyway?`
      );
      if (!proceed) return;
    }

    onSave(forms);
  };

  return (
    <div className="flex flex-col gap-4">
      <div>
        <div className="flex items-center justify-between mb-1">
          <label className="sap-label" style={{ marginBottom: 0 }}>Load the email file directly (.msg from Outlook, or .eml)</label>
          {extracted && (
            <button type="button" onClick={handleStartOver} className="sap-link">Start over</button>
          )}
        </div>
        <input type="file" accept=".msg,.eml" onChange={handleEmailFile} className="sap-input" disabled={loadingFile} />
        {loadingFile && <p className="text-xs mt-1" style={{ color: "var(--sap-blue)" }}>Reading and extracting the email…</p>}
        {extracted && !loadingFile && (
          <p className="text-xs mt-1" style={{ color: "var(--sap-gray)" }}>
            One email is under review below. Save it first, or load another file to replace it.
          </p>
        )}
      </div>

      <div>
        <label className="sap-label">...or paste the email content here</label>
        <textarea
          value={emailText}
          onChange={(e) => setEmailText(e.target.value)}
          rows="6"
          placeholder="Paste the email text from the department or SAP here..."
          className="sap-textarea"
        ></textarea>
        <div className="flex justify-end gap-2 mt-2">
          <button
            type="button"
            onClick={handleExtract}
            disabled={aiBusy || !emailText.trim()}
            className="sap-btn sap-btn-blue"
            style={sample ? { background: "linear-gradient(135deg, #3D5AFE, #8B5CF6)", border: "none" } : undefined}
            title={sample ? "Claude reads the whole email, fills the fields, lists what's there and what's missing, and drafts your questions to the sender" : "Reads the email with built-in rules"}
          >
            {aiBusy ? "✨ Reading the email…" : sample ? "✨ Read the email" : "🔍 Read the email"}
          </button>
        </div>
      </div>

      <AttachmentPicker attachments={attachments} onChange={setAttachments} />

      {extracted && (
        <form onSubmit={handleSubmit} className="flex flex-col gap-4" style={{ borderTop: "1px solid var(--sap-border)", paddingTop: "1rem" }}>
          {findRequestsFromSameEmail(sourceHash, requests).length > 0 && (
            <div className="p-3 text-sm" style={{ background: "var(--sap-red-bg)", border: "1px solid #F5C2C2", borderRadius: "2px", color: "var(--sap-red)" }}>
              <p className="font-semibold">⚠️ This exact email is already logged</p>
              <p className="mt-1">
                It created {findRequestsFromSameEmail(sourceHash, requests).length} request(s):{" "}
                {findRequestsFromSameEmail(sourceHash, requests).map((r) => r.serviceType).join(", ")}.
                Saving again will duplicate them.
              </p>
            </div>
          )}

          {aiBusy && (
            <div className="p-3 text-sm flex items-center gap-2" style={{ background: "#EEF1FF", border: "1px solid #DCE2FF", borderRadius: "12px", color: "var(--sap-blue)" }}>
              <AiBadge /> <span>Claude is reading the email… this usually takes 10–40 seconds.</span>
              <button type="button" onClick={() => aiCtl.current && aiCtl.current.abort()} className="sap-link" style={{ marginInlineStart: "auto" }}>Stop</button>
            </div>
          )}

          {sample && !ai && !aiBusy && (
            <div className="p-3 text-sm flex items-center gap-3" style={{ background: "#F7F8FF", border: "1px dashed #C9D1FF", borderRadius: "12px" }}>
              <AiBadge />
              <span style={{ color: "var(--sap-text)" }}>Fields came from the quick rule-based reader. Let Claude read the full email for a more complete result.</span>
              <button type="button" onClick={aiExtract} className="sap-btn sap-btn-outline" style={{ marginInlineStart: "auto" }}>✨ Read with AI</button>
            </div>
          )}

          {(() => {
            const x = extracted;
            const has = (v) => !!String(v || "").trim();
            const datesVal = x.serviceDateFrom
              ? `${x.serviceDateFrom}${x.serviceDateTo ? " → " + x.serviceDateTo : ""}`
              : (x.requiredDate ? `needed by ${x.requiredDate}` : "");
            const items = [
              { label: "Requester", value: x.owner, required: true, you: true },
              { label: "Traveller / for", value: x.beneficiary || (x.owner ? `${x.owner} (same person)` : ""), required: true, ask: "The full name(s) of the traveller(s) / guest(s)", kw: /name|traveller|traveler|guest|مسافر|اسم/i },
              { label: "Service", value: selectedTypes.join(", "), required: true, ask: "Which service is needed (hotel, car rental, tickets…)", kw: /service|hotel|car|ticket|خدمة/i },
              { label: "Dates", value: datesVal, required: true, ask: "The exact dates (check-in and check-out, or departure and return)", kw: /date|check-?in|check-?out|depart|تاريخ/i },
              ...(ai && ai.city ? [{ label: "City", value: ai.city }] : []),
              { label: "Department", value: x.department, required: true, ask: "Which department this request is for", kw: /department|قسم|ادارة|إدارة/i },
              { label: "Charged to", value: x.chargeTo === "project" ? "Project" : x.chargeTo === "cost_center" ? "Cost Center" : "", required: true, ask: "Is this charged to a project or to a cost center?", kw: /cost cent|project|مشروع|تكلفة/i },
              ...(x.chargeTo === "project"
                ? [
                    { label: "Project", value: x.projectName, ask: "The project name/number", kw: /project name|project number|اسم المشروع/i },
                    { label: "Network", value: x.network, required: true, blocker: true, ask: "The project's Network number (needed to raise the PR)", kw: /network|نتورك|شبكة/i },
                    { label: "Activity", value: x.activity, required: true, blocker: true, ask: "The Activity number under that Network (needed to raise the PR)", kw: /activity|اكتيفيتي|نشاط/i },
                  ]
                : []),
              ...(x.chargeTo === "cost_center" && has(x.costCenter) ? [{ label: "Cost Center", value: x.costCenter }] : []),
              ...(prStage !== "none"
                ? selectedTypes.map((type) => ({
                    label: `PR number${selectedTypes.length > 1 ? ` (${type})` : ""}`,
                    value: (typeEntries[type] && typeEntries[type].prNumber) || x.prNumber || "",
                    required: true,
                    ask: "The PR number you raised for this request",
                    kw: /\bPR\b|requisition/i,
                  }))
                : []),
              ...selectedTypes.map((type) => ({
                label: `${type} supplier`,
                value: (typeEntries[type] && typeEntries[type].vendor) || "",
                ask: `Your preferred ${type.toLowerCase()} supplier, if you have one in mind`,
                kw: /supplier|vendor|hotel name|مورد/i,
              })),
              ...(has(x.budget) ? [{ label: "Budget", value: x.budget }] : []),
            ];
            const found = items.filter((i) => has(i.value));
            const missing = items.filter((i) => !has(i.value));
            const missingRequired = missing.filter((i) => i.required);
            const blockers = missing.filter((i) => i.blocker);
            const aiQs = ai ? ai.questions : [];
            // The AI's questions come first (better worded); rule-based ones fill
            // in whatever it didn't already cover.
            const questions = [
              ...aiQs,
              ...missing.filter((i) => i.ask && !(i.kw && aiQs.some((q) => i.kw.test(q)))).map((i) => i.ask),
            ];
            const lowSignal = emailText.trim().length > 0 && emailText.replace(/\\par[d]?|\\[a-z]+\d*|[{}]/gi, "").trim().length < 40;
            const target = prStage === "approved" ? "PO" : "PR";
            const verdict = blockers.length
              ? { tone: "red", text: `⛔ Can't raise the ${target} yet — ${blockers.map((b) => b.label).join(" & ")} missing` }
              : missingRequired.length
              ? { tone: "amber", text: `⚠️ Almost there — ${missingRequired.length} required item${missingRequired.length === 1 ? "" : "s"} missing` }
              : { tone: "green", text: `✅ Everything needed for the ${target} is here` };
            const toneStyle = {
              red: { background: "var(--sap-red-bg)", color: "var(--sap-red)", border: "1px solid #F5C2C2" },
              amber: { background: "var(--sap-amber-bg)", color: "var(--sap-amber)", border: "1px solid #F5DFA6" },
              green: { background: "var(--sap-green-bg)", color: "var(--sap-green)", border: "1px solid #BFE3CB" },
            }[verdict.tone];

            // What the letter asks for: everything only the sender can supply
            // and that matters for the PR (optional supplier preference left out).
            const draftLabels = missing.filter((i) => !i.you && (i.required || i.label === "Project")).map((i) => i.label);
            const draftQuestions = [
              ...aiQs,
              ...missing
                .filter((i) => draftLabels.includes(i.label) && !(i.kw && aiQs.some((q) => i.kw.test(q))))
                .map((i) => missingAsk(i.label, "en")),
            ];
            const sapDates = x.serviceDateFrom
              ? `${toSapDate(x.serviceDateFrom)}${x.serviceDateTo ? " – " + toSapDate(x.serviceDateTo) : ""}`
              : (x.requiredDate ? toSapDate(x.requiredDate) : "");

            return (
              <div className="p-4 text-sm" style={{ background: "linear-gradient(145deg, #F1F3FF, #FAF7FF)", border: "1px solid #DCE2FF", borderRadius: "16px" }}>
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  {sample ? <AiBadge>✨ AI reading</AiBadge> : <span className="font-semibold" style={{ color: "var(--sap-text)" }}>🔍 Quick read</span>}
                  {aiBusy && <span className="text-xs font-semibold" style={{ color: "#3D5AFE" }}>Claude is reading the email…</span>}
                  {ai && ai.city && <span className="text-xs" style={{ color: "var(--sap-gray)" }}>📍 {ai.city}</span>}
                  {sample && !aiBusy && (
                    <button type="button" onClick={aiExtract} className="sap-link" style={{ marginInlineStart: "auto" }}>{ai ? "↻ Re-read" : "✨ Read with AI"}</button>
                  )}
                </div>
                {!sample && (
                  <p className="text-xs mb-2" style={{ color: "var(--sap-gray)" }}>
                    Read by rules only. For a real read (meaning, missing items, questions for the sender), turn on AI: 🤖 AI Assistant → API key.
                  </p>
                )}
                <p className="mb-3" style={{ color: "var(--sap-text)" }} dir="auto">
                  {(ai && ai.summary) || summarizeEmail({ owner: x.owner, beneficiary: x.beneficiary, selectedTypes, budget: x.budget, requiredDate: x.requiredDate, serviceDateFrom: x.serviceDateFrom, serviceDateTo: x.serviceDateTo, prNumber: x.prNumber })}
                </p>
                {lowSignal && (
                  <p className="font-semibold mb-2" style={{ color: "var(--sap-red)" }}>
                    ⚠️ This email's text looks unreadable or mostly empty (possibly an unsupported Rich Text format) — check the fields carefully, or ask the sender directly.
                  </p>
                )}
                <div className="px-3 py-2 mb-3 font-semibold" style={{ ...toneStyle, borderRadius: 10 }}>{verdict.text}</div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
                  <div className="p-3" style={{ background: "#fff", border: "1px solid var(--sap-border)", borderRadius: 12 }}>
                    <p className="font-semibold mb-1.5" style={{ color: "var(--sap-green)" }}>✅ Found in the email ({found.length})</p>
                    <ul className="flex flex-col gap-1">
                      {found.map((i) => (
                        <li key={i.label} className="flex gap-2">
                          <span style={{ color: "var(--sap-gray)", minWidth: 110 }}>{i.label}</span>
                          <span className="font-semibold" style={{ color: "var(--sap-text)" }} dir="auto">{String(i.value)}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div className="p-3" style={{ background: "#fff", border: `1px solid ${missing.length ? "#F5C2C2" : "var(--sap-border)"}`, borderRadius: 12 }}>
                    <p className="font-semibold mb-1.5" style={{ color: missing.length ? "var(--sap-red)" : "var(--sap-green)" }}>
                      {missing.length ? `❌ Missing (${missing.length})` : "❌ Missing — nothing 🎉"}
                    </p>
                    <ul className="flex flex-col gap-1">
                      {missing.map((i) => (
                        <li key={i.label} className="flex items-center gap-2 flex-wrap">
                          <span className="font-semibold" style={{ color: i.blocker ? "var(--sap-red)" : "var(--sap-text)" }}>{i.label}</span>
                          {i.blocker && <span className="text-xs font-bold px-2" style={{ background: "var(--sap-red-bg)", color: "var(--sap-red)", borderRadius: 999 }}>blocks the PR</span>}
                          {!i.blocker && i.required && <span className="text-xs px-2" style={{ background: "var(--sap-amber-bg)", color: "var(--sap-amber)", borderRadius: 999 }}>required</span>}
                          {!i.required && <span className="text-xs" style={{ color: "var(--sap-gray)" }}>optional</span>}
                          <span className="text-xs" style={{ color: "var(--sap-gray)" }}>{i.you ? "· you fill it in" : "· ask the sender"}</span>
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>

                {questions.length > 0 && (
                  <div className="mb-3">
                    <p className="font-semibold mb-1" style={{ color: "var(--sap-text)" }}>❓ What to ask the sender</p>
                    <ol className="flex flex-col gap-0.5" style={{ color: "var(--sap-text)", paddingInlineStart: 18, listStyle: "decimal" }}>
                      {questions.map((q, i) => <li key={i} dir="auto">{q}</li>)}
                    </ol>
                    {!showDraft ? (
                      <button
                        type="button"
                        className="sap-btn mt-2"
                        onClick={() => setShowDraft(true)}
                        style={{ background: "linear-gradient(135deg, #3D5AFE, #8B5CF6)", color: "#fff", border: "none", boxShadow: "0 8px 20px rgba(61,90,254,.25)" }}
                      >
                        ✉️ {sample ? "Draft the email to the sender with AI" : "Draft the email to the sender"}
                      </button>
                    ) : (
                      <div className="mt-2">
                        <MissingInfoDraft
                          key={sourceHash}
                          toName={x.senderName || x.owner}
                          toEmail={x.senderEmail}
                          subject={x.emailSubject}
                          facts={{ service: selectedTypes.join(" & "), traveller: x.beneficiary || "", dates: sapDates, project: x.projectName || "", network: x.network || "", requester: x.owner, city: (ai && ai.city) || "" }}
                          questions={draftQuestions}
                          missingLabels={draftLabels}
                          blocker={blockers.length > 0}
                        />
                        <button type="button" onClick={() => setShowDraft(false)} className="sap-link mt-1">Hide the email</button>
                      </div>
                    )}
                  </div>
                )}

              {ai && ai.suggestions.length > 0 && (
                <div>
                  <p className="font-semibold mb-1.5" style={{ color: "var(--sap-text)" }}>🏨 Supplier suggestions — click to use:</p>
                  <div className="flex flex-col gap-1.5">
                    {ai.suggestions.map((s, i) => (
                      <button
                        key={i}
                        type="button"
                        onClick={() => {
                          if (!selectedTypes.includes(s.type)) setSelectedTypes((prev) => [...prev, s.type]);
                          setTypeEntries((prev) => ({ ...prev, [s.type]: { ...(prev[s.type] || makeTypeEntry(s.type, "", customActions)), vendor: s.name } }));
                          appToast(`${s.type} supplier set to "${s.name}"`);
                        }}
                        className="text-left px-3 py-2"
                        style={{ background: "#fff", border: "1px solid var(--sap-border)", borderRadius: 10, cursor: "pointer" }}
                      >
                        <span className="font-semibold" style={{ color: "var(--sap-text)" }}>{s.name}</span>
                        <span className="text-xs" style={{ color: "var(--sap-gray)" }}> · {s.type}{s.source ? ` · ${s.source}` : ""}</span>
                        {s.why && <div className="text-xs" style={{ color: "var(--sap-gray)" }}>{s.why}</div>}
                      </button>
                    ))}
                  </div>
                  <p className="text-xs mt-1.5" style={{ color: "var(--sap-gray)" }}>General suggestions are not verified — confirm availability and rates before booking.</p>
                </div>
              )}
              </div>
            );
          })()}

          <div className="p-3" style={{ background: "#fff", border: "1px solid var(--sap-border)", borderRadius: 14 }}>
            <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
              <p className="font-semibold text-sm" style={{ color: "var(--sap-text)" }}>📌 Where is the PR for this request?</p>
              {prStageSource === "email" && <span className="text-xs" style={{ color: "var(--sap-gray)" }}>Detected from the email — confirm it</span>}
              {prStageSource === "ai" && <AiBadge>✨ Read by AI — confirm it</AiBadge>}
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
              {PR_STAGES.map((st) => {
                const on = prStage === st.id;
                const tone = STATUS_INLINE_STYLE[st.status];
                return (
                  <button
                    key={st.id}
                    type="button"
                    onClick={() => choosePrStage(st.id)}
                    className="text-left p-3"
                    style={{
                      borderRadius: 12,
                      cursor: "pointer",
                      background: on ? tone.background : "#fff",
                      border: `2px solid ${on ? tone.color : "var(--sap-border)"}`,
                      boxShadow: on ? "0 6px 16px rgba(16,24,40,.08)" : "none",
                    }}
                  >
                    <div className="text-sm font-semibold" style={{ color: on ? tone.color : "var(--sap-text)" }}>{st.icon} {st.title}</div>
                    <div className="text-xs mt-1" style={{ color: "var(--sap-gray)" }}>{st.hint}</div>
                  </button>
                );
              })}
            </div>
            {ai && ai.prStageEvidence && prStage !== "none" && (
              <p className="text-xs mt-2" style={{ color: "var(--sap-gray)" }} dir="auto">From the email: “{ai.prStageEvidence}”</p>
            )}
            {prStage !== "none" && (
              <p className="text-xs mt-2" style={{ color: "var(--sap-blue-dark)" }}>
                The requester already raised this PR, so you won't create it again — enter its number in each service below and the tracker will follow it up{prStage === "approved" ? " and guide you to create the PO" : " until it's approved"}.
              </p>
            )}
          </div>

          <div className="p-3" style={{ background: "#fff", border: "1px solid var(--sap-border)", borderRadius: 14 }}>
            <div className="flex items-center justify-between gap-2 mb-2 flex-wrap">
              <p className="font-semibold text-sm" style={{ color: "var(--sap-text)" }}>💳 Charged to</p>
              {extracted.chargeTo && <span className="text-xs" style={{ color: "var(--sap-gray)" }}>{ai ? "Read by AI" : "Detected from the email"} — confirm it</span>}
            </div>
            <ChargeFields
              value={extracted}
              onChange={(v) => setExtracted((prev) => ({ ...prev, chargeTo: v.chargeTo, projectName: v.projectName, network: v.network, activity: v.activity, costCenter: v.costCenter }))}
            />
          </div>

          <div className="sap-panel-info p-3 text-sm" style={{ color: "var(--sap-blue-dark)" }}>
            <p className="font-semibold mb-2">
              🤖 Confirm or adjust which services apply. Each checked service becomes its own tracked request (its own supplier, PR, and PO), since they don't share the same approval.
            </p>
            <div className="flex flex-wrap gap-3">
              {SERVICE_TYPES.filter((s) => s !== "Other").concat("Other").map((type) => (
                <label key={type} className="flex items-center gap-1.5 text-sm" style={{ color: "var(--sap-text)" }}>
                  <input type="checkbox" checked={selectedTypes.includes(type)} onChange={() => toggleType(type)} />
                  {type}
                </label>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="sap-label">Owner (requester) *</label>
              <input
                value={extracted.owner}
                onChange={(e) => setExtracted({ ...extracted, owner: e.target.value, ownerNeedsConfirmation: false })}
                className="sap-input"
                style={!extracted.owner ? { borderColor: "var(--sap-red)" } : undefined}
                placeholder="Select or type the requester's name"
                required
              />
              {extracted.ownerNeedsConfirmation && (
                <p className="text-xs mt-1 font-semibold" style={{ color: "var(--sap-red)" }}>
                  ⚠️ Could not confirm the owner from this email (found "{extracted.ownerGuess}" — might just be a signature/footer line). Please pick or type the real requester below.
                </p>
              )}
              {knownOwners.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                  <span className="text-xs" style={{ color: "var(--sap-gray)" }}>Previous requesters:</span>
                  {knownOwners.slice(0, 8).map((o) => (
                    <button
                      type="button"
                      key={o}
                      onClick={() => setExtracted({ ...extracted, owner: o, ownerNeedsConfirmation: false })}
                      className="text-xs px-2 py-0.5"
                      style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-text)" }}
                    >
                      {o}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div>
              <label className="sap-label">Beneficiary / traveller (who the service is for)</label>
              <input
                value={extracted.beneficiary || ""}
                onChange={(e) => setExtracted({ ...extracted, beneficiary: e.target.value })}
                className="sap-input"
                placeholder="Leave blank if the requester is also the traveller"
              />
              <p className="text-xs mt-1" style={{ color: "var(--sap-gray)" }}>
                Invoices arrive under this name months later — filling it in is what makes them findable.
              </p>
              {knownBeneficiaries.length > 0 && (
                <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                  <span className="text-xs" style={{ color: "var(--sap-gray)" }}>Previous travellers:</span>
                  {knownBeneficiaries.slice(0, 8).map((b) => (
                    <button
                      type="button"
                      key={b}
                      onClick={() => setExtracted({ ...extracted, beneficiary: b })}
                      className="text-xs px-2 py-0.5"
                      style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-text)" }}
                    >
                      {b}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <div>
              <label className="sap-label">Service start (check-in / departure)</label>
              <input type="date" value={extracted.serviceDateFrom || ""} onChange={(e) => setExtracted({ ...extracted, serviceDateFrom: e.target.value })} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Service end (check-out / return)</label>
              <input type="date" value={extracted.serviceDateTo || ""} onChange={(e) => setExtracted({ ...extracted, serviceDateTo: e.target.value })} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Required by (when you need it done)</label>
              <input type="date" value={extracted.requiredDate} onChange={(e) => setExtracted({ ...extracted, requiredDate: e.target.value })} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Budget (shared, split it manually per request if needed)</label>
              <input type="number" value={extracted.budget} onChange={(e) => setExtracted({ ...extracted, budget: e.target.value })} className="sap-input" />
            </div>
            <div>
              <label className="sap-label">Department / Project</label>
              <select
                value={extracted.department || ""}
                onChange={(e) => setExtracted({ ...extracted, department: e.target.value })}
                className="sap-select"
              >
                <option value="">— Select —</option>
                {PURCHASING_GROUPS.map((g) => <option key={g.code} value={g.label}>{g.label} ({g.code})</option>)}
              </select>
            </div>
          </div>

          {selectedTypes.map((type) => {
            const entry = typeEntries[type];
            if (!entry) return null;
            const registered = getRegisteredSuppliers(suppliers, type);
            const learned = getKnownVendors(requests, type);
            const registeredLower = registered.map((v) => v.toLowerCase());
            const extraLearned = learned.filter((v) => !registeredLower.includes(v.toLowerCase()));
            const isUnregistered = entry.vendor.trim() && registered.length > 0 && !registeredLower.includes(entry.vendor.trim().toLowerCase());
            return (
              <div key={type} className="sap-card p-3" style={{ borderTop: "3px solid var(--sap-blue)" }}>
                <p className="font-semibold mb-2" style={{ color: "var(--sap-text)" }}>🧾 {type} request</p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-3">
                  <div>
                    <label className="sap-label">Vendor / Supplier</label>
                    <input value={entry.vendor} onChange={(e) => updateEntry(type, { vendor: e.target.value })} className="sap-input" />
                    {(registered.length > 0 || extraLearned.length > 0) && (
                      <div className="flex flex-wrap gap-1 mt-1.5 items-center">
                        <span className="text-xs" style={{ color: "var(--sap-gray)" }}>
                          {registered.length > 0 ? "Recommended (registered):" : "Usual vendors:"}
                        </span>
                        {registered.slice(0, 6).map((v) => (
                          <button
                            type="button"
                            key={v}
                            onClick={() => updateEntry(type, { vendor: v })}
                            className="text-xs px-2 py-0.5"
                            style={{ background: "var(--sap-green-bg)", border: "1px solid #BFE3CB", borderRadius: "10px", color: "var(--sap-green)" }}
                          >
                            ⭐ {v}
                          </button>
                        ))}
                        {extraLearned.slice(0, 4).map((v) => (
                          <button
                            type="button"
                            key={v}
                            onClick={() => updateEntry(type, { vendor: v })}
                            className="text-xs px-2 py-0.5"
                            style={{ background: "#F5F6F7", border: "1px solid var(--sap-border)", borderRadius: "10px", color: "var(--sap-text)" }}
                          >
                            {v}
                          </button>
                        ))}
                      </div>
                    )}
                    {isUnregistered && (
                      <div className="mt-1.5 text-xs font-semibold flex items-center gap-2" style={{ color: "var(--sap-orange)" }}>
                        <span>⚠️ "{entry.vendor}" isn't on your registered {type} supplier list.</span>
                        <button type="button" onClick={() => registerSupplier(type, entry.vendor)} className="sap-link">+ Register it</button>
                      </div>
                    )}
                  </div>
                  <div>
                    <label className="sap-label">{prStage === "none" ? "PR Number (after you create it)" : "PR Number (from the email) *"}</label>
                    <input
                      value={entry.prNumber}
                      onChange={(e) => updateEntry(type, { prNumber: e.target.value })}
                      className="sap-input"
                      placeholder={prStage === "none" ? "Leave empty for now" : "e.g. 1000234567"}
                      style={prStage !== "none" && !entry.prNumber.trim() ? { borderColor: "var(--sap-red)" } : undefined}
                    />
                  </div>
                </div>

                <p className="text-sm font-semibold mb-1" style={{ color: "var(--sap-blue-dark)" }}>💡 Suggested actions:</p>
                <ul className="space-y-1">
                  {entry.actionSteps.map((a, i) => (
                    <li key={i} className="flex items-center gap-2">
                      <span style={{ color: "var(--sap-blue)" }}>{i + 1}.</span>
                      <input
                        value={a}
                        onChange={(e) => updateStep(type, i, e.target.value)}
                        className="sap-input"
                        style={{ flex: 1 }}
                      />
                      <button type="button" onClick={() => removeStep(type, i)} className="sap-link-danger">Remove</button>
                    </li>
                  ))}
                </ul>
                <div className="flex gap-2 mt-2">
                  <input
                    value={entry.newStep}
                    onChange={(e) => updateEntry(type, { newStep: e.target.value })}
                    placeholder="Add a new action..."
                    className="sap-input"
                    style={{ flex: 1 }}
                  />
                  <button type="button" onClick={() => addStep(type)} className="sap-btn sap-btn-outline">+ Add</button>
                </div>
                <button type="button" onClick={() => saveActionsAsDefault(type)} className="mt-2 sap-link" style={{ display: "block" }}>
                  💾 Save this checklist as the default for "{type}" requests
                </button>
              </div>
            );
          })}

          <div>
            <label className="sap-label">Additional Notes (shared)</label>
            <textarea value={extracted.notes} onChange={(e) => setExtracted({ ...extracted, notes: e.target.value })} rows="3" className="sap-textarea"></textarea>
          </div>

          <div className="flex justify-end gap-2 pt-2">
            <button type="button" onClick={onCancel} className="sap-btn sap-btn-outline">Cancel</button>
            <button type="submit" className="sap-btn sap-btn-blue">
              Save {selectedTypes.length > 1 ? `${selectedTypes.length} Requests` : "Request"}
            </button>
          </div>
        </form>
      )}
    </div>
  );
}

function emptyForm() {
  return {
    id: null,
    prNumber: "",
    poNumber: "",
    owner: "",
    // Who the service is actually for — often not the person who asked.
    // Invoices arrive months later under this name, so it is the key that
    // makes them findable.
    beneficiary: "",
    department: "",
    serviceType: SERVICE_TYPES[0],
    vendor: "",
    budget: "",
    finalAmount: "",
    requiredDate: "",
    // The dates of the service itself (check-in/check-out, travel), as
    // distinct from the date the work has to be finished by.
    serviceDateFrom: "",
    serviceDateTo: "",
    completedDate: "",
    status: "Pending",
    waitingOn: "Me",
    // "me" = I raise the PR in SAP; "requester" = it arrived already raised.
    prRaisedBy: "me",
    // "cost_center" | "project" — a project needs its Network and Activity.
    chargeTo: "",
    costCenter: "",
    projectName: "",
    network: "",
    activity: "",
    stageSince: "",
    notes: "",
    attachments: [],
  };
}
