<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Camp Check-In — Supervisor</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12161C; --paper:#FAF7F0; --paper-2:#F1EBDB; --card:#FFFFFF;
    --gold:#C89B3C; --gold-dim:#E8D9AF; --forest:#1E7A54; --forest-bg:#E4F3EB;
    --rust:#B5502B; --rust-bg:#FBE9E1; --slate:#6B7280; --line:#E4DECF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Inter',-apple-system,sans-serif; background:var(--paper); color:var(--ink);
    min-height:100vh; padding-bottom:24px;
  }
  .shell{max-width:460px;margin:0 auto;padding:16px}

  /* ── Top status bar ── */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--ink);color:var(--paper);border-radius:16px;padding:14px 16px;margin-bottom:14px;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{
    width:34px;height:34px;border-radius:9px;background:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;
  }
  .brand .txt{line-height:1.15}
  .brand .txt b{font-family:'Space Grotesk';font-size:14px;font-weight:700;display:block}
  .brand .txt span{font-size:10px;color:var(--gold-dim);letter-spacing:.04em}
  .topbar a{
    color:var(--paper);text-decoration:none;font-size:11px;font-weight:600;
    background:rgba(255,255,255,.12);padding:8px 12px;border-radius:9px;white-space:nowrap;
  }

  /* ── Selectors row ── */
  .selectors{display:flex;gap:8px;margin-bottom:12px}
  .select-wrap{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:8px 10px;
  }
  .select-wrap label{display:block;font-size:9px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .select-wrap select{
    width:100%;border:none;background:transparent;font-family:'Inter';font-size:13px;font-weight:600;
    color:var(--ink);appearance:none;-webkit-appearance:none;padding:2px 0;
  }

  /* ── Mode segmented control ── */
  .segmented{
    display:flex;background:var(--paper-2);border-radius:12px;padding:4px;margin-bottom:14px;position:relative;
  }
  .segmented button{
    flex:1;border:none;background:transparent;padding:11px;border-radius:9px;
    font-family:'Inter';font-size:13px;font-weight:700;cursor:pointer;color:var(--slate);
    position:relative;z-index:1;transition:color .2s;
  }
  .segmented button.on{color:white}
  .seg-pill{
    position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:9px;
    background:var(--forest);transition:transform .25s cubic-bezier(.4,0,.2,1), background .25s;
  }
  .seg-pill.out{background:var(--rust);transform:translateX(calc(100% + 4px))}

  /* ── Stat pills ── */
  .stat-row{display:flex;gap:8px;margin-bottom:14px}
  .stat-pill{
    flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;display:flex;align-items:center;justify-content:space-between;
  }
  .stat-pill .lb{font-size:10px;color:var(--slate);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .stat-pill .vl{font-family:'Space Grotesk';font-size:20px;font-weight:700}
  .stat-pill.warn .vl{color:var(--rust)}

  /* ── Scanner card ── */
  .scanner-card{
    background:var(--ink);border-radius:20px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
  }
  #reader{width:100%;border-radius:14px;overflow:hidden}
  #reader video{border-radius:14px}
  .reticle{
    aspect-ratio:1.15;border-radius:14px;position:relative;
    background:linear-gradient(145deg,#1A1F28,#0D1015);
    display:flex;align-items:center;justify-content:center;
  }
  .reticle .corner{position:absolute;width:26px;height:26px;border:3px solid var(--gold)}
  .reticle .tl{top:16px;left:16px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
  .reticle .tr{top:16px;right:16px;border-left:none;border-bottom:none;border-radius:0 6px 0 0}
  .reticle .bl{bottom:16px;left:16px;border-right:none;border-top:none;border-radius:0 0 0 6px}
  .reticle .br{bottom:16px;right:16px;border-left:none;border-top:none;border-radius:0 0 6px 0}
  .reticle .hint{color:#6B7280;font-size:12px;text-align:center;line-height:1.6}
  .reticle .hint .ic{font-size:30px;display:block;margin-bottom:8px}

  .btn{
    width:100%;padding:15px;border-radius:13px;border:none;font-family:'Inter';
    font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;letter-spacing:.01em;
  }
  .btn:active{transform:scale(.98)}
  .btn-gold{background:var(--gold);color:var(--ink)}
  .btn-forest{background:var(--forest);color:white}
  .btn-rust{background:var(--rust);color:white}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

  /* ── Boarding pass result ── */
  .pass-wrap{display:none;margin-bottom:14px}
  .alert-strip{
    padding:11px 14px;border-radius:11px 11px 0 0;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:8px;
  }
  .alert-strip.ok{background:var(--forest);color:white}
  .alert-strip.wrn{background:var(--gold);color:var(--ink)}
  .alert-strip.err{background:var(--rust);color:white}

  .pass{
    background:var(--card);border-radius:0 0 18px 18px;overflow:hidden;
    box-shadow:0 10px 30px rgba(18,22,28,.12);
  }
  .pass-top{display:flex}
  .pass-main{flex:1;padding:18px 16px;min-width:0}
  .pass-stub{
    width:108px;flex-shrink:0;background:var(--paper-2);padding:16px 10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    border-left:2px dashed var(--line);
  }
  .pass-stub .gate-lb{font-size:8.5px;font-weight:700;letter-spacing:.1em;color:var(--slate);text-transform:uppercase;margin-bottom:2px}
  .pass-stub .gate-no{font-family:'Space Grotesk';font-size:30px;font-weight:700;line-height:1}
  .pass-stub .team-tag{
    margin-top:8px;font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:#EDE7D8;color:#6B5A2E;
  }

  .id-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .avatar{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;
    box-shadow:0 0 0 3px var(--card),0 0 0 4.5px var(--gold);
  }
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
  .pass-name{font-family:'Space Grotesk';font-size:16px;font-weight:700;line-height:1.2}
  .pass-sub{font-size:12px;color:var(--slate);margin-top:2px}

  .perforation{
    height:0;border-top:2px dashed var(--line);margin:0 -16px 12px;position:relative;
  }
  .perforation::before,.perforation::after{
    content:'';position:absolute;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--paper);
  }
  .perforation::before{left:-23px}
  .perforation::after{right:-23px}

  .ticket-id{
    font-family:'Space Mono';font-size:11px;color:var(--slate);letter-spacing:.06em;margin-bottom:14px;
  }
  .ticket-id b{color:var(--ink)}

  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
  .detail-cell{background:var(--paper);border-radius:9px;padding:9px 11px}
  .detail-cell .lb{font-size:9.5px;color:var(--slate);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
  .detail-cell .vl{font-size:13px;font-weight:700}

  .pass-actions{padding:14px 16px 16px}

  .loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px;color:var(--slate);background:var(--card);border-radius:18px;font-size:13px}
  .spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .stamp{
    display:inline-flex;align-items:center;gap:6px;font-family:'Space Grotesk';font-weight:700;
    font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">
      <div class="mark">🏕️</div>
      <div class="txt"><b>Camp Check-In</b><span>SUPERVISOR CONSOLE</span></div>
    </div>
    <a href="dashboard.html">Dashboard →</a>
  </div>

  <div class="selectors">
    <div class="select-wrap">
      <label>Bus</label>
      <select id="busSelect">
        <option value="1">Bus 1</option><option value="2">Bus 2</option><option value="3">Bus 3</option>
        <option value="4">Bus 4</option><option value="5">Bus 5</option><option value="6">Bus 6</option><option value="7">Bus 7</option>
      </select>
    </div>
    <div class="select-wrap">
      <label>Supervisor</label>
      <select id="supervisorSelect">
        <option value="Supervisor 1">Supervisor 1</option>
        <option value="Supervisor 2">Supervisor 2</option>
        <option value="Supervisor 3">Supervisor 3</option>
      </select>
    </div>
  </div>

  <div class="segmented">
    <div class="seg-pill" id="segPill"></div>
    <button id="modeIn" class="on">Check In</button>
    <button id="modeOut">Check Out</button>
  </div>

  <div class="stat-row">
    <div class="stat-pill"><span class="lb">Scanned</span><span class="vl" id="scanN">0</span></div>
    <div class="stat-pill warn"><span class="lb">Duplicates</span><span class="vl" id="dupN">0</span></div>
  </div>

  <div class="scanner-card">
    <div id="reader"></div>
    <div id="reticle" class="reticle">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="hint"><span class="ic">◎</span>Tap start, then hold the<br>student's QR code steady</div>
    </div>
    <button class="btn btn-gold" id="startBtn">Start Camera &amp; Scan</button>
  </div>

  <div id="loadWrap" style="display:none;margin-bottom:14px">
    <div class="loading"><div class="spin"></div><span>Looking up student…</span></div>
  </div>

  <div id="passWrap" class="pass-wrap">
    <div id="alertStrip" class="alert-strip"></div>
    <div class="pass">
      <div class="pass-top">
        <div class="pass-main">
          <div class="id-row">
            <div class="avatar" id="avatarEl">--</div>
            <div>
              <div class="pass-name" id="nameEl">--</div>
              <div class="pass-sub" id="gradeEl">--</div>
            </div>
          </div>
          <div class="perforation"></div>
          <div class="ticket-id">STUDENT&nbsp;ID&nbsp;·&nbsp;<b id="idEl">--</b></div>
          <div class="detail-grid">
            <div class="detail-cell"><div class="lb">Team</div><div class="vl" id="teamEl">--</div></div>
            <div class="detail-cell"><div class="lb">Scanned</div><div class="vl" id="timeEl">--</div></div>
          </div>
        </div>
        <div class="pass-stub">
          <span class="gate-lb">Board Bus</span>
          <span class="gate-no" id="busEl">--</span>
          <span class="team-tag" id="teamTag">TEAM --</span>
        </div>
      </div>
      <div class="pass-actions">
        <button class="btn btn-forest" id="confirmBtn">✓ Confirm Check-In</button>
        <button class="btn btn-ghost" id="againBtn">← Scan Next Student</button>
      </div>
    </div>
  </div>

</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybQrwOn4qX3IooQBuNnIqtwRyNZzhV-a9M9qTNGD1Z-hsqiLwyq_DiRF7f8lqzwX37HA/exec';
const IS_DEMO = !SCRIPT_URL || SCRIPT_URL.includes('PASTE');

let mode='checkin', html5QrCode, currentStudent=null, scanCount=0, dupCount=0;

/* Segmented control */
const modeIn=document.getElementById('modeIn'), modeOut=document.getElementById('modeOut'), segPill=document.getElementById('segPill');
modeIn.onclick=()=>setMode('checkin');
modeOut.onclick=()=>setMode('checkout');
function setMode(m){
  mode=m;
  modeIn.classList.toggle('on', m==='checkin');
  modeOut.classList.toggle('on', m==='checkout');
  segPill.classList.toggle('out', m==='checkout');
  segPill.style.background = m==='checkin' ? 'var(--forest)' : 'var(--rust)';
  const cb=document.getElementById('confirmBtn');
  if(cb){
    cb.textContent = m==='checkin' ? '✓ Confirm Check-In' : '✓ Confirm Check-Out';
    cb.className = 'btn ' + (m==='checkin' ? 'btn-forest' : 'btn-rust');
  }
}

/* Scanner */
document.getElementById('startBtn').onclick = async () => {
  hidePass();
  document.getElementById('startBtn').style.display='none';
  document.getElementById('reticle').style.display='none';
  html5QrCode = new Html5Qrcode('reader');
  try {
    await html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      onScan, () => {}
    );
  } catch (err) {
    alert('Camera error: ' + err.message);
    resetScanner();
  }
};
async function onScan(text){
  await html5QrCode.stop();
  resetScanner();
  await doLookup(text.trim());
}
function resetScanner(){
  document.getElementById('startBtn').style.display='block';
  document.getElementById('reticle').style.display='flex';
}
function hidePass(){
  document.getElementById('passWrap').style.display='none';
  document.getElementById('loadWrap').style.display='none';
}

/* Lookup */
async function doLookup(studentId){
  hidePass();
  document.getElementById('loadWrap').style.display='block';

  if(IS_DEMO){ setTimeout(()=>showDemo(studentId), 550); return; }

  try{
    const r = await fetch(SCRIPT_URL+'?action=lookup&studentId='+encodeURIComponent(studentId));
    const d = await r.json();
    document.getElementById('loadWrap').style.display='none';

    if(d.error){ showBareAlert('err','⚠ '+d.error); return; }
    if(!d.found){ showBareAlert('err','⚠ No student found for code: '+studentId); return; }

    showPass(d);
    if(d.alreadyCheckedIn && mode==='checkin'){
      const t = d.previousTime ? new Date(d.previousTime).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}) : '';
      setAlert('wrn','⚠ Already checked in at '+t);
      dupCount++; document.getElementById('dupN').textContent=dupCount;
    }
  }catch(err){
    document.getElementById('loadWrap').style.display='none';
    showBareAlert('err','⚠ Connection failed — check internet or Apps Script authorization.');
  }
}

function showBareAlert(type,msg){
  document.getElementById('passWrap').style.display='none';
  const w=document.getElementById('loadWrap');
  w.style.display='block';
  w.innerHTML = '<div class="alert-strip '+type+'" style="border-radius:14px;justify-content:center;padding:16px">'+msg+'</div>';
}

/* Show boarding pass */
function showPass(d){
  currentStudent=d;
  document.getElementById('passWrap').style.display='block';
  document.getElementById('confirmBtn').style.display='block';
  setAlert('ok', mode==='checkin' ? '✓ Match found — ready to board' : '✓ Match found — ready to check out');

  const av=document.getElementById('avatarEl');
  if(d.photoUrl){ av.innerHTML='<img src="'+d.photoUrl+'" alt="">'; av.style.background='transparent'; }
  else { av.innerHTML=initials(d.name); av.style.background=colorFor(d.name); }

  document.getElementById('nameEl').textContent = d.name;
  document.getElementById('gradeEl').textContent = (d.grade||'')+' · '+(d.classCode||'');
  document.getElementById('idEl').textContent = d.studentId;
  document.getElementById('teamEl').textContent = d.team || '—';
  document.getElementById('teamTag').textContent = 'TEAM ' + (d.team || '—');
  document.getElementById('busEl').textContent = d.bus || '—';
  document.getElementById('timeEl').textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}
function setAlert(type,msg){
  document.getElementById('alertStrip').className='alert-strip '+type;
  document.getElementById('alertStrip').textContent=msg;
}
function initials(n){var p=String(n||'').trim().split(/\s+/);return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():(p[0]||'?').substring(0,2).toUpperCase();}
function colorFor(n){var c=['#2E5EAA','#B5502B','#1E7A54','#7C4DA6','#C89B3C','#0E7C86','#A8461F','#2B6FA0'];var h=0;for(var i=0;i<String(n||'').length;i++)h=n.charCodeAt(i)+((h<<5)-h);return c[Math.abs(h)%c.length];}

/* Confirm */
document.getElementById('confirmBtn').onclick = async () => {
  if(!currentStudent) return;
  const sup = document.getElementById('supervisorSelect').value;

  if(IS_DEMO){
    scanCount++; document.getElementById('scanN').textContent=scanCount;
    setAlert('ok','✓ '+(mode==='checkin'?'Checked in':'Checked out')+' (demo mode — not connected to sheet)');
    document.getElementById('confirmBtn').style.display='none';
    return;
  }

  try{
    const r = await fetch(SCRIPT_URL, {
      method:'POST',
      body: JSON.stringify({
        action: mode, studentId: currentStudent.studentId, name: currentStudent.name,
        team: currentStudent.team, bus: currentStudent.bus, grade: currentStudent.grade,
        supervisor: sup
      })
    });
    const d = await r.json();
    if(d.success){
      scanCount++; document.getElementById('scanN').textContent=scanCount;
      if(d.duplicate){ dupCount++; document.getElementById('dupN').textContent=dupCount; }
      setAlert(d.duplicate?'wrn':'ok', (d.duplicate?'⚠ ':'✓ ')+d.message);
      document.getElementById('confirmBtn').style.display='none';
    } else {
      setAlert('err','⚠ '+(d.message||'Failed to save'));
    }
  }catch(err){
    setAlert('err','⚠ Failed to send — try again.');
  }
};

document.getElementById('againBtn').onclick = () => { hidePass(); currentStudent=null; };

function showDemo(sid){
  document.getElementById('loadWrap').style.display='none';
  showPass({ studentId: sid, name:'Hamad Yousuf Hassan', team:1, bus:document.getElementById('busSelect').value, grade:'KG', classCode:'KG-A', photoUrl:'' });
}

setMode('checkin');
</script>
</body>
</html>
