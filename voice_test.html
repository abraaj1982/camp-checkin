<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة صوت الأسماء</title>
<style>
:root{--g:#2B6B3A;--bg:#EEF2E6;--line:#D7E0CC;--ink:#1B2A1E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px}
.w{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:6px 0 4px}p{margin:4px 0 12px;color:#5D6F60;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
label{display:block;font-weight:700;font-size:14px;margin:8px 0 4px}select,input[type=range]{width:100%}select{padding:12px;border-radius:12px;border:1px solid var(--line);font-size:16px;background:#fff}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--g);color:#fff;font-weight:700;cursor:pointer}button.alt{background:#fff;color:var(--g);border:2px solid var(--g)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .n{flex:1;font-size:19px;font-weight:600}.row .i{color:#8a9a8d;width:24px;text-align:center}
.row button{min-width:52px;padding:10px}.row.on{background:#E6F0DF;border-radius:10px}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar button{flex:1}
.note{font-size:13px;color:#5D6F60;background:#fff8e6;border:1px solid #ecd9a6;border-radius:12px;padding:10px;margin-top:12px}
</style>
</head>
<body>
<div class="w">
  <h1>🔊 تجربة نطق الأسماء</h1>
  <p>أسماء عشوائية مخترعة (ليست أسماء طلاب حقيقيين). اضغط ▶ لتسمع نطق جوالك، وجرّب الأصوات والسرعة.</p>
  <div class="card">
    <label for="v">الصوت</label><select id="v"></select>
    <label for="r">السرعة: <span id="rv">0.85</span></label><input id="r" type="range" min="0.5" max="1.2" step="0.05" value="0.85">
    <div class="bar" style="margin-top:12px"><button id="new">🎲 10 أسماء جديدة</button><button id="all" class="alt">▶ شغّل الكل بالترتيب</button></div>
  </div>
  <div class="card" id="list"></div>
  <div class="note" id="info"></div>
</div>
<script>
const FIRST = ['محمد','أحمد','علي','حسن','حسين','يوسف','إبراهيم','عبدالله','خالد','سالم','سعيد','ناصر','مصطفى','مهدي','صادق','جعفر','باقر','عباس','زيد','عمر','هلال','راشد','مازن','طارق','فهد','عبدالرحمن','عبدالعزيز','أنس','بلال','حمزة','ياسر','منصور','سلطان','إسماعيل','موسى','عيسى','سليمان','داود','هاشم','كاظم','رضا','زكريا','يحيى','ماجد','وليد','عادل','سيف','نايف','حمدان','معاذ'];
const MID = ['سالم','ناصر','خالد','حمد','سعيد','علي','محمد','راشد','عبدالله','أحمد','حسن','سيف'];
const FAM = ['البلوشي','الحارثي','الهنائي','المعمري','الريامي','الكندي','الزدجالي','العبري','الراشدي','الشكيلي','اللواتي','البوسعيدي','الرواحي','الحبسي','المسكري'];
const $ = id => document.getElementById(id); let names = [], voices = [], playing = false;
const pick = a => a[Math.floor(Math.random() * a.length)];
function fresh() { names = []; while (names.length < 10) { const n = pick(FIRST) + ' ' + pick(MID) + ' ' + pick(FAM); if (names.indexOf(n) === -1) names.push(n); } draw(); }
function draw() { $('list').innerHTML = names.map((n, i) => `<div class="row" id="r${i}"><span class="i">${i + 1}</span><span class="n">${n}</span><button data-i="${i}">▶</button></div>`).join(''); }
function loadVoices() {
  voices = (speechSynthesis.getVoices() || []).filter(v => /^ar/i.test(v.lang));
  const all = speechSynthesis.getVoices() || [];
  $('v').innerHTML = voices.length ? voices.map((v, i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join('') : '<option value="">لا يوجد صوت عربي في هذا الجهاز</option>';
  $('info').innerHTML = voices.length ? `وجدت <b>${voices.length}</b> صوتًا عربيًا في جهازك. جرّب كل صوت وقارن النطق واللكنة.` :
    `⚠️ لم أجد صوتًا عربيًا في هذا الجهاز/المتصفح (الأصوات المتاحة: ${all.length}). على الآيفون: الإعدادات ← إمكانية الوصول ← المحتوى المنطوق ← الأصوات ← العربية، ثم نزّل صوتًا. وعلى الأندرويد: إعدادات تحويل النص إلى كلام ← ثبّت بيانات الصوت العربي.`;
}
function say(text, done) {
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text);
  const v = voices[Number($('v').value)]; if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'ar-SA';
  u.rate = Number($('r').value); u.onend = u.onerror = () => done && done(); speechSynthesis.speak(u);
}
async function playAll() {
  if (playing) { playing = false; speechSynthesis.cancel(); $('all').textContent = '▶ شغّل الكل بالترتيب'; return; }
  playing = true; $('all').textContent = '⏹ إيقاف';
  for (let i = 0; i < names.length && playing; i++) { document.querySelectorAll('.row').forEach(r => r.classList.remove('on')); $('r' + i).classList.add('on'); await new Promise(res => say(names[i], res)); await new Promise(res => setTimeout(res, 1800)); }
  document.querySelectorAll('.row').forEach(r => r.classList.remove('on')); playing = false; $('all').textContent = '▶ شغّل الكل بالترتيب';
}
$('r').oninput = () => { $('rv').textContent = $('r').value; };
$('new').onclick = () => { playing = false; speechSynthesis.cancel(); fresh(); };
$('all').onclick = playAll;
$('list').onclick = e => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('.row').forEach(r => r.classList.remove('on')); $('r' + b.dataset.i).classList.add('on'); say(names[Number(b.dataset.i)]); };
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; } else $('info').textContent = 'هذا المتصفح لا يدعم النطق الصوتي.';
fresh();
</script>
</body>
</html>
