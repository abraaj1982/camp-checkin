<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المراحل — MUKHAYYAM</title>
<link rel="stylesheet" href="theme.css">
<script src="ui.js" defer></script>
<style>
.now{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.now.live{background:var(--okbg);color:var(--ok)}.now.idle{background:var(--soft);color:var(--muted)}
.now small{display:block;font-weight:400;font-size:12.5px;opacity:.9}
.dot{width:12px;height:12px;border-radius:50%;background:currentColor;flex:none}.live .dot{animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.35}}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.kpi div{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--muted)}
.brow{padding:9px 0;border-top:1px solid var(--line)}.brow:first-child{border-top:0}
.bar{height:10px;background:var(--bar,var(--soft));border-radius:9px;overflow:hidden;margin:6px 0 0}.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}.meta b{color:var(--ink)}
.st{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.st:first-child{border-top:0}
.st .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;flex:none;background:var(--soft);color:var(--muted)}
.st.done .n{background:var(--okbg);color:var(--ok)}.st.live .n{background:var(--brand);color:#fff}
.st .t{flex:1;min-width:0}.st .t b{display:block}.st .t .sub{font-size:12.5px;color:var(--muted);display:block}
details.grp{border-top:1px solid var(--line);padding:8px 0}details.grp:first-of-type{border-top:0}details.grp summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}details.grp .names{margin-top:8px}
.dir{font-size:11.5px;font-weight:700;border-radius:8px;padding:1px 7px;margin-inline-start:4px;display:inline-block}.dir.in{background:var(--okbg);color:var(--ok)}.dir.out{background:var(--badbg);color:var(--bad)}
.names{display:flex;flex-wrap:wrap;gap:6px}.names span{background:var(--soft);border-radius:10px;padding:4px 9px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="brand"><div class="logo">م</div><div style="min-width:0"><div class="t" id="campT"></div><div class="s" id="campS"></div></div></div>
    <div class="tools"><a class="tool" href="hub.html" id="homeBtn"></a><button class="tool" id="langBtn"></button><button class="tool" id="themeBtn"></button></div>
  </header>
  <section class="hero compact"><div class="ic" aria-hidden="true">📋</div><div><h1 id="hT"></h1><p id="hS"></p></div></section>
  <main id="app"></main>
</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4lEBGPNxghwq9UmK0iljI5QdS-8iCvC-K09dDtbZCXGvGZyA4repTE3rFVVRp5zS4yw/exec';
const token = sessionStorage.getItem('mukhayyam_token');
let perms = [];
try { perms = JSON.parse(sessionStorage.getItem('mukhayyam_permissions') || '[]'); } catch (e) {}
const can = k => perms.indexOf('*') !== -1 || perms.indexOf(k) !== -1;
if (!token) location.href = 'login.html'; else if (!can('stages') && !can('manage') && !can('dashboard')) location.href = 'hub.html';
const pref = { get(k, d) { try { return localStorage.getItem('mk_pref_' + k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('mk_pref_' + k, v); } catch (e) {} } };
const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AUTH_ERR = /EXPIRED|IDLE_TIMEOUT|REVOKED|BAD_SIGNATURE|MALFORMED|USER_NOT_FOUND|ACCOUNT_DISABLED|BAD_PAYLOAD/;
const T = {
 ar: { dir: 'rtl', title: 'جدول الوصول والمغادرة', sub: 'متابعة مراحل الوصول والرحلة والمغادرة (تبدأ وتنتهي تلقائياً بالتاريخ والوقت)', home: 'الرئيسية', lang: 'English', dark: '🌙 داكن', light: '☀ فاتح',
  live: 'جارية الآن', idle: 'لا توجد مرحلة جارية الآن', idleSub: 'المشرفون لا يستطيعون المسح الآن', until: t => 'حتى ' + t,
  in: 'دخول', out: 'خروج', done: d => d === 'out' ? 'خرجوا' : 'وصلوا', left: 'لم يُمسحوا', withdrawn: 'استأذنوا', perBus: 'حسب الباص', bus: n => 'باص ' + n,
  remaining: 'لم يُمسحوا بعد', allDone: 'الجميع مُسجَّل ✓', anyBus: 'في هذه المرحلة يركب الطالب أي باص من باصات الرحلة، ويُسجَّل الباص الذي ركبه.',
  next: 'المرحلة التالية', program: 'برنامج المراحل', sDone: 'انتهت', sLive: 'جارية', sNone: 'بلا وقت', count: (a, b) => a + ' / ' + b, students: n => n + ' طالباً',
  note: 'لتعديل وقت مرحلة (إذا تأخر باص مثلاً): غيّر خانتي From / To في تبويب Stages من ملف المنصة، ويسري خلال دقيقة.',
  off: 'المراحل غير مفعّلة بعد. يفعّلها المسؤول التقني مرة واحدة.', updated: t => 'آخر تحديث ' + t, refresh: 'تحديث',
  error: 'تعذّر الاتصال. حاول مرة أخرى.', sessionEnd: 'انتهت الجلسة. سجّل الدخول من جديد.' },
 en: { dir: 'ltr', title: 'Arrival and departure schedule', sub: 'Follow the arrival, trip and departure stages (they open and close by date and time)', home: 'Home', lang: 'العربية', dark: '🌙 Dark', light: '☀ Light',
  live: 'Open now', idle: 'No stage is open now', idleSub: 'Supervisors cannot scan now', until: t => 'until ' + t,
  in: 'In', out: 'Out', done: d => d === 'out' ? 'Left' : 'Arrived', left: 'Not scanned', withdrawn: 'Withdrawn', perBus: 'Per bus', bus: n => 'Bus ' + n,
  remaining: 'Not scanned yet', allDone: 'Everyone recorded ✓', anyBus: 'In this stage a student may take any trip bus; the bus he took is recorded.',
  next: 'Next stage', program: 'Stage programme', sDone: 'Done', sLive: 'Open', sNone: 'No time', count: (a, b) => a + ' / ' + b, students: n => n + ' students',
  note: 'To change a stage time (e.g. a late bus): edit its From / To cells in the Stages tab of the sheet; it applies within a minute.',
  off: 'Stages are not switched on yet. The technical admin turns them on once.', updated: t => 'Updated ' + t, refresh: 'Refresh',
  error: 'Connection problem. Try again.', sessionEnd: 'Session expired. Please log in again.' }
};
const st = { lang: pref.get('lang', 'ar'), theme: pref.get('theme', 'light'), data: null, msg: null, at: '' };
const L = () => T[st.lang];
async function api(action, extra) {
  const r = await (await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, token: token }, extra || {})) })).json();
  if (r && r.code && AUTH_ERR.test(r.code)) { st.msg = { cls: 'bad', t: L().sessionEnd }; render(); setTimeout(() => { sessionStorage.clear(); location.href = 'login.html'; }, 1500); throw new Error('auth'); }
  return r;
}
const nowHHMM = () => new Date().toLocaleTimeString('en-GB', { timeZone: 'Asia/Muscat', hour: '2-digit', minute: '2-digit' });
async function load() {
  try { const r = await api('stages'); if (r.success) { st.data = r; st.msg = null; st.at = nowHHMM(); } else st.msg = { cls: 'bad', t: r.error || L().error }; } catch (e) { if (e.message !== 'auth') st.msg = { cls: 'bad', t: L().error }; }
  render();
}
const dirPill = d => `<span class="dir ${d}">${d === 'out' ? L().out : L().in}</span>`;
const when = x => [x.day, x.time].filter(Boolean).join(' · ');
function liveView(x) {
  const l = L(), left = x.expected - x.done - (x.withdrawn || 0);
  return `<div class="now live"><span class="dot"></span><div>${l.live}: ${x.order}) ${esc(x.name)} ${dirPill(x.dir)}<small>${esc(x.time)} · ${esc(x.who)}</small></div></div>
  <div class="kpi"><div><b>${x.done}</b><span>${l.done(x.dir)}</span></div><div><b>${left}</b><span>${l.left}</span></div><div><b>${x.withdrawn || 0}</b><span>${l.withdrawn}</span></div></div>
  <section class="card"><h2 class="h2" style="margin-bottom:4px">${l.perBus}</h2>${(x.perBus || []).map(b => `<div class="brow"><div class="meta"><b>${esc(l.bus(b.bus || '—'))}</b><span>${l.count(b.done, b.total)}</span></div><div class="bar"><i style="width:${b.total ? Math.round(b.done / b.total * 100) : 0}%"></i></div></div>`).join('')}
   ${x.anyBus ? `<div class="muted" style="font-size:12.5px;margin-top:8px">${l.anyBus}</div>` : ''}</section>
  <section class="card"><h2 class="h2" style="margin-bottom:8px">${l.remaining} <span class="pill ${left ? 'warn' : 'ok'}">${left}</span></h2>${(x.remaining || []).length ? remainingByBus(x.remaining) : `<div class="muted">${l.allDone}</div>`}</section>`;
}
// Names still missing, grouped by bus; a short list opens by itself, a long one stays folded (tap a bus to see its names).
function remainingByBus(list) {
  const l = L(), g = {};
  list.forEach(s => { (g[s.bus || '—'] = g[s.bus || '—'] || []).push(s); });
  return Object.keys(g).sort().map(b => `<details class="grp" ${list.length <= 25 ? 'open' : ''}><summary><span>${esc(l.bus(b))}</span><span class="pill warn">${g[b].length}</span></summary><div class="names">${g[b].map(s => `<span>${esc(s.name)}</span>`).join('')}</div></details>`).join('');
}
function idleView(n) {
  const l = L();
  return `<div class="now idle"><span class="dot"></span><div>${l.idle}<small>${l.idleSub}</small></div></div>
  ${n ? `<section class="card"><h2 class="h2" style="margin-bottom:6px">${l.next}</h2><div><b>${n.order}) ${esc(n.name)}</b> ${dirPill(n.dir)}</div><div class="muted" style="font-size:13px;margin-top:4px">${esc(when(n))} · ${esc(n.who)} · ${esc(l.students(n.expected))}</div></section>` : ''}`;
}
function programView(list) {
  const l = L();
  return `<section class="card"><h2 class="h2" style="margin-bottom:4px">${l.program}</h2>${list.map(s => `<div class="st ${s.status}"><div class="n">${s.status === 'done' ? '✓' : s.order}</div>
   <div class="t"><b>${esc(s.name)} ${dirPill(s.dir)}</b><span class="sub">${esc(when(s))} · ${esc(s.who)}</span>
   ${s.status === 'live' || s.status === 'done' ? `<span class="sub">${l.count(s.done, s.expected)}</span>` : ''}</div>
   ${s.status === 'live' ? `<span class="pill ok">${l.sLive}</span>` : s.status === 'done' ? `<span class="pill">${l.sDone}</span>` : s.status === 'none' ? `<span class="pill bad">${l.sNone}</span>` : ''}</div>`).join('')}</section>`;
}
function render() {
  const l = L(); document.documentElement.lang = st.lang; document.documentElement.dir = l.dir; document.documentElement.dataset.theme = st.theme; document.title = l.title + ' — MUKHAYYAM';
  $('hT').textContent = l.title; $('hS').textContent = l.sub; $('homeBtn').textContent = l.home; $('langBtn').textContent = l.lang; $('themeBtn').textContent = st.theme === 'light' ? l.dark : l.light;
  const d = st.data, msg = st.msg ? `<div class="banner ${st.msg.cls}" role="alert">${esc(st.msg.t)}</div>` : '';
  if (!d) { $('app').innerHTML = msg; return; }
  if (!d.enabled) { $('app').innerHTML = msg + `<div class="banner warn">${l.off}</div>`; return; }
  const list = d.stages || [], live = list.filter(s => s.status === 'live'), next = list.filter(s => s.status === 'next')[0];
  $('app').innerHTML = msg + (live.length ? live.map(liveView).join('') : idleView(next)) + programView(list) +
    `<div class="muted" style="text-align:center;font-size:12.5px;margin-bottom:8px">${esc(l.note)}</div>
     <div class="muted" style="text-align:center;font-size:12.5px">${esc(l.updated(st.at))} · <button class="chip" data-refresh="1">${l.refresh}</button></div>`;
}
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b && b.dataset.refresh) { st.msg = null; load(); } });
$('langBtn').onclick = () => { st.lang = st.lang === 'ar' ? 'en' : 'ar'; pref.set('lang', st.lang); render(); };
$('themeBtn').onclick = () => { st.theme = st.theme === 'light' ? 'dark' : 'light'; pref.set('theme', st.theme); render(); };
render(); load();
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 20000); // the numbers follow the scans and the clock
</script>
</body></html>
