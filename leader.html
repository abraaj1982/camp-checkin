<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>القائد — MUKHAYYAM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<link rel="stylesheet" href="theme.css">
<script src="ui.js" defer></script>
<style>
.kpi{flex:1 1 160px;padding:14px 16px}
#map{height:380px;border-radius:12px;background:var(--soft);z-index:0}
.cols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}.c1{flex:1 1 280px;min-width:0}.c2{flex:2 1 420px;min-width:0}
.bus{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.brow{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.pin{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);font-size:14px}
.pin.f{background:#2E7D4F}.pin.s{background:#D4912A}.pin.o{background:#C2455A}
@keyframes pulse{50%{opacity:.55}}.sk{animation:pulse 1.2s infinite;background:var(--soft)}
.kpi .kv{font-size:38px}.kpi.hero{background:linear-gradient(135deg,var(--brand),#1F4A2B);color:#fff;border:0}.kpi.hero .kl{color:rgba(255,255,255,.85)}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring b{width:56px;height:56px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:16px}
.ev{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#E9B04C,#d39320);color:#1b1b1b;border:0}
.ev .cd{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-inline-start:auto;white-space:nowrap}
.bus .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bus .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.bus .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;padding:0 12px;font:inherit;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mini.call{border-color:var(--brand);color:var(--brand);font-weight:600}
.names{margin-top:8px;max-height:220px;overflow:auto;border-top:1px solid var(--line)}
.names div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.eta{font-weight:700;color:var(--brand)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.com{padding:14px}.com .kv{font-size:28px}
.feed div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.bar.team i{background:#4F7F55}
.camp-pin{font-size:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.toolsbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;inset:0;padding:10mm;color:#000;background:#fff}#printArea h2{font-size:15pt;margin:6mm 0 2mm}#printArea table{width:100%;border-collapse:collapse;font-size:11pt}#printArea td,#printArea th{border:.3mm solid #555;padding:1.5mm 2mm;text-align:start}}
</style>
</head>
<body>
<div class="wrap wide">
<header class="hdr"><div class="brand"><div class="logo">م</div><div style="min-width:0"><div class="t" id="campT"></div><div class="s" id="campS"></div></div></div><div class="tools"><a class="tool" href="hub.html" id="homeBtn" style="text-decoration:none;display:flex;align-items:center"></a><button class="tool" id="langBtn" aria-label="Language"></button><button class="tool" id="themeBtn"></button></div></header>
<section class="hero compact"><div class="ic" aria-hidden="true">📍</div><div><h1 id="hT"></h1><p id="hS"></p></div></section>
<div id="netbar" class="netbar" hidden></div>
<main id="app"></main>
</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4lEBGPNxghwq9UmK0iljI5QdS-8iCvC-K09dDtbZCXGvGZyA4repTE3rFVVRp5zS4yw/exec';
const POLL_MS = 15000;
const token = sessionStorage.getItem('mukhayyam_token');
let perms = [];
try { perms = JSON.parse(sessionStorage.getItem('mukhayyam_permissions') || '[]'); } catch (e) {}
const can = k => perms.indexOf('*') !== -1 || perms.indexOf(k) !== -1;
if (!token) location.href = 'login.html'; else if (!can('dashboard') && !can('livemap') && !can('stats')) location.href = 'hub.html';

const pref = { get(k, d) { try { return localStorage.getItem('mk_pref_' + k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('mk_pref_' + k, v); } catch (e) {} } };
const T = {
 ar: { dir: 'rtl', title: 'القائد', sub: 'متابعة المخيم مباشرة', home: 'الرئيسية', lang: 'English', dark: '🌙 داكن', light: '☀ فاتح', of: 'من', bus: n => 'باص ' + n,
  present: 'صعدوا / في المخيم', remaining: 'لم يصعدوا بعد', arrivedBuses: 'باصات وصلت', withdrawn: 'غادروا', meals: 'وجبات اليوم', mealsNote: 'طلاب + مشرفون',
  map: 'تتبع الباصات مباشرة', live: 'مباشر', byBus: 'الحضور حسب الباص', byTeam: 'الحضور حسب الفريق (كم صعد من كل فريق)', committees: 'اللجان الآن', withdrawals: 'الاستئذانات', noWd: 'لا استئذانات.', wdOpen: 'قيد التنفيذ', wdClosed: 'خرج', receiver: 'المستلِم', feed: 'آخر الأحداث', noFeed: 'لا أحداث بعد.',
  st: { boarding: 'يصعدون', departed: 'انطلق', onway: 'في الطريق', arrived: 'وصل' }, notStarted: 'لم يبدأ', noLoc: 'لا يوجد موقع بعد', lastSeen: s => 'آخر موقع ' + (s < 90 ? 'منذ ' + s + ' ث' : 'منذ ' + Math.round(s / 60) + ' د'),
  eta: (m, km) => 'يصل خلال ~' + m + ' د (' + km + ' كم)', arrivedOk: 'وصل المخيم ✓', speed: k => k + ' كم/س', call: '📞 اتصال', missingBtn: n => '👥 الناقصون (' + n + ')', allIn: 'اكتمل الباص ✓', noPhone: 'لا رقم للمشرف',
  medOpen: 'حالات طبية مفتوحة', medUrgent: n => n + ' عاجلة', phones: 'هواتف بالأمانات', bags: 'حقائب بالأمانات', withdrawOpen: 'استئذان خروج مفتوح',
  nextEvent: 'الفعالية القادمة', d: 'ي', h: 'س', m: 'د', setCamp: '📍 تحديد موقع المخيم', setCampHint: 'اضغط على الخريطة في مكان المخيم', campSaved: 'حُفظ موقع المخيم', campNone: 'لم يُحدَّد موقع المخيم بعد (لحساب وقت الوصول والوصول التلقائي).',
  sound: '🔔 صوت التنبيهات', soundOff: '🔕 الصوت متوقف', printReport: '🖨 طباعة التقرير', printAbsent: '🖨 كشف الغائبين', absentTitle: 'كشف من لم يصعد', reportTitle: 'تقرير حالة المخيم', at: 'في',
  noMap: 'تعذّر تحميل الخريطة. تظهر الحالة في القائمة.', offline: 'غير متصل. تُعرض آخر بيانات.', loading: 'جارٍ التحميل...', stale: 'هذه آخر بيانات محفوظة، جارٍ التحديث...', err: 'تعذّر تحميل البيانات.', note: 'الموقع من هاتف المشرف، ويتحدّث ما دامت شاشته مفتوحة.',
  actions: { board: 'صعد', undo: 'تراجع', withdraw: 'استأذن للخروج', readmit: 'أُعيد للمخيم' }, num: '#', student: 'الطالب', team: 'الفريق', cls: 'الصف' },
 en: { dir: 'ltr', title: 'Camp leader', sub: 'Live camp overview', home: 'Home', lang: 'العربية', dark: '🌙 Dark', light: '☀ Light', of: 'of', bus: n => 'Bus ' + n,
  present: 'Boarded / at camp', remaining: 'Not boarded yet', arrivedBuses: 'Buses arrived', withdrawn: 'Withdrawn', meals: 'Meals today', mealsNote: 'students + supervisors',
  map: 'Live bus tracking', live: 'Live', byBus: 'Attendance by bus', byTeam: 'Attendance by team (how many of each team boarded)', committees: 'Committees now', withdrawals: 'Withdrawals', noWd: 'No withdrawals.', wdOpen: 'In progress', wdClosed: 'Left', receiver: 'Receiver', feed: 'Latest activity', noFeed: 'No activity yet.',
  st: { boarding: 'Boarding', departed: 'Departed', onway: 'On the way', arrived: 'Arrived' }, notStarted: 'Not started', noLoc: 'No location yet', lastSeen: s => 'Last seen ' + (s < 90 ? s + 's ago' : Math.round(s / 60) + ' min ago'),
  eta: (m, km) => 'Arrives in ~' + m + ' min (' + km + ' km)', arrivedOk: 'At camp ✓', speed: k => k + ' km/h', call: '📞 Call', missingBtn: n => '👥 Missing (' + n + ')', allIn: 'Bus complete ✓', noPhone: 'No supervisor phone',
  medOpen: 'Open medical cases', medUrgent: n => n + ' urgent', phones: 'Phones in custody', bags: 'Bags in custody', withdrawOpen: 'Open withdrawals',
  nextEvent: 'Next event', d: 'd', h: 'h', m: 'm', setCamp: '📍 Set camp location', setCampHint: 'Click the camp location on the map', campSaved: 'Camp location saved', campNone: 'Camp location not set yet (needed for arrival time and automatic arrival).',
  sound: '🔔 Alert sound', soundOff: '🔕 Sound off', printReport: '🖨 Print report', printAbsent: '🖨 Absent list', absentTitle: 'Students not boarded', reportTitle: 'Camp status report', at: 'at',
  noMap: 'Could not load the map. Status is shown in the list.', offline: 'Offline. Showing the latest data.', loading: 'Loading...', stale: 'Showing the last saved data, refreshing...', err: 'Could not load data.', note: 'Location comes from the supervisor’s phone and updates while his screen is open.',
  actions: { board: 'boarded', undo: 'undone', withdraw: 'asked to leave', readmit: 're-admitted' }, num: '#', student: 'Student', team: 'Team', cls: 'Class' }
};
const X = {
 ar: { roundGap: (b, n) => `باص ${b}: جولة التحقق وجدت ${n} مسجَّلين غير موجودين في الباص`, roundOk: (t, c, tot) => `جولة التحقق ${t}: ${c} / ${tot} ✓`, roundBad: (t, c, tot, ab) => `جولة التحقق ${t}: ${ab} غير موجود`, alerts: 'تنبيهات', none: 'لا توجد تنبيهات. كل شيء طبيعي ✓', stale: (b, a) => `باص ${b}: انقطع إرسال موقعه منذ ${Math.round(a / 60)} دقيقة (ربما أُغلقت شاشة المشرف أو ضعفت الشبكة). اتصل بالمشرف.`, missing: (b, n) => `باص ${b}: يتحرك ويوجد ${n} طالب لم يُسجَّل صعودهم.`, no_report: bs => `باصات لم تبدأ بعد: ${bs.join('، ')}`, bags: (b, n) => `باص ${b}: ${n} طالب حقائبهم المحمّلة أقل من المتوقع.`, cases_open: n => `${n} بلاغ مفتوح يحتاج متابعة.`, med_urgent: n => `${n} حالة طبية عاجلة مفتوحة.`, withdraw_open: n => `${n} استئذان خروج مفتوح.`, cases: 'البلاغات', noCases: 'لا توجد بلاغات.', ack: 'استلمت', close: 'إغلاق', ty: { student: 'طالب', bus: 'باص', lost: 'مفقود', other: 'أخرى' }, stt: { open: 'مفتوح', ack: 'قيد المتابعة', closed: 'مغلق' } },
 en: { roundGap: (b, n) => `Bus ${b}: the round check found ${n} recorded students not on the bus`, roundOk: (t, c, tot) => `Round check ${t}: ${c} / ${tot} ✓`, roundBad: (t, c, tot, ab) => `Round check ${t}: ${ab} missing`, alerts: 'Alerts', none: 'No alerts. Everything looks normal ✓', stale: (b, a) => `Bus ${b}: location updates stopped ${Math.round(a / 60)} min ago (supervisor screen closed or weak signal). Call the supervisor.`, missing: (b, n) => `Bus ${b}: moving with ${n} student(s) not checked in.`, no_report: bs => `Buses not started yet: ${bs.join(', ')}`, bags: (b, n) => `Bus ${b}: ${n} student(s) with fewer loaded bags than expected.`, cases_open: n => `${n} open case(s) need follow-up.`, med_urgent: n => `${n} urgent medical case(s) open.`, withdraw_open: n => `${n} open withdrawal request(s).`, cases: 'Cases', noCases: 'No cases.', ack: 'Acknowledge', close: 'Close', ty: { student: 'Student', bus: 'Bus', lost: 'Lost item', other: 'Other' }, stt: { open: 'Open', ack: 'In progress', closed: 'Closed' } }
};
const st = { cases: [], lang: pref.get('lang', 'ar'), theme: pref.get('theme', 'light'), sum: null, live: [], extra: null, camp: null, canSetCamp: false, err: '', open: {}, picking: false, msg: '' };
const L_ = () => T[st.lang], X_ = () => X[st.lang];
const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const AUTH_ERR = /EXPIRED|IDLE_TIMEOUT|REVOKED|BAD_SIGNATURE|MALFORMED|USER_NOT_FOUND|ACCOUNT_DISABLED|BAD_PAYLOAD/;
async function api(a, extra) { const r = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: a, token: token }, extra || {})) }); return r.json(); }

// Saved copy of the last data: the screen shows it INSTANTLY, then refreshes (the server needs a few seconds).
const CK = 'mk_leader_cache_v2';
try { const c = JSON.parse(localStorage.getItem(CK) || 'null'); if (c && c.sum) { Object.assign(st, { sum: c.sum, live: c.live || [], cases: c.cases || [], extra: c.extra || null, camp: c.camp || null, stale: true }); } } catch (e) {}
async function poll() {
  try {
    const r = await api('leaderAll');                      // ONE request for the whole screen
    if (r && r.code && AUTH_ERR.test(r.code)) { sessionStorage.clear(); location.href = 'login.html'; return; }
    if (r && r.success) {
      if (r.summary) st.sum = r.summary; if (r.buses) st.live = r.buses; if (r.cases) st.cases = r.cases;
      st.extra = r.extra || null; st.camp = r.camp || null; st.canSetCamp = !!r.canSetCamp;
      st.err = ''; st.stale = false;
      try { localStorage.setItem(CK, JSON.stringify({ sum: st.sum, live: st.live, cases: st.cases, extra: st.extra, camp: st.camp, at: Date.now() })); } catch (e) {}
      ding();
    } else st.err = L_().err;
  } catch (e) { st.err = ''; }
  render();
}

/* ---------- helpers ---------- */
const ageClass = a => a < 90 ? 'f' : a < 600 ? 's' : 'o';
function distM(a, b, c, d) { const R = 6371000, r = Math.PI / 180, x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
function etaText(b) {
  const l = L_(); if (b.status === 'arrived') return `<span class="eta">${l.arrivedOk}</span>`;
  if (!st.camp || b.lat === null || b.lat === undefined) return '';
  const road = distM(b.lat, b.lng, st.camp.lat, st.camp.lng) * 1.25;      // straight line × 1.25 ≈ road distance
  const v = b.speed && b.speed > 3 ? b.speed : 13.9;                      // current speed, else ~50 km/h
  return `<span class="eta">${l.eta(Math.max(1, Math.round(road / v / 60)), (road / 1000).toFixed(1))}</span>`;
}
function countdown(iso) {
  const ms = new Date(iso).getTime() - Date.now(), l = L_(); if (!(ms > 0)) return '';
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return (d ? d + l.d + ' ' : '') + h + l.h + ' ' + m + l.m;
}
// all buses (from the student list) merged with the live positions, so a bus that has not started still has a card
function allBuses() {
  const live = {}; st.live.forEach(b => { live[b.bus] = b; });
  const per = (st.sum && st.sum.perBus) || [];
  const keys = Array.from(new Set(per.map(p => p.bus).concat(Object.keys(live)))).sort((a, b) => Number(a) - Number(b));
  return keys.map(k => { const p = per.find(x => x.bus === k) || {}, lv = live[k];
    return Object.assign({ bus: k, status: lv ? lv.status : '', lat: null, lng: null, ageSec: null, supervisor: '', speed: null }, lv || {}, { boarded: p.boarded !== undefined ? p.boarded : (lv ? lv.boarded : 0), total: p.total !== undefined ? p.total : (lv ? lv.total : 0), missing: p.missing || 0, started: !!lv }); });
}

/* ---------- alert sound (only for NEW red alerts) ---------- */
let seenBad = null, soundOn = (() => { try { return localStorage.getItem('mk_leader_sound') === '1'; } catch (e) { return false; } })();
function ding() {
  const bad = ((st.sum && st.sum.alerts) || []).filter(a => a.level === 'bad').map(a => a.type + a.bus);
  if (seenBad && soundOn && bad.some(k => seenBad.indexOf(k) === -1)) {
    try { const ac = new (window.AudioContext || window.webkitAudioContext)(); [0, .25].forEach(t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ac.destination); g.gain.setValueAtTime(.25, ac.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + t + .2); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + .2); }); } catch (e) {}
  }
  seenBad = bad;
}

/* ---------- map (kept alive across refreshes: no flicker, zoom is preserved) ---------- */
let map = null, markers = {}, campMarker = null, campCircle = null;
function drawMap() {
  const el = $('map'); if (!el) return;
  if (typeof L === 'undefined') { el.innerHTML = '<div class="muted" style="padding:20px;text-align:center">' + esc(L_().noMap) + '</div>'; return; }
  if (!map) {
    map = L.map(el, { zoomControl: true }).setView(st.camp ? [st.camp.lat, st.camp.lng] : [23.58, 58.4], st.camp ? 11 : 8);
    // Two base maps: street map and satellite (Esri World Imagery, free, no key). The choice is remembered.
    const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    const sat = L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics' }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, opacity: .9 })   // place names over the satellite
    ]);
    let useSat = false; try { useSat = localStorage.getItem('mk_leader_map') === 'sat'; } catch (e) {}
    (useSat ? sat : street).addTo(map);
    const names = st.lang === 'ar' ? { street: '🗺 خريطة', sat: '🛰 قمر صناعي' } : { street: '🗺 Map', sat: '🛰 Satellite' };
    L.control.layers({ [names.street]: street, [names.sat]: sat }, null, { position: 'topleft', collapsed: false }).addTo(map);
    map.on('baselayerchange', e => { try { localStorage.setItem('mk_leader_map', e.layer === sat ? 'sat' : 'street'); } catch (err) {} });
    map.on('click', async ev => {
      if (!st.picking) return; st.picking = false;
      const r = await api('setCampLocation', { lat: +ev.latlng.lat.toFixed(6), lng: +ev.latlng.lng.toFixed(6) });
      if (r.success) { st.camp = r.camp; st.msg = L_().campSaved; } render(); poll();
    });
  }
  el.style.cursor = st.picking ? 'crosshair' : '';
  const pts = [];
  st.live.filter(b => b.lat !== null && b.lng !== null).forEach(b => {
    const icon = L.divIcon({ className: '', html: '<div class="pin ' + (b.status === 'arrived' ? 'f' : ageClass(b.ageSec)) + '">' + esc(b.bus) + '</div>', iconSize: [30, 30], iconAnchor: [15, 15] });
    if (markers[b.bus]) markers[b.bus].setLatLng([b.lat, b.lng]).setIcon(icon); else markers[b.bus] = L.marker([b.lat, b.lng], { icon: icon }).addTo(map);
    markers[b.bus].bindTooltip(L_().bus(b.bus) + ' · ' + L_().lastSeen(b.ageSec)); pts.push([b.lat, b.lng]);
  });
  if (st.camp) {
    const ll = [st.camp.lat, st.camp.lng]; pts.push(ll);
    if (!campMarker) { campMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="camp-pin">⛺</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map); campCircle = L.circle(ll, { radius: 400, color: '#2B6B3A', weight: 1, fillOpacity: .08 }).addTo(map); }
    else { campMarker.setLatLng(ll); campCircle.setLatLng(ll); }
  }
  if (pts.length && !map._fitted) { map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 }); map._fitted = true; }
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} }, 50);
}

/* ---------- printing ---------- */
function printAbsent() {
  const l = L_(), mb = (st.extra && st.extra.missingByBus) || {};
  const when = new Date().toLocaleString(st.lang === 'ar' ? 'ar' : 'en');
  $('printArea').innerHTML = `<h1>${l.absentTitle}</h1><div>${esc(when)}</div>` + Object.keys(mb).sort((a, b) => a - b).map(b => `<h2>${l.bus(esc(b))} (${mb[b].length})</h2>${mb[b].length ? `<table><tr><th>${l.num}</th><th>${l.student}</th><th>${l.team}</th><th>${l.cls}</th></tr>${mb[b].map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.name)} · ${esc(s.id)}</td><td>${esc(s.team)}</td><td>${esc(s.cls)}</td></tr>`).join('')}</table>` : `<div>${l.allIn}</div>`}`).join('');
  window.print();
}
function printReport() {
  const l = L_(), s = st.sum, x = st.extra || {}, c = x.committees || {};
  const when = new Date().toLocaleString(st.lang === 'ar' ? 'ar' : 'en');
  $('printArea').innerHTML = `<h1>${l.reportTitle}</h1><div>${esc(when)}</div>
   <h2>${l.byBus}</h2><table><tr><th></th><th>${l.present}</th><th>${l.remaining}</th></tr>${allBuses().map(b => `<tr><td>${l.bus(esc(b.bus))} · ${esc(l.st[b.status] || l.notStarted)}</td><td>${b.boarded} / ${b.total}</td><td>${b.missing}</td></tr>`).join('')}<tr><th>Σ</th><th>${s.boarded} / ${s.total}</th><th>${s.total - s.boarded - s.withdrawn}</th></tr></table>
   ${x.byTeam ? `<h2>${l.byTeam}</h2><table>${x.byTeam.map(t => `<tr><td>${esc(t.team)}</td><td>${t.present} / ${t.total}</td></tr>`).join('')}</table>` : ''}
   <h2>${l.committees}</h2><table><tr><td>${l.medOpen}</td><td>${c.medOpen || 0}</td></tr><tr><td>${l.phones}</td><td>${c.phones || 0}</td></tr><tr><td>${l.bags}</td><td>${c.bags || 0}</td></tr><tr><td>${l.withdrawOpen}</td><td>${c.withdrawOpen || 0}</td></tr><tr><td>${l.meals}</td><td>${c.meals || 0}</td></tr></table>`;
  window.print();
}

/* ---------- render ---------- */
function render() {
  const keepMap = map ? $('map') : null; if (keepMap) keepMap.remove();   // the live map survives re-renders
  const l = L_(), x = X_(); document.documentElement.lang = st.lang; document.documentElement.dir = l.dir; document.documentElement.dataset.theme = st.theme;
  $('hT').textContent = l.title; $('hS').textContent = l.sub; $('homeBtn').textContent = l.home; $('langBtn').textContent = l.lang; $('themeBtn').textContent = st.theme === 'light' ? l.dark : l.light; document.title = l.title + ' — MUKHAYYAM';
  const nb = $('netbar'); if (!navigator.onLine) { nb.hidden = false; nb.className = 'netbar warn'; nb.textContent = l.offline; } else nb.hidden = true;
  const s = st.sum;
  if (!s) { $('app').innerHTML = st.err ? '<div class="card muted">' + esc(st.err) + '</div>' : '<div class="kpis">' + [1, 2, 3, 4].map(() => '<div class="card kpi sk"><div class="kl">&nbsp;</div><div class="kv">&nbsp;</div></div>').join('') + '</div><div class="card sk" style="height:300px"></div><div class="muted" style="text-align:center">' + esc(l.loading) + '</div>'; return; }
  const ex = st.extra || {}, com = ex.committees || {}, buses = allBuses();
  const left = s.total - s.boarded - s.withdrawn, pct = s.total ? Math.round(s.boarded / s.total * 100) : 0;
  const arrived = buses.filter(b => b.status === 'arrived').length;
  // alerts: "not started" buses grouped into ONE line
  const al = s.alerts || [], nr = al.filter(a => a.type === 'no_report').map(a => a.bus), rest = al.filter(a => a.type !== 'no_report');
  const amsg = a => a.type === 'round_gap' ? x.roundGap(esc(a.bus), a.count) : a.type === 'stale' ? x.stale(esc(a.bus), a.ageSec) : a.type === 'missing' ? x.missing(esc(a.bus), a.missing) : a.type === 'bags' ? x.bags(esc(a.bus), a.count) : a.type === 'med_urgent' ? x.med_urgent(a.count) : a.type === 'withdraw_open' ? x.withdraw_open(a.count) : x.cases_open(a.count);
  const alertsHtml = (rest.length || nr.length) ? rest.map(a => `<div class="banner ${a.level === 'bad' ? 'bad' : 'warn'}" style="margin:0 0 6px">${amsg(a)}</div>`).join('') + (nr.length ? `<div class="banner" style="margin:0;background:var(--soft)">${x.no_report(nr.map(esc))}</div>` : '') : `<div class="banner ok" style="margin:0">${x.none}</div>`;
  const kpi = (lab, v, n, c) => `<div class="card kpi"><div class="kl">${lab}</div><div class="kv" ${c ? `style="color:var(--${c})"` : ''}>${v}</div><div class="kl">${n || ''}</div></div>`;
  const hero = `<div class="card kpi hero" style="display:flex;align-items:center;gap:14px"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><div><div class="kl">${l.present}</div><div class="kv">${s.boarded}</div><div class="kl">${l.of} ${s.total}</div></div></div>`;
  const ev = ex.nextEvent ? `<section class="card ev"><div style="font-size:30px">🎉</div><div><div style="font-size:13px;opacity:.8">${l.nextEvent}</div><b style="font-size:18px">${esc(ex.nextEvent.title)}</b></div><div class="cd" id="cd">${countdown(ex.nextEvent.startsAt)}</div></section>` : '';
  const sup = (ex.supervisors || {});
  const cards = buses.map(b => {
    const sp = (sup[b.bus] || [])[0], miss = (ex.missingByBus || {})[b.bus] || [], open = st.open[b.bus];
    const pill = !b.started ? `<span class="pill">${l.notStarted}</span>` : `<span class="pill ${b.status === 'arrived' ? 'ok' : b.status === 'onway' ? 'warn' : ''}">${esc(l.st[b.status] || b.status)}</span>`;
    const seen = b.lat === null || b.lat === undefined ? `<span>${l.noLoc}</span>` : `<span style="color:var(--${b.ageSec >= 300 ? 'bad' : 'ok'})">${b.ageSec >= 300 ? '⚠ ' : ''}${l.lastSeen(b.ageSec)}</span>`;
    return `<div class="bus"><div class="top"><b>${l.bus(esc(b.bus))}</b>${pill}</div>
      <div class="bar" style="margin-top:8px"><i style="width:${b.total ? Math.round(b.boarded / b.total * 100) : 0}%"></i></div>
      <div class="meta"><span><b style="color:var(--ink)">${b.boarded}</b> ${l.of} ${b.total}</span>${sp ? `<span>${esc(sp.name)}</span>` : (b.supervisor ? `<span>${esc(b.supervisor)}</span>` : '')}${seen}${b.speed && b.status !== 'arrived' ? `<span>${l.speed(Math.round(b.speed * 3.6))}</span>` : ''}</div>
      ${etaText(b) ? `<div style="margin-top:6px">${etaText(b)}</div>` : ''}
      ${(ex.rounds || {})[b.bus] ? (rd => `<div style="margin-top:6px"><span class="pill ${rd.absent ? 'bad' : 'ok'}">${rd.absent ? x.roundBad(new Date(rd.at).toTimeString().slice(0, 5), rd.checked, rd.total, rd.absent) : x.roundOk(new Date(rd.at).toTimeString().slice(0, 5), rd.checked, rd.total)}</span></div>`)(ex.rounds[b.bus]) : ''}
      <div class="acts">${sp && sp.phone ? `<a class="mini call" href="tel:${esc(sp.phone)}">${l.call}</a>` : ''}${ex.missingByBus ? (b.missing > 0 ? `<button class="mini" data-open="${esc(b.bus)}">${l.missingBtn(b.missing)}</button>` : (b.total ? `<span class="pill ok">${l.allIn}</span>` : '')) : ''}</div>
      ${open && miss.length ? `<div class="names">${miss.map(m => `<div><span>${esc(m.name)}</span><span class="muted">${esc(m.id)} · ${esc(m.team)}</span></div>`).join('')}</div>` : ''}</div>`;
  }).join('');
  const teamsReal = (ex.byTeam || []).filter(t => t.team && t.team !== '—');
  const byTeam = teamsReal.map(t => `<div class="brow"><span>${esc(t.team)}</span><div class="bar team" style="margin:0"><i style="width:${t.total ? Math.round(t.present / t.total * 100) : 0}%"></i></div><span class="muted" style="text-align:end"><b style="color:var(--ink)">${t.present}</b> / ${t.total}</span></div>`).join('');
  const comm = st.extra ? `<section class="card"><h2 class="h2" style="margin-bottom:10px">${l.committees}</h2><div class="grid4">
    <div class="card com"><div class="kl">⚕️ ${l.medOpen}</div><div class="kv" style="color:var(--${com.medUrgent ? 'bad' : 'ink'})">${com.medOpen || 0}</div><div class="kl">${com.medUrgent ? l.medUrgent(com.medUrgent) : ''}</div></div>
    <div class="card com"><div class="kl">📱 ${l.phones}</div><div class="kv">${com.phones || 0}</div></div>
    <div class="card com"><div class="kl">🧳 ${l.bags}</div><div class="kv">${com.bags || 0}</div></div>
    <div class="card com"><div class="kl">🚪 ${l.withdrawOpen}</div><div class="kv" style="color:var(--${com.withdrawOpen ? 'warn' : 'ink'})">${com.withdrawOpen || 0}</div></div>
    <div class="card com"><div class="kl">🍽️ ${l.meals}</div><div class="kv">${com.meals || 0}</div><div class="kl">${l.mealsNote}</div></div></div></section>` : '';
  const wds = st.extra ? `<section class="card feed"><h2 class="h2" style="margin-bottom:6px">${l.withdrawals}</h2>${(ex.withdrawals || []).length ? ex.withdrawals.map(w => `<div><span>${esc(w.name)}${w.bus ? ' · ' + l.bus(esc(w.bus)) : ''} <span class="muted">· ${l.receiver}: ${esc(w.guardian)}</span></span><span style="display:flex;gap:6px;align-items:center"><span class="pill ${w.status === 'open' ? 'warn' : 'bad'}">${w.status === 'open' ? l.wdOpen : l.wdClosed}</span><span class="muted">${esc(new Date(w.time).toTimeString().slice(0, 5))}</span></span></div>`).join('') : `<div class="muted">${l.noWd}</div>`}</section>` : '';
  const feed = st.extra ? `<section class="card feed"><h2 class="h2" style="margin-bottom:6px">${l.feed}</h2>${(ex.feed || []).length ? ex.feed.map(f => `<div><span>${f.action === 'board' ? '🟢' : f.action === 'undo' ? '↩️' : '🚪'} ${esc(f.name)} · ${l.actions[f.action] || esc(f.action)} · ${l.bus(esc(f.bus))}</span><span class="muted">${esc(new Date(f.time).toTimeString().slice(0, 5))}</span></div>`).join('') : `<div class="muted">${l.noFeed}</div>`}</section>` : '';
  const casesHtml = st.cases.length ? st.cases.map(c => `<div class="bus" style="margin-bottom:8px"><div class="top"><b>${esc(x.ty[c.type] || c.type)}${c.bus ? ' · ' + l.bus(esc(c.bus)) : ''}</b><span class="pill ${c.status === 'open' ? 'bad' : c.status === 'ack' ? 'warn' : 'ok'}">${esc(x.stt[c.status] || c.status)}</span></div><div style="margin:6px 0">${esc(c.text)}</div>${c.status !== 'closed' ? `<div style="display:flex;gap:8px">${c.status === 'open' ? `<button class="btn" data-case="${esc(c.id)}" data-st="ack">${x.ack}</button>` : ''}<button class="btn" data-case="${esc(c.id)}" data-st="closed">${x.close}</button></div>` : ''}</div>`).join('') : `<div class="muted">${x.noCases}</div>`;
  $('app').innerHTML = `${st.stale ? `<div class="banner warn" style="margin-top:0">${l.stale}</div>` : ''}${st.err ? `<div class="banner bad">${esc(st.err)}</div>` : ''}${st.msg ? `<div class="banner ok">${esc(st.msg)}</div>` : ''}
  <div class="toolsbar"><button class="mini" id="soundBtn">${soundOn ? l.sound : l.soundOff}</button>${st.extra ? `<button class="mini" id="absentBtn">${l.printAbsent}</button>` : ''}<button class="mini" id="reportBtn">${l.printReport}</button></div>
  ${ev}
  <section class="card"><h2 class="h2" style="margin-bottom:8px">${x.alerts}</h2>${alertsHtml}</section>
  <div class="kpis">${hero}${kpi(l.remaining, left, '', left ? 'warn' : 'ok')}${kpi(l.arrivedBuses, arrived + ' / ' + buses.length, '', arrived === buses.length && buses.length ? 'ok' : '')}${kpi(l.withdrawn, s.withdrawn, '', s.withdrawn ? 'bad' : '')}</div>
  <div class="cols"><section class="card c2"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap"><h2 class="h2">${l.map}</h2><span style="display:flex;gap:6px;align-items:center">${st.canSetCamp ? `<button class="mini" id="campBtn">${st.picking ? l.setCampHint : l.setCamp}</button>` : ''}<span class="pill ok">● ${l.live}</span></span></div><div id="map"></div><div class="muted" style="font-size:12.5px;margin-top:8px">${st.camp ? l.note : l.campNone}</div></section>
  <aside class="c1" style="display:flex;flex-direction:column;gap:10px">${cards}</aside></div>
  ${comm}
  <div class="cols"><section class="card c1"><h2 class="h2" style="margin-bottom:6px">${l.byBus}</h2>${buses.map(b => `<div class="brow"><span>${l.bus(esc(b.bus))}</span><div class="bar" style="margin:0"><i style="width:${b.total ? Math.round(b.boarded / b.total * 100) : 0}%"></i></div><span class="muted" style="text-align:end"><b style="color:var(--ink)">${b.boarded}</b> / ${b.total}</span></div>`).join('')}</section>
  ${byTeam ? `<section class="card c1"><h2 class="h2" style="margin-bottom:6px">${l.byTeam}</h2>${byTeam}</section>` : ''}</div>
  <div class="cols">${feed ? `<div class="c1" style="display:flex;flex-direction:column;gap:14px">${feed}${wds}</div>` : ''}<section class="card c1"><h2 class="h2" style="margin-bottom:8px">${x.cases}</h2>${casesHtml}</section></div>`;
  if (keepMap) { const ph = $('map'); if (ph) ph.replaceWith(keepMap); }
  drawMap();
}
document.addEventListener('click', async e => {
  const t = e.target.closest && e.target.closest('button,[data-open]'); if (!t) return;
  if (t.dataset.open) { st.open[t.dataset.open] = !st.open[t.dataset.open]; return render(); }
  if (t.id === 'soundBtn') { soundOn = !soundOn; try { localStorage.setItem('mk_leader_sound', soundOn ? '1' : '0'); } catch (err) {} if (soundOn) { seenBad = null; ding(); } return render(); }
  if (t.id === 'absentBtn') return printAbsent();
  if (t.id === 'reportBtn') return printReport();
  if (t.id === 'campBtn') { st.picking = !st.picking; st.msg = ''; return render(); }
  if (t.dataset.case && (can('dashboard') || can('manage'))) {
    t.disabled = true;
    try { await api('updateCase', { id: t.dataset.case, status: t.dataset.st }); } catch (err) {}
    poll();
  }
});
$('langBtn').onclick = () => { st.lang = st.lang === 'ar' ? 'en' : 'ar'; pref.set('lang', st.lang); render(); };
$('themeBtn').onclick = () => { st.theme = st.theme === 'light' ? 'dark' : 'light'; pref.set('theme', st.theme); render(); };
window.addEventListener('online', poll); window.addEventListener('offline', render);
window.addEventListener('load', () => { if (!map) render(); });   // the map library loads after the first (instant, saved-data) render: redraw once it is ready
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
setInterval(() => { if (!document.hidden && navigator.onLine) poll(); }, POLL_MS);
setInterval(() => { const e = $('cd'); if (e && st.extra && st.extra.nextEvent) e.textContent = countdown(st.extra.nextEvent.startsAt); }, 30000);
render(); poll();
</script>
<div id="printArea"></div>
</body></html>
