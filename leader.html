<html lang="ar" dir="rtl" data-theme="light">

<style>
.kpi{flex:1 1 160px;padding:14px 16px}
#map{height:380px;border-radius:12px;background:var(--soft);z-index:0}
.cols{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}.c1{flex:1 1 280px;min-width:0}.c2{flex:2 1 420px;min-width:0}
.bus{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.brow{display:grid;grid-template-columns:90px 1fr 80px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.pin{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);font-size:14px}
.pin.f{background:#2E7D4F}.pin.s{background:#D4912A}.pin.o{background:#C2455A}
.pin.tr{background:#C2455A}.pin.to{background:#E08A1E}.pin.tg{background:#2E7D4F}.pin.td{background:#7B8580}.pin.stale{opacity:.5}
@keyframes pulse{50%{opacity:.55}}.sk{animation:pulse 1.2s infinite;background:var(--soft)}
.kpi .kv{font-size:38px}.kpi.hero{background:var(--brand);color:var(--btnink);border:0}.kpi.hero .kl{color:var(--btnink);opacity:.85}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring b{width:56px;height:56px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;font-size:16px}
.ev{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#E9B04C,#d39320);color:#1b1b1b;border:0}
.ev .cd{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-inline-start:auto;white-space:nowrap}
.bus .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.bus .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:6px}
.bus .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;padding:0 12px;font:inherit;font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.mini.call{border-color:var(--brand);color:var(--brand);font-weight:600}
.names{margin-top:8px;max-height:220px;overflow:auto;border-top:1px solid var(--line)}
.names div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.eta{font-weight:700;color:var(--brand)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.com{padding:14px}.com .kv{font-size:28px}
.feed div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.bar.team i{background:var(--brand)}
.camp-pin{font-size:26px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.toolsbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#printArea{display:none}
@page{size:A4;margin:10mm}
/* Printed reports wear the camp identity: the symbol, brown titles, a gold rule, brown table heads, the icon strip at the foot. */
@media print{body>*:not(#printArea){display:none!important} /* the hidden screen must not leave empty pages after the report */
 #printArea{display:block;position:static;padding:0;color:#372A25;background:#fff;font-family:Tajawal,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .pr-hd{display:flex;align-items:center;gap:4mm;padding-bottom:3mm;border-bottom:.8mm solid #EBBA4E}.pr-hd img{height:18mm}
 .pr-hd .n{font-weight:800;font-size:12pt}.pr-hd h1{font-family:Lalezar,Tajawal,sans-serif;font-weight:400;font-size:20pt;margin:0;line-height:1.2}.pr-hd .w{margin-inline-start:auto;font-size:10pt;text-align:end}
 .pr-k{display:flex;gap:3mm;margin:4mm 0 2mm}.pr-k div{flex:1;border:.3mm solid #D8C79C;border-radius:3mm;padding:2mm 3mm;background:#FBF3D7}.pr-k b{display:block;font-family:Lalezar,Tajawal,sans-serif;font-weight:400;font-size:18pt;line-height:1.1}.pr-k span{font-size:9.5pt}

 #printArea table{width:100%;border-collapse:collapse;font-size:10.5pt}#printArea td,#printArea th{border:.3mm solid #D8C79C;padding:1.5mm 2mm;text-align:start}
 #printArea th{background:#372A25;color:#FBF3D7;font-weight:700}#printArea tr:nth-child(even) td{background:#FBF3D7}
 .pr-ft{margin-top:6mm;height:9mm;background:url(brand/strip.png) repeat-x center/auto 100%}}

  const hero = `<div class="card kpi hero" style="display:flex;align-items:center;gap:14px"><div class="ring" style="--p:${pct}"><b>${pct}%</b></div><div><div class="kl">${l.present}</div><div class="kv">${s.boarded}</div><div class="kl">${l.of} ${s.total}</div>${s.direct !== undefined ? `<div class="kl" style="margin-top:4px">🚌 ${l.viaBus}: <b>${s.viaBus}</b></div><div class="kl">🚗 ${l.direct}: <b>${s.direct}</b></div>` : ''}</div></div>`;
  const ev = ex.nextEvent ? `<section class="card ev"><div style="font-size:30px">🎉</div><div><div style="font-size:13px;opacity:.8">${l.nextEvent}</div><b style="font-size:18px">${esc(ex.nextEvent.title)}</b></div><div class="cd" id="cd">${countdown(ex.nextEvent.startsAt)}</div></section>` : '';
  const sup = (ex.supervisors || {});
  const cards = buses.map(b => {
    const sp = (sup[b.bus] || [])[0], miss = (ex.missingByBus || {})[b.bus] || [], open = st.open[b.bus];
    const tn = busTone(b), pill = `<span class="pill ${TONE_CLS[tn]}">${TONE_DOT[tn]} ${esc(!b.started ? l.notStarted : l.tone[tn])}</span>`;
    const seen = b.lat === null || b.lat === undefined ? `<span>${l.noLoc}</span>` : `<span style="color:var(--${b.ageSec >= 300 ? 'bad' : 'ok'})">${b.ageSec >= 300 ? '⚠ ' : ''}${l.lastSeen(b.ageSec)}</span>`;
    return `<div class="bus"><div class="top"><b>${l.bus(esc(b.bus))}</b>${pill}</div>
      <div class="bar" style="margin-top:8px"><i style="width:${b.total ? Math.round(b.boarded / b.total * 100) : 0}%"></i></div>
      <div class="meta"><span><b style="color:var(--ink)">${b.boarded}</b> ${l.of} ${b.total}${b.guardian ? ` · 🚗${b.guardian}` : ''}</span>${sp ? `<span>${esc(sp.name)}</span>` : (b.supervisor ? `<span>${esc(b.supervisor)}</span>` : '')}${seen}${b.speed && b.status !== 'arrived' ? `<span>${l.speed(Math.round(b.speed * 3.6))}</span>` : ''}</div>
      ${etaText(b) ? `<div style="margin-top:6px">${etaText(b)}</div>` : ''}
      ${(ex.rounds || {})[b.bus] ? (rd => `<div style="margin-top:6px"><span class="pill ${rd.absent ? 'bad' : 'ok'}">${rd.absent ? x.roundBad(new Date(rd.at).toTimeString().slice(0, 5), rd.checked, rd.total, rd.absent) : x.roundOk(new Date(rd.at).toTimeString().slice(0, 5), rd.checked, rd.total)}</span></div>`)(ex.rounds[b.bus]) : ''}
      <div class="acts">${sp && sp.phone ? `<a class="mini call" href="tel:${esc(sp.phone)}">${l.call}</a>` : ''}${needsTracking(b) ? (st.pinged[b.bus] && Date.now() - st.pinged[b.bus] < 60000 ? `<span class="pill ok">${l.pinged}</span>` : `<button class="mini" data-ping="${esc(b.bus)}">${l.ping}</button>`) + (sp && waNum(sp.phone) ? `<a class="mini" target="_blank" rel="noopener" href="https://wa.me/${waNum(sp.phone)}?text=${encodeURIComponent(l.waMsg(b.bus, new URL('supervisor.html', location.href).href))}">${l.wa}</a>` : '') : ''}${ex.missingByBus ? (b.missing > 0 ? `<button class="mini" data-open="${esc(b.bus)}">${l.missingBtn(b.missing)}</button>` : (b.total ? `<span class="pill ok">${l.allIn}</span>` : '')) : ''}</div>
      ${open && miss.length ? `<div class="names">${miss.map(m => `<div><span>${esc(m.name)}</span><span class="muted">${esc(m.id)} · ${esc(m.team)}</span></div>`).join('')}</div>` : ''}</div>`;
  }).join('');
  const teamsReal = (ex.byTeam || []).filter(t => t.team && t.team !== '—');
  const byTeam = teamsReal.map(t => `<div class="brow"><span>${esc(t.team)}</span><div class="bar team" style="margin:0"><i style="width:${t.total ? Math.round(t.present / t.total * 100) : 0}%"></i></div><span class="muted" style="text-align:end"><b style="color:var(--ink)">${t.present}</b> / ${t.total}</span></div>`).join('');
  const comm = st.extra ? `<section class="card"><h2 class="h2" style="margin-bottom:10px">${l.committees}</h2><div class="grid4">
    <div class="card com"><div class="kl">⚕️ ${l.medOpen}</div><div class="kv" style="color:var(--${com.medUrgent ? 'bad' : 'ink'})">${com.medOpen || 0}</div><div class="kl">${com.medUrgent ? l.medUrgent(com.medUrgent) : ''}</div></div>
    <div class="card com"><div class="kl">🚪 ${l.withdrawOpen}</div><div class="kv" style="color:var(--${com.withdrawOpen ? 'warn' : 'ink'})">${com.withdrawOpen || 0}</div></div>
    <div class="card com"><div class="kl">🍽️ ${l.meals}</div><div class="kv">${com.meals || 0}</div><div class="kl">${l.mealsNote}</div></div></div></section>` : '';
  const wds = st.extra ? `<section class="card feed"><h2 class="h2" style="margin-bottom:6px">${l.withdrawals}</h2>${(ex.withdrawals || []).length ? ex.withdrawals.map(w => `<div><span>${esc(w.name)}${w.bus ? ' · ' + l.bus(esc(w.bus)) : ''} <span class="muted">· ${l.receiver}: ${esc(w.guardian)}</span></span><span style="display:flex;gap:6px;align-items:center"><span class="pill ${w.status === 'open' ? 'warn' : 'bad'}">${w.status === 'open' ? l.wdOpen : l.wdClosed}</span><span class="muted">${esc(new Date(w.time).toTimeString().slice(0, 5))}</span></span></div>`).join('') : `<div class="muted">${l.noWd}</div>`}</section>` : '';
  const feed = st.extra ? `<section class="card feed"><h2 class="h2" style="margin-bottom:6px">${l.feed}</h2>${(ex.feed || []).length ? ex.feed.map(f => `<div><span>${f.action === 'board' ? '🟢' : f.action === 'undo' ? '↩️' : '🚪'} ${esc(f.name)} · ${f.via === 'guardian' && f.action === 'board' ? l.withGuardian : (l.actions[f.action] || esc(f.action)) + ' · ' + l.bus(esc(f.bus))}</span><span class="muted">${esc(new Date(f.time).toTimeString().slice(0, 5))}</span></div>`).join('') : `<div class="muted">${l.noFeed}</div>`}</section>` : '';
  const casesHtml = st.cases.length ? st.cases.map(c => `<div class="bus" style="margin-bottom:8px"><div class="top"><b>${esc(x.ty[c.type] || c.type)}${c.bus ? ' · ' + l.bus(esc(c.bus)) : ''}</b><span class="pill ${c.status === 'open' ? 'bad' : c.status === 'ack' ? 'warn' : 'ok'}">${esc(x.stt[c.status] || c.status)}</span></div><div class="muted" style="font-size:12.5px;margin-top:4px">🕒 ${caseTime(c.time)}${c.byName ? (st.lang === 'en' ? ' · reported by ' : ' · بلّغ: ') + esc(c.byName) : ''}</div><div style="margin:6px 0">${esc(c.text)}</div>${c.status !== 'closed' ? `<div style="display:flex;gap:8px">${c.status === 'open' ? `<button class="btn" data-case="${esc(c.id)}" data-st="ack">${x.ack}</button>` : ''}<button class="btn" data-case="${esc(c.id)}" data-st="closed">${x.close}</button></div>` : ''}</div>`).join('') : `<div class="muted">${x.noCases}</div>`;
  $('app').innerHTML = `${st.stale ? `<div class="banner warn" style="margin-top:0">${l.stale}</div>` : ''}${st.err ? `<div class="banner bad">${esc(st.err)}</div>` : ''}${st.msg ? `<div class="banner ok">${esc(st.msg)}</div>` : ''}
  <div class="toolsbar"><button class="mini" id="soundBtn">${soundOn ? l.sound : l.soundOff}</button>${st.extra ? `<button class="mini" id="absentBtn">${l.printAbsent}</button>` : ''}<button class="mini" id="reportBtn">${l.printReport}</button></div>
  ${ev}
  <section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 class="h2" style="margin:0">${alHidden && nAlerts ? `<span style="color:var(--${nBad ? 'bad' : 'warn'})">●</span> ${x.alCount(nAlerts)}` : x.alerts}</h2>${nAlerts ? `<button class="mini" id="alBtn">${alHidden ? x.alShow : x.alHide}</button>` : ''}</div>${alHidden && nAlerts ? '' : `<div style="margin-top:8px">${alertsHtml}</div>`}</section>
  <div class="kpis">${hero}${kpi(l.remaining, left, '', left ? 'warn' : 'ok')}${kpi(l.arrivedBuses, arrived + ' / ' + buses.length, '', arrived === buses.length && buses.length ? 'ok' : '')}${kpi(l.withdrawn, s.withdrawn, l.withdrawnNote, s.withdrawn ? 'bad' : '')}</div>
  ${donutHtml(s)}${st.extra ? stagesHtml(ex) : ''}${weatherHtml()}
  <div class="cols"><section class="card c2"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap"><h2 class="h2">${l.map}</h2><span style="display:flex;gap:6px;align-items:center">${st.canSetCamp ? `<button class="mini" id="campBtn">${st.picking ? l.setCampHint : l.setCamp}</button>` : ''}<span class="pill ok">● ${l.live}</span></span></div><div id="map"></div><div class="muted" style="font-size:12.5px;margin-top:8px">${st.camp ? l.note : l.campNone}</div></section>
  <aside class="c1" style="display:flex;flex-direction:column;gap:10px">${cards}</aside></div>
  ${comm}${st.extra ? clinicHtml(ex) : ''}
  <div class="cols"><section class="card c1"><h2 class="h2" style="margin-bottom:6px">${l.byBus}</h2>${buses.map(b => `<div class="brow"><span>${l.bus(esc(b.bus))}</span><div class="bar" style="margin:0"><i style="width:${b.total ? Math.round(b.boarded / b.total * 100) : 0}%"></i></div><span class="muted" style="text-align:end"><b style="color:var(--ink)">${b.boarded}</b> / ${b.total}${b.guardian ? ` · 🚗${b.guardian}` : ''}</span></div>`).join('')}</section>
  ${byTeam ? `<section class="card c1"><h2 class="h2" style="margin-bottom:6px">${l.byTeam}</h2>${byTeam}</section>` : ''}</div>
  <div class="cols">${feed ? `<div class="c1" style="display:flex;flex-direction:column;gap:14px">${feed}${wds}</div>` : ''}<section class="card c1"><h2 class="h2" style="margin-bottom:8px">${x.cases}</h2>${casesHtml}</section></div>`;
  if (keepMap) { const ph = $('map'); if (ph) ph.replaceWith(keepMap); }
  drawMap();
}
document.addEventListener('click', async e => {
  const t = e.target.closest && e.target.closest('button,[data-open]'); if (!t) return;
  if (t.dataset.open) { st.open[t.dataset.open] = !st.open[t.dataset.open]; return render(); }
  if (t.dataset.ping) { const bus = t.dataset.ping; t.disabled = true; try { const r = await api('trackPing', { bus: bus }); if (r && r.success) st.pinged[bus] = Date.now(); else alert(L_().pingFail); } catch (err) { alert(L_().pingFail); } return render(); }
  if (t.id === 'soundBtn') { soundOn = !soundOn; try { localStorage.setItem('mk_leader_sound', soundOn ? '1' : '0'); } catch (err) {} if (soundOn) { seenBad = null; ding(); } return render(); }
  if (t.id === 'alBtn') { const nb = ((st.sum && st.sum.alerts) || []).filter(a => a.level === 'bad' && a.type !== 'no_report').length; setAlHidden(!alHidden, nb); return render(); }
  if (t.id === 'absentBtn') return printAbsent();
  if (t.id === 'reportBtn') return printReport();
  if (t.id === 'campBtn') { st.picking = !st.picking; st.msg = ''; return render(); }
  if (t.dataset.case && (can('dashboard') || can('manage'))) {
    t.disabled = true;
    try { await api('updateCase', { id: t.dataset.case, status: t.dataset.st }); } catch (err) {}
    poll();
  }
});
$('langBtn').onclick = () => { st.lang = st.lang === 'ar' ? 'en' : 'ar'; pref.set('lang', st.lang); render(); };
$('themeBtn').onclick = () => { st.theme = st.theme === 'light' ? 'dark' : 'light'; pref.set('theme', st.theme); render(); };
window.addEventListener('online', poll); window.addEventListener('offline', render);
window.addEventListener('load', () => { if (!map) render(); });   // the map library loads after the first (instant, saved-data) render: redraw once it is ready
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
setInterval(() => { if (!document.hidden && navigator.onLine) poll(); }, POLL_MS);
setInterval(() => { if (!document.hidden && navigator.onLine) loadWeather(); }, 1800000); // the weather changes slowly: every 30 minutes
setInterval(() => { const e = $('cd'); if (e && st.extra && st.extra.nextEvent) e.textContent = countdown(st.extra.nextEvent.startsAt); }, 30000);
render(); poll(); loadWeather();
</script>
<div id="printArea"></div>
</body></html>
