<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة العرض — MUKHAYYAM</title>
<link rel="stylesheet" href="brand/brand.css">
<style>
/* Camp 13 identity (brand/brand.css + the visual identity guide): flat dark brown and cream, gold only for numbers and one highlight.
   Landscape projector / TV, all sizes in vw. Scenes alternate dark and light, as the guide asks of posts. */
:root{--ink:var(--cream);--mute:rgba(251,243,215,.7);--gold:var(--gd);--line:rgba(251,243,215,.2);--track:rgba(251,243,215,.18);--fill:var(--gd)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--dark)}
body{color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-weight:500;cursor:none}
.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:1vw;padding:1.4vw 2.6vw 0}
.hd{display:flex;align-items:center;gap:1.2vw}
.logo{width:6.2vw;height:6.2vw;display:grid;place-items:center}.logo img{width:100%;height:100%;object-fit:contain}
.cname{font-family:Lalezar,Tajawal,sans-serif;font-size:2.7vw;line-height:1.2}
.slogan{display:flex;align-items:center;gap:1vw;font-size:1.25vw;font-weight:700;color:var(--mute)}.slogan img{height:2.2vw}
.live{margin-inline-start:auto;display:flex;align-items:center;gap:.6vw;border:1.5px solid rgba(255,110,100,.6);padding:.3vw 1vw;border-radius:99px;font-weight:700;font-size:1.2vw}
.live i{width:.75vw;height:.75vw;border-radius:50%;background:#ff5a4f;animation:pls 1.4s infinite}.live.off{border-color:var(--line)}.live.off i{background:#8d8178;animation:none}
@keyframes pls{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 24vw;gap:1.6vw;min-height:0}
.stage{position:relative;min-width:0;border-radius:2vw;overflow:hidden;background:var(--dark);border:.15vw solid var(--line);transition:background .6s,color .6s}
.stage[data-tone="light"]{background:var(--cream);border-color:var(--cream);color:var(--dark);--ink:var(--dark);--mute:rgba(55,42,37,.68);--gold:var(--dark);--line:rgba(55,42,37,.16);--track:rgba(55,42,37,.14);--fill:var(--dark)}
.sc{position:absolute;inset:0;padding:2vw 2.4vw 2.6vw;display:flex;flex-direction:column;justify-content:center;animation:scin .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes scin{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
.dots{position:absolute;bottom:.9vw;inset-inline:0;display:flex;justify-content:center;gap:.5vw;z-index:2}.dots i{width:.7vw;height:.7vw;border-radius:99px;background:var(--track);transition:all .4s}.dots i.on{width:2.4vw;background:var(--fill)}
.k{color:var(--gold);font-weight:800;font-size:1.35vw}.h{font-family:Lalezar,Tajawal,sans-serif;font-size:3vw;line-height:1.3;margin:.2vw 0 1vw}
.st{font-family:Lalezar,Tajawal,sans-serif;font-size:2.6vw;text-align:center;margin-bottom:1.2vw}
.new{background:var(--gd);color:var(--dark);border-radius:.7vw;padding:0 .7vw;font-family:Tajawal,sans-serif;font-weight:800;font-size:.55em;vertical-align:middle}
.g{display:grid;grid-template-columns:9vw minmax(0,1fr) auto;gap:1.2vw;align-items:center;padding:.85vw 0;border-top:1px solid var(--line);font-size:1.9vw;font-weight:700}
.g:first-of-type{border-top:0}.grp{background:var(--gd);color:var(--dark);border-radius:.8vw;text-align:center;padding:.3vw 0;font-size:1.4vw;font-weight:800}
.pl{font-size:1.3vw;color:var(--mute);font-weight:700;white-space:nowrap}
.bar{height:1vw;background:var(--track);border-radius:99px;overflow:hidden;margin-top:1.4vw}.bar i{display:block;height:100%;background:var(--fill);border-radius:99px;transition:width 1s linear}
.rem{display:flex;justify-content:space-between;color:var(--mute);font-size:1.25vw;margin-top:.5vw}
.day{display:flex;flex-direction:column;gap:.5vw}
.dr{display:grid;grid-template-columns:11vw minmax(0,1fr) auto;gap:1vw;align-items:center;border:1px solid var(--line);border-radius:1vw;padding:.5vw 1.2vw;font-size:1.45vw}
.dr.past{opacity:.42}.dr.now{background:rgba(235,186,78,.28);border:.15vw solid var(--gd)}.dr .tm{font-family:Lalezar,Tajawal,sans-serif;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.nowb{background:var(--gd);color:var(--dark);border-radius:99px;padding:0 .7vw;font-size:.75em;font-weight:800;margin-inline-start:.5vw}
.rail{display:flex;flex-direction:column;gap:.9vw;min-height:0}
.rc{border:1.5px solid var(--line);border-radius:1.5vw;padding:.9vw 1.2vw}
.clk{font-family:Lalezar,Tajawal,sans-serif;font-size:4.2vw;direction:ltr;text-align:center;line-height:1.05;font-variant-numeric:tabular-nums}.clk small{font-size:.4em;color:var(--gd)}
.date{text-align:center;color:var(--mute);font-size:1.05vw;margin-top:.3vw}
.rc .t{color:var(--gd);font-weight:700;font-size:1.1vw}.rc .v{font-size:1.6vw;font-weight:800;line-height:1.35}.rc .s{color:var(--mute);font-size:1.02vw}
.cd{font-family:Lalezar,Tajawal,sans-serif;color:var(--gold);direction:ltr;font-variant-numeric:tabular-nums;display:inline-block}.rc .cd{font-size:2.3vw;color:var(--gd)}
.tick{display:flex;align-items:center;gap:1vw;border:1.5px solid var(--line);border-radius:1vw;height:3.4vw;overflow:hidden;font-size:1.45vw;font-weight:700}
.tick b{flex:none;background:var(--gd);color:var(--dark);height:100%;display:grid;place-items:center;padding:0 1.2vw}
.tick .tr{flex:1;position:relative;height:100%;overflow:hidden;white-space:nowrap}.tick .tr span{position:absolute;top:50%;animation:mq linear infinite}
@keyframes mq{from{left:0;transform:translate(-100%,-50%)}to{left:100%;transform:translate(0,-50%)}}
.strip{height:2.4vw;margin:0 -2.6vw;background:url(brand/strip.png) repeat-x center/auto 100%}
.card2{max-width:90%;margin:0 auto;text-align:center}.ai{font-size:5vw;line-height:1.1;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1vh) rotate(-6deg)}}
.al{font-size:1.5vw;color:var(--gold);font-weight:800;margin:.4vw 0}.kb{display:inline-block;border-radius:99px;padding:.15vw 1.2vw;color:var(--dark);border:1px solid rgba(55,42,37,.18)}.at{font-family:Lalezar,Tajawal,sans-serif;font-size:3.4vw;line-height:1.4}.sub2{font-size:1.8vw;opacity:.92;margin-top:.6vw}
.verse{font-family:Amiri,serif;font-size:3vw;line-height:1.8}
.rank{display:flex;flex-direction:column;gap:.7vw;max-width:92%;margin:0 auto;width:100%}
.lr{display:grid;grid-template-columns:4vw 15vw 1fr 7vw;align-items:center;gap:1.2vw;font-size:1.9vw;font-weight:700;border:1px solid var(--line);border-radius:1.2vw;padding:.45vw 1.4vw}
.lr .bar{margin:0;height:1.4vw}.lr .bar i{margin:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}.lr .pt{text-align:left;font-family:Lalezar,Tajawal,sans-serif;color:var(--gold);direction:ltr}
.pq{display:grid;gap:.9vw;max-width:92%;margin:0 auto;width:100%}
.pc{text-align:center;border-radius:1.3vw;padding:.9vw;border:1px solid var(--line)}
.pc .pn{font-size:1.6vw;font-weight:800}.pc .pt{font-family:Lalezar,Tajawal,sans-serif;font-size:2.6vw;color:var(--gold);direction:ltr}.pc small{font-size:1vw;opacity:.75}
.pc.nx{border:.2vw solid var(--gd);background:rgba(235,186,78,.22)}.pc.dn{opacity:.42}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:2vw;height:22vw}.pd{width:14vw;text-align:center}
.pd .m{font-size:2.6vw}.pd .n{font-size:1.8vw;font-weight:800}.pd .b{border-radius:1vw 1vw 0 0;display:grid;place-items:center;font-family:Lalezar,Tajawal,sans-serif;font-size:2.6vw;background:var(--ink);color:var(--stage-bg,var(--dark))}
.pd{display:flex;flex-direction:column;justify-content:flex-end}
.pd .b{transform-origin:bottom;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}.pd .m,.pd .n{animation:pop .5s ease-out both}
.pd:nth-child(3) .b{animation-delay:.2s}.pd:nth-child(3) .m,.pd:nth-child(3) .n{animation-delay:1s}
.pd:nth-child(1) .b{animation-delay:.9s}.pd:nth-child(1) .m,.pd:nth-child(1) .n{animation-delay:1.7s}
.pd:nth-child(2) .b{animation-delay:1.6s}.pd:nth-child(2) .m,.pd:nth-child(2) .n{animation-delay:2.4s}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.up{color:#4CC38A;font-size:.8em;margin-inline-start:.4vw}
.nx3{display:flex;flex-direction:column;gap:.8vw;max-width:94%;margin:0 auto;width:100%}
.nx3 .r{display:grid;grid-template-columns:11vw minmax(0,1fr);gap:1.2vw;align-items:center;border:1px solid var(--line);border-radius:1.2vw;padding:.8vw 1.4vw}
.nx3 .r:first-child{border:.2vw solid var(--gd)}.nx3 .tm{font-family:Lalezar,Tajawal,sans-serif;font-size:2.1vw;direction:ltr;text-align:right}
.nx3 .ti{font-size:2vw;font-weight:800;line-height:1.3}.nx3 .pl{font-size:1.25vw;color:var(--mute);margin-top:.2vw}
#confetti{position:fixed;inset:0;z-index:15;pointer-events:none}
.stage[data-tone="light"] .pd .b{color:var(--cream)}.stage:not([data-tone="light"]) .pd .b{color:var(--dark)}.pd .b.first{background:var(--gd);color:var(--dark)!important}
.full{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;padding:4vw;background:var(--dark)}
.full.urgent{background:#9e2a22}
.full .ttl{font-family:Lalezar,Tajawal,sans-serif;font-size:5.4vw;line-height:1.3}.full .sub{font-size:2.1vw;font-weight:700;color:var(--gd);margin-top:1.2vw}.full.urgent .sub{color:var(--cream)}.full .ic{font-size:7vw}
.full .big{font-family:Lalezar,Tajawal,sans-serif;font-size:8vw;color:var(--gd);direction:ltr;font-variant-numeric:tabular-nums;line-height:1.1;margin:1vw 0}
.setup{position:fixed;inset:0;display:grid;place-items:center;z-index:50;cursor:auto;background:var(--dark)}
.setup .box{width:min(560px,90vw);padding:28px;border-radius:18px;background:var(--cream);color:var(--dark);font-size:16px}
.setup input{width:100%;padding:12px;border-radius:10px;border:1.5px solid rgba(55,42,37,.3);background:#fff;color:var(--dark);font-size:16px;margin:10px 0;direction:ltr}
.setup button,.fs{border:0;border-radius:10px;font-family:Tajawal,sans-serif;font-weight:800;cursor:pointer;background:var(--gd);color:var(--dark)}
.setup button{width:100%;padding:12px;font-size:16px}
.fs{position:fixed;bottom:8.6vw;left:3vw;z-index:30;padding:.4vw 1vw;font-size:1vw;opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hd"><div class="logo" id="logo"><img src="brand/symbol.png" alt=""></div><div><div class="cname" id="cname"></div><div class="slogan"><img src="brand/slogan.png" alt="في الخير محملاً"><span id="slogan"></span></div></div><span class="live" id="live"><i></i><span id="liveTx">مباشر</span></span></header>
  <div class="main"><section class="stage"><div id="stage"></div><nav class="dots" id="dots"></nav></section><aside class="rail" id="rail"></aside></div>
  <div class="tick" id="ticker" style="display:none"><b>📣</b><div class="tr" id="tick"></div></div>
  <div class="strip" aria-hidden="true"></div>
</div>
<div id="over"></div>
<button class="fs" id="fsBtn">⛶ ملء الشاشة</button>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4lEBGPNxghwq9UmK0iljI5QdS-8iCvC-K09dDtbZCXGvGZyA4repTE3rFVVRp5zS4yw/exec';
// The camp name can also be set from the system (CampName). The logo and the slogan come from the official files in brand/ (the guide forbids retyping the slogan).
const CONFIG = { name: 'مخيم نشاط التدريس ١٣', slideSeconds: 12, adhanMinutes: 4, soonMinutes: 5 };
const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const PR = { fajr: 'الفجر', dhuhr: 'الظهر', asr: 'العصر', maghrib: 'المغرب', isha: 'العشاء' };
const TEAM_COLORS = ['#E5484D', '#4CC38A', '#3E8BFF', '#E8B04B', '#A06CF0', '#F07E3A', '#2EC4C4', '#E86BA7'];
// A team named after a colour is drawn in that colour; other teams take the next colour of the list.
const NAMED_COLORS = [['أحمر', '#E5484D'], ['أخضر', '#4CC38A'], ['أزرق', '#3E8BFF'], ['أصفر', '#E8B04B'], ['بنفسج', '#A06CF0'], ['برتقال', '#F07E3A'], ['فيروز', '#2EC4C4'], ['وردي', '#E86BA7']];
const teamColor = (name, i) => { const n = String(name || ''); const hit = NAMED_COLORS.find(c => n.indexOf(c[0]) !== -1); return hit ? hit[1] : TEAM_COLORS[i % TEAM_COLORS.length]; };
const HIDE_TYPES = ['حركة']; // bus movements are for the supervisors, not for the big screen

let resSig = null, prevTotals = null, freshAt = {}; // what changed in the last load (new result -> podium then the race)
let D = null, offset = 0, online = false, tried = false, loading = false, idx = -1, seen = {}, lastKey = '', lastSync = 0;
try { D = JSON.parse(store.get('mk_display_cache') || 'null'); lastSync = Number(store.get('mk_display_sync')) || 0; offset = Number(store.get('mk_display_off')) || 0; } catch (e) {}
// Preview only: display.html?at=2026-12-31T10:22 pretends it is that time (the clock keeps running from there).
const PREVIEW_AT = (() => { const v = new URLSearchParams(location.search).get('at'); const d = v ? new Date(v) : null; return d && !isNaN(d) ? d.getTime() - Date.now() : null; })();
const now = () => new Date(Date.now() + (PREVIEW_AT !== null ? PREVIEW_AT : offset));
const p2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const hms = ms => { ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return p2(Math.floor(s / 3600)) + ':' + p2(Math.floor(s % 3600 / 60)) + ':' + p2(s % 60); };
const t12 = hhmm => { const [h, m] = hhmm.split(':').map(Number); return ((h % 12) || 12) + ':' + p2(m) + ' ' + (h < 12 ? 'ص' : 'م'); };
const atTime = (day, hhmm) => { const [h, m] = hhmm.split(':').map(Number); const d = new Date(day); d.setHours(h, m, 0, 0); return d; };
const dur = ms => { const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60), r = m % 60; return h ? (h === 1 ? 'ساعة' : h === 2 ? 'ساعتين' : h + ' ساعات') + (r ? ' و' + r + ' دقيقة' : '') : r + ' دقيقة'; };

/* ---------- data ---------- */
async function load() {
  const key = store.get('mk_feed_key'); if (!key || loading) return;
  loading = true;
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 15000); // a hung request must not block the next try
  try {
    const r = await (await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'feed', key: key }), signal: ac.signal })).json();
    if (r.success) { noteChanges(r); D = r; const so = new Date(r.serverTime).getTime() - Date.now(); offset = isFinite(so) ? so : 0; online = true; lastSync = Date.now(); store.set('mk_display_cache', JSON.stringify(r)); store.set('mk_display_sync', String(lastSync)); store.set('mk_display_off', String(offset)); }
    else { online = false; if (/key/i.test(r.error || '')) { store.set('mk_feed_key', ''); setup('المفتاح غير صحيح. أدخله من جديد.'); } }
  } catch (e) { online = false; }
  clearTimeout(to); loading = false; tried = true;
}

// A competition whose rows changed (or a new one) is shown at once as a podium, then the team ranking moves.
function noteChanges(r) {
  const sig = {}; (r.results || []).forEach(g => { sig[g.competition] = JSON.stringify(g.rows); });
  if (resSig !== null) {
    const at = now().getTime();
    Object.keys(sig).forEach(c => { if (sig[c] !== resSig[c]) { freshAt['pod-' + c] = new Date(at).toISOString(); delete seen['pod-' + c]; } });
    const tot = JSON.stringify(r.totals || []), old = JSON.stringify((D && D.totals) || []);
    if (tot !== old) { if (!prevTotals) prevTotals = {}; ((D && D.totals) || []).forEach(x => { prevTotals[x.team] = x.points; }); freshAt.rank = new Date(at + 1).toISOString(); delete seen.rank; }
  }
  resSig = sig;
}

/* ---------- program: blocks of activities that start together (one per group) ---------- */
function blocksOf(day) {
  const items = (D && D.program || []).filter(x => x.date === day && HIDE_TYPES.indexOf(x.type) === -1), map = {};
  items.forEach(x => { (map[x.from] = map[x.from] || []).push(x); });
  const keys = Object.keys(map).sort();
  return keys.map((k, i) => { const list = map[k], start = atTime(day + 'T00:00:00', k), ends = list.map(x => x.to).filter(Boolean).sort();
    const nextStart = keys[i + 1] ? atTime(day + 'T00:00:00', keys[i + 1]) : null;
    const end = ends.length ? atTime(day + 'T00:00:00', ends[ends.length - 1]) : (nextStart || new Date(start.getTime() + 30 * 60000));
    return { start: start, end: end < start ? new Date(start.getTime() + 30 * 60000) : end, items: list }; });
}
function programState() {
  const t = now(), today = blocksOf(ymd(t)), tom = new Date(t); tom.setDate(tom.getDate() + 1);
  const cur = today.filter(b => b.start <= t && t < b.end).pop() || null;
  const next = today.concat(blocksOf(ymd(tom))).find(b => b.start > t) || null;
  return { today: today, cur: cur, next: next };
}
const blockTitle = b => { const ts = Array.from(new Set(b.items.map(x => x.title))); return b.items.length > 1 && ts.length > 1 ? 'أنشطة المجموعات' : ts[0]; };
const groupName = g => String(g || '').replace(/[()]/g, '').replace('جميع الموجودين', 'الجميع').trim() || 'الجميع';

/* ---------- prayers (the adhan is live from the camp mosque: the screen only shows it, no sound) ---------- */
function prayerEvents() {
  if (!D || !D.prayers) return [];
  const out = [], base = now();
  for (const k of [-1, 0, 1]) { const day = new Date(base); day.setDate(day.getDate() + k); const p = D.prayers[ymd(day)]; if (!p) continue;
    for (const n of Object.keys(PR)) if (p[n]) out.push({ n: n, at: atTime(day, p[n]) }); }
  return out.sort((a, b) => a.at - b.at);
}
function prayerState() {
  const t = now().getTime(), ev = prayerEvents();
  return { cur: ev.filter(e => e.at.getTime() <= t && t < e.at.getTime() + CONFIG.adhanMinutes * 60000).pop(), next: ev.find(e => e.at.getTime() > t) };
}

/* ---------- scenes ---------- */
const ann = k => (D && D.announcements || []).filter(a => a.kind === k);
function nowScene(ps) {
  const b = ps.cur, t = now();
  if (!b) return '';
  const pct = Math.min(100, Math.round((t - b.start) / (b.end - b.start) * 100));
  const rows = b.items.length > 1 ? b.items.map(x => `<div class="g"><span class="grp">${esc(groupName(x.group))}</span><span>${esc(x.title)}</span><span class="pl">${x.place ? '📍 ' + esc(x.place) : ''}</span></div>`).join('')
    : `<div class="sub2" style="font-size:1.7vw">${b.items[0].place ? '📍 ' + esc(b.items[0].place) : ''}${b.items[0].group ? ' · ' + esc(groupName(b.items[0].group)) : ''}</div>`;
  return `<div class="k">⏺ الآن · ${t12(b.items[0].from)}${b.items[0].to ? ' – ' + t12(b.items[0].to) : ''}</div><div class="h">${esc(blockTitle(b))}</div>${rows}
    <div class="bar"><i style="width:${Math.max(2, pct)}%"></i></div><div class="rem"><span>مضى ${dur(t - b.start)}</span><span>متبقٍ ${dur(b.end - t)}</span></div>`;
}
function dayScene(ps) {
  const t = now(), list = ps.today; if (!list.length) return '';
  const ci = list.indexOf(ps.cur), from = Math.max(0, Math.min(ci < 0 ? list.findIndex(b => b.start > t) - 1 : ci - 2, list.length - 8)), show = list.slice(Math.max(0, from), Math.max(0, from) + 8);
  return `<h2 class="st">📅 برنامج اليوم · ${esc(t.toLocaleDateString('ar-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }))}</h2><div class="day">${show.map(b => { const isNow = b === ps.cur, past = b.end <= t;
    return `<div class="dr ${isNow ? 'now' : past ? 'past' : ''}"><span class="tm">${t12(b.items[0].from)}</span><span>${esc(blockTitle(b))}${isNow ? '<span class="nowb">الآن</span>' : ''}</span><span class="pl">${b.items.length > 1 ? b.items.length + ' مجموعات' : (b.items[0].place ? '📍 ' + esc(b.items[0].place) : '')}</span></div>`; }).join('')}</div>`;
}
function rankScene() {
  const tt = D.totals, mx = Math.max(1, ...tt.map(x => x.points)), medal = ['🥇', '🥈', '🥉'], before = prevTotals || {};
  const oldOrder = Object.keys(before).sort((a, b) => before[b] - before[a]);
  return `<h2 class="st">🏆 الترتيب العام للفرق</h2><div class="rank">${tt.slice(0, 8).map((x, i) => { const was = oldOrder.indexOf(x.team), up = prevTotals && (was === -1 ? false : was > i);
    const from = before[x.team] === undefined ? (prevTotals ? 0 : x.points) : before[x.team];
    return `<div class="lr"><span style="text-align:center">${medal[i] || (i + 1)}</span><b>${esc(x.team)}${up ? '<span class="up">▲</span>' : ''}</b><div class="bar"><i data-w="${Math.round(x.points / mx * 100)}%" style="width:${Math.round(from / mx * 100)}%;background:${teamColor(x.team, i)}"></i></div><span class="pt">${x.points}</span></div>`; }).join('')}</div>`;
}
function prayersScene() {
  const t = now(), p = D.prayers[ymd(t)], st = prayerState(), names = Object.keys(PR).filter(n => p[n]);
  return `<h2 class="st">🕌 أوقات الصلاة</h2>${st.next ? `<div class="al" style="text-align:center;margin:-.4vw 0 1vw">الصلاة القادمة: ${PR[st.next.n]} بعد <span class="cd" data-cd="${st.next.at.getTime()}">${hms(st.next.at - t)}</span></div>` : ''}
    <div class="pq" style="grid-template-columns:repeat(${Math.min(names.length, 5)},1fr)">${names.map(n => { const at = atTime(t, p[n]), nx = st.next && st.next.n === n && ymd(st.next.at) === ymd(t);
      return `<div class="pc ${nx ? 'nx' : at < t ? 'dn' : ''}"><div class="pn">${PR[n]}</div><div class="pt">${t12(p[n])}</div></div>`; }).join('')}</div>`;
}
// Each kind wears its colour (the same as on the media page) so the hall knows the kind at a glance.
const KIND_COLOR = { announce: '#EBBA4E', event: '#A3A867', wisdom: '#ECCA9C', kudos: '#A8D285', quote: '#D39D66', call: '#372A25', greeting: '#FBF3D7' };
const textScene = (icon, kicker, title, body, verse, kind) => `<div class="card2"><div class="ai">${icon}</div><div class="al"><span class="kb" style="background:${KIND_COLOR[kind] || 'var(--gd)'}${kind === 'call' ? ';color:#FBF3D7;border-color:#FBF3D7' : ''}">${esc(kicker)}</span></div>${verse ? `<div class="verse">${esc(title)}</div>${body ? `<div class="sub2" style="color:var(--gold)">${esc(body)}</div>` : ''}` : `<div class="at">${esc(title)}</div>${body ? `<div class="sub2">${esc(body)}</div>` : ''}`}</div>`;
function podiumScene(g) {
  const rows = g.rows.slice(0, 3), order = [rows[1], rows[0], rows[2]].filter(Boolean), h = [17, 12, 9], md = ['🥇', '🥈', '🥉'];
  return `<h2 class="st">🎯 ${esc(g.competition)} <span class="new">النتيجة</span></h2><div class="pod">${order.map(r => { const i = rows.indexOf(r);
    return `<div class="pd"><div class="m">${md[i]}</div><div class="n">${esc(r.team)}</div><div class="b${i === 0 ? ' first' : ''}" style="height:${h[i]}vw">${r.points !== null ? r.points : '#' + (i + 1)}</div></div>`; }).join('')}</div>`;
}
// The next three activities of today, with their places, and a countdown to the first.
function upcomingScene() {
  const t = now(), list = blocksOf(ymd(t)).filter(b => b.start > t).slice(0, 3);
  return `<h2 class="st">⏭ القادم الآن</h2><div class="nx3">${list.map((b, i) => `<div class="r"><div class="tm">${t12(p2(b.start.getHours()) + ':' + p2(b.start.getMinutes()))}</div><div><div class="ti">${esc(blockTitle(b))}${i === 0 ? ` <span class="cd" data-cd="${b.start.getTime()}" style="font-size:.8em">${hms(b.start - t)}</span>` : ''}</div><div class="pl">${b.items.length > 1 ? b.items.map(x => esc(groupName(x.group)) + (x.place ? ': ' + esc(x.place) : '')).join(' · ') : (b.items[0].place ? '📍 ' + esc(b.items[0].place) : '')}</div></div></div>`).join('')}</div>`;
}
function welcomeScene() {
  const t = now(), h = t.getHours(), g = ann('greeting')[0];
  return textScene('🏕️', h < 12 ? 'صباح الخير' : h < 18 ? 'طاب يومكم' : 'مساء النور', g ? g.title : campName(), g ? g.body : '', false, 'greeting');
}
function finaleScene(a) {
  const ms = new Date(a.startsAt) - now(), d = Math.floor(ms / 864e5), hh = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return `<div class="card2"><div class="ai">🎉</div><div class="al">العدّ التنازلي</div><div class="at">${esc(a.title)}</div><div class="sub2" style="font-size:3vw;color:var(--gold);font-weight:900">${d > 0 ? d + ' يوم · ' : ''}${hh} ساعة · ${m} دقيقة</div></div>`;
}
function scenes(ps) {
  const s = [], t = now();
  if (ps.cur) s.push({ key: 'now', live: true, html: () => nowScene(programState()) });
  if (ps.today.length) s.push({ key: 'day', live: true, html: () => dayScene(programState()) });
  if (blocksOf(ymd(t)).filter(b => b.start > t).length >= 2) s.push({ key: 'next3', html: upcomingScene });
  ann('announce').slice(0, 5).forEach(a => s.push({ key: a.id, at: a.publishedAt, html: () => textScene('📣', 'إعلان', a.title, a.body, false, 'announce') }));
  ann('event').filter(a => a.startsAt && new Date(a.startsAt) - t > -30 * 60000).slice(0, 3).forEach(a => s.push({ key: a.id, at: a.publishedAt, html: () => textScene('📅', 'فعالية قادمة', a.title, [a.body, t12(p2(new Date(a.startsAt).getHours()) + ':' + p2(new Date(a.startsAt).getMinutes()))].filter(Boolean).join(' · '), false, 'event') }));
  ann('call').slice(0, 3).forEach(a => s.push({ key: a.id, at: a.publishedAt, html: () => textScene('🔔', 'استدعاء', a.title, a.body || 'يُرجى المراجعة', false, 'call') }));
  if (D && D.prayers && D.prayers[ymd(t)]) s.push({ key: 'prayers', live: true, html: prayersScene });
  const res = D && D.results || [], fr = res.filter(g => freshAt['pod-' + g.competition]).sort((a, b) => freshAt['pod-' + b.competition] < freshAt['pod-' + a.competition] ? -1 : 1)[0] || res[res.length - 1];
  if (fr) s.push({ key: 'pod-' + fr.competition, at: freshAt['pod-' + fr.competition], html: () => podiumScene(fr) });
  if (D && D.totals && D.totals.length) s.push({ key: 'rank', at: freshAt.rank, html: rankScene });
  ann('wisdom').slice(0, 1).forEach(a => s.push({ key: a.id, at: a.publishedAt, html: () => textScene('📖', 'حكمة اليوم', a.title, a.body, true, 'wisdom') }));
  ann('kudos').slice(0, 3).forEach(a => s.push({ key: a.id, at: a.publishedAt, html: () => textScene('🤝', 'شكر وموقف طيب', a.title, a.body, false, 'kudos') }));
  ann('quote').slice(0, 3).forEach(a => s.push({ key: a.id, at: a.publishedAt, html: () => textScene('💬', 'قالوا عن المخيم', '«' + a.body + '»', a.title, false, 'quote') }));
  const fin = ann('finale')[0]; if (fin && fin.startsAt && new Date(fin.startsAt) - t > 60 * 60000) s.push({ key: 'finale', live: true, html: () => finaleScene(fin) });
  if (!s.length) s.push({ key: 'welcome', html: welcomeScene });
  return s;
}

// Celebration: paper pieces in the camp colours for about five seconds (not when the viewer asked for less motion).
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.id = 'confetti'; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  const x = c.getContext('2d'), cols = ['#EBBA4E', '#FBF3D7', '#A8D285', '#D39D66', '#A3A867', '#ECCA9C'], P = [];
  for (let i = 0; i < 160; i++) P.push({ x: Math.random() * c.width, y: -Math.random() * c.height * .5, w: 6 + Math.random() * 8, h: 10 + Math.random() * 10, vx: -1.5 + Math.random() * 3, vy: 2 + Math.random() * 3.5, r: Math.random() * 6, vr: -.15 + Math.random() * .3, c: cols[i % cols.length] });
  const t0 = performance.now();
  (function step(t) { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .03; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); });
    if (t - t0 < 5000) requestAnimationFrame(step); else c.remove(); })(t0);
}

/* ---------- full-screen moments (priority order) ---------- */
function override() {
  const t = now(), u = ann('urgent')[0];
  if (u) return `<div class="full urgent"><div><div class="ic">🚨</div><div class="ttl">${esc(u.title)}</div>${u.body ? `<div class="sub" style="color:#fff">${esc(u.body)}</div>` : ''}</div></div>`;
  const ps = prayerState();
  if (ps.cur) {
    const n = PR[ps.cur.n];
    return `<div class="full adhan"><div><div class="ic">🕌</div><div class="sub" style="margin:0">حان الآن موعد</div><div class="ttl">أذان ${n}</div><div class="sub" style="color:var(--ink);opacity:.8">يُرجى التوجّه إلى المسجد</div></div></div>`;
  }
  const pg = programState(), nb = pg.next;
  if (nb && nb.start - t > 0 && nb.start - t <= CONFIG.soonMinutes * 60000 && nb.items.some(x => x.type !== 'راحة'))
    return `<div class="full"><div><div class="ic">⏰</div><div class="sub" style="margin:0">يبدأ بعد قليل</div><div class="ttl">${esc(blockTitle(nb))}</div><div class="big">${hms(nb.start - t)}</div><div class="sub">${nb.items.length > 1 ? nb.items.map(x => esc(groupName(x.group)) + ': ' + esc(x.place || x.title)).join(' · ') : (nb.items[0].place ? '📍 ' + esc(nb.items[0].place) : '')}</div></div></div>`;
  return '';
}

/* ---------- identity variant ---------- */
// The identity guide allows only the dark and cream backgrounds, so there are no colour variants any more.
function themeNow() { return 'brand'; }

/* ---------- painting ---------- */
const campName = () => (D && D.campName) || CONFIG.name;
function dayLine() {
  const t = now(), start = D && D.campStart ? new Date(D.campStart + 'T00:00:00') : null, days = D && D.campDays || 4;
  const n = start ? Math.floor((new Date(ymd(t) + 'T00:00:00') - start) / 864e5) + 1 : 0;
  return n >= 1 && n <= days ? ' · اليوم ' + n + ' من ' + days : n < 1 && start ? ' · يبدأ المخيم بعد ' + Math.ceil((start - t) / 864e5) + ' يوم' : '';
}
function paintHeader() {
  const th = themeNow(); if (document.body.dataset.t !== th) document.body.dataset.t = th;
  $('cname').textContent = campName(); $('slogan').textContent = dayLine().replace(/^ · /, '');
  $('live').className = 'live' + (online ? '' : ' off');
  $('liveTx').textContent = online ? 'مباشر' : !tried ? 'جارٍ التحديث…' : 'دون اتصال · آخر تحديث ' + (lastSync ? new Date(lastSync).toTimeString().slice(0, 5) : '—');
}
function paintRail() {
  const t = now(), h = t.getHours(), pg = programState(), ps = prayerState(), w = D && D.weather && D.weather.days ? D.weather.days.find(x => x.date === ymd(t)) : null;
  const tt = D && D.totals || [];
  let html = `<div class="rc"><div class="clk">${(h % 12) || 12}:${p2(t.getMinutes())} <small>${h < 12 ? 'ص' : 'م'}</small></div><div class="date">${esc(t.toLocaleDateString('ar-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }))}${w ? ` · ${w.tmax}° · 🌧 ${w.rain}%` : ''}</div></div>`;
  if (pg.next) html += `<div class="rc"><div class="t">⏭ التالي</div><div class="v">${esc(blockTitle(pg.next))}</div><div class="s">${t12(pg.next.items[0].from)}${pg.next.items.length === 1 && pg.next.items[0].place ? ' · ' + esc(pg.next.items[0].place) : ''}</div><div class="cd">${hms(pg.next.start - t)}</div></div>`;
  if (ps.next) html += `<div class="rc"><div class="t">🕌 الصلاة القادمة</div><div class="v">${PR[ps.next.n]} · ${t12(p2(ps.next.at.getHours()) + ':' + p2(ps.next.at.getMinutes()))}</div><div class="s">بعد <span class="cd" data-cd="${ps.next.at.getTime()}" style="direction:ltr;display:inline-block;font-variant-numeric:tabular-nums">${hms(ps.next.at - t)}</span></div></div>`;
  if (tt.length) html += `<div class="rc"><div class="t">🏆 المتصدّر</div><div class="v">${esc(tt[0].team)} · ${tt[0].points}</div>${tt[1] ? `<div class="s">يليه ${esc(tt[1].team)} ${tt[1].points}</div>` : ''}</div>`;
  $('rail').innerHTML = html;
}
function paintTicker() {
  const items = ann('announce').concat(ann('call')).map(a => a.title + (a.body ? ' — ' + a.body : ''));
  const el = $('tick'), txt = items.join('     ✦     ');
  $('ticker').style.display = items.length ? '' : 'none';
  if (el.dataset.txt !== txt) { el.dataset.txt = txt; el.innerHTML = `<span style="animation-duration:${Math.max(22, txt.length * 0.25)}s">${esc(txt)}</span>`; }
}
let cur = null;
// One timer for the slides: something shown out of turn gets its full time (a new podium a little longer, for the celebration).
let slideT = null;
function schedule(ms) { clearTimeout(slideT); slideT = setTimeout(showScene, ms); }
function showScene() {
  schedule(CONFIG.slideSeconds * 1000); // keeps the loop going even when nothing is drawn now
  const ov = override(); $('over').innerHTML = ov; if (ov) return;
  const s = scenes(programState()); if (!s.length) return;
  // something new (published in the last 3 minutes, not shown yet) jumps the queue
  const t = now().getTime(), fresh = s.find(x => x.at && !seen[x.key] && t - new Date(x.at).getTime() < 3 * 60000);
  if (fresh) cur = fresh; else { idx = (idx + 1) % s.length; cur = s[idx]; }
  seen[cur.key] = true;
  const st = $('stage').parentElement; st.dataset.tone = st.dataset.tone === 'light' ? 'dark' : 'light';
  $('stage').innerHTML = `<section class="sc">${fresh ? '<div style="text-align:center;margin-bottom:.6vw"><span class="new">جديد</span></div>' : ''}${cur.html()}</section>`;
  lastKey = cur.key;
  if (cur.key === 'rank') { setTimeout(() => { document.querySelectorAll('#stage [data-w]').forEach(e => { e.style.width = e.dataset.w; }); prevTotals = null; }, 900); }
  if (fresh && /^pod-/.test(cur.key)) setTimeout(confetti, 2600);
  schedule(fresh && /^pod-/.test(cur.key) ? 16000 : CONFIG.slideSeconds * 1000);
  $('dots').innerHTML = s.map(x => `<i class="${x.key === cur.key ? 'on' : ''}"></i>`).join('');
}
function tick() {
  paintHeader(); paintRail();
  const ov = override(); if (ov || $('over').innerHTML) $('over').innerHTML = ov;
  if (cur && cur.live && !ov && now().getSeconds() % 5 === 0) { const sc = document.querySelector('#stage .sc'); if (sc) sc.innerHTML = cur.html(); } // live scenes refresh their numbers
  document.querySelectorAll('[data-cd]').forEach(e => { e.textContent = hms(Number(e.dataset.cd) - now().getTime()); });
}

/* ---------- setup (the key is typed once on the screen computer, never in the URL) ---------- */
function setup(msg) {
  const d = document.createElement('div'); d.className = 'setup';
  d.innerHTML = `<div class="box"><h2 style="margin-bottom:8px">إعداد شاشة العرض</h2><div style="color:var(--mute)">أدخل «مفتاح العرض» مرة واحدة على هذا الجهاز. تحصل عليه من مسؤول النظام.</div>${msg ? `<div style="color:#9e2a22;margin-top:8px">${esc(msg)}</div>` : ''}<input id="kIn" type="password" autocomplete="off" placeholder="FEED KEY"><button id="kBtn">حفظ وبدء العرض</button></div>`;
  document.body.appendChild(d);
  d.querySelector('#kBtn').onclick = async () => { const v = d.querySelector('#kIn').value.trim(); if (!v) return; store.set('mk_feed_key', v); d.remove(); await load(); paintTicker(); showScene(); };
}
let wakeLock = null;
async function keepAwake() { try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
$('fsBtn').onclick = () => { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); $('fsBtn').style.display = 'none'; keepAwake(); };
if (!store.get('mk_feed_key')) setup();
paintHeader(); paintRail(); paintTicker(); showScene();
load().then(() => { idx = -1; paintHeader(); paintRail(); paintTicker(); showScene(); }); // start the loop from "now" once the data is in
setInterval(tick, 1000);
schedule(CONFIG.slideSeconds * 1000);
setInterval(() => load().then(paintTicker), 20000);
window.addEventListener('online', () => load().then(paintTicker));
keepAwake();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); load().then(() => { paintTicker(); showScene(); }); } });
</script>
