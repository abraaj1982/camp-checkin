<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استئذان الخروج من المخيم — MUKHAYYAM</title>
<link rel="stylesheet" href="theme.css">
<script src="ui.js" defer></script>
<style>
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="brand"><div class="logo">م</div><div style="min-width:0"><div class="t" id="campT"></div><div class="s" id="campS"></div></div></div>
    <div class="tools"><a class="tool" href="hub.html" id="homeBtn"></a><button class="tool" id="langBtn"></button><button class="tool" id="themeBtn"></button></div>
  </header>
  <section class="hero compact"><div class="ic" aria-hidden="true">🚪</div><div><h1 id="hT"></h1><p id="hS"></p></div></section>
  <main id="app"></main>
</div>
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4lEBGPNxghwq9UmK0iljI5QdS-8iCvC-K09dDtbZCXGvGZyA4repTE3rFVVRp5zS4yw/exec';
const token = sessionStorage.getItem('mukhayyam_token');
let perms = [];
try { perms = JSON.parse(sessionStorage.getItem('mukhayyam_permissions') || '[]'); } catch (e) {}
const can = k => perms.indexOf('*') !== -1 || perms.indexOf(k) !== -1;
if (!token) location.href = 'login.html'; else if (!can('custody')) location.href = 'hub.html';

const pref = { get(k, d) { try { return localStorage.getItem('mk_pref_' + k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('mk_pref_' + k, v); } catch (e) {} } };
const $ = id => document.getElementById(id);
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(16).slice(2));
const AUTH_ERR = /EXPIRED|IDLE_TIMEOUT|REVOKED|BAD_SIGNATURE|MALFORMED|USER_NOT_FOUND|ACCOUNT_DISABLED|BAD_PAYLOAD/;

const T = {
 ar: { dir: 'rtl', title: 'استئذان الخروج من المخيم', sub: 'حالات خاصة لأسباب قهرية · تعتمدها السكرتارية وتصل للكشافة', home: 'الرئيسية', lang: 'English', dark: '🌙 داكن', light: '☀ فاتح',
  notice: 'للحالات الخاصة جدًا فقط (قبل حفل الختام). عند الاعتماد يظهر الاسم عند الكشافة في البوابة. انصراف الطلاب بعد الحفل يسجّله المشرفون.',
  tNew: n => 'استئذان الخروج' + (n ? ' 🩺' + n : ''), tDoc: 'سجل اللجنة الطبية', tList: 'الطلبات', tSummary: 'الملخص', docAlert: n => '🩺 وصل ' + (n === 1 ? 'طلب' : n + ' طلبات') + ' من اللجنة الطبية: لا مانع طبي من مغادرة ' + (n === 1 ? 'الطالب' : 'الطلاب') + '. راجعه أدناه ثم اعتمده أو أعده.', docPendTitle: '🩺 طلبات اللجنة الطبية بانتظار قرارك',
  search: 'ابحث بالاسم أو الرقم', none: 'لا نتائج', team: 'الفريق', bus: n => 'باص ' + n,
  guardian: 'اسم المستلِم وصلته (ولي الأمر أو من ينوب)', guardianPh: 'مثال: سالم أحمد — العم', reason: 'سبب الاستئذان', approve: 'اعتماد وإرسال للكشافة', openNow: 'استئذان خروج قائم', cancelWd: 'إلغاء الطلب',
  sentOk: n => 'اعتُمد خروج ' + n + ' وأُرسل إلى الكشافة.', docOk: 'اعتُمد الطلب وأُرسل إلى الكشافة.', returnedOk: 'أُعيد الطلب إلى الطبيب.', cancelledOk: 'أُلغي الطلب.', readmittedOk: 'أُعيد الطالب إلى المخيم.', error: 'تعذّر الاتصال. حاول مرة أخرى.', sessionEnd: 'انتهت الجلسة. سجّل الدخول من جديد.',
  open: 'بانتظار الكشافة', closed: 'خرج', cancelled: 'ملغى', reversed: 'أُعيد الطالب', readmit: 'إعادة الطالب (سُجّل خروجه بالخطأ)', confirmReadmit: 'إعادة هذا الطالب إلى المخيم وإلغاء خروجه؟', noWd: 'لا توجد طلبات.', recvBy: 'المستلِم', medTag: '🩺 بتوصية طبية',
  sOpen: 'بانتظار الكشافة', sClosed: 'خرجوا', sDoc: 'طلبات الطبيب القائمة', confirmCancel: 'إلغاء استئذان الخروج؟',
  docTitle: 'طلبات عدم الممانعة من الطبيب', docNone: 'لا توجد طلبات من الطبيب.', docBy: 'الطبيب', docNote: 'ملاحظة الطبيب', docApprove: 'اعتماد وتحويل للكشافة', docReturn: 'إعادة للطبيب', docReturnWhy: 'سبب الإعادة للطبيب', docSend: 'إرسال الإعادة', docCancel: 'تراجع',
  stPending: 'بانتظار قرارك', stApproved: 'اعتُمد', stReturned: 'أُعيد للطبيب',
  codes: { ALREADY_OPEN: 'يوجد استئذان خروج مفتوح لهذا الطالب', ALREADY_WITHDRAWN: 'هذا الطالب خرج مسبقاً', NOT_FOUND: 'الطالب غير موجود', NOT_OPEN: 'الطلب ليس مفتوحاً', NOT_WITHDRAWN: 'الطالب ليس خارجاً الآن', NOT_PENDING: 'الطلب ليس قائمًا', NOT_CLOSED: 'لا يمكن إعادة طالب لم يخرج بعد' } },
 en: { dir: 'ltr', title: 'Exit permission', sub: 'Special cases for compelling reasons · approved by the secretariat, handled by the scouts', home: 'Home', lang: 'العربية', dark: '🌙 Dark', light: '☀ Light',
  notice: 'For very special cases only (before the closing ceremony). Once approved the name shows at the gate. Departure after the ceremony is recorded by the supervisors.',
  tNew: n => 'Exit permission' + (n ? ' 🩺' + n : ''), tDoc: 'Medical committee log', tList: 'Requests', tSummary: 'Summary', docAlert: n => '🩺 ' + (n === 1 ? 'A request' : n + ' requests') + ' from the medical committee: no medical objection to the student leaving. Review below, then approve or return.', docPendTitle: '🩺 Medical committee requests waiting for your decision',
  search: 'Search by name or number', none: 'No results', team: 'Team', bus: n => 'Bus ' + n,
  guardian: 'Receiver name and relation (guardian or delegate)', guardianPh: 'e.g. Salem Ahmed — uncle', reason: 'Reason', approve: 'Approve and send to the scouts', openNow: 'Exit request open', cancelWd: 'Cancel request',
  sentOk: n => 'Exit approved for ' + n + ' and sent to the scouts.', docOk: 'Approved and sent to the scouts.', returnedOk: 'Returned to the doctor.', cancelledOk: 'Request cancelled.', readmittedOk: 'The student was re-admitted to the camp.', error: 'Connection problem. Try again.', sessionEnd: 'Session expired. Please log in again.',
  open: 'Waiting for the scouts', closed: 'Left', cancelled: 'Cancelled', reversed: 'Re-admitted', readmit: 'Re-admit the student (recorded by mistake)', confirmReadmit: 'Bring this student back and cancel his exit?', noWd: 'No requests.', recvBy: 'Receiver', medTag: '🩺 medical recommendation',
  sOpen: 'Waiting for the scouts', sClosed: 'Left', sDoc: 'Doctor requests pending', confirmCancel: 'Cancel the exit request?',
  docTitle: 'No-objection requests from the doctor', docNone: 'No requests from the doctor.', docBy: 'Doctor', docNote: 'Doctor’s note', docApprove: 'Approve and send to the scouts', docReturn: 'Return to the doctor', docReturnWhy: 'Reason for returning', docSend: 'Send', docCancel: 'Back',
  stPending: 'Waiting for your decision', stApproved: 'Approved', stReturned: 'Returned to the doctor',
  codes: { ALREADY_OPEN: 'An exit request is already open', ALREADY_WITHDRAWN: 'Student already left', NOT_FOUND: 'Student not found', NOT_OPEN: 'Request is not open', NOT_WITHDRAWN: 'The student is not out now', NOT_PENDING: 'The request is not pending', NOT_CLOSED: 'Cannot re-admit a student who has not left yet' } }
};
const MED_REASON = 'بتوصية طبية';
const st = { lang: pref.get('lang', 'ar'), theme: pref.get('theme', 'light'), tab: 'new', q: '', results: [], cur: null, guardian: '', reason: '', msg: null, sum: null, wds: [], docs: [], docPending: 0, docG: {}, retId: '', retWhy: '' };
const L = () => T[st.lang];

async function api(payload) {
  const r = await (await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.assign({ token: token }, payload)) })).json();
  if (r && r.code && AUTH_ERR.test(r.code)) { st.msg = { cls: 'bad', t: L().sessionEnd }; render(); setTimeout(() => { sessionStorage.clear(); location.href = 'login.html'; }, 1500); throw new Error('auth'); }
  return r;
}
const say = (cls, t) => { st.msg = { cls: cls, t: t }; };
const errText = r => (r && L().codes[r.code]) || (r && r.error) || L().error;
const hhmm = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Muscat', hour: '2-digit', minute: '2-digit' }); };

/* ---------- actions ---------- */
let qTimer = null;
function onQ(v) {
  st.q = v; clearTimeout(qTimer);
  if (v.trim().length < 1) { st.results = []; return renderResults(); }
  qTimer = setTimeout(async () => { try { const r = await api({ action: 'custodyFind', q: v.trim() }); if (r.success && st.q === v) { st.results = r.results; renderResults(); } } catch (e) {} }, 300);
}
function pick(id) { const s = st.results.find(x => x.id === id) || (st.cur && st.cur.id === id ? st.cur : null); if (!s) return; st.cur = s; st.guardian = ''; st.reason = ''; st.msg = null; render(); }
async function approve() {
  try { const r = await api({ action: 'withdrawStart', studentId: st.cur.id, guardian: st.guardian, reason: st.reason, clientId: uid() });
    if (r.success) { say('ok', L().sentOk(st.cur.name)); st.cur = null; st.q = ''; st.results = []; st.guardian = ''; st.reason = ''; await loadAll(); }
    else say('bad', errText(r));
  } catch (e) { if (e.message !== 'auth') say('bad', L().error); }
  render();
}
async function refreshCur() { if (!st.cur) return; try { const r = await api({ action: 'custodyFind', q: st.cur.id }); const h = r.success && r.results.find(x => x.id === st.cur.id); if (h) st.cur = h; } catch (e) {} render(); }
async function readmit(id) {
  if (!confirm(L().confirmReadmit)) return;
  try { const r = await api({ action: 'withdrawReopen', id: id }); say(r.success ? 'ok' : 'bad', r.success ? L().readmittedOk : errText(r)); } catch (e) { if (e.message !== 'auth') say('bad', L().error); }
  await loadAll(); render();
}
async function cancelWd(id) {
  if (!confirm(L().confirmCancel)) return;
  try { const r = await api({ action: 'withdrawCancel', id: id }); say(r.success ? 'ok' : 'bad', r.success ? L().cancelledOk : errText(r)); } catch (e) { if (e.message !== 'auth') say('bad', L().error); }
  await loadAll(); await refreshCur();
}
async function docApprove(id) {
  const g = (st.docG[id] || '').trim();
  try { const r = await api({ action: 'medClearApprove', id: id, guardian: g }); if (r.success) { say('ok', L().docOk); delete st.docG[id]; } else say('bad', errText(r)); } catch (e) { if (e.message !== 'auth') say('bad', L().error); }
  await loadAll(); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
async function docReturn(id) {
  try { const r = await api({ action: 'medClearReturn', id: id, reason: st.retWhy }); if (r.success) { say('ok', L().returnedOk); st.retId = ''; st.retWhy = ''; } else say('bad', errText(r)); } catch (e) { if (e.message !== 'auth') say('bad', L().error); }
  await loadAll(); render();
}
async function loadSummary() { try { const r = await api({ action: 'custodySummary' }); if (r.success) st.sum = r; } catch (e) {} }
async function loadWds() { try { const r = await api({ action: 'withdrawList' }); if (r.success) st.wds = r.withdrawals; } catch (e) {} }
async function loadDocs() { try { const r = await api({ action: 'medClearList' }); if (r.success) { st.docs = r.list; st.docPending = r.pending; notifyDocs(); } } catch (e) {} }
async function loadAll() { await Promise.all([loadSummary(), loadWds(), loadDocs()]); }
function setTab(t) { st.tab = t; st.msg = null; render(); loadAll().then(render); }

/* ---------- views ---------- */
function resultsHtml() {
  const l = L();
  if (!st.q.trim()) return '';
  if (!st.results.length) return `<div class="muted" style="padding:8px">${l.none}</div>`;
  return st.results.map(s => `<button class="res" data-pick="${esc(s.id)}"><b>${esc(s.name)}</b><span class="muted"> · ${esc(s.id)} · ${esc(s.team)} · ${l.bus(esc(s.bus))}</span></button>`).join('');
}
function renderResults() { const e = $('qres'); if (e) e.innerHTML = resultsHtml(); }
function newView() {
  const l = L(), c = st.cur;
  const card = !c ? '' : (c.withdrawal
    ? `<section class="card"><div class="big2">${esc(c.name)}</div><div class="muted" style="font-size:13px">${esc(c.id)}</div><div class="item" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><b>${l.openNow}</b><span class="pill warn">${l.open}</span></div><div class="muted" style="margin:6px 0">${l.recvBy}: ${esc(c.withdrawal.guardian)} · ${esc(c.withdrawal.reason)}</div><button class="btn alt full" data-cancelwd="${esc(c.withdrawal.id)}">${l.cancelWd}</button></div></section>`
    : `<section class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><div class="muted" style="font-size:13px">${esc(c.id)}</div><div class="big2">${esc(c.name)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="pill">${esc(c.team)}</span><span class="pill">${l.bus(esc(c.bus))}</span></div></div><button class="tool" data-clear="1" aria-label="x">✕</button></div>
       <label class="lbl" for="g" style="margin-top:12px">${l.guardian}</label><input id="g" type="text" value="${esc(st.guardian)}" maxlength="60" autocomplete="off" placeholder="${esc(l.guardianPh)}">
       <label class="lbl" for="rs" style="margin-top:8px">${l.reason}</label><input id="rs" type="text" value="${esc(st.reason)}" maxlength="200" autocomplete="off">
       <button class="btn go full" style="margin-top:12px" data-approve="1" ${st.guardian.trim().length < 2 || st.reason.trim().length < 3 ? 'disabled' : ''}>${l.approve}</button></section>`);
  return `${docPendingBlock()}<section class="card"><label class="lbl" for="q">${l.search}</label><input id="q" type="search" value="${esc(st.q)}" autocomplete="off"><div id="qres" style="margin-top:6px">${resultsHtml()}</div></section>${card}`;
}
function docCard(x) {
  const l = L(), pend = x.status === 'pending', ret = st.retId === x.id;
  return `<div class="item"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(x.name)}</b><span class="pill ${pend ? 'warn' : x.status === 'approved' ? 'ok' : ''}">${pend ? l.stPending : x.status === 'approved' ? l.stApproved : l.stReturned}</span></div>
      <div class="muted" style="font-size:13px">${esc(x.studentId)} · ${esc(x.team)} · ${l.bus(esc(x.bus))} · ${l.docBy}: ${esc(x.doctor)} · ${esc(hhmm(x.time))}</div>
      ${x.note ? `<div style="margin:6px 0"><span class="muted">${l.docNote}:</span> ${esc(x.note)}</div>` : ''}
      ${x.status === 'returned' && x.returnReason ? `<div class="muted" style="margin:6px 0">↩ ${esc(x.returnReason)}</div>` : ''}
      ${pend ? (ret ? `<label class="lbl" for="rw" style="margin-top:8px">${l.docReturnWhy}</label><input id="rw" type="text" value="${esc(st.retWhy)}" maxlength="200" autocomplete="off"><div class="two" style="margin-top:8px"><button class="btn" data-docret="${esc(x.id)}" ${st.retWhy.trim().length < 3 ? 'disabled' : ''}>${l.docSend}</button><button class="btn alt" data-retcancel="1">${l.docCancel}</button></div>`
        : `<label class="lbl" for="dg-${esc(x.id)}" style="margin-top:8px">${l.guardian}</label><input id="dg-${esc(x.id)}" data-dg="${esc(x.id)}" type="text" value="${esc(st.docG[x.id] || '')}" maxlength="60" autocomplete="off" placeholder="${esc(l.guardianPh)}">
           <div class="two" style="margin-top:8px"><button class="btn go" data-docok="${esc(x.id)}" ${(st.docG[x.id] || '').trim().length < 2 ? 'disabled' : ''}>${l.docApprove}</button><button class="btn alt" data-docretopen="${esc(x.id)}">${l.docReturn}</button></div>`) : ''}</div>`;
}
function docPendingBlock() {
  const l = L(), p = st.docs.filter(x => x.status === 'pending'); if (!p.length) return '';
  return `<section class="card" style="border:2px solid var(--warn)"><h2 class="h2" style="margin-bottom:8px">${l.docPendTitle}</h2>${p.map(docCard).join('')}</section>`;
}
function docView() {
  const l = L();
  if (!st.docs.length) return `<div class="card muted">${l.docNone}</div>`;
  return `<section class="card"><h2 class="h2" style="margin-bottom:8px">${l.docTitle}</h2>${st.docs.map(docCard).join('')}</section>`;
}
// A new request from the medical committee: a short beep + vibration, once per request.
let seenDoc = null;
function beep() { try { const C = window.AudioContext || window.webkitAudioContext; const a = new C(), o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.value = 0.15; o.start(); o.stop(a.currentTime + 0.35); } catch (e) {} }
function notifyDocs() {
  const ids = st.docs.filter(x => x.status === 'pending').map(x => x.id);
  if (seenDoc && ids.some(i => !seenDoc.has(i))) { beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} }
  seenDoc = new Set(ids);
}
function listView() {
  const l = L();
  if (!st.wds.length) return `<div class="card muted">${l.noWd}</div>`;
  return st.wds.map(w => `<div class="item"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(w.name)}</b><span class="pill ${w.status === 'open' ? 'warn' : w.status === 'closed' ? 'ok' : ''}">${l[w.status] || esc(w.status)}</span></div>
    <div class="muted" style="font-size:13px">${esc(w.studentId)} · ${esc(w.team)} · ${l.bus(esc(w.bus))}${w.reason === MED_REASON ? ' · ' + l.medTag : ''}</div><div style="margin:6px 0">${l.recvBy}: ${esc(w.guardian)}${w.reason === MED_REASON ? '' : ' · ' + esc(w.reason)}</div>
    ${w.status === 'open' ? `<button class="btn alt full" style="min-height:46px" data-cancelwd="${esc(w.id)}">${l.cancelWd}</button>` : w.status === 'closed' ? `<button class="btn alt full" style="min-height:46px" data-readmit="${esc(w.id)}">↩ ${l.readmit}</button>` : ''}</div>`).join('');
}
function summaryView() {
  const l = L(), s = st.sum; if (!s) return `<div class="card muted">...</div>`;
  const k = (lab, v) => `<div class="card"><div class="kl">${lab}</div><div class="kv">${v}</div></div>`;
  return `<div class="kpis">${k(l.sOpen, s.withdrawalsOpen)}${k(l.sClosed, s.withdrawalsClosed)}${k(l.sDoc, st.docPending)}</div>`;
}
function render() {
  const l = L(); document.documentElement.lang = st.lang; document.documentElement.dir = l.dir; document.documentElement.dataset.theme = st.theme; document.title = l.title + ' — MUKHAYYAM';
  $('hT').textContent = l.title; $('hS').textContent = l.sub; $('homeBtn').textContent = l.home; $('langBtn').textContent = l.lang; $('themeBtn').textContent = st.theme === 'light' ? l.dark : l.light;
  const ae = document.activeElement, keep = ae && ae.id ? { id: ae.id, pos: ae.selectionStart } : null;
  $('app').innerHTML = `${st.docPending ? `<div class="banner bad" role="alert" style="font-weight:700">${esc(l.docAlert(st.docPending))}</div>` : ''}${st.msg ? `<div class="banner ${st.msg.cls}" role="alert">${esc(st.msg.t)}</div>` : ''}
   <div class="tabs">${[['new', l.tNew(st.docPending)], ['list', l.tList], ['doc', l.tDoc], ['summary', l.tSummary]].map(t => `<button class="${st.tab === t[0] ? 'on' : ''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>
   ${st.tab === 'new' ? newView() : st.tab === 'doc' ? docView() : st.tab === 'list' ? listView() : summaryView()}`;
  if (keep && $(keep.id) && ['INPUT', 'TEXTAREA'].indexOf($(keep.id).tagName) !== -1) { const e = $(keep.id); e.focus(); try { e.setSelectionRange(keep.pos, keep.pos); } catch (x) {} }
}
document.addEventListener('input', e => {
  const i = e.target.id;
  if (i === 'q') onQ(e.target.value); else if (i === 'g') { st.guardian = e.target.value; render(); } else if (i === 'rs') { st.reason = e.target.value; render(); }
  else if (i === 'rw') { st.retWhy = e.target.value; render(); } else if (e.target.dataset && e.target.dataset.dg) { st.docG[e.target.dataset.dg] = e.target.value; render(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.tab) setTab(d.tab);
  else if (d.pick) pick(d.pick);
  else if (d.clear) { st.cur = null; st.msg = null; render(); }
  else if (d.approve) approve();
  else if (d.cancelwd) cancelWd(d.cancelwd);
  else if (d.readmit) readmit(d.readmit);
  else if (d.docok) docApprove(d.docok);
  else if (d.docretopen) { st.retId = d.docretopen; st.retWhy = ''; render(); }
  else if (d.retcancel) { st.retId = ''; render(); }
  else if (d.docret) docReturn(d.docret);
});
$('langBtn').onclick = () => { st.lang = st.lang === 'ar' ? 'en' : 'ar'; pref.set('lang', st.lang); render(); };
$('themeBtn').onclick = () => { st.theme = st.theme === 'light' ? 'dark' : 'light'; pref.set('theme', st.theme); render(); };
render(); loadAll().then(render);
setInterval(() => { if (!document.hidden && !document.activeElement.id) loadAll().then(render); }, 20000);
</script>
</body></html>
