/* ---------- API + offline queue ---------- */
// C7: a request gets 30 s (the slowest measured under heavy load is ~22 s). A connection that never answers is cut,
// so the queue cannot freeze behind it; the record stays queued and is resent (the server ignores duplicates by clientId).
const API_TIMEOUT_MS = 30000;
async function api(payload) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), API_TIMEOUT_MS) : null;
  try {
    const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(Object.assign({ token: token }, payload)), signal: ctl ? ctl.signal : undefined });
    return await res.json();
  } finally { if (timer) clearTimeout(timer); }
}
const AUTH_ERR = /EXPIRED|IDLE_TIMEOUT|REVOKED|BAD_SIGNATURE|MALFORMED|USER_NOT_FOUND|ACCOUNT_DISABLED|BAD_PAYLOAD/;
let queue = store.get('queue', []);
const saveQueue = () => store.set('queue', queue);
const RETRY_MS = [5000, 15000, 30000, 60000];
// Next record to send: the first one that is not waiting for a retry, and never ahead of an earlier record of the SAME student
// (a board and its undo must reach the server in the order they were made).
function nextOp() {
  const now = Date.now(), held = {};
  for (let i = 0; i < queue.length; i++) { const op = queue[i], k = op.body.studentId ? 's:' + op.body.studentId : 'o:' + i; if (!held[k] && !(op.nextAt > now)) return i; held[k] = true; }
  return -1;
}
let flushing = false;
async function flush() {
  if (flushing || !queue.length || !navigator.onLine) return;
  flushing = true;
  try {
    let i;
    while ((i = nextOp()) !== -1) {
      const op = queue[i];
      let r;
      try { r = await api(op.body); } catch (e) { break; } // network problem: keep the queue, retry later
      if (r && r.code && AUTH_ERR.test(r.code)) { st.banner = { cls: 'bad', msg: L().sessionEnd }; render(); setTimeout(() => endSession(r.code), 1500); break; }
      if (!r || (r.success === false && !r.code)) {
        // The server could not process it (busy / temporary error). It is NEVER given up: it waits a little longer each time
        // (5 s, 15 s, 30 s, then every 60 s) while other students' records go ahead, and stays listed on screen until it is sent.
        op.tries = (op.tries || 0) + 1; op.nextAt = Date.now() + RETRY_MS[Math.min(op.tries, RETRY_MS.length) - 1]; saveQueue(); render();
        continue;

    }

}
function applyServerResult(op, r) {
  if (!r) return;
  if (op.kind === 'scan' && op.body.op === 'board') {
    const who = rosterFind(op.body.studentId), nm = who ? who.name : op.body.studentId;
    if (!r.success && ['NOT_IN_STAGE', 'NO_STAGE', 'STAGE_ENDED'].indexOf(r.code) !== -1) { // refused by the stage rules: undo what the screen showed, and say why
      if (who) { who.state = 'none'; who.at = ''; who.pending = false; }
      st.banner = { cls: 'bad', msg: nm + ': ' + (r.error || '') }; feedback('bad'); return;
    }
    if (r.success && r.warn) st.banner = { cls: 'warn', msg: nm + ': ' + (r.warn === 'NO_ARRIVAL' ? L().warnNoArrival : L().warnAlreadyIn) };
  }
  if (op.kind === 'scan' && op.body.op === 'undo' && !r.success && (r.code === 'UNDO_EXPIRED' || r.code === 'NOT_LAST')) {
    st.banner = { cls: 'bad', msg: L().undoLocked }; // the roster is refreshed right after the flush, so the student shows as boarded again
    return;
  }
  if (op.kind === 'scan' && !r.success && (r.code === 'OTHER_BUS' || r.code === 'NOT_FOUND')) {
    const s = rosterFind(op.body.studentId); if (s) { s.state = 'none'; s.at = ''; s.pending = false; }
    st.banner = { cls: 'bad', msg: (r.code === 'OTHER_BUS' ? L().other(r.student ? r.student.bus : '', r.student ? r.student.supervisor : '') : L().notFound) };
  }
}
function enqueue(kind, body, extra) { queue.push(Object.assign({ kind: kind, body: Object.assign({ clientId: uid(), clientTime: Date.now() }, body), at: new Date().toTimeString().slice(0, 5) }, extra || {})); saveQueue(); flush(); } // clientTime: when it was scanned (the server places an offline scan in the right stage by it)

/* ---------- roster ---------- */
function rosterFind(id) { return st.roster && st.roster.students.find(s => s.id === String(id).trim()); }
// The server's list does not know yet about records still waiting on THIS phone: show them as the supervisor made them
// (boarded ⏳ / undone), otherwise a refresh makes students he already recorded look "not boarded" and he records them again.
function withQueue(r) {
  queue.forEach(op => {
    if (op.kind !== 'scan') return;
    const s = r.students.find(x => x.id === String(op.body.studentId)); if (!s || s.state === 'withdrawn') return;
    const want = op.optState || 'boarded';
    if (op.body.op === 'board' && s.state !== want) { s.state = want; s.at = op.at || ''; s.pending = true; }
    else if (op.body.op === 'undo' && ['boarded', 'on_trip', 'departed'].indexOf(s.state) !== -1) { s.state = 'none'; s.at = ''; s.pending = true; }
  });
  return r;
}
async function refreshRoster(silent) {
  if (!navigator.onLine) return;
  try {
    const r = await api({ action: 'roster' });
    if (r.success) { st.roster = withQueue(r); store.set('roster', st.roster); if (r.bus) { me.bus = r.bus; paintHero(); } }
    else if (r.code && AUTH_ERR.test(r.code)) { endSession(r.code); }
    else { st.loadErr = r.error || 'تعذّر تحميل القائمة'; render(); }

function roundMark(m) { const r = st.round, c = curRound(); if (!c) return; c.mark = m; const next = r.list.findIndex((x, k) => k > r.i && !x.mark); const any = r.list.findIndex(x => !x.mark);
  if (any === -1) { r.done = true; } else r.i = next !== -1 ? next : any; render(); }
function roundGo(i) { st.round.i = i; st.round.done = false; render(); }
function roundPhase(p) { st.round.phase = p; render(); }
function roundExit() { st.round = null; render(); }
function roundSend() {
  const r = st.round, absent = r.list.filter(x => x.mark === 'no').map(x => x.id);
  enqueue('round', { action: 'roundSave', phase: r.phase, absent: absent }); st.banner = { cls: 'ok', msg: L().rcSent }; st.round = null; render();
}
function roundView() {
  const l = L(), r = st.round, n = r.list.length, checked = r.list.filter(x => x.mark).length, gone = r.list.filter(x => x.mark === 'no');
  const top = `<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>🔍 ${l.rc}</b><button class="tool" onclick="roundExit()" style="min-height:40px">${l.rcExit}</button></div>
    <div class="tabs" style="margin-top:10px"><button class="${r.phase === 'depart' ? 'on' : ''}" onclick="roundPhase('depart')">${l.rcDepart}</button><button class="${r.phase === 'arrive' ? 'on' : ''}" onclick="roundPhase('arrive')">${l.rcArrive}</button></div>
    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center"><span class="pill ${checked === n ? 'ok' : ''}">${l.rcOf(checked, n)}</span></div>
    <div class="bar"><i style="width:${n ? Math.round(checked / n * 100) : 0}%"></i></div></section>`;
  let main;
  if (r.done) main = `<section class="card"><div class="banner ${gone.length ? 'bad' : 'ok'}" style="margin:0"><b>${l.rcDone}</b><br>${gone.length ? l.rcGap(gone.length) : l.rcOk(n)}</div>
    ${gone.length ? `<div style="margin-top:8px">${gone.map(x => `<div class="row"><span><b>${esc(x.name)}</b> <span class="muted">· ${esc(x.id)}</span></span><button class="chip" onclick="roundGo(${r.list.indexOf(x)})">${l.rcPending}</button></div>`).join('')}</div><div class="muted" style="font-size:13px;margin-top:8px">${l.rcFix}</div>` : ''}
    <button class="btn full" style="margin-top:12px;min-height:60px;font-size:18px" onclick="roundSend()">${l.rcSend}</button></section>`;
  else { const c = curRound(); main = `<section class="card" style="text-align:center"><div class="muted" style="font-size:13px;direction:ltr">${r.i + 1} / ${n}</div><div style="font-size:30px;font-weight:700;margin:10px 0 4px;line-height:1.3">${esc(c.name)}</div><div class="muted">${esc(c.id)}</div>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" style="flex:1;min-height:76px;font-size:20px;background:#1F7A45" onclick="roundMark('yes')">${l.rcHere}</button><button class="btn" style="flex:1;min-height:76px;font-size:20px;background:#B3261E" onclick="roundMark('no')">${l.rcGone}</button></div>
    ${r.i > 0 ? `<button class="btn alt full" style="margin-top:10px;min-height:44px" onclick="roundGo(${r.i - 1})">${l.rcBack}</button>` : ''}</section>`; }
  const list = `<section class="card"><div style="max-height:320px;overflow:auto">${r.list.map((x, k) => `<div class="row" onclick="roundGo(${k})" style="cursor:pointer;${k === r.i && !r.done ? 'background:var(--soft);border-radius:10px' : ''}"><span>${esc(x.name)}</span><span class="pill ${x.mark === 'yes' ? 'ok' : x.mark === 'no' ? 'bad' : ''}">${x.mark === 'yes' ? '✓' : x.mark === 'no' ? '✗' : '…'}</span></div>`).join('')}</div></section>`;
  return top + main + list;
}
function resList() {
  const l = L(), q = st.q.trim().toLowerCase(); if (!q) return '';
  const num = st.method === 'num';
  const mine = (st.roster ? st.roster.students : []).filter(s => num ? s.id.startsWith(q) : (s.name.toLowerCase().includes(q) || s.id === q)).slice(0, 6);
  const others = st.remote.filter(r => !mine.find(m => m.id === r.id));
  const all = mine.map(s => Object.assign({ mine: true }, s)).concat(others.map(s => Object.assign({ mine: false }, s)));
  if (!all.length) return `<div class="muted" style="margin-top:8px">${l.none}</div>`;
  return all.map(s => `<button class="res" data-id="${esc(s.id)}" data-mine="${s.mine ? 1 : 0}"><span><b>${esc(s.id)}</b> · ${esc(s.name)}</span><span style="display:flex;gap:6px;align-items:center">${s.via === 'guardian' ? '<span class="pill">🚗</span>' : s.state === 'boarded' ? '<span class="pill ok">✓</span>' : ''}<span class="pill ${s.mine ? 'ok' : 'bad'}">${l.bus(s.bus)}</span></span></button>`).join('');
}
let qTimer = null;
function onQ(v) {
  st.q = v; const el = $('qres'); if (el) el.innerHTML = resList();
  clearTimeout(qTimer);
  if (v.trim().length >= 2 && navigator.onLine) qTimer = setTimeout(async () => { try { const r = await api({ action: 'lookup', q: v.trim() }); if (r.success && st.q === v) { st.remote = r.results; const e2 = $('qres'); if (e2) e2.innerHTML = resList(); } } catch (e) {} }, 350);
}
document.addEventListener('click', e => { const el = e.target.closest && e.target.closest('.res'); if (el) pickRes(el.dataset.id, el.dataset.mine === '1'); });
const safeUrl = u => (/^https?:\/\//i.test(String(u || '')) ? u : '');
function pickRes(id, mine) { if (mine) identify(id); else pickRemote(st.remote.find(r => r.id === id)); }
function curCard() {
  const l = L(), c = st.cur;
  if (c.notFound) return `<div class="card"><div class="banner bad">${l.notFound} (${esc(c.id)})</div><button class="btn alt full" style="margin-top:10px" onclick="resetCur()">${l.next}</button></div>`;
  if (c.offlineOther) return `<div class="card"><div class="banner warn">${l.otherOffline}</div><button class="btn alt full" style="margin-top:10px" onclick="resetCur()">${l.next}</button></div>`;
  const chk = stageCheck(c), stg = chk.stage || null, anyBusOk = !c.mine && !!(stg && stg.anyBus);
  const dup = isDup(c, stg), wd = c.state === 'withdrawn';
  let act;
  if (!c.mine && !anyBusOk) act = `<div class="banner bad">${l.other(c.bus, c.supervisor)}</div><button class="btn full" style="margin-top:12px" disabled>${l.board}</button>`;
  else if (wd) act = `<div class="banner bad">${l.withdrawn}</div><button class="btn full" style="margin-top:12px" disabled>${l.board}</button>`;
  else if (dup) act = `<div class="banner warn">${l.dup(c.at)}</div><button class="btn full" style="margin-top:12px" disabled>${l.board}</button>`;
  else if (!chk.ok) act = `<div class="banner bad">${esc(chk.msg)}</div><button class="btn full" style="margin-top:12px" disabled>${l.board}</button>`;
  else act = `<button class="btn full" style="margin-top:14px;position:sticky;bottom:12px;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25)" onclick="board()">${l.board}</button>`;
  const exp = c.bagsExpected || 0;
  const bags = ''; // the bag count step is switched off (the bags team works outside the system)
  return `<div class="card" style="border-color:${c.mine && !dup && !wd ? 'var(--brand)' : 'var(--line)'}"><div style="display:flex;gap:14px;align-items:center"><div class="photo">${safeUrl(c.photo) ? `<img src="${esc(safeUrl(c.photo))}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}<span>${L().student}</span></div><div style="flex:1;min-width:0"><div class="muted" style="font-size:13px">${l.student} ${esc(c.id)}</div><div class="big2">${esc(c.name)}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><span class="pill">${esc(c.team)}</span>${c.cls ? `<span class="pill">${l.cls} ${esc(c.cls)}</span>` : ''}<span class="pill ${c.mine ? 'ok' : 'bad'}">${l.bus(c.bus)}</span></div></div></div>${act}${bags}<button class="btn alt full" style="margin-top:8px;min-height:44px;font-size:14px" onclick="resetCur()">${l.cancel}</button></div>`;
}
// My reports: only what THIS supervisor sent, with the status the leader gave it.
async function loadMyReports() { if (!navigator.onLine) return; try { const r = await api({ action: 'myCases' }); if (r.success) { st.myRep = r.cases; store.set('myrep', r.cases); render(); } } catch (e) {} }
